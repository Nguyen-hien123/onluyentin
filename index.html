<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ôn Tin">
<title>Ôn luyện Tin học</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>window.PWA = 1;</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ETin%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f7f6; --card:#ffffff; --ink:#15302c; --muted:#5d716d; --line:#dfe8e5;
  --brand:#0f766e; --brand-2:#14b8a6; --brand-soft:#dff5f1;
  --ok:#16a34a; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2;
  --gold:#f59e0b; --gold-soft:#fef3c7; --lock:#9aa8a5;
  --c1:#2563eb; --c2:#0d9488; --c3:#db2777; --c4:#ea580c; --c5:#7c3aed; --c6:#ca8a04; --c7:#0891b2;
  --shadow:0 2px 10px rgba(15,48,44,.08);
  --onc:#ffffff;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1716; --card:#172423; --ink:#e6f2ef; --muted:#9db3ae; --line:#28403c;
    --brand:#2dd4bf; --brand-2:#14b8a6; --brand-soft:#123b36;
    --ok:#4ade80; --ok-soft:#14361f; --bad:#f87171; --bad-soft:#3d1717;
    --gold:#fbbf24; --gold-soft:#3a2e10; --lock:#5f706d;
    --c1:#60a5fa; --c2:#2dd4bf; --c3:#f472b6; --c4:#fb923c; --c5:#a78bfa; --c6:#facc15; --c7:#22d3ee;
    --shadow:0 2px 10px rgba(0,0,0,.35); --onc:#0b1716;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1716; --card:#172423; --ink:#e6f2ef; --muted:#9db3ae; --line:#28403c;
  --brand:#2dd4bf; --brand-2:#14b8a6; --brand-soft:#123b36;
  --ok:#4ade80; --ok-soft:#14361f; --bad:#f87171; --bad-soft:#3d1717;
  --gold:#fbbf24; --gold-soft:#3a2e10; --lock:#5f706d;
  --c1:#60a5fa; --c2:#2dd4bf; --c3:#f472b6; --c4:#fb923c; --c5:#a78bfa; --c6:#facc15; --c7:#22d3ee;
  --shadow:0 2px 10px rgba(0,0,0,.35); --onc:#0b1716;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
b,strong{font-weight:700}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 16px calc(12px);display:flex;align-items:center;gap:10px}
:root[data-theme="dark"] .top{color:#062b27}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{color:#062b27}}
.top h1{font-size:18px;margin:0;flex:1;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .back{background:rgba(255,255,255,.18);border:0;border-radius:12px;width:40px;height:40px;font-size:20px;color:inherit}
.pts{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.wrap{padding:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:17px;background:var(--brand);color:#fff;margin-top:10px}
:root[data-theme="dark"] .btn{color:#062b27}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#062b27}}
.btn.ghost,:root .btn.ghost{background:var(--brand-soft);color:var(--brand)!important}
.btn.gold,:root .btn.gold{background:var(--gold);color:#3b2600!important}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=tel],input[type=password],textarea,select{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:17px}
textarea{font-size:14px;min-height:120px;font-family:ui-monospace,Consolas,monospace}
input:focus,textarea:focus{outline:none;border-color:var(--brand)}
.hero{text-align:center;padding:28px 16px 8px}
.logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:28px;box-shadow:var(--shadow)}
.hero h2{margin:12px 0 2px;font-size:24px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:600}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:600}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:8px;text-decoration:underline}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;max-width:560px;width:100%}
.tabbar button{flex:1;background:none;border:0;padding:8px 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button span{font-size:22px;line-height:1.1}
.tabbar button.on{color:var(--brand);font-weight:700}
/* level box */
.lvl{display:flex;gap:12px;align-items:center}
.lvl .ic{font-size:38px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--brand));border-radius:99px}
/* chặng */
.chang{border-left:6px solid var(--cc,var(--brand))}
.chang .hd{display:flex;align-items:center;gap:10px}
.chang .num{width:44px;height:44px;border-radius:14px;background:var(--cc);color:var(--onc);display:grid;place-items:center;font-weight:800;flex:none}
.chang.locked{opacity:.6}
.chang.locked .num{background:var(--lock)}
.chang h3{margin:0;font-size:16px;line-height:1.3}
.path{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.node{display:flex;align-items:center;gap:12px;background:var(--bg);border:0;border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.node .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--cc);color:var(--onc);font-size:15px}
.node.locked .dot{background:var(--lock)}
.node.locked{color:var(--muted)}
.node .t{flex:1;line-height:1.3;font-size:15px}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap;font-size:15px}
.stars .e{color:var(--line)}
.boss{background:var(--gold-soft)!important}
.boss .dot{background:var(--gold)!important;color:#3b2600!important}
.badge{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
/* lesson tabs */
.ltabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 4px;position:sticky;top:64px;background:var(--bg);z-index:4}
.ltabs button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.ltabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .ltabs button.on{color:#062b27}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ltabs button.on{color:#062b27}}
.ltabs .tick{color:var(--ok)}
.ltabs button.on .tick{color:inherit}
.muc h4{margin:0 0 8px;font-size:17px;display:flex;gap:8px;align-items:center}
.muc ul{margin:0;padding-left:20px}
.muc li{margin:4px 0}
.note{border-radius:14px;padding:12px 14px;margin-bottom:14px}
.note.gn{background:var(--gold-soft)}
.note.vd{background:var(--brand-soft)}
.note.mt{background:var(--card);box-shadow:var(--shadow)}
/* mind map */
.mm{padding:4px 0 8px}
.mm-root{display:block;margin:0 auto 6px;max-width:92%;text-align:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--onc);border-radius:22px;padding:14px 18px;font-weight:800;font-size:17px;box-shadow:var(--shadow)}
.mm-tree{position:relative;margin-left:18px;padding-left:18px;border-left:3px solid var(--line)}
.mm-br{position:relative;margin:14px 0}
.mm-br:before{content:"";position:absolute;left:-18px;top:24px;width:16px;border-top:3px solid var(--bc)}
.mm-bt{display:flex;align-items:center;gap:8px;width:100%;border:0;text-align:left;background:var(--bc);color:var(--onc);border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px;line-height:1.3}
.mm-bt .ar{margin-left:auto;transition:transform .2s}
.mm-br.open .mm-bt .ar{transform:rotate(90deg)}
.mm-lv{display:none;margin:8px 0 0 14px;padding-left:14px;border-left:3px dashed var(--bc)}
.mm-br.open .mm-lv{display:block}
.mm-lf{background:var(--card);border-radius:12px;padding:8px 12px;margin:6px 0;box-shadow:var(--shadow);font-size:15px;position:relative}
.mm-lf:before{content:"";position:absolute;left:-17px;top:18px;width:14px;border-top:3px dashed var(--bc)}
/* flashcards */
.flip{perspective:1000px;margin:6px 0 12px}
.flip .in{position:relative;min-height:220px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:20px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow);overflow:auto}
.flip .f{background:var(--card);border:3px solid var(--brand-soft)}
.flip .b{background:var(--brand-soft);transform:rotateY(180deg)}
.flip .lab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:14px;background:rgba(0,0,0,.06);border-radius:8px;padding:8px;margin-top:8px;white-space:pre-wrap;text-align:left}
.code pre{margin:0;white-space:pre-wrap}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:6px}
.qtext{font-size:18px;font-weight:600;line-height:1.45;margin:6px 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:16px;line-height:1.4}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.sel{border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tfrow{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.tfrow .y{margin-bottom:8px}
.tfrow .ch{display:flex;gap:8px}
.tfrow .ch button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px;font-weight:700}
.tfrow .ch button.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.tfrow.right{border-color:var(--ok);background:var(--ok-soft)}
.tfrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;background:var(--brand-soft)}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.result{text-align:center}
.result .big{font-size:52px;font-weight:800;color:var(--brand);line-height:1.1}
.result .st{font-size:40px;color:var(--gold);letter-spacing:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;text-align:center}
.tile .v{font-size:24px;font-weight:800;color:var(--brand)}
.tile .l{font-size:13px;color:var(--muted)}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg .b{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 6px;text-align:center;font-size:12px;line-height:1.3}
.bdg .b .i{font-size:30px;display:block}
.bdg .b.off{opacity:.35;filter:grayscale(1)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.pill{display:inline-block;border-radius:8px;padding:2px 8px;font-weight:700;font-family:ui-monospace,Consolas,monospace;background:var(--brand-soft);color:var(--brand)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90%;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 8px}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;margin:4px 4px 0 0;font-weight:600;font-size:14px}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
@media print{.top,.tabbar,.noprint{display:none!important}#app{max-width:none;padding:0}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}body{background:#fff;color:#000}}
.slips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slip{border:1.5px dashed var(--muted);border-radius:10px;padding:8px;font-size:13px;text-align:center}
.slip b{font-size:16px}
</style>
</head>

"},{"m":"NB","q":"Ứng dụng dùng để xem, sắp xếp thư mục và tệp trên điện thoại là","o":["ứng dụng quản lí tệp (My Files)","ứng dụng lịch (Calendar)","ứng dụng báo thức (Clock)","ứng dụng máy ảnh (Camera)"],"g":"Ứng dụng quản lí tệp (File Manager, My Files…) tổ chức hệ thống tệp phân cấp như trên máy tính (SGK Bài 7, tr.33–37)."},{"m":"VD","q":"Nam muốn gửi một ảnh trong máy cho bạn qua ứng dụng nhắn tin ngay từ trình quản lí tệp. Nam chạm giữ ảnh rồi chọn","o":["Chia sẻ","Di chuyển","Sao chép","Xoá"],"g":"Chạm và giữ tệp để Di chuyển, Sao chép, Chia sẻ, Xoá; gửi cho người khác qua ứng dụng thì chọn Chia sẻ (SGK Bài 7, tr.33–37)."}],"tf":[{"q":"Hà dùng điện thoại Android để học trực tuyến và quản lí ảnh.","y":["Ứng dụng Zoom, Google Meet thường phải cài thêm.","Nút Tổng quan dùng để quay lại màn hình trước.","Ảnh chụp thường lưu trong thư mục DCIM → Camera.","Ứng dụng quản lí tệp cho phép di chuyển, sao chép, xoá tệp."],"d":[true,false,true,true],"g":["Ứng dụng cài thêm.","Quay lại dùng nút Quay lại; Tổng quan hiện ứng dụng đang chạy.","Theo SGK.","Chạm và giữ để thao tác."]}]},{"so":8,"cd":2,"ten":"Mạng máy tính trong cuộc sống hiện đại","trang":"38–43","muctieu":["Hiểu được sự khác biệt giữa mạng LAN và Internet.","Trình bày được những thay đổi trong cuộc sống, học tập, làm việc khi mạng máy tính phổ biến.","Nêu được một số công nghệ dựa trên Internet: điện toán đám mây, IoT và lợi ích."],"muc":[{"t":"Mạng LAN và Internet","icon":"🌐","b":["<b>LAN<\/b>: phạm vi nhỏ, nối qua Hub, Switch, Wifi; có chủ sở hữu.","<b>Internet<\/b>: toàn cầu, nối qua <b>Router<\/b>, nhà cung cấp; không có chủ sở hữu."]},{"t":"Vai trò của Internet","icon":"🤝","b":["Kho tri thức khổng lồ, truy cập mọi lúc mọi nơi.","Thay đổi cách giao tiếp, học tập, làm việc."]},{"t":"Điện toán đám mây","icon":"☁️","b":["Thuê tài nguyên CNTT qua Internet theo nhu cầu.","<b>SaaS<\/b> phần mềm · <b>PaaS<\/b> nền tảng · <b>IaaS<\/b> hạ tầng.","Linh hoạt, chất lượng cao, tiết kiệm."]},{"t":"Kết nối vạn vật (IoT rong phòng thực hành Tin học của trường nối với nhau tạo thành","o":["mạng cục bộ (LAN)","mạng diện rộng (WAN)","mạng Internet toàn cầu","dịch vụ điện toán đám mây"],"g":"LAN là mạng trong phạm vi gia đình, trường học, công ty (SGK Bài 8, tr.38–43)."},{"m":"NB","q":"Thiết bị dùng để kết nối các mạng LAN với nhau là","o":["Router (bộ định tuyến)","Switch (bộ chuyển mạch)","Hub (bộ tập trung)","Micro (thiết bị thu âm)"],"g":"Switch/Hub chỉ chuyển tiếp dữ liệu trong nội bộ LAN; Router kết nối các LAN với nhau (SGK Bài 8, tr.38–43)."},{"m":"TH","q":"Switch hoặc Hub trong mạng có chức năng","o":["chuyển tiếp dữ liệu trong nội bộ LAN","kết nối các mạng LAN với nhau","cung cấp dịch vụ đám mây","diệt phần mềm độc hại"],"g":"Switch/Hub chỉ chuyển tiếp dữ liệu trong nội bộ LAN (SGK Bài 8, tr.38–43)."},{"m":"NB","q":"Điện toán đám mây là","o":["chia sẻ tài nguyên CNTT theo nhu cầu qua Internet","lưu dữ liệu chỉ trên ổ cứng của máy cá nhân","dự báo thời tiết bằng vệ tinh nhân tạo","nối các máy tính trong một phòng học"],"g":"Điện toán đám mây: chia sẻ tài nguyên CNTT theo nhu cầu qua Internet, miễn phí hoặc trả phí theo mức sử dụng (SGK Bài 8, tr.38–43)."},{"m":"TH","q":"Một công ty thuê nền tảng bản đồ số để xây dựng ứng dụng giao hàng của mình. Đây là ví dụ của","o":["nền tảng như là dịch vụ (PaaS)","phần mềm như là dịch vụ (SaaS)","hạ tầng như là dịch vụ (IaaS)","mạng cục bộ của công ty (LAN)"],"g":"PaaS – nền tảng như là dịch vụ, VD thuê nền tảng bản đồ số (SGK Bài 8, tr.38–43)."},{"m":"NB","q":"Kết nối vạn vật (IoT) là","o":["liên kết thiết bị thông minh để tự thu thập, xử lí dữ liệu","mạng chỉ nối các máy tính để bàn với nhau","dịch vụ cho thuê phần mềm soạn thảo qua mạng","kho học liệu mở miễn phí trên Internet"],"g":"IoT: liên kết các thiết bị thông minh để tự động thu thập, trao đổi, xử lí dữ liệu (SGK Bài 8, tr.38–43)."},{"m":"VD","q":"Trạm thu phí không dừng trên đường cao tốc tự nhận biết xe và trừ tiền nhờ","o":["thẻ RFID dán trên xe","vé giấy phát cho tài xế","nhân viên ghi sổ tay","tiền mặt trả tại trạm"],"g":"Thu phí không dừng dùng thẻ RFID — một ví dụ của IoT (SGK Bài 8, tr.38–43)."},{"m":"TH","q":"Đâu là một lợi ích của kết nối vạn vật (IoT)?","o":["Hoạt động liên tục, dữ liệu tức thời","Chỉ chạy khi có người điều khiển","Luôn cần nhiều người giám sát","Không cần thiết bị kết nối mạng"],"g":"Lợi ích IoT: thu thập dữ liệu diện rộng, làm việc ở nơi bất lợi; hoạt động liên tục, tự động, dữ liệu tức thời; tiết kiệm chi phí (SGK Bài 8, tr.38–43)."}],"tf":[{"q":"Trường của Nam lắp mạng wifi phòng máy và dùng Google Docs để làm bài nhóm.","y":["Mạng trong phòng máy là mạng LAN.","Internet có một chủ sở hữu duy nhất quản lí.","Google Docs là ví dụ của dịch vụ phần mềm SaaS.","Thu phí không dừng bằng thẻ RFID là một ứng dụng IoT."],"d":[true,false,true,true],"g":["Phạm vi nhỏ, có chủ sở hữu.","Internet không có chủ sở hữu.","Dùng phần mềm qua Internet.","Ví dụ IoT trong SGK."]}]},{"so":9,"cd":2,"ten":"An toàn trên không gian mạng","trang":"44–49","muctieu":["Nêu được nguy cơ, tác hại khi tham gia Internet thiếu hiểu biết, bất cẩn.","Nêu được cách phòng vệ khi bị bắt nạt trên mạng; biết bảo vệ dữ liệu cá nhân.","Trình bày sơ lược về phần mềm độc hại; biết dùng công cụ phòng chống."],"muc":[{"t":"Nguy cơ trên mạng","icon":"⚠️","b":["Tin giả, lừa đảo, <b>lộ thông tin cá nhân<\/b>.","<b>Bắt nạt trên mạng<\/b>: không trả lời, lưu bằng chứng, báo người lớn.","Nghiện mạng, ảnh hưởng sức khoẻ, học tập."]},{"t":"Virus, worm, trojan","icon":"🦠","b":["<b>Virus<\/b>: gắn vào phần mềm khác để lây.","<b>Worm<\/b>: tự lây qua lỗ hổng mạng.","<b>Trojan<\/b>: nội gián đánh cắp thông tin."]},{"t":"Tác hại của mã độc","icon":"💥","b":["Phá dữ liệu, làm chậm máy.","Đánh cắp mật khẩu, tống tiền (WannaCry)."]},{"t":"Phòng chống mã độc","icon":"🛡️","b":["Không mở liên kết lạ, phần mềm bẻ khoá.","Dùng <b>Windows Defender<\/b>: Quick, Full, Custom scan."]}],"ghinho":"Cẩn trọng là lá chắn đầu tiên: bảo vệ thông tin cá nhân, không mở liên kết lạ, luôn có phần mềm diệt virus.","vandung":"Quét virus cho USB của em bằng Windows Defender.","the":[{"q":"Kể <b>3 nguy cơ<\/b> khi sử dụng Internet.","a":"Ví dụ: <b>tin giả<\/b>; <b>lừa đảo<\/b>; <b>lộ thông tin cá nhân<\/b>; bắt nạt trên mạng; nghiện mạng."},{"q":"Kể tên <b>3 loại<\/b> phần mềm độc hại.","a":"<b>Virus<\/b>, <b>Worm<\/b> (sâu máy tính), <b>Trojan<\/b>."},{"q":"Bị bắt nạt trên mạng, có thể gọi số tổng đài nào để được hỗ trợ?","a":"<b>Tổng đài 111<\/b>. Có thể nhờ cả GVCN, tổ tư vấn học đường."},{"q":"<b>Virus<\/b> khác <b>Worm<\/b> ở điểm nào?","a":"<b>Virus<\/b> là đoạn mã phải <b>gắn vào phần mềm khác<\/b>; <b>Worm<\/b> là phần mềm <b>hoàn chỉnh<\/b>, tự lây qua lỗ hổng bảo mật."},{"q":"<b>Trojan<\/b> nguy hiểm ở chỗ nào?","a":"Là phần mềm “<b>nội gián<\/b>”: ẩn trong máy để <b>đánh cắp thông tin<\/b>, <b>chiếm quyền<\/b> điều khiển máy."},{"q":"Nêu <b>3 cách<\/b> bảo vệ thông tin cá nhân trên mạng.","a":"Không ghi thông tin cá nhân ở nơi người khác đọc được; giữ máy <b>không nhiễm phần mềm gián điệp<\/b>; <b>cẩn trọng với wifi công cộng<\/b>; không để lộ mật khẩu."},{"q":"<i>Tình huống:<\/i> Em nhận tin nhắn “Bạn trúng thưởng điện thoại, bấm link và nhập mã OTP để nhận quà”. Em làm gì?","a":"<b>Không bấm link, không cung cấp mã OTP<\/b>; xác minh qua kênh khác; báo bố mẹ, thầy cô. Đây là dấu hiệu <b>lừa đảo<\/b>."},{"q":"<i>Tình huống:<\/i> Bạn cùng lớp liên tục bị nhắn tin chế giễu trong nhóm chat. Nên khuyên bạn làm gì?","a":"<b>Không trả lời, không tranh luận<\/b>; <b>lưu giữ bằng chứng<\/b>; báo bố mẹ, thầy cô; nghiêm trọng thì báo công an."},{"q":"<i>Tình huống:<\/i> Bạn muốn tải bản <b>bẻ khoá<\/b> một trò chơi từ trang web lạ. Có thể gặp nguy cơ gì? Khuyên bạn thế nào?","a":"Nguy cơ <b>nhiễm phần mềm độc hại<\/b> (Trojan, sâu…), mất dữ liệu, lộ thông tin; lại <b>vi phạm bản quyền<\/b>. Khuyên dùng bản chính thức, tải từ nguồn tin cậy."},{"q":"<i>Thử thách:<\/i> Năm 2017, mã độc WannaCry mã hoá dữ liệu để tống tiền. Đề xuất <b>4 việc<\/b> phòng chống phần mềm độc hại.","a":"Cẩn thận khi chép tệp từ USB, thẻ nhớ; không tải phần mềm bẻ khoá; <b>không mở liên kết lạ<\/b>; không để lộ mật khẩu; dùng phần mềm phòng chống (Windows Security: Quick scan, Full scan…)."}],"mcq":[{"m":"NB","q":"Thông tin nào sau đây là thông tin cá nhân cần được bảo vệ?","o":["Số tài khoản ngân hàng của em","Lịch chiếu phim ở rạp gần nhà","Giá vé xe buýt của thành phố","Dự báo thời tiết ngày mai"],"g":"Thông tin cá nhân: tên, số điện thoại, email, tài khoản ngân hàng, tài khoản ứng dụng… (SGK Bài 9, tr.44–49)."},{"m":"TH","q":"Hậu quả có thể xảy ra khi bị lộ thông tin cá nhân trên mạng là","o":["bị mạo danh, lừa đảo, mất tiền","máy tính chạy nhanh hơn trước","có thêm nhiều bạn bè thật","tài khoản được bảo mật tốt hơn"],"g":"Lộ thông tin cá nhân có thể bị mạo danh, mất tiền (SGK Bài 9, tr.44–49)."},{"m":"TH","q":"Sâu máy tính (Worm) khác virus ở điểm nào?","o":["Là phần mềm hoàn chỉnh, tự lây qua lỗ hổng","Phải gắn vào phần mềm khác mới lây được","Không gây hại gì cho máy và dữ liệu","Chỉ lây khi người dùng in tài liệu"],"g":"Virus là đoạn mã phải gắn vào phần mềm khác; Worm là phần mềm hoàn chỉnh, lây qua lỗ hổng bảo mật hoặc lừa người dùng tự chạy (SGK Bài 9, tr.44–49)."},{"m":"NB","q":"Năm 2017, phần mềm độc hại nào mã hoá dữ liệu để tống tiền người dùng trên nhiều nước?","o":["WannaCry","Windows Defender","Google Drive","Microsoft Teams"],"g":"Sâu WannaCry (2017) mã hoá dữ liệu để tống tiền (SGK Bài 9, tr.44–49)."},{"m":"TH","q":"Phần mềm keylogger ghi lại các phím người dùng gõ để lấy mật khẩu thuộc loại","o":["Trojan (phần mềm nội gián)","virus gắn vào tệp khác","phần mềm diệt virus","phần mềm soạn thảo"],"g":"Trojan đánh cắp thông tin, chiếm quyền máy; gồm spyware, keylogger, backdoor, rootkit (SGK Bài 9, tr.44–49)."},{"m":"VD","q":"Minh liên tục nhận tin nhắn chế giễu từ một tài khoản lạ. Cách ứng xử phù hợp là","o":["lưu bằng chứng, báo bố mẹ và thầy cô","nhắn lại bằng lời lẽ thật gay gắt","xoá hết tin nhắn rồi giữ im lặng","đăng bài bêu tên tài khoản đó"],"g":"Bắt nạt trên mạng: không trả lời, không tranh luận; lưu giữ bằng chứng; chia sẻ với bố mẹ, thầy cô; nghiêm trọng thì báo công an (SGK Bài 9, tr.44–49)."},{"m":"NB","q":"Số điện thoại Tổng đài quốc gia bảo vệ trẻ em là","o":["111","113","114","115"],"g":"Kênh hỗ trợ: GVCN, tổ tư vấn học đường, Tổng đài 111 (SGK Bài 9, tr.44–49)."},{"m":"TH","q":"Trong Windows Security, kiểu quét kiểm tra toàn bộ tệp và chương trình trên máy là","o":["Full scan","Quick scan","Custom scan","Offline scan"],"g":"Windows Security có Quick scan (nhanh), Full scan (toàn bộ), Custom scan (tự chọn), Offline scan (SGK Bài 9, tr.44–49)."},{"m":"VD","q":"Hoa nhận tin nhắn \"Bấm vào liên kết để nhận quà miễn phí\" từ một số lạ. Hoa nên","o":["không mở, xác minh qua kênh khác","mở ngay để nhận quà trước","gửi tiếp liên kết cho bạn bè","nhập mật khẩu để nhận quà"],"g":"Phòng chống phần mềm độc hại, lừa đảo: không mở liên kết lạ, xác minh qua kênh khác (SGK Bài 9, tr.44–49)."}],"tf":[{"q":"Bình nhận tin nhắn: “Bạn trúng thưởng điện thoại, bấm vào liên kết để nhận quà”.","y":["Đây có thể là tin lừa đảo, không nên bấm vào liên kết.","Trojan là loại mã độc tự lây qua lỗ hổng mạng.","Windows Defender có thể quét theo chế độ Quick, Full, Custom.","Bị bắt nạt trên mạng thì nên trả lời gay gắt lại ngay."],"d":[true,false,true,false],"g":["Không mở liên kết lạ.","Tự lây qua lỗ hổng mạng là worm; trojan là nội gián đánh cắp thông tin.","Theo SGK.","Không trả lời, lưu bằng chứng, báo người lớn."]}]},{"so":10,"cd":2,"ten":"Thực hành khai thác tài nguyên trên Internet","trang":"50–54","muctieu":["Biết Internet là kho tài nguyên chung rất lớn, có nhiều dịch vụ thông tin.","Khai thác được một số dịch vụ, tài nguyên phục vụ học tập: phần mềm dịch, kho học liệu mở."],"muc":[{"t":"Google Dịch","icon":"🌍","b":["translate.google.com: chọn <b>ngôn ngữ nguồn – đích<\/b>.","Nhập: <b>gõ trực tiếp, giọng nói, từ tệp<\/b>.","Nháy loa để nghe đọc; ⇄ đảo chiều dịch.","Bản dịch máy có thể chưa chuẩn → <b>soát lại<\/b>."]},{"t":"Kho học liệu mở","icon":"📚","b":["Học liệu mở: tri thức miễn phí cho mọi người.","Kho của Bộ GD&ĐT: <b>igiaoduc.vn<\/b>.","Chọn thư mục → lớp → môn → <b>Học trực tuyến<\/b>."]}],"ghinho":"Internet là thư viện khổng lồ: biết khai thác đúng dịch vụ, đúng nguồn sẽ tự học hiệu quả.","vandung":"Dịch một đoạn văn ngắn sang ngoại ngữ em học; tìm thêm một kho học liệu mở khác.","the":[{"q":"Trong Google Dịch, nhập văn bản cần dịch theo những cách nào?","a":"<b>Gõ trực tiếp<\/b>, nhập bằng <b>giọng nói<\/b> (cần micro), dịch <b>từ tệp<\/b> (Word, PDF…)."},{"q":"Kho học liệu số của Bộ GD&amp;ĐT có địa chỉ web nào?","a":"<b>igiaoduc.vn<\/b>"},{"q":"<i>Đúng hay Sai?<\/i><br>“Bản dịch của Google Dịch luôn chính xác, có thể nộp ngay.”","a":"<b>Sai.<\/b> Bản dịch máy có thể còn nhầm — chỉ để <b>hỗ trợ<\/b>, cần kiểm tra lại (dịch ngược, tra từ điển, hỏi thầy cô)."}],"mcq":[{"m":"NB","q":"Trong Google Dịch, khung bên phải hiển thị","o":["kết quả dịch ở ngôn ngữ đích","văn bản gốc cần được dịch","danh sách các tệp đã tải lên","lịch sử các lần tra cứu"],"g":"Khung trái – ngôn ngữ nguồn (đầu vào); khung phải – ngôn ngữ đích (kết quả) (SGK Bài 10, tr.50–54)."},{"m":"NB","q":"Biểu tượng ⇄ trong Google Dịch dùng để","o":["đảo ngôn ngữ nguồn và ngôn ngữ đích","đọc to văn bản bằng giọng nói","tải tệp văn bản lên để dịch","xoá toàn bộ văn bản đã nhập"],"g":"Biểu tượng ⇄ đảo ngôn ngữ nguồn – đích (SGK Bài 10, tr.50–54)."},{"m":"NB","q":"Cách nhập văn bản mặc định của Google Dịch là","o":["gõ trực tiếp","giọng nói","tải tệp lên","chụp ảnh"],"g":"3 cách nhập: gõ trực tiếp (mặc định), giọng nói, từ tệp (SGK Bài 10, tr.50–54)."},{"m":"TH","q":"Để đưa kết quả dịch vào tệp Word, em dùng lần lượt tổ hợp phím","o":["Ctrl + C rồi Ctrl + V","Ctrl + Z rồi Ctrl + Y","Ctrl + S rồi Ctrl + P","Ctrl + A rồi Delete"],"g":"Lấy kết quả: Ctrl + C (sao chép) rồi Ctrl + V (dán) vào tệp văn bản (SGK Bài 10, tr.50–54)."},{"m":"NB","q":"Khái niệm học liệu mở (Open CourseWare) phổ biến từ năm 2002, gắn với","o":["Học viện Công nghệ Massachusetts","Bộ Giáo dục và Đào tạo","Tập đoàn Google","Đại học Quốc gia Hà Nội"],"g":"Học liệu mở phổ biến từ năm 2002 (Học viện Công nghệ Massachusetts – MIT) (SGK Bài 10, tr.50–54)."},{"m":"TH","q":"Cách kiểm tra lại bản dịch của máy là","o":["dịch ngược, đối chiếu từ điển","tin hoàn toàn kết quả của máy","chỉ xem bản dịch dài hay ngắn","mở bằng trình duyệt web khác"],"g":"Bản dịch của máy có thể còn nhầm — kiểm tra bằng dịch ngược, đối chiếu từ điển, hỏi thầy cô (SGK Bài 10, tr.50–54)."},{"m":"TH","q":"Khi dùng tài liệu tìm được trên mạng cho bài thuyết trình, em cần","o":["chọn nguồn chính thống và ghi nguồn","chép nguyên văn, không cần ghi nguồn","dùng mọi trang web tìm thấy đầu tiên","lấy ảnh bất kì, không cần kiểm tra"],"g":"Năng lực số – tìm kiếm, đánh giá thông tin: chọn nguồn chính thống, ghi nguồn khi dùng tài liệu trên mạng."},{"m":"VD","q":"Khi dùng một công cụ AI trực tuyến để hỗ trợ học tập, việc em nên làm là","o":["không nhập thông tin cá nhân của ai","nhập số điện thoại cả lớp để xếp lịch","gửi mật khẩu để AI ghi nhớ giúp","tải ảnh căn cước của bạn lên"],"g":"An toàn số: không đưa thông tin cá nhân (của mình và người khác) lên ứng dụng lạ, công cụ AI trực tuyến."},{"m":"VD","q":"Một chatbot AI trả lời câu hỏi lịch sử cho em. Em nên","o":["kiểm chứng lại bằng nguồn tin cậy","tin ngay vì AI không bao giờ sai","chép nguyên câu trả lời để nộp bài","chia sẻ ngay lên mạng xã hội"],"g":"Dùng AI có trách nhiệm: kết quả của AI có thể sai → luôn kiểm chứng; không nộp sản phẩm AI làm thay như bài của mình."}],"tf":[{"q":"Lan dùng Google Dịch và kho học liệu igiaoduc.vn để ôn bài.","y":["Google Dịch có thể nhập bằng giọng nói.","Bản dịch máy luôn chính xác, không cần soát lại.","Học liệu mở là tri thức được chia sẻ miễn phí cho mọi người.","igiaoduc.vn là kho học liệu của Bộ GD&ĐT."],"d":[true,false,true,true],"g":["Gõ, giọng nói, tệp.","Cần soát lại.","Định nghĩa học liệu mở.","Theo SGK."]}]},{"so":11,"cd":3,"ten":"Ứng xử trên môi trường số. Nghĩa vụ tôn trọng bản quyền","trang":"55–62","muctieu":["Nêu được những vấn đề về đạo đức, pháp luật, văn hoá khi giao tiếp qua mạng.","Giải thích được một số nội dung pháp lí liên quan đến việc đưa tin lên mạng.","Hiểu được hành vi nào vi phạm bản quyền tác phẩm, sản phẩm số."],"muc":[{"t":"Đạo đức, pháp luật, văn hoá","icon":"🧭","b":["Vi phạm: tin không phù hợp, công bố thông tin cá nhân trái phép.","Thư rác, vi phạm bản quyền, bắt nạt, ứng xử thiếu văn hoá.","Tin trên mạng lan nhanh, lưu lâu → hậu quả lớn."]},{"t":"Quy định pháp lí","icon":"⚖️","b":["Luật CNTT (2006), Luật An ninh mạng (2018)…","NĐ 15/2020/NĐ-CP xử phạt; QĐ 874/QĐ-BTTTT – quy tắc ứng xử.","<b>Chia sẻ tin vi phạm cũng là vi phạm<\/b>."]},{"t":"Quyền tác giả, bản quyền","icon":"©️","b":["Gồm <b>quyền nhân thân<\/b> và <b>quyền tài sản<\/b>.","Vi phạm: phần mềm lậu, bẻ khoá, sao chép, đăng tải trái phép.","Mua phần mềm = mua <b>quyền sử dụng<\/b> (licence)."]}],"ghinho":"Trước khi đăng hay chia sẻ: kiểm tra đúng – sai, hợp pháp – vi phạm, và luôn tôn trọng công sức tác giả.","vandung":"Phân tích một tình huống chia sẻ tin giả trên mạng xã hội và hậu quả của nó.","the":[{"q":"Phần mềm <b>bẻ khoá<\/b> còn gọi bằng từ tiếng Anh nào?","a":"<b>Crack<\/b> — dùng phần mềm crack là vi phạm bản quyền."},{"q":"Bộ quy tắc ứng xử trên mạng xã hội được ban hành theo quyết định nào?","a":"Quyết định <b>874/QĐ-BTTTT<\/b> (năm 2021)."},{"q":"Quyền tác giả gồm <b>2 nhóm quyền<\/b> nào?","a":"<b>Quyền nhân thân<\/b> và <b>quyền tài sản<\/b>."},{"q":"Kể <b>2 văn bản luật<\/b> liên quan đến hành vi sử dụng mạng.","a":"Ví dụ: Luật <b>An ninh mạng<\/b> (2018), Luật <b>Công nghệ thông tin<\/b> (2006), Luật Giao dịch điện tử (2005)…"},{"q":"Mua phần mềm (VD Windows, Word) thường là mua cái gì?","a":"Mua <b>quyền sử dụng<\/b> (licence), tính theo số máy cài đặt."},{"q":"<i>Đúng hay Sai?<\/i><br>“Chỉ chia sẻ lại (share) một tin vi phạm pháp luật thì không sao.”","a":"<b>Sai.<\/b> <b>Chia sẻ<\/b> một tin vi phạm pháp luật <b>cũng là vi phạm<\/b> pháp luật."},{"q":"Vì sao hành vi xấu trên mạng thường gây hậu quả <b>nặng hơn<\/b> ngoài đời?","a":"Giao tiếp gián tiếp, có thể <b>ẩn danh<\/b>; tin <b>phát tán nhanh, rộng<\/b> và <b>lưu lại lâu<\/b>."},{"q":"Kể <b>3 hành vi<\/b> vi phạm bản quyền.","a":"Ví dụ: <b>mạo danh tác giả<\/b>; dùng <b>phần mềm lậu<\/b>, crack; sửa chữa, đăng tải tác phẩm <b>không được phép<\/b>; chiếm đoạt mã phần mềm."},{"q":"Đạo đức và pháp luật khác nhau thế nào?","a":"<b>Đạo đức<\/b>: con người <b>tự giác<\/b> thực hiện. <b>Pháp luật<\/b>: Nhà nước quy định và <b>cưỡng chế<\/b> thực hiện."},{"q":"<i>Tình huống:<\/i> Nhà em mua 1 bản quyền phần mềm cho 1 máy, bạn em mượn đĩa cài cho máy thứ hai. Có vi phạm không?","a":"<b>Có vi phạm<\/b> — bản quyền chỉ cho phép dùng trên số máy đã mua."},{"q":"<i>Tình huống:<\/i> Em đọc được tin “Trường nghỉ học 1 tuần vì dịch” trên một trang lạ. Trước khi chia sẻ, em cần làm gì?","a":"<b>Kiểm tra<\/b> tin có chính xác không (đối chiếu nguồn chính thức: trang trường, thầy cô), có vi phạm pháp luật không, <b>cân nhắc hậu quả<\/b> rồi mới chia sẻ."},{"q":"<i>Tình huống:<\/i> Bạn lấy ảnh bài vẽ của người khác đăng lên mạng, ghi là của mình. Bạn vi phạm quyền gì?","a":"Vi phạm <b>quyền tác giả<\/b> — cụ thể là <b>quyền nhân thân<\/b> (đứng tên, công bố): hành vi <b>mạo danh tác giả<\/b>."},{"q":"<i>Thử thách:<\/i> Đặt <b>3 quy tắc<\/b> ứng xử cho nhóm chat của lớp em.","a":"Gợi ý: nói lời <b>lịch sự<\/b>, không xúc phạm, chế giễu; <b>không đăng thông tin cá nhân<\/b>, ảnh của bạn khi chưa được đồng ý; <b>kiểm tra tin<\/b> trước khi chia sẻ; ghi nguồn khi dùng tài liệu của người khác. (Hợp lí là đúng.)"}],"mcq":[{"m":"NB","q":"Quyền tác giả gồm hai nhóm quyền là","o":["quyền nhân thân và quyền tài sản","quyền sao chép và quyền chia sẻ","quyền mua bán và quyền cho thuê","quyền đăng tải và quyền bình luận"],"g":"Quyền tác giả gồm quyền nhân thân và quyền tài sản."},{"m":"TH","q":"Khi mua một phần mềm có bản quyền, người mua thực chất được","o":["quyền sử dụng phần mềm (licence)","toàn bộ quyền tác giả phần mềm","quyền bán lại cho người khác","quyền sửa mã nguồn để kinh doanh"],"g":"Mua phần mềm là mua quyền sử dụng (licence)."},{"m":"VD","q":"Hà thấy một bài đăng có thông tin chưa kiểm chứng xúc phạm thầy giáo. Việc nên làm là","o":["không chia sẻ và báo cho người lớn","chia sẻ ngay để mọi người cùng biết","bình luận chê bai người đăng bài","chụp lại rồi gửi vào nhóm lớp"],"g":"Chia sẻ tin vi phạm cũng là vi phạm; nên dừng lại, không lan truyền và báo người lớn."},{"m":"NB","q":"Văn bản pháp lí nào sau đây được nhắc tới trong SGK về môi trường mạng?","o":["Luật An ninh mạng (2018)","Luật Giao thông đường bộ","Luật Bảo vệ môi trường","Luật Hôn nhân và gia đình"],"g":"SGK nêu Luật CNTT (2006), Luật An ninh mạng (2018), NĐ 15/2020/NĐ-CP…"},{"m":"VD","q":"Hành vi nào sau đây vi phạm bản quyền?","o":["Dùng phần mềm bẻ khoá để cài máy","Mua licence phần mềm diệt virus","Dùng phần mềm nguồn mở đúng giấy phép","Trích dẫn tác giả khi dùng ảnh"],"g":"Dùng phần mềm lậu, bẻ khoá là vi phạm bản quyền."},{"m":"TH","q":"Vì sao một tin sai lệch trên mạng có thể gây hậu quả lớn?","o":["Tin lan truyền rất nhanh và lưu rất lâu","Tin chỉ những người quen mới xem được","Tin sẽ tự biến mất sau vài giờ đăng","Tin trên mạng luôn được kiểm duyệt trước"],"g":"Thông tin trên mạng lan nhanh, lưu lâu nên hậu quả lớn."}],"tf":[{"q":"Lớp 10A làm video giới thiệu trường, định dùng một bài hát và ảnh lấy từ Internet.","y":["Dùng bài hát của nhạc sĩ mà không xin phép có thể vi phạm quyền tác giả.","Ảnh tìm được trên mạng thì ai cũng được tự do dùng mà không cần ghi nguồn.","Ghi rõ tên tác giả, nguồn là một cách tôn trọng công sức tác giả.","Đăng ảnh bạn khác kèm thông tin cá nhân khi chưa được phép là hành vi bình thường."],"d":[true,false,true,false],"g":["Sao chép, đăng tải trái phép là vi phạm.","Ảnh vẫn có quyền tác giả, cần tôn trọng.","Tôn trọng quyền nhân thân của tác giả.","Công bố thông tin cá nhân trái phép là vi phạm."]}]},{"so":12,"cd":4,"ten":"Phần mềm thiết kế đồ hoạ","trang":"63–68","muctieu":["Biết khái niệm thiết kế đồ hoạ; phân biệt đồ hoạ vectơ và đồ hoạ điểm ảnh.","Sử dụng được chức năng cơ bản của Inkscape để vẽ hình đơn giản."],"muc":[{"t":"Thiết kế đồ hoạ","icon":"🎨","b":["Tạo sản phẩm kết hợp hình ảnh, chữ để <b>truyền thông điệp<\/b>.","<b>Điểm ảnh (bitmap)<\/b>: tập điểm ảnh, phóng to bị vỡ.","<b>Vectơ<\/b>: định nghĩa bằng toán học, phóng to vẫn nét."]},{"t":"Phần mềm Inkscape","icon":"🖌️","b":["Vectơ: Illustrator, CorelDRAW, <b>Inkscape<\/b> · ảnh: Photoshop, GIMP.","Giao diện: bảng chọn, hộp công cụ, thanh điều khiển, vùng làm việc, bảng màu.","Lưu tệp <b>.svg<\/b> (Ctrl+S)."]},{"t":"Đối tượng của hình vẽ","icon":"⭐","b":["Công cụ: hình chữ nhật, tròn, sao, bút vẽ, văn bản.","Đối tượng xếp theo <b>lớp<\/b>: tạo sau nằm trên.","Thực hành: vẽ bông hoa, Quốc kì Việt Nam."]}],"ghinho":"Logo, biểu tượng nên vẽ bằng đồ hoạ vectơ để phóng to, thu nhỏ vẫn sắc nét.","vandung":"Vẽ quốc kì Thái Lan, Lào, Myanmar bằng Inkscape.","the":[{"q":"Có <b>hai loại<\/b> đồ hoạ cơ bản nào?","a":"Đồ hoạ <b>điểm ảnh<\/b> (bitmap) và đồ hoạ <b>vectơ<\/b> (vector)."},{"q":"Ảnh chụp bằng điện thoại thuộc loại đồ hoạ nào?","a":"Đồ hoạ <b>điểm ảnh<\/b> (bitmap) — tạo thành từ các điểm ảnh (pixel)."},{"q":"Tệp sản phẩm của Inkscape có phần mở rộng là gì?","a":"<b>.svg<\/b> (tệp hình vectơ)."},{"q":"Kể tên <b>2 phần mềm<\/b> tạo hình vectơ và <b>2 phần mềm<\/b> xử lí ảnh bitmap.","a":"Vectơ: <b>Inkscape<\/b>, Adobe Illustrator, CorelDRAW. Bitmap: <b>Adobe Photoshop<\/b>, <b>GIMP<\/b>."},{"q":"Phím tắt <b>Ctrl + N<\/b> và <b>Ctrl + S<\/b> trong Inkscape dùng để làm gì?","a":"<b>Ctrl + N<\/b>: tạo tệp mới. <b>Ctrl + S<\/b>: lưu tệp."},{"q":"Vì sao phóng to ảnh chụp thì bị <b>vỡ hình<\/b>, còn hình vectơ thì <b>không<\/b>?","a":"Ảnh chụp gồm các <b>điểm ảnh<\/b>, phóng to thì điểm ảnh to ra, nhoè. Hình vectơ xác định bằng <b>phương trình toán học<\/b> nên co dãn không vỡ."},{"q":"Phân biệt <b>màu tô<\/b> (Fill) và <b>màu vẽ<\/b> (Stroke). Chọn màu vẽ trên bảng màu thế nào?","a":"Màu tô: màu <b>bên trong<\/b> hình; màu vẽ: màu <b>đường viền<\/b>. Chọn màu vẽ: <b>giữ phím Shift<\/b> khi nháy vào bảng màu."},{"q":"Vẽ ngôi sao trước rồi vẽ hình chữ nhật đỏ sau. Vì sao ngôi sao bị che khuất? Khắc phục thế nào?","a":"Đối tượng vẽ sau nằm ở <b>lớp trên<\/b>. Chọn hình chữ nhật, đưa xuống <b>lớp dưới<\/b> (nút hạ lớp trên thanh điều khiển thuộc tính)."},{"q":"<i>Đúng hay Sai?<\/i><br>“Trong Inkscape chỉ được vẽ trong khu vực trang in.”","a":"<b>Sai.<\/b> Có thể vẽ trên <b>toàn bộ vùng làm việc<\/b>; trang in chỉ là phần sẽ được in ra."},{"q":"<i>Tình huống:<\/i> CLB bóng đá cần một <b>logo<\/b> dùng in cả trên áo, huy hiệu lẫn băng rôn lớn. Nên dùng đồ hoạ loại nào, phần mềm nào? Vì sao?","a":"Đồ hoạ <b>vectơ<\/b>, phần mềm <b>Inkscape<\/b> — phóng to, thu nhỏ <b>không vỡ hình<\/b>, độ lớn tệp không đổi."},{"q":"Kể các bước vẽ <b>Quốc kì Việt Nam<\/b> trong Inkscape.","a":"Vẽ <b>ngôi sao 5 cánh<\/b> (Corners = 5), tô vàng → vẽ <b>hình chữ nhật<\/b> tỉ lệ 2 : 3, tô đỏ → đưa hình chữ nhật <b>xuống lớp dưới<\/b>, đặt sao vào giữa."},{"q":"Hình tròn đang chọn; lần lượt nháy màu <b>đỏ, xanh, cam<\/b> trên bảng màu, rồi <b>giữ Shift<\/b> nháy màu <b>đen<\/b>. Kết quả hình tròn có màu thế nào?","a":"Màu tô là <b>cam<\/b> (màu chọn cuối cùng), đường viền màu <b>đen<\/b>."},{"q":"<i>Thử thách:<\/i> Nêu <b>4 điểm khác nhau<\/b> giữa đồ hoạ điểm ảnh và đồ hoạ vectơ.","a":"Điểm ảnh: định nghĩa bằng <b>tập điểm<\/b>; hợp chỉnh sửa ảnh, chân thực; phóng to giảm chất lượng; ảnh lớn, nét thì tệp lớn. Vectơ: định nghĩa bằng <b>phương trình toán học<\/b>; hợp logo, bản vẽ kĩ thuật; co dãn không vỡ; tệp không đổi; dễ chuyển sang điểm ảnh."}],"mcq":[{"m":"TH","q":"Ưu điểm nổi bật của đồ hoạ vectơ so với ảnh điểm ảnh là","o":["phóng to vẫn sắc nét","thể hiện ảnh chụp chân thực hơn","luôn có dung lượng lớn hơn","chỉnh sửa được từng điểm ảnh"],"g":"Ảnh vectơ định nghĩa bằng toán học nên phóng to vẫn nét; ảnh bitmap bị vỡ."},{"m":"NB","q":"Phần mềm nào sau đây là phần mềm đồ hoạ vectơ nguồn mở?","o":["Inkscape","Photoshop","GIMP","Paint"],"g":"Vectơ: Illustrator, CorelDRAW, Inkscape (nguồn mở). GIMP, Photoshop xử lí ảnh điểm ảnh."},{"m":"NB","q":"Tệp bản vẽ của Inkscape được lưu mặc định với phần mở rộng","o":["svg","jpg","docx","xcf"],"g":"Inkscape lưu tệp .svg (Ctrl+S)."},{"m":"TH","q":"Trong Inkscape, khi hai đối tượng chồng lên nhau thì","o":["đối tượng tạo sau nằm trên","đối tượng tạo trước nằm trên","đối tượng lớn hơn nằm trên","đối tượng màu đậm nằm trên"],"g":"Các đối tượng xếp theo lớp: tạo sau nằm trên."},{"m":"VD","q":"Câu lạc bộ cần thiết kế logo để in cả lên huy hiệu nhỏ lẫn băng rôn lớn. Nên chọn","o":["đồ hoạ vectơ","ảnh chụp điện thoại","ảnh điểm ảnh độ phân giải thấp","ảnh chụp màn hình"],"g":"Logo nên vẽ bằng đồ hoạ vectơ để phóng to, thu nhỏ vẫn sắc nét."},{"m":"NB","q":"Thành phần nào KHÔNG thuộc giao diện Inkscape theo SGK?","o":["Ngăn tiến trình dựng phim","Hộp công cụ","Thanh điều khiển thuộc tính","Bảng màu"],"g":"Giao diện Inkscape: bảng chọn, hộp công cụ, thanh điều khiển, vùng làm việc, bảng màu."}],"tf":[{"q":"Bình dùng Inkscape vẽ Quốc kì Việt Nam để làm hình nền trình chiếu.","y":["Bình nên vẽ hình chữ nhật đỏ trước rồi vẽ ngôi sao vàng sau.","Phóng to Quốc kì vectơ lên khổ lớn thì hình sẽ bị vỡ hạt.","Ngôi sao có thể vẽ bằng công cụ vẽ sao, đa giác.","Tệp bản vẽ được lưu với phần mở rộng .xcf."],"d":[true,false,true,false],"g":["Đối tượng tạo sau nằm trên nên ngôi sao hiện trên nền đỏ.","Đồ hoạ vectơ phóng to vẫn sắc nét.","Inkscape có công cụ sao, đa giác.","Inkscape lưu .svg; .xcf là của GIMP."]}]},{"so":13,"cd":4,"ten":"Bổ sung các đối tượng đồ hoạ","trang":"69–74","muctieu":["Biết và sử dụng được một số lệnh tạo, điều chỉnh đối tượng đồ hoạ đơn giản.","Biết và thực hiện được các phép ghép đối tượng đồ hoạ."],"muc":[{"t":"Đối tượng hình khối","icon":"🔷","b":["Thuộc tính: W, H, Rx, Ry, Start, End…","Đa giác, sao: <b>Corners, Rounded, Spoke ratio<\/b>."]},{"t":"Màu tô, màu vẽ","icon":"🎨","b":["Hộp <b>Fill and Stroke<\/b>: Fill (tô), Stroke paint (viền), Stroke style.","Kiểu tô: đồng nhất, chuyển sắc (gradient), hoa văn.","<b>Opacity<\/b>: độ trong suốt."]},{"t":"Các phép ghép","icon":"🧩","b":["<b>Hợp<\/b> (Ctrl +) · <b>Hiệu<\/b> (Ctrl −) · <b>Giao<\/b> (Ctrl *).","<b>Hiệu đối xứng<\/b> (Ctrl ^) · <b>Chia<\/b> (Ctrl /) · <b>Cắt<\/b>.","Lệnh trong bảng chọn <b>Path<\/b>."]}],"ghinho":"Hình phức tạp được ghép từ hình đơn giản: chọn đúng phép ghép và thứ tự lớp là chìa khoá.","vandung":"Vẽ miếng dưa hấu; vẽ hình trong không gian (hình cầu).","the":[{"q":"Hộp thoại nào dùng để chỉnh <b>màu tô, màu vẽ<\/b> và kiểu nét?","a":"Hộp thoại <b>Fill and Stroke<\/b>."},{"q":"Thuộc tính <b>Corners<\/b> của hình đa giác, hình sao cho biết gì?","a":"<b>Số đỉnh<\/b> của đa giác hoặc <b>số cánh<\/b> của hình sao."},{"q":"Các phép ghép hình nằm trong bảng chọn nào?","a":"Bảng chọn <b>Path<\/b>."},{"q":"Phím tắt <b>Ctrl + D<\/b> dùng để làm gì?","a":"Tạo <b>bản sao<\/b> (Duplicate) của đối tượng đang chọn."},{"q":"Giá trị <b>Opacity<\/b> thể hiện điều gì?","a":"<b>Độ trong suốt<\/b> của màu khi tô lên đối tượng."},{"q":"Muốn các đỉnh ngôi sao 5 cánh nhọn trở nên <b>cong<\/b>, em thay đổi thuộc tính nào?","a":"Thuộc tính <b>Rounded<\/b> (độ cong tại các đỉnh)."},{"q":"Hình vuông có thuộc tính <b>Rx, Ry = 0<\/b> nghĩa là gì?","a":"Bán kính bo góc bằng 0 — các góc của hình là <b>góc vuông<\/b> (không bo tròn)."},{"q":"Muốn đường viền của hình thành <b>nét đứt<\/b>, chọn trang nào trong hộp thoại Fill and Stroke?","a":"Trang <b>Stroke style<\/b> (chỉnh kiểu nét vẽ, độ dày)."},{"q":"Phân biệt <b>phép hợp<\/b> (Union) và <b>phép giao<\/b> (Intersection).","a":"<b>Hợp<\/b>: lấy <b>tất cả<\/b> phần thuộc một trong các hình. <b>Giao<\/b>: chỉ lấy phần thuộc <b>cả hai<\/b> hình."},{"q":"Hình vuông ở lớp dưới, hình tròn ở lớp trên, chồng một phần. Thực hiện <b>Difference<\/b> (hiệu), kết quả là gì?","a":"Phần <b>hình vuông<\/b> không bị hình tròn che — tức hình vuông bị <b>khoét<\/b> mất phần chung."},{"q":"Từ <b>2 hình tròn<\/b> và <b>1 hình vuông<\/b> cùng màu đỏ, làm thế nào để có hình <b>trái tim<\/b>?","a":"Xoay hình vuông 45°, đặt 2 hình tròn lên 2 cạnh trên → chọn cả 3 hình, dùng <b>Path/Union<\/b> (phép hợp)."},{"q":"Vẽ <b>đám mây<\/b> từ nhiều hình tròn: dùng phép ghép nào? Nêu các bước.","a":"Vẽ nhiều hình tròn chồng lên nhau (Ctrl + D để sao chép) → chọn tất cả → <b>Path/Union<\/b> → chỉnh màu tô, màu viền."},{"q":"<i>Thử thách:<\/i> Nêu cách vẽ <b>hình cầu<\/b> (quả bóng có ánh sáng) như trong SGK.","a":"Hình tròn đen trên nền vàng → tô <b>chuyển màu<\/b> (gradient), kéo điểm điều khiển cho màu chuyển chéo → hình tròn trắng nhỏ tô chuyển màu từ tâm → phóng to, đặt lên tạo vùng sáng."}],"mcq":[{"m":"NB","q":"Trong Inkscape, hộp thoại dùng để chọn màu tô và màu viền là","o":["Fill and Stroke","Export PNG Image","Layers and Objects","Text and Font"],"g":"Hộp Fill and Stroke: Fill (tô), Stroke paint (viền), Stroke style."},{"m":"NB","q":"Thuộc tính Opacity của đối tượng điều chỉnh","o":["độ trong suốt","độ dày nét viền","số đỉnh đa giác","độ bo tròn góc"],"g":"Opacity là độ trong suốt."},{"m":"TH","q":"Kiểu tô màu chuyển dần từ màu này sang màu khác gọi là","o":["tô chuyển sắc (gradient)","tô đồng nhất một màu","tô hoa văn lặp lại","tô viền bằng nét đứt"],"g":"Ba kiểu tô: đồng nhất, chuyển sắc (gradient), hoa văn."},{"m":"NB","q":"Phép ghép Hợp (Union) hai đối tượng có phím tắt là","o":["Ctrl +","Ctrl −","Ctrl *","Ctrl /"],"g":"Hợp Ctrl +, Hiệu Ctrl −, Giao Ctrl *, Hiệu đối xứng Ctrl ^, Chia Ctrl /."},{"m":"VD","q":"Muốn tạo hình trăng khuyết từ hai hình tròn chồng lệch nhau, phép ghép phù hợp là","o":["Hiệu (Difference)","Hợp (Union)","Giao (Intersection)","Nhân bản (Duplicate)"],"g":"Lấy hình tròn dưới trừ phần bị hình tròn trên che → phép Hiệu."},{"m":"TH","q":"Các lệnh ghép đối tượng (Union, Difference…) nằm trong bảng chọn","o":["Path","File","Text","Help"],"g":"Các phép ghép nằm trong bảng chọn Path."}],"tf":[{"q":"Chi vẽ đám mây trong Inkscape bằng cách ghép nhiều hình tròn và tô màu.","y":["Ghép các hình tròn thành một đám mây dùng phép Hợp.","Phép Giao giữ lại toàn bộ các hình tròn ban đầu.","Có thể tô đám mây chuyển sắc từ trắng sang xanh nhạt.","Muốn đám mây mờ đi, ta tăng số đỉnh trong mục Corners."],"d":[true,false,true,false],"g":["Union (Ctrl +) gộp các hình thành một.","Giao chỉ giữ phần chung của các hình.","Kiểu tô gradient.","Độ mờ chỉnh bằng Opacity."]}]},{"so":14,"cd":4,"ten":"Làm việc với đối tượng đường và văn bản","trang":"75–81","muctieu":["Biết các thao tác chỉnh sửa hình.","Thực hiện được việc vẽ, chỉnh sửa để được đường cong mong muốn.","Biết tạo và định dạng văn bản trong hình vẽ."],"muc":[{"t":"Đối tượng dạng đường","icon":"〰️","b":["Gồm các đoạn thẳng, đoạn cong nối với nhau.","Đoạn cong: 2 <b>điểm neo<\/b> và 2 <b>điểm chỉ hướng<\/b>.","Vẽ bằng công cụ <b>Pen<\/b>; Enter để kết thúc."]},{"t":"Tinh chỉnh đường","icon":"✏️","b":["<b>Neo trơn<\/b> (đường cong mượt) · <b>neo góc<\/b>.","Thêm, bỏ, gộp, tách điểm neo.","<b>Path → Object to Path<\/b>: hình khối thành đường."]},{"t":"Đối tượng văn bản","icon":"🔤","b":["Chỉnh phông, cỡ, kiểu chữ, khoảng cách.","Dịch, xoay từng kí tự.","<b>Text → Put on Path<\/b>: chữ uốn theo đường."]}],"ghinho":"Điểm neo và điểm chỉ hướng quyết định hình dạng đường cong; chữ có thể uốn theo đường để tạo logo đẹp.","vandung":"Sưu tầm và vẽ lại một logo đơn giản.","the":[{"q":"Công cụ nào dùng để vẽ đối tượng <b>đường<\/b> tự do?","a":"Công cụ <b>Pen<\/b> (bút vẽ)."},{"q":"Kết thúc một đường đang vẽ bằng Pen thế nào?","a":"Nhấn phím <b>Enter<\/b> hoặc <b>nháy đúp<\/b> chuột tại điểm neo cuối."},{"q":"Kể tên <b>2 loại<\/b> điểm neo.","a":"<b>Neo trơn<\/b> (smooth nodes) và <b>neo góc<\/b> (corner nodes)."},{"q":"Muốn đặt văn bản <b>uốn theo một đường<\/b>, dùng lệnh nào?","a":"Chọn văn bản và đường → lệnh <b>Text/Put on Path<\/b>."},{"q":"Một đoạn cong được biểu diễn bởi <b>mấy điểm<\/b>? Đó là những điểm nào?","a":"<b>4 điểm<\/b>: 2 <b>điểm đầu mút<\/b> và 2 <b>điểm điều khiển<\/b>."},{"q":"<b>Neo trơn<\/b> khác <b>neo góc<\/b> thế nào?","a":"Neo trơn: hai đường chỉ hướng luôn <b>cùng phương<\/b> — chỗ nối mềm mại. Neo góc: tạo <b>góc gấp<\/b> tại điểm neo."},{"q":"Độ cong tại một điểm neo phụ thuộc vào yếu tố nào? Muốn đổi độ cong làm gì?","a":"Phụ thuộc <b>điểm chỉ hướng<\/b> và <b>đường chỉ hướng<\/b>. Kéo thả điểm chỉ hướng để đổi độ cong."},{"q":"<b>Hình khối<\/b> khác đối tượng <b>dạng đường<\/b> ở điểm nào?","a":"Hình khối: định nghĩa sẵn bằng <b>tính chất toán học<\/b>, chỉnh thì vẫn giữ đặc trưng. Đường: do người dùng tạo, <b>chỉnh từng đoạn<\/b> độc lập được."},{"q":"<i>Đúng hay Sai?<\/i><br>“Đặt văn bản uốn theo một đường rồi thì không đổi được định dạng chữ nữa.”","a":"<b>Sai.<\/b> Vẫn tuỳ chỉnh được phông, cỡ, màu… cho văn bản, kể cả <b>từng kí tự<\/b>."},{"q":"Muốn biến hình chữ nhật thành <b>đường<\/b> có 4 điểm neo rời để chỉnh tự do, dùng lệnh nào?","a":"Lệnh <b>Path/Object to Path<\/b>."},{"q":"Nêu cách vẽ <b>chiếc lá<\/b> từ một hình chữ nhật như trong SGK.","a":"Hình chữ nhật → <b>Object to Path<\/b> → <b>gộp<\/b> 2 điểm neo cạnh trên thành 1 (được tam giác) → đổi 2 neo cạnh dưới thành <b>neo trơn<\/b> → vẽ cuống bằng <b>Pen<\/b> → tô màu."},{"q":"<i>Tình huống:<\/i> Làm băng rôn “Chúc mừng năm mới!” với dòng chữ uốn lượn trên dây cờ. Nêu các bước.","a":"Dùng <b>Pen<\/b> vẽ đường cong (đổi neo giữa thành neo trơn) → gõ chữ bằng công cụ <b>Văn bản<\/b> → chọn chữ và đường → <b>Text/Put on Path<\/b> → bỏ màu nét đường."},{"q":"<i>Thử thách:<\/i> Kể <b>5 thuộc tính<\/b> có thể điều chỉnh cho cụm kí tự trong một đoạn văn bản.","a":"Khoảng cách giữa các <b>kí tự<\/b>; giữa các <b>từ<\/b>; dịch cụm kí tự theo <b>chiều ngang<\/b>; theo <b>chiều đứng<\/b>; <b>xoay<\/b> kí tự (cùng phông, cỡ, kiểu, màu chữ)."}],"mcq":[{"m":"NB","q":"Công cụ dùng để vẽ đối tượng dạng đường trong Inkscape là","o":["Pen (bút vẽ)","Rectangle","Text","Zoom"],"g":"Vẽ đường bằng công cụ Pen; nhấn Enter để kết thúc."},{"m":"TH","q":"Một đoạn cong trong Inkscape được xác định bởi","o":["2 điểm neo và 2 điểm chỉ hướng","1 điểm neo và 1 điểm chỉ hướng","3 điểm neo nằm thẳng hàng","4 điểm neo ở bốn góc"],"g":"Đoạn cong gồm 2 điểm neo và 2 điểm chỉ hướng."},{"m":"TH","q":"Để đường cong đi qua điểm neo một cách mượt mà, điểm neo đó nên là","o":["neo trơn","neo góc","neo tách","neo xoá"],"g":"Neo trơn cho đường cong mượt; neo góc tạo góc nhọn."},{"m":"NB","q":"Lệnh chuyển một hình khối thành đối tượng đường là","o":["Path → Object to Path","Text → Put on Path","File → Export PNG","Edit → Duplicate"],"g":"Path → Object to Path: hình khối thành đường để chỉnh điểm neo."},{"m":"VD","q":"Lớp muốn làm logo có dòng chữ “10A1 ĐOÀN KẾT” uốn cong theo hình tròn. Lệnh cần dùng là","o":["Text → Put on Path","Path → Union","Object → Group","File → Save As"],"g":"Text → Put on Path: chữ uốn theo đường."},{"m":"VD","q":"Khi đang vẽ bằng Pen, muốn kết thúc đường đang vẽ ta nhấn","o":["Enter","Delete","Ctrl + Z","Tab"],"g":"Vẽ bằng Pen, nhấn Enter để kết thúc."}],"tf":[{"q":"Dũng thiết kế logo CLB Tin học: vẽ một chiếc lá bằng Pen và cho chữ chạy theo viền lá.","y":["Chiếc lá có thể vẽ từ các đoạn cong nối với nhau.","Muốn chỉnh độ cong của lá, Dũng kéo các điểm chỉ hướng.","Không thể đặt chữ chạy theo một đường cong trong Inkscape.","Hình tròn vẽ bằng công cụ Ellipse luôn chỉnh được từng điểm neo mà không cần chuyển đổi."],"d":[true,true,false,false],"g":["Đối tượng đường gồm đoạn thẳng, đoạn cong.","Điểm chỉ hướng quyết định hình dạng đường cong.","Dùng Text → Put on Path.","Cần Path → Object to Path để thành đường."]}]},{"so":15,"cd":4,"ten":"Hoàn thiện hình ảnh đồ hoạ","trang":"82–85","muctieu":["Tạo được sản phẩm số đơn giản, hữu ích, thực tế: logo, banner, poster, thiệp chúc mừng…","Xuất được sản phẩm sang định dạng ảnh PNG."],"muc":[{"t":"Phân tích yêu cầu","icon":"🧭","b":["VD tờ rơi ì sao làm xong cần <b>xuất ra PNG<\/b> thay vì gửi tệp .svg?","a":"Ảnh PNG (đồ hoạ <b>điểm ảnh<\/b>) mở, xem, chia sẻ, in được trên <b>hầu hết thiết bị<\/b>, không cần phần mềm Inkscape."},{"q":"Làm nền tờ rơi có <b>mép răng cưa<\/b> như SGK: dùng những lệnh nào?","a":"Vẽ tam giác, <b>Duplicate<\/b> thành dây → <b>Union<\/b> cả dây → đặt lên đỉnh hình chữ nhật → <b>Difference<\/b> → được mép răng cưa."},{"q":"<i>Tình huống:<\/i> Lớp làm <b>thiệp mời sinh nhật<\/b>. Em cần những nhóm đối tượng nào?","a":"Gợi ý: <b>nền<\/b>; hình trang trí (bóng bay, kim tuyến…); <b>văn bản<\/b> (lời mời, nhân dịp, thời gian, địa điểm); khung, đường kẻ. (Hợp lí là đúng.)"},{"q":"<i>Tình huống:<\/i> Áp phích “Tiết kiệm điện, nước” bị rối mắt vì chữ nhỏ, nhiều màu. Em góp ý chỉnh thế nào?","a":"Chữ chính <b>to, rõ<\/b>, ít phông; <b>giảm số màu<\/b>, chọn màu hài hoà, tương phản với nền; sắp xếp <b>bố cục<\/b> có điểm nhấn, chừa khoảng trống. (Hợp lí là đúng.)"},{"q":"<i>Thử thách:<\/i> Lập <b>kế hoạch 5 bước<\/b> thiết kế tờ rơi quảng bá Hội chợ sách của trường.","a":"1) Xác định <b>thông tin<\/b> cần có, thứ tự quan trọng → 2) Chọn <b>hình minh hoạ<\/b> → 3) Chia <b>nhóm đối tượng<\/b>, vẽ từng nhóm → 4) Sắp xếp, chỉnh <b>màu sắc, lớp<\/b> → 5) <b>Lưu .svg<\/b> và <b>xuất PNG<\/b>."}],"mcq":[{"m":"TH","q":"Bước đầu tiên khi thiết kế tờ rơi Hội chợ sách là","o":["phân tích yêu cầu, thông tin cần có","tô màu nền thật nổi bật trước","xuất ngay bản vẽ ra ảnh PNG","chọn phông chữ đẹp cho tiêu đề"],"g":"Sản phẩm tốt bắt đầu từ phân tích yêu cầu: thông tin, thứ tự ưu tiên, hình minh hoạ."},{"m":"NB","q":"Lệnh xuất bản vẽ Inkscape thành ảnh PNG là","o":["File → Export PNG Image","File → Save","Path → Union","Text → Put on Path"],"g":"File → Export PNG Image, chọn vùng, kích thước, tên tệp → Export."},{"m":"TH","q":"Để nhiều đối tượng di chuyển cùng nhau như một khối, ta dùng lệnh","o":["Group","Duplicate","Difference","Opacity"],"g":"Group gom các đối tượng thành nhóm."},{"m":"VD","q":"Khi vẽ t nghề <b>có ích<\/b> cho xã hội.","a":"Ý chính cần có: tạo <b>thông điệp truyền thông<\/b> hấp dẫn; lợi ích cho <b>mọi ngành nghề<\/b>; làm đẹp đời sống tinh thần; nhu cầu nhân lực <b>cao<\/b>. (Nhóm chấm: đủ ý, mạch lạc, có ví dụ.)"},{"q":"Kể tên <b>3 phần mềm<\/b> đồ hoạ máy tính.","a":"Ví dụ: <b>Adobe Photoshop<\/b>, <b>CorelDraw<\/b>, <b>GIMP<\/b>, InDesign, Scribus, AutoCad, Inkscape…"},{"q":"Tố chất quan trọng nhất của người thiết kế đồ hoạ là gì?","a":"<b>Khả năng sáng tạo<\/b>, yêu thích và <b>cảm nhận được cái đẹp<\/b>."},{"q":"Kiến thức về công nghệ nào là <b>điểm cộng<\/b> cho người làm thiết kế đồ hoạ?","a":"Kiến thức về <b>công nghệ in ấn<\/b>."},{"q":"Có thể học thiết kế đồ hoạ ở những đâu?","a":"<b>Trung tâm, trường dạy nghề<\/b>; <b>đại học, cao đẳng<\/b> về mĩ thuật, kiến trúc, thiết kế hoặc trường có ngành Công nghệ thông tin."},{"q":"Kể tên <b>2 trang tìm việc làm<\/b> được nhắc tới trong SGK.","a":"<b>LinkedIn<\/b>, <b>Vietnamworks<\/b>."},{"q":"Vì sao người làm đồ hoạ cần kiến thức rộng về <b>toán học, vật lí, nghệ thuật, xã hội<\/b>?","a":"Để <b>ứng dụng<\/b> vào công việc, <b>nắm bắt xu hướng<\/b>, nhu cầu xã hội và theo kịp xu thế đời sống."},{"q":"Muốn tìm thông tin hướng nghiệp ngành đồ hoạ trên Internet, em gõ những <b>từ khoá<\/b> nào?","a":"Ví dụ: “<b>thiết kế đồ hoạ<\/b>”, “thiết kế 3D”, “thiết kế giao diện”, “<b>nhận diện thương hiệu<\/b>”, “thiết kế quảng cáo”…"},{"q":"Kể <b>3 nơi<\/b> sinh viên ngành thiết kế đồ hoạ có thể làm việc sau khi tốt nghiệp.","a":"Ví dụ: <b>công ty quảng cáo<\/b>, công ty thiết kế; <b>xưởng phim hoạt hình<\/b>, truyện tranh; <b>toà soạn, nhà xuất bản<\/b>; đài truyền hình; trường học, trung tâm…"},{"q":"<i>Đúng hay Sai?<\/i><br>“Người thiết kế đồ hoạ chỉ cần vẽ đẹp, không cần ngoại ngữ, không cần tư duy con số.”","a":"<b>Sai.<\/b> Còn cần kĩ năng <b>đánh giá, phản biện, phân tích<\/b>, <b>tư duy với con số<\/b> và khả năng <b>ngoại ngữ<\/b>."},{"q":"<i>Tình huống:<\/i> Bạn Minh vẽ đẹp nhưng chưa biết dùng phần mềm đồ hoạ. Muốn theo nghề, Minh cần bổ sung gì?","a":"Học <b>thành thạo máy tính, phần mềm đồ hoạ<\/b> (Inkscape, Photoshop…); kiến thức <b>công nghệ<\/b>; rèn kĩ năng <b>tìm kiếm thông tin<\/b>, học hỏi cái mới; ngoại ngữ."},{"q":"Ngoài đi làm cho công ty, người làm thiết kế đồ hoạ còn có những <b>cách làm việc<\/b> nào?","a":"<b>Làm thêm tại nhà<\/b> (thiết kế web, logo…), <b>tự mở<\/b> công ty/studio, nhận dự án, <b>giảng dạy<\/b>… — cách làm việc rất đa dạng."},{"q":"Để theo ngành thiết kế đồ hoạ ở đại học, em nên học tốt <b>những môn nào<\/b> ở THPT? Vì sao?","a":"Gợi ý: <b>Tin học<\/b> (phần mềm đồ hoạ), <b>Mĩ thuật<\/b> (cảm thụ cái đẹp), <b>Toán<\/b> (tư duy hình, con số), <b>Ngoại ngữ<\/b> (đọc tài liệu, phần mềm). (Hợp lí là đúng.)"},{"q":"<i>Thử thách:<\/i> Lập “<b>hồ sơ nghề<\/b>” thiết kế đồ hoạ gồm 3 dòng: <b>Làm gì? – Cần gì? – Học ở đâu?<\/b>","a":"<b>Làm gì:<\/b> sáng tạo thông điệp bằng hình, chữ, màu. <b>Cần gì:<\/b> sáng tạo, cảm nhận cái đẹp, thành thạo phần mềm đồ hoạ, học hỏi. <b>Học ở đâu:<\/b> trung tâm, trường nghề, đại học, cao đẳng."}],"mcq":[{"m":"NB","q":"Sản phẩm nào sau đây là sản phẩm của nghề thiết kế đồ hoạ?","o":["Logo, tờ rơi, áp phích","Hệ điều hành máy tính","Cơ sở dữ liệu ngân hàng","Mạch điện tử của CPU"],"g":"Thiết kế đồ hoạ: thiệp, tờ rơi, logo, biển hiệu, áp phích…"},{"m":"TH","q":"Phẩm chất quan trọng của người làm thiết kế đồ hoạ là","o":["sáng tạo, yêu thích cái đẹp","chỉ cần giỏi tính nhẩm","không cần học thêm khi đi làm","chỉ thích làm việc một mình"],"g":"Cần sáng tạo, thẩm mĩ, thành thạo phần mềm, học hỏi liên tục."},{"m":"NB","q":"Phần mềm thường dùng trong nghề thiết kế đồ hoạ là","o":["Photoshop, Illustrator","MySQL, HeidiSQL","Python IDLE, Thonny","Windows Defender"],"g":"Thành thạo phần mềm đồ hoạ: Photoshop, Illustrator…"},{"m":"TH","q":"Nơi làm việc phù hợp với người làm thiết kế đồ hoạ là","o":["công ty quảng cáo, truyền thông, studio","trạm biến áp của công ty điện lực","phòng thí nghiệm hoá sinh, dược","nhà máy lọc dầu, khai thác mỏ"],"g":"Làm ở công ty quảng cáo, truyền thông, studio…, nhiều việc tự do."},{"m":"VD","q":"Lan thích vẽ, hay thiết kế thiệp cho lớp và muốn theo nghề thiết kế đồ hoạ. Lời khuyên phù hợp là","o":["rèn kĩ năng phần mềm đồ hoạ, cập nhật xu hướng","bỏ vẽ để chỉ học thuộc lí thuyết","chỉ chép lại mẫu có sẵn trên mạng","không học phần mềm, chỉ cần vẽ tay"],"g":"Nghề cần cả óc thẩm mĩ và kĩ năng công nghệ, luôn cập nhật."},{"m":"TH","q":"Nhận định nào đúng về nhu cầu nhân lực ngành thiết kế đồ hoạ?","o":["Nhu cầu cao, nhiều việc làm tự do","Không còn nhu cầu vì đã có máy in","Chỉ tuyển người trên 40 tuổi","Chỉ có việc ở cơ quan nhà nước"],"g":"SGK: nhu cầu nhân lực cao, nhiều việc làm tự do."}],"tf":[{"q":"Minh tìm hiểu nghề thiết kế đồ hoạ để chọn ngành học.","y":["Thiết kế đồ hoạ giúp truyền thông điệp bằng hình ảnh, màu sắc, chữ.","Người làm nghề chỉ cần năng khiếu, không cần thành thạo phần mềm.","Có thể học nghề ở đại học, cao đẳng, trung cấp, trung tâm.","Nghề này chỉ phục vụ ngành quảng cáo, không giúp gì ngành khác."],"d":[true,false,true,false],"g":["Đúng bản chất nghề.","Cần thành thạo phần mềm đồ hoạ.","Nhiều nơi đào tạo.","Mang lại lợi ích cho mọi ngành nghề."]}]},{"so":34,"cd":6,"ten":"Nghề phát triển phần mềm","trang":"160–164","muctieu":["Hiểu khái niệm nghề phát triển phần mềm và kiến thức, kĩ năng cần có.","Biết các ngành học đại học, cao đẳng và cơ hội nghề nghiệp liên quan."],"muc":[{"t":"Phát triển phần mềm là gì?","icon":"💻","b":["Quy trình: <b>khảo sát → phân tích → thiết kế → lập trình → kiểm thử → chuyển giao → bảo trì<\/b>.","Gồm cả quản trị dự án phần mềm."]},{"t":"Kiến thức, kĩ năng","icon":"🧑‍💻","b":["<b>Lập trình viên<\/b>: thuật toán, ngôn ngữ lập trình.","<b>Kĩ sư phần mềm<\/b>: phân tích, thiết kế hệ thống.","<b>Quản trị dự án<\/b>: kế hoạch, điều phối."]},{"t":"Công việc, cơ hội","icon":"🚀","b":["Ứng dụng, web, game, di động, <b>trí tuệ nhân tạo<\/b>.","Ngành CNTT có tỉ lệ việc làm cao, nhu cầu lớn.","Học tại đại học, cao đẳng, trung tâm đào tạo."]}],"ghinho":"Phát triển phần mềm là làm việc nhóm nhiều vai trò; nền tảng toán, tư duy thuật toán và tự học là quan trọng nhất.","vandung":"Tìm các trường đào tạo ngành phát triển phần mềm ở tỉnh/thành phố em.","the":[{"q":"Người phát triển phần mềm trong tiếng Anh gọi là gì?","a":"<b>Software Developer<\/b>."},{"q":"Sản xuất phần mềm có bao nhiêu <b>công đoạn<\/b> cơ bản?","a":"<b>7 công đoạn<\/b>: điều tra khảo sát, phân tích hệ thống, thiết kế hệ thống, lập trình, kiểm thử, chuyển giao, bảo trì."},{"q":"Công đoạn <b>đầu tiên<\/b> khi làm một phần mềm là gì?","a":"<b>Điều tra khảo sát<\/b>: tiếp xúc khách hàng, tìm hiểu yêu cầu, lập hồ sơ yêu cầu."},{"q":"Công đoạn nào <b>viết các đoạn mã<\/b> thực hiện chức năng của phần mềm?","a":"<b>Lập trình<\/b> (dựa vào tài liệu thiết kế)."},{"q":"Công đoạn <b>chuyển giao<\/b> gồm những việc gì?","a":"<b>Cài đặt<\/b>, khởi tạo dữ liệu, <b>hướng dẫn sử dụng<\/b> và chuyển giao cho khách hàng."},{"q":"Công đoạn <b>kiểm thử<\/b> để làm gì?","a":"<b>Phát hiện, loại bỏ lỗi<\/b> và chỗ bất hợp lí; kiểm tra kết quả theo đúng chức năng đã thiết kế."},{"q":"Vì sao <b>bảo trì<\/b> là công việc rất quan trọng?","a":"Phần mềm mới vận hành có thể còn <b>sai sót<\/b>; bảo trì để <b>khắc phục lỗi<\/b>, <b>nâng cấp<\/b> tính năng, giao diện — có thể thành một vòng phát triển mới."},{"q":"<b>Thiết kế hệ thống<\/b> khác <b>phân tích hệ thống<\/b> ở điểm nào?","a":"<b>Phân tích<\/b>: mô tả đầy đủ <b>yêu cầu<\/b> phần mềm (làm gì). <b>Thiết kế<\/b>: đưa ra thiết kế <b>tổng thể<\/b>, dữ liệu, chức năng, giao diện (làm thế nào)."},{"q":"<i>Đúng hay Sai?<\/i><br>“Phát triển phần mềm chỉ là lập trình.”","a":"<b>Sai.<\/b> Phát triển phần mềm gồm <b>nhiều công việc<\/b>: khảo sát, phân tích, thiết kế, lập trình, kiểm thử, chuyển giao, bảo trì và quản trị dự án."},{"q":"<i>Sắp xếp:<\/i> Kiểm thử · Điều tra khảo sát · Lập trình · Thiết kế hệ thống — theo đúng thứ tự.","a":"<b>Điều tra khảo sát → Thiết kế hệ thống → Lập trình → Kiểm thử<\/b>."},{"q":"<i>Tình huống:<\/i> Trường muốn làm app quản lí thư viện. Khi gặp thầy cô thủ thư để hỏi “cần app làm được gì?”, nhóm đang ở công đoạn nào?","a":"<b>Điều tra khảo sát<\/b> — tìm hiểu yêu cầu nghiệp vụ, xây dựng hồ sơ yêu cầu của hệ thống."},{"q":"<i>Tình huống:<\/i> App đã dùng 3 tháng, bạn đọc góp ý muốn thêm chức năng “gia hạn sách online”. Đây là công đoạn nào? Vì sao?","a":"<b>Bảo trì<\/b> — <b>nâng cấp<\/b> tính năng sau khi phần mềm đã vận hành."},{"q":"<i>Thử thách:<\/i> Kể <b>đủ 7 công đoạn<\/b> sản xuất phần mềm theo đúng thứ tự và cho biết hoạt động nào bao trùm tất cả.","a":"Điều tra khảo sát → Phân tích hệ thống → Thiết kế hệ thống → Lập trình → Kiểm thử → Chuyển giao → Bảo trì. Bao trùm: <b>quản trị dự án phần mềm<\/b>."},{"q":"Ba vị trí <b>quan trọng nhất<\/b> trong phát triển phần mềm là gì?","a":"<b>Lập trình viên<\/b>, <b>kĩ sư phần mềm<\/b>, <b>người quản trị dự án<\/b>."},{"q":"Muốn làm <b>kĩ sư phần mềm<\/b>, em nên học ngành gì ở đại học?","a":"Ngành <b>Tin học<\/b> hoặc <b>Công nghệ thông tin<\/b>."},{"q":"Kể tên <b>3 công ty, tập đoàn công nghệ<\/b> ở Việt Nam có tổ chức hội chợ việc làm.","a":"<b>FPT<\/b>, <b>Viettel<\/b>, <b>VNPT<\/b>…"},{"q":"Lập trình viên cần có những <b>tố chất<\/b> nào?","a":"Hiểu biết <b>thuật toán<\/b>, cấu trúc dữ liệu; đức tính <b>cẩn thận, tỉ mỉ<\/b>; làm chủ môi trường lập trình."},{"q":"Kể <b>3 lĩnh vực<\/b> công việc phát triển phần mềm.","a":"Ví dụ: <b>lập trình ứng dụng<\/b>, phát triển <b>giao diện<\/b>, ứng dụng <b>web<\/b>, lập trình <b>AI<\/b>, phát triển <b>games<\/b>, ứng dụng <b>di động<\/b>."},{"q":"SGK so sánh kĩ sư phần mềm và lập trình viên giống mối quan hệ nào trong xây dựng?","a":"Giống <b>kiến trúc sư<\/b> và <b>thợ xây<\/b>."},{"q":"Người quản trị dự án phần mềm cần những phẩm chất gì?","a":"<b>Tầm nhìn<\/b>, hiểu quy trình làm phần mềm, hiểu xu hướng công nghệ; khả năng <b>tổ chức, lập kế hoạch, điều phối nguồn lực<\/b>, giám sát."},{"q":"<i>Đúng hay Sai?<\/i><br>“Tất cả những người phát triển phần mềm đều có vai trò như nhau.”","a":"<b>Sai.<\/b> Có nhiều vị trí khác nhau: lập trình viên, kĩ sư phần mềm (phân tích, thiết kế), quản trị dự án, kiểm thử, bảo trì…"},{"q":"Vì sao nhu cầu tuyển dụng người phát triển phần mềm ngày càng lớn?","a":"Do sự phát triển của <b>CMCN 4.0<\/b>: AI, IoT, điện toán đám mây, <b>chuỗi khối<\/b>… mở ra nhiều cơ hội; phát triển phần mềm chiếm tỉ lệ <b>cao nhất<\/b> trong tuyển dụng ngành CNTT."},{"q":"<i>Ghép đôi:<\/i> Lập trình viên · Phân tích – thiết kế · Quản trị dự án với tố chất: <b>(a)<\/b> cẩn thận, tỉ mỉ <b>(b)<\/b> hiểu nghiệp vụ lĩnh vực ứng dụng <b>(c)<\/b> tầm nhìn, điều phối nguồn lực.","a":"<b>Lập trình viên – (a)<\/b>; <b>Phân tích – thiết kế – (b)<\/b>; <b>Quản trị dự án – (c)<\/b>."},{"q":"<i>Tình huống:<\/i> Muốn viết phần mềm <b>kế toán<\/b>, người phân tích – thiết kế cần hiểu thêm gì ngoài tin học?","a":"Cần hiểu <b>nghiệp vụ kế toán<\/b> — phải hiểu nghề “như một kế toán giỏi” để xây dựng giải pháp đúng."},{"q":"<i>Tình huống:<\/i> Bạn Lan mê chơi game, muốn sau này <b>làm ra game<\/b>. Lan nên chuẩn bị gì từ bây giờ?","a":"Học tốt <b>Toán, Tin<\/b>; học <b>lập trình<\/b> (Python…), thuật toán; tham gia khoá học, CLB; sau THPT học ngành <b>CNTT<\/b>, tích luỹ kinh nghiệm qua dự án thực tế."},{"q":"<i>Thử thách:<\/i> Nghề thiết kế đồ hoạ hay phát triển phần mềm hợp với em hơn? Nêu <b>2 lí do<\/b> dựa vào sở thích và tố chất của em.","a":"Không có đáp án duy nhất. Nhóm chấm đúng khi bạn nêu được <b>tố chất của nghề<\/b> (sáng tạo, cảm nhận cái đẹp ↔ tư duy thuật toán, tỉ mỉ) gắn với <b>bản thân<\/b>."}],"mcq":[{"m":"TH","q":"Thứ tự đúng của một số công đoạn phát triển phần mềm là","o":["phân tích → thiết kế → lập trình → kiểm thử","lập trình → phân tích → kiểm thử → thiết kế","kiểm thử → lập trình → thiết kế → phân tích","thiết kế → kiểm thử → phân tích → lập trình"],"g":"Quy trình: khảo sát → phân tích → thiết kế → lập trình → kiểm thử → chuyển giao → bảo trì."},{"m" , <b>lọc<\/b> dữ liệu theo tiêu chí."},{"q":"Mục đích chính của công việc quản lí là gì?","a":"<b>Xử lí thông tin<\/b> để <b>đưa ra quyết định<\/b>."},{"q":"Kể <b>2 ví dụ<\/b> thu thập dữ liệu <b>tự động<\/b>. Lợi ích là gì?","a":"Quét <b>mã vạch<\/b> ở quầy thu ngân; <b>công tơ điện tử<\/b> gửi chỉ số về điện lực. Lợi ích: <b>giảm công sức<\/b>, có khối dữ liệu lớn giúp ra quyết định."},{"q":"<i>Tình huống:<\/i> Phân loại các việc sau là <b>cập nhật<\/b> hay <b>khai thác<\/b>: (a) sửa tên ghi nhầm (b) thống kê tỉ lệ HS Giỏi (c) xoá điểm 0 của bạn nghỉ có lí do.","a":"(a) <b>cập nhật<\/b>; (b) <b>khai thác thông tin<\/b> (thống kê); (c) <b>cập nhật<\/b>."},{"q":"<i>Thử thách:<\/i> Thư viện trường quản lí sách bằng sổ ghi tay. Nêu <b>3 lợi ích<\/b> khi chuyển sang dùng CSDL.","a":"Gợi ý: tìm kiếm, <b>truy xuất nhanh<\/b>; <b>không dư thừa<\/b>, nhất quán (sửa một nơi); <b>thống kê<\/b> sách mượn nhiều; bảo mật, <b>sao lưu<\/b> được; thu thập tự động bằng mã vạch. (Hợp lí là đúng.)"}],"mcq":[{"m":"TH","q":"Cập nhật dữ liệu gồm các thao tác","o":["thêm, xoá, sửa dữ liệu","tìm kiếm, sắp xếp, lọc","thống kê, phân tích","in ấn, trình chiếu"],"g":"Cập nhật: thêm, xoá, sửa."},{"m":"TH","q":"Lọc danh sách học sinh có điểm từ 8 trở lên thuộc công việc","o":["truy xuất dữ liệu","cập nhật dữ liệu","thu thập dữ liệu","sao lưu dữ liệu"],"g":"Truy xuất: tìm kiếm, sắp xếp, lọc theo tiêu chí."},{"m":"VD","q":"Tính tỉ lệ học sinh Giỏi, Khá của lớp thuộc công việc","o":["khai thác thông tin","cập nhật dữ liệu","nhập dữ liệu","xoá dữ liệu"],"g":"Khai thác: thống kê, phân tích, tính toán."},{"m":"NB","q":"Ví dụ nào là thu thập dữ liệu tự động?","o":["Quét mã vạch ở siêu thị","Viết sổ điểm bằng tay","Gõ danh sách lớp từ giấy","Đọc tên điểm danh"],"g":"Mã vạch, công tơ điện tử, IoT… thu thập tự động."},{"m":"TH","q":"Công việc quan trọng hàng đầu trong bài toán quản lí là","o":["lưu trữ dữ liệu","in báo cáo màu","trang trí giao diện","chọn phông chữ"],"g":"Quản lí là xử lí thông tin để ra c lập dữ liệu<\/b>, <b>toàn vẹn<\/b>, <b>nhất quán<\/b>, <b>bảo mật và an toàn<\/b>."},{"q":"Lưu trữ thủ công một dữ liệu ở <b>nhiều nơi<\/b> dễ dẫn đến những vấn đề gì?","a":"<b>Dư thừa<\/b> dữ liệu và <b>không nhất quán<\/b> (VD điểm Toán ở bảng môn là 9, bảng lớp ghi nhầm 8)."},{"q":"<b>Tính độc lập dữ liệu<\/b> nghĩa là gì?","a":"Thay đổi <b>cách lưu trữ<\/b> dữ liệu mà <b>không phải sửa<\/b> phần mềm ứng dụng."},{"q":"<i>Đúng hay Sai?<\/i><br>“Ràng buộc điểm phải từ 0 đến 10 thể hiện tính <b>bảo mật<\/b> của CSDL.”","a":"<b>Sai.<\/b> Đó là tính <b>toàn vẹn<\/b> — dữ liệu phải thoả mãn các ràng buộc."},{"q":"<i>Tình huống:<\/i> Hệ thống bán vé tàu bán <b>một ghế cho hai khách<\/b>. CSDL đã vi phạm tính chất nào?","a":"Tính <b>nhất quán<\/b> — dữ liệu phải đúng đắn sau cập nhật, kể cả khi nhiều người truy cập cùng lúc."},{"q":"Vì sao <b>không cần lưu<\/b> bảng điểm cả lớp nếu đã có các bảng điểm từng môn?","a":"Bảng điểm lớp <b>ghép được<\/b> từ các bảng điểm môn; lưu thêm sẽ <b>dư thừa<\/b>, dễ <b>không nhất quán<\/b> khi sửa điểm."}],"mcq":[{"m":"NB","q":"Cơ sở dữ liệu là","o":["tập hợp dữ liệu có liên quan, lưu trữ có tổ chức trên máy tính","một phần mềm soạn thảo văn bản trên máy tính","một tệp ảnh có dung lượng lớn lưu trên máy","một thiết bị lưu trữ ngoài như ổ cứng, USB"],"g":"Định nghĩa CSDL theo SGK."},{"m":"TH","q":"Ràng buộc “điểm phải từ 0 đến 10” thể hiện tính chất nào của CSDL?","o":["Tính toàn vẹn","Tính độc lập","Tính bảo mật","Tính cấu trúc"],"g":"Toàn vẹn: dữ liệu thoả các ràng buộc."},{"m":"TH","q":"Hệ thống không bán một ghế cho hai khách cùng lúc thể hiện tính","o":["nhất quán","dư thừa","độc lập","cấu trúc"],"g":"Nhất quán: không bán 1 ghế cho 2 khách."},{"m":"TH","q":"Ghi cùng một điểm ở hai nơi rồi sửa một nơi dễ gây ra","o":["dữ liệu không nhất quán","dữ liệu bảo mật hơn","dữ liệu nhỏ gọn hơn","dữ liệu độc lập hơn"],"g":"Dư thừa dẫn tới không nhất quán."},{"m":"TH","q":"Tính độc lập dữ liệu nghĩa là","o":["đổi cấu trúc dữ liệu không phải
