của bảng A là khoá chính của bảng B."]},{"t":"Liên kết dữ liệu","icon":"🔗","b":["Dùng khoá ngoài ghép nối 2 bảng (<b>join<\/b>).","Tách bảng → tránh lặp dữ liệu, sửa một lần, dữ liệu nhất quán."]}],"ghinho":"CSDL quan hệ = các bảng liên kết qua khoá: khoá chính để phân biệt, khoá ngoài để kết nối.","vandung":"Xác định khoá chính, khoá ngoài cho CSDL quản lí điểm thi tốt nghiệp.","the":[{"q":"Ai đề xuất mô hình <b>CSDL quan hệ<\/b>, vào khoảng thời gian nào?","a":"<b>Edgar Frank Codd<\/b>, những năm <b>1970<\/b>."},{"q":"Trong một bảng, mỗi <b>hàng<\/b> và mỗi <b>cột<\/b> gọi là gì?","a":"Hàng: <b>bản ghi<\/b> (record). Cột: <b>trường<\/b> (field)."},{"q":"<b>Khoá<\/b> của một bảng là gì?","a":"Trường (nhóm trường) có giá trị <b>không trùng nhau<\/b> ở các bản ghi — xác định <b>duy nhất<\/b> một bản ghi."},{"q":"<b>Khoá ngoài<\/b> là gì? Dùng để làm gì?","a":"Trường của bảng A là <b>khoá chính ở bảng B<\/b>. Dùng để <b>liên kết<\/b> (join) dữ liệu hai bảng."},{"q":"<i>Đúng hay Sai?<\/i><br>“Bảng Học sinh có thể chọn trường <b>Họ tên<\/b> làm khoá chính.”","a":"<b>Sai.<\/b> Họ tên có thể <b>trùng nhau<\/b>; nên chọn trường như <b>mã học sinh<\/b>."},{"q":"Vì sao khai báo <b>kiểu dữ liệu<\/b> cho từng trường?","a":"Để <b>hạn chế lãng phí<\/b> dung lượng và <b>kiểm soát tính đúng đắn<\/b> của dữ liệu nhập vào."},{"q":"Vì sao tách dữ liệu nhạc thành 2 bảng <b>Bản nhạc<\/b> và <b>Nhạc sĩ<\/b> (liên kết qua Aid) thay vì một bảng?","a":"Tránh <b>lặp lại<\/b> tên nhạc sĩ ở nhiều dòng; muốn sửa tên chỉ cần <b>sửa một lần<\/b> → giữ <b>nhất quán<\/b>."}],"mcq":[{"m":"NB","q":"Mô hình CSDL quan hệ do ai đề xuất?","o":["E. F. Codd","Guido van Rossum","George Boole","Alan Turing"],"g":"E. F. Codd đề xuất từ những năm 1970."},{"m":"NB","q":"Trong bảng CSDL quan hệ, mỗi hàng được gọi là","o":["bản ghi","trường","khoá","bảng con"],"g":"Bản ghi (record): mỗi hàng; trường (field): mỗi cột."},{"m":"TH","q":"Khoá chính của bảng dùng để","o":["xác định duy nhất mỗi bản ghi","sắp xếp các cột theo thứ tự","tô màu các bản ghi quan trọng","đặt mật khẩu cho bảng"],"g":"Khoá xác định duy nhất một bản ghi."},{"m":"TH","q":"Trường của bảng A là khoá chính của bảng B thì trường đó trong bảng A gọi là","o":["khoá ngoài","khoá chính","khoá phụ","khoá kép"],"g":"Khoá ngoài: trường của bảng A là khoá chính của bảng B."},{"m":"VD","q":"Trong bảng HOCSINH(MaHS, HoTen, NgaySinh, Lop), trường thích hợp làm khoá chính là","o":["MaHS","HoTen","NgaySinh","Lop"],"g":"Mã học sinh là duy nhất; họ tên, ngày sinh có thể trùng."},{"m":"TH","q":"Tách dữ liệu thành nhiều bảng có liên kết giúp","o":["tránh lặp dữ liệu, sửa một lần","tăng số lần nhập dữ liệu","làm dữ liệu khó tìm hơn","bỏ được khoá chính"],"g":"Tách bảng → tránh lặp, sửa một lần, dữ liệu nhất quán."}],"tf":[{"q":"Thư viện có bảng SACH(MaSach, TenSach) và bảng MUON(MaPhieu, MaSach, MaHS).","y":["MaSach là khoá chính của bảng SACH.","MaSach trong bảng MUON là khoá ngoài.","Mỗi cột của bảng MUON gọi là một bản ghi.","Hai bảng được liên kết qua trường MaSach."],"d":[true,true,false,true],"g":["Xác định duy nhất mỗi cuốn sách.","Tham chiếu khoá chính bảng SACH.","Mỗi cột là một trường.","Liên kết bằng khoá ngoài."]}]},{"so":14,"cd":4,"ten":"SQL – Ngôn ngữ truy vấn có cấu trúc","trang":"69–72","muctieu":["Hiểu được ở mức nguyên lí: CSDL và các bảng được tạo lập, được thêm mới, cập nhật và truy xuất dữ liệu qua SQL."],"muc":[{"t":"Lợi ích của ngôn ngữ truy vấn","icon":"💬","b":["Lập trình “theo thủ tục”: phải biết cấu trúc tệp, dễ nhầm.","Truy vấn: chỉ viết <b>muốn làm gì<\/b>, hệ QTCSDL tự thực hiện.","SQL gồm 3 phần: <b>DDL · DML · DCL<\/b>."]},{"t":"Khởi tạo CSDL (DDL)","icon":"🏗️","b":["<code>CREATE DATABASE<\/code>, <code>CREATE TABLE<\/code>, <code>ALTER TABLE<\/code>.","<code>PRIMARY KEY<\/code>, <code>FOREIGN KEY … REFERENCES<\/code>.","Kiểu: CHAR(n), VARCHAR(n), INT, REAL, DATE, BOOLEAN…"]},{"t":"Cập nhật, truy xuất (DML)","icon":"🔎","b":["<code>SELECT … FROM … WHERE … ORDER BY<\/code>; <code>INNER JOIN<\/code>.","<code>INSERT INTO<\/code> · <code>UPDATE … SET<\/code> · <code>DELETE FROM<\/code>."]},{"t":"Kiểm soát quyền truy cập (DCL)","icon":"🛂","b":["<code>GRANT<\/code> – cấp quyền cho người dùng.","<code>REVOKE<\/code> – thu hồi quyền."]}],"ghinho":"SQL là “ngôn ngữ chung” của hầu hết hệ QTCSDL: DDL tạo khung, DML làm việc với dữ liệu, DCL phân quyền. Mỗi câu kết thúc bằng dấu “;”.","vandung":"Viết câu SELECT lấy dữ liệu từ hai bảng liên kết bằng INNER JOIN.","the":[{"q":"SQL là viết tắt của cụm từ gì?","a":"<b>Structured Query Language<\/b> — ngôn ngữ truy vấn có cấu trúc."},{"q":"SQL gồm <b>3 thành phần<\/b> nào?","a":"<b>DDL<\/b> (định nghĩa dữ liệu), <b>DML<\/b> (thao tác dữ liệu), <b>DCL<\/b> (kiểm soát dữ liệu)."},{"q":"Câu truy vấn SQL kết thúc bằng dấu gì?","a":"Dấu chấm phẩy <b>;<\/b>"},{"q":"Hai câu truy vấn nào <b>cấp<\/b> và <b>thu hồi<\/b> quyền người dùng?","a":"<b>GRANT<\/b> (cấp quyền) và <b>REVOKE<\/b> (thu hồi quyền)."},{"q":"Kiểu <b>DATE<\/b> và <b>TIME<\/b> trong SQL viết theo dạng nào?","a":"DATE: <b>'YYYY-MM-DD'<\/b>. TIME: <b>'HH:MM:SS'<\/b>."},{"q":"<b>CHAR(n)<\/b> khác <b>VARCHAR(n)<\/b> thế nào?","a":"CHAR(n): xâu độ dài <b>cố định<\/b> n kí tự (thiếu thì thêm dấu cách). VARCHAR(n): độ dài <b>thay đổi<\/b>, không quá n kí tự."},{"q":"Câu truy vấn sau làm gì?<div class='code'>SELECT Mid, TenBN\n  FROM bannhac\n  WHERE Aid = 1\n  ORDER BY TenBN;<\/div>","a":"Lấy cột <b>Mid, TenBN<\/b> của các dòng có <b>Aid = 1<\/b> trong bảng bannhac, <b>sắp xếp<\/b> theo TenBN."},{"q":"Câu truy vấn sau làm gì?<div class='code'>DELETE FROM bannhac\n  WHERE Mid = '0005';<\/div>","a":"<b>Xoá<\/b> dòng có Mid = '0005' trong bảng <b>bannhac<\/b>."},{"q":"Câu truy vấn sau thuộc thành phần nào của SQL? Nó làm gì?<div class='code'>GRANT select\n  ON music.*\n  TO guest;<\/div>","a":"Thuộc <b>DCL<\/b>. Cấp quyền <b>SELECT<\/b> trên tất cả các bảng của CSDL music cho người dùng <b>guest<\/b>."},{"q":"Viết câu truy vấn đổi tên nhạc sĩ có <b>Aid = 6<\/b> trong bảng <b>nhacsi<\/b> thành <b>'Hoàng Hiệp'<\/b>.","a":"<div class='code'>UPDATE nhacsi\n  SET TenNS = 'Hoàng Hiệp'\n  WHERE Aid = 6;<\/div>"},{"q":"Viết câu truy vấn thêm 2 nhạc sĩ <b>(5, 'Phú Quang')<\/b> và <b>(6, 'Phan Huỳnh Điểu')<\/b> vào bảng <b>nhacsi<\/b>.","a":"<div class='code'>INSERT INTO nhacsi VALUES\n  (5, 'Phú Quang'),\n  (6, 'Phan Huỳnh Điểu');<\/div>"},{"q":"Bảng <b>diemtoan_11A<\/b> có cột <b>tb<\/b> (điểm trung bình Toán). Viết câu truy vấn tính <b>điểm trung bình cộng<\/b> của cả lớp.","a":"<div class='code'>SELECT AVG(tb)\n  FROM diemtoan_11A;<\/div>"},{"q":"<i>Thử thách:<\/i> Viết câu truy vấn lấy <b>tên bản nhạc<\/b> (bannhac.TenBN) kèm <b>tên nhạc sĩ<\/b> (nhacsi.TenNS), liên kết hai bảng theo <b>Aid<\/b>.","a":"<div class='code'>SELECT bannhac.TenBN,\n  nhacsi.TenNS\nFROM bannhac\n INNER JOIN nhacsi\n ON bannhac.Aid\n  = nhacsi.Aid;<\/div>"}],"mcq":[{"m":"NB","q":"Câu lệnh SQL dùng để tạo bảng là","o":["CREATE TABLE","SELECT","INSERT INTO","GRANT"],"g":"DDL: CREATE DATABASE, CREATE TABLE, ALTER TABLE."},{"m":"NB","q":"Câu lệnh SQL dùng để truy xuất dữ liệu là","o":["SELECT … FROM … WHERE","CREATE DATABASE … ;","ALTER TABLE … ADD …","REVOKE … ON … FROM"],"g":"DML: SELECT … FROM … WHERE … ORDER BY."},{"m":"TH","q":"Lệnh GRANT và REVOKE thuộc thành phần nào của SQL?","o":["DCL – kiểm soát quyền truy cập","DDL – định nghĩa dữ liệu","DML – thao tác dữ liệu","DQL – truy vấn dữ liệu"],"g":"DCL: GRANT cấp quyền, REVOKE thu hồi."},{"m":"VD","q":"Câu lệnh lấy họ tên học sinh có điểm Tin từ 8 trở lên là","o":["SELECT HoTen FROM HOCSINH WHERE DiemTin >= 8;","SELECT * HOCSINH WHERE DiemTin >= 8;","INSERT HoTen FROM HOCSINH WHERE DiemTin >= 8;","UPDATE HOCSINH SET HoTen WHERE DiemTin >= 8;"],"g":"Cú pháp SELECT … FROM … WHERE …;"},{"m":"TH","q":"Lợi ích chính của ngôn ngữ truy vấn so với lập trình theo thủ tục là","o":["chỉ cần viết muốn làm gì, hệ QTCSDL tự thực hiện","phải biết rõ cấu trúc tệp lưu dữ liệu","chỉ chạy được trên một máy tính","không cần hệ quản trị CSDL"],"g":"Truy vấn: chỉ viết muốn làm gì, hệ QTCSDL tự thực hiện."},{"m":"VD","q":"Muốn sửa điểm của học sinh mã HS05 thành 9, dùng lệnh","o":["UPDATE … SET … WHERE …","DELETE FROM … WHERE …","CREATE TABLE …","SELECT … ORDER BY …"],"g":"UPDATE … SET dùng để sửa dữ liệu."}],"tf":[{"q":"Cô giáo dùng SQL quản lí bảng DIEM(MaHS, Mon, Diem).","y":["Lệnh INSERT INTO dùng để thêm bản ghi mới.","Lệnh DELETE FROM DIEM WHERE MaHS = 'HS03'; xoá các bản ghi của HS03.","Mệnh đề ORDER BY dùng để lọc dữ liệu theo điều kiện.","Câu lệnh SQL kết thúc bằng dấu chấm phẩy “;”."],"d":[true,true,false,true],"g":["DML.","DELETE FROM … WHERE.","ORDER BY để sắp xếp; WHERE để lọc.","Theo SGK."]}]},{"so":15,"cd":4,"ten":"Bảo mật và an toàn hệ cơ sở dữ liệu","trang":"73–76","muctieu":["Hiểu được tầm quan trọng và một số biện pháp bảo vệ hệ CSDL."],"muc":[{"t":"Bảo mật hệ CSDL","icon":"🔒","b":["Xây dựng <b>chính sách bảo mật<\/b>: phân nhóm người dùng, mỗi nhóm một quyền.","VD web âm nhạc: guest (xem) · moderator (thêm) · master_mod (sửa, xoá) · admin.","Ý thức người dùng: giữ mật khẩu; theo dõi hệ thống, lưu <b>log file<\/b>; an ninh mạng."]},{"t":"Sự cố nguồn điện","icon":"⚡","b":["Không đủ công suất → xây dựng hệ thống điện đủ tải.","Quá tải → kiểm tra thường xuyên · mất điện đột ngột → <b>bộ lưu điện<\/b>."]},{"t":"Sự cố thiết bị lưu trữ","icon":"💽","b":["Hỏng do tuổi thọ → thay trước khi hết hạn dùng.","Hỏng bất ngờ → <b>sao lưu định kì<\/b>, lưu hai bản, kiểm tra chéo.","Hệ QTCSDL hỗ trợ sao lưu và phục hồi từ bản gần nhất."]}],"ghinho":"Bảo vệ CSDL cần cả công nghệ (phân quyền, sao lưu) lẫn con người (ý thức, trách nhiệm).","vandung":"Xây dựng mô hình phân nhóm quyền truy cập cho CSDL điểm của một trung tâm tiếng Anh.","the":[{"q":"Việc <b>đầu tiên<\/b> khi xây dựng chính sách bảo mật CSDL là gì?","a":"<b>Lập danh sách<\/b> và xác định <b>quyền hạn<\/b> của các nhóm người dùng."},{"q":"Biên bản lưu lại hoạt động của hệ thống thường được gọi là gì?","a":"<b>Log file<\/b>."},{"q":"Giải pháp chung để khôi phục dữ liệu khi thiết bị lưu trữ hỏng là gì?","a":"<b>Sao lưu dữ liệu định kì<\/b> ra thiết bị dự phòng; phục hồi từ bản sao lưu gần nhất."},{"q":"Nêu giải pháp cho sự cố <b>mất điện đột ngột<\/b> với máy tính quản trị CSDL.","a":"Dùng <b>bộ lưu điện<\/b> (UPS) cấp điện ngay khi mất điện đột ngột."},{"q":"Vì sao chính sách bảo mật phải có quy định về <b>ý thức, trách nhiệm<\/b> của người dùng với tài khoản?","a":"Nếu người dùng <b>để lộ tài khoản<\/b>, kẻ xấu chiếm được thì giải pháp phân quyền <b>mất tác dụng<\/b>."},{"q":"<i>Tình huống:<\/i> Website âm nhạc: khách chỉ được <b>xem<\/b>; cộng tác viên được <b>thêm<\/b> bản nhạc mới nhưng không xoá, sửa. Cấp quyền gì cho mỗi nhóm?","a":"Khách (guest): quyền <b>SELECT<\/b>. Cộng tác viên (moderator): quyền <b>SELECT, INSERT<\/b>."},{"q":"<i>Thử thách:<\/i> Trung tâm tiếng Anh có 4 giáo viên dạy 4 kĩ năng (bảng diemnghe, diemnoi, diemdoc, diemviet). Hãy <b>phân nhóm quyền<\/b> truy cập CSDL.","a":"<b>Học viên<\/b>: chỉ xem (SELECT). <b>Mỗi giáo viên<\/b>: thêm, cập nhật, xoá bản ghi trong <b>bảng điểm môn mình dạy<\/b>. <b>Một người quản trị<\/b>: toàn quyền với tất cả các bảng."}],"mcq":[{"m":"TH","q":"Để bảo mật hệ CSDL, chính sách thường dùng là","o":["phân nhóm người dùng, mỗi nhóm một quyền","cho mọi người dùng quyền quản trị","công khai mật khẩu quản trị","tắt hết nhật kí hệ thống"],"g":"Phân nhóm người dùng, mỗi nhóm một quyền."},{"m":"NB","q":"Thiết bị giúp hệ thống không mất dữ liệu khi mất điện đột ngột là","o":["bộ lưu điện (UPS)","máy in laser","bộ chia mạng","máy quét mã vạch"],"g":"Mất điện đột ngột → bộ lưu điện."},{"m":"TH","q":"Biện pháp phòng thiết bị lưu trữ hỏng bất ngờ là","o":["sao lưu định kì, lưu hai bản","dùng một ổ đĩa duy nhất","tắt máy liên tục","xoá bớt dữ liệu cũ"],"g":"Sao lưu định kì, lưu hai bản, kiểm tra chéo."},{"m":"TH","q":"Tệp nhật kí (log file) giúp người quản trị","o":["theo dõi các thao tác trên hệ thống","tăng dung lượng trống của ổ cứng","tăng tốc độ đường tr o":"MySQL lo phần “chủ” (xử lí dữ liệu), HeidiSQL lo phần “khách” (giao diện) – bộ đôi nguồn mở để thực hành quản trị CSDL.","vandung":"Tìm hiểu thêm về MySQL và HeidiSQL với từ khoá phù hợp.","the":[{"q":"Kể tên hệ QTCSDL và phần mềm khách được dùng để thực hành trong SGK.","a":"Hệ QTCSDL <b>MySQL<\/b> và phần mềm <b>HeidiSQL<\/b>."},{"q":"MySQL và HeidiSQL có phải trả tiền bản quyền không?","a":"<b>Không<\/b> — cả hai đều là phần mềm <b>mã nguồn mở, miễn phí<\/b>."},{"q":"Lệnh mở MySQL trong cửa sổ dòng lệnh với người dùng root là gì?","a":"<div class='code'>mysql -u root -p<\/div>"},{"q":"Trong lệnh <code>mysql -u root -p<\/code>, chữ <b>u<\/b> và <b>p<\/b> là viết tắt của gì?","a":"<b>u<\/b>: user (người dùng). <b>p<\/b>: password (mật khẩu)."},{"q":"Nêu <b>3 lợi ích<\/b> của việc quản trị CSDL trên máy tính.","a":"<b>Tiện lợi<\/b>, <b>kịp thời<\/b>, <b>nhanh chóng<\/b>, <b>hạn chế sai sót<\/b> (so với ghi chép thủ công)."},{"q":"Vì sao nên dùng HeidiSQL thay vì gõ lệnh trong mysql.exe?","a":"mysql.exe dùng <b>giao diện dòng lệnh<\/b>, không thuận tiện với người mới. HeidiSQL có <b>giao diện đồ hoạ<\/b>, dễ dùng, hỗ trợ <b>tiếng Việt<\/b>."},{"q":"<i>Thử thách:<\/i> Thiết kế các bảng (tên bảng, trường, khoá chính) cho CSDL quản lí <b>sách<\/b> và <b>tác giả<\/b> của thư viện trường, tránh lặp tên tác giả.","a":"Gợi ý: <b>tacgia<\/b>(<u>idTacgia<\/u>, tenTacgia) · <b>sach<\/b>(<u>idSach<\/u>, tenSach, namXB, idTacgia) — idTacgia trong sach là <b>khoá ngoài<\/b>. (Thiết kế hợp lí khác vẫn đúng.)"}],"mcq":[{"m":"TH","q":"Ưu điểm của quản trị CSDL trên máy tính so với thủ công là","o":["nhanh chóng, kịp thời, hạn chế sai sót","tốn nhiều công sức hơn","phải ghi chép bằng tay","không giao dịch trực tuyến được"],"g":"Trên máy: tiện lợi, kịp thời, nhanh chóng, hạn chế sai sót."},{"m":"NB","q":"Hệ QTCSDL dùng để thực hành trong SGK Tin 11 là","o":["MySQL","Oracle","Microsoft Access","MongoDB"],"g":"SGK dùng MySQL (nguồn mở, miễn phí, gọn nhẹ)."},{"m":"NB","q":"Phần mềm khách có giao diện đồ hoạ dùng cùng MySQL trong SGK là","o":["HeidiSQL","GIMP","VideoPad","Inkscape"],"g":"HeidiSQL: phần mềm khách nguồn mở, giao diện đồ hoạ."},{"m":"TH","q":"Trong bộ đôi MySQL – HeidiSQL, vai trò của MySQL là","o":["phía “chủ”, xử lí dữ liệu","phía “khách”, hiển thị giao diện","trình duyệt web","phần mềm soạn thảo"],"g":"MySQL lo phần “chủ”, HeidiSQL lo phần “khách”."},{"m":"VD","q":"Lệnh mở MySQL trong cửa sổ lệnh với tài khoản root là","o":["mysql -u root -p","mysql open root","run mysql root","root -p mysql"],"g":"Cửa sổ lệnh: mysql -u root -p."},{"m":"TH","q":"Khi cài MySQL, điều cần ghi nhớ là","o":["mật khẩu của tài khoản root","tên máy in mặc định","địa chỉ email của nhà sản xuất","số serial của ổ cứng"],"g":"Ghi nhớ mật khẩu root để kết nối."}],"tf":[{"q":"Nhóm Tuấn cài MySQL và HeidiSQL để thực hành quản lí bản thu âm.","y":["MySQL là hệ QTCSDL nguồn mở, miễn phí.","HeidiSQL là phần mềm khách có giao diện đồ hoạ, hỗ trợ tiếng Việt.","Kết nối HeidiSQL với MySQL không cần mật khẩu root.","Quản lí thủ công nhanh và ít sai sót hơn quản lí trên máy tính."],"d":[true,true,false,false],"g":["Theo SGK.","Theo SGK.","Cần người dùng root, mật khẩu.","Ngược lại."]}]},{"so":18,"cd":6,"ten":"Thực hành xác định cấu trúc bảng và các trường khoá","trang":"86–90","muctieu":["Có hình dung về công việc xác định các bảng dữ liệu, cấu trúc của chúng và các trường khoá trước khi tạo lập CSDL."],"muc":[{"t":"Xem xét bài toán","icon":"🎵","b":["Quản lí bản thu âm: tên bản nhạc, nhạc sĩ, ca sĩ.","Một bản nhạc có nhiều ca sĩ thể hiện."]},{"t":"Tạo lập bảng","icon":"📐","b":["<code>banthuam(idBanthuam, tenBannhac, tenNhacsi, tenCasi)<\/code>.","<b>idBanthuam<\/b> làm khoá chính – ngắn gọn, thuận tiện."]},{"t":"Tổ chức lại bảng","icon":"✂️","b":["Tên lặp lại → tách bảng <b>casi<\/b>, <b>bannhac<\/b>, <b>nhacsi<\/b>.","Thay tên bằng mã: idCasi, idBannhac, idNhacsi."]},{"t":"Các loại khoá","icon":"🔑","b":["Mỗi bảng một <b>khoá chính<\/b>.","<b>Khoá ngoài<\/b> tham chiếu khoá chính bảng khác.","<b>Unique<\/b>: cặp không được trùng."]},{"t":"Kiểu dữ liệu","icon":"🔢","b":["Khoá chính: <b>INT<\/b>, <b>AUTO_INCREMENT<\/b>.","Tên: <b>VARCHAR(255)<\/b>."]}],"ghinho":"Thiết kế trước, tạo bảng sau: tách bảng để không lặp dữ liệu, dùng khoá để liên kết.","vandung":"Phân tích, thiết lập mô hình dữ liệu cho bài toán quản lí tên quận/huyện, tỉnh/thành phố.","the":[{"q":"Bảng <b>banthuam(idBanthuam, tenBannhac, tenNhacsi, tenCasi)<\/b>: vì sao chọn <b>idBanthuam<\/b> làm khoá chính?","a":"idBanthuam xác định <b>duy nhất<\/b> một bản thu âm, lại <b>ngắn gọn<\/b> hơn khoá gồm 3 trường tenBannhac, tenNhacsi, tenCasi."},{"q":"Trong bảng banthuam, tên ca sĩ Trần Khánh xuất hiện ở nhiều dòng. Điều đó gây bất lợi gì?","a":"<b>Lặp lại<\/b> dữ liệu → tốn dung lượng; khi sửa tên ca sĩ phải <b>sửa ở tất cả<\/b> các dòng, dễ sai, không nhất quán."},{"q":"<i>Đúng hay Sai?<\/i><br>“Để quản lí bản thu âm, tốt nhất gộp hết vào <b>một bảng<\/b> chứa đủ tên bản nhạc, nhạc sĩ, ca sĩ.”","a":"<b>Sai.<\/b> Nên tách thành nhiều bảng (casi, nhacsi, bannhac, banthuam) liên kết qua khoá để <b>tránh lặp<\/b>, dễ sửa."},{"q":"Để khắc phục tên ca sĩ bị lặp, SGK tạo thêm bảng nào và thay trường nào trong bảng banthuam?","a":"Tạo bảng <b>casi(idCasi, tenCasi)<\/b>; thay trường <b>tenCasi<\/b> trong banthuam bằng <b>idCasi<\/b> (khoá ngoài)."},{"q":"Sau khi tổ chức lại, CSDL mymusic gồm những bảng nào?","a":"<b>casi<\/b>(idCasi, tenCasi) · <b>nhacsi<\/b>(idNhacsi, tenNhacsi) · <b>bannhac<\/b>(idBannhac, tenBannhac, idNhacsi) · <b>banthuam<\/b>(idBanthuam, idBannhac, idCasi)."},{"q":"Trong bảng <b>banthuam(idBanthuam, idBannhac, idCasi)<\/b>, trường nào là khoá chính, trường nào là khoá ngoài? Tham chiếu tới đâu?","a":"Khoá chính: <b>idBanthuam<\/b>. Khoá ngoài: <b>idBannhac<\/b> → bảng bannhac; <b>idCasi<\/b> → bảng casi."}],"mcq":[{"m":"TH","q":"Trong bảng banthuam(idBanthuam, tenBannhac, tenNhacsi, tenCasi), trường làm khoá chính là","o":["idBanthuam","tenBannhac","tenNhacsi","tenCasi"],"g":"idBanthuam ngắn gọn, duy nhất, thuận tiện làm khoá chính."},{"m":"TH","q":"Vì sao nên tách bảng banthuam thành các bảng casi, bannhac, nhacsi?","o":["Để tránh lặp lại tên nhiều lần","Để tăng thêm số cột của bảng","Để các bảng không cần khoá chính","Để dữ liệu khó bị người khác tìm"],"g":"Tên lặp lại → tách bảng, thay tên bằng mã."},{"m":"NB","q":"Kiểu dữ liệu thường chọn cho trường khoá chính dạng mã số tự tăng là","o":["INT, AUTO_INCREMENT","VARCHAR(255), cho phép rỗng","DATE, ngày tạo bản ghi","BOOLEAN, chỉ đúng hoặc sai"],"g":"Khoá chính: INT, AUTO_INCREMENT."},{"m":"NB","q":"Kiểu dữ liệu phù hợp cho trường tên bản nhạc là","o":["VARCHAR(255)","INT AUTO_INCREMENT","BOOLEAN","DATE"],"g":"Tên: VARCHAR(255)."},{"m":"TH","q":"Khoá UNIQUE trên cặp trường (tenBannhac, idNhacsi) đảm bảo","o":["cặp giá trị đó không bị trùng","hai trường luôn rỗng","hai trường tự tăng","bảng không có khoá chính"],"g":"Unique: cặp không được trùng."},{"m":"TH","q":"Mỗi bảng trong CSDL quan hệ có","o":["một khoá chính","nhiều khoá chính","không có khoá nào","đúng hai khoá ngoài"],"g":"Mỗi bảng một khoá chính."}],"tf":[{"q":"Nhóm Linh thiết kế CSDL quản lí bản thu âm: một bản nhạc có nhiều ca sĩ thể hiện.","y":["Nếu lưu tên ca sĩ trực tiếp trong bảng banthuam thì tên sẽ lặp lại nhiều lần.","Bảng casi nên có khoá chính idCasi.","idCasi trong bảng banthuam là khoá ngoài tham chiếu bảng casi.","Nên tạo bảng trước rồi mới thiết kế cấu trúc."],"d":[true,true,true,false],"g":["Dẫn tới dư thừa.","Thay tên bằng mã.","Khoá ngoài.","Thiết kế trước, tạo bảng sau."]}]},{"so":19,"cd":6,"ten":"Thực hành tạo lập cơ sở dữ liệu và các bảng","trang":"91–94","muctieu":["Biết tạo mới một CSDL qua giao diện của phần mềm khách quản trị CSDL HeidiSQL.","Tạo được bảng không có khoá ngoài, chỉ định khoá chính, khoá cấm trùng lặp cho trường không được trùng giá trị."],"muc":[{"t":"Tạo lập CSDL mymusic","icon":"🆕","b":["Chuột phải vùng danh sách CSDL → <b>Tạo mới → Cơ sở dữ liệu<\/b>.","Nhập tên <b>mymusic<\/b>; bộ mã utf8mb4.","HeidiSQL tự sinh câu <code>CREATE DATABASE<\/code>."]},{"t":"Khai báo bảng, trường, kiểu","icon":"🧮","b":["<b>Tạo mới → Bảng<\/b>, tên <b>nhacsi<\/b> → Thêm mới trường.","<b>idNhacsi<\/b>: INT, bỏ Allow NULL, AUTO_INCREMENT.","<b>tenNhacsi<\/b>: VARCHAR(255) (Ctrl+Insert thêm trường)."]},{"t":"Khoá chính và lưu kết quả","icon":"🔑","b":["Chuột phải idNhacsi → <b>Create new index → PRIMARY<\/b>.","Chọn nhầm khoá → sửa lại ở ô PRIMARY KEY.","Nhấn <b>Lưu<\/b> → bảng hiện dưới mymusic."]}],"ghinho":"Mỗi bảng cần: tên, các trường, kiểu dữ liệu và một khoá chính – nhớ Lưu trước khi rời đi.","vandung":"Lập CSDL quản lí tên Quận/Huyện, Tỉnh/Thành phố; tạo bảng Tỉnh/Thành phố.","the":[{"q":"Muốn tạo CSDL mới trong HeidiSQL, nháy phải chuột vào vùng danh sách CSDL, chọn gì?","a":"<b>Tạo mới → Cơ sở dữ liệu<\/b>, nhập tên (VD mymusic), chọn OK."},{"q":"Khi tạo CSDL mymusic, bộ mã kí tự mặc định là gì?","a":"<b>Unicode 4 byte: utf8mb4<\/b> (đối chiếu so sánh xâu theo utf8mb4_general_ci)."},{"q":"Trường <b>idNhacsi<\/b> được khai báo kiểu dữ liệu gì? Trường <b>tenNhacsi<\/b> kiểu gì?","a":"idNhacsi: <b>INT<\/b>. tenNhacsi: <b>VARCHAR(255)<\/b>."},{"q":"Phím tắt nào dùng để <b>thêm trường<\/b> (cột) khi khai báo bảng?","a":"<b>Ctrl + Insert<\/b> (hoặc nháy phải chuột → Add column)."},{"q":"Khai báo khoá chính trong HeidiSQL thế nào?","a":"Nháy phải chuột vào dòng khai báo trường → <b>Create new index → PRIMARY<\/b>."},{"q":"Thuộc tính <b>AUTO_INCREMENT<\/b> của trường idNhacsi có tác dụng gì?","a":"Giá trị <b>tự động tăng<\/b>, tự điền khi thêm dòng mới — không cần nhập."},{"q":"Vì sao bỏ đánh dấu ô <b>Allow NULL<\/b> khi khai báo trường idNhacsi?","a":"Để trường <b>không được để trống<\/b> — khoá chính phải luôn có giá trị."},{"q":"<i>Đúng hay Sai?<\/i><br>“Lỡ chọn nhầm trường làm khoá chính thì phải xoá bảng tạo lại.”","a":"<b>Sai.<\/b> Nháy đúp vào ô dưới PRIMARY KEY, chọn lại trường đúng rồi <b>Lưu<\/b>."},{"q":"Viết câu truy vấn SQL tạo bảng <b>nhacsi<\/b> gồm idNhacsi (INT) và tenNhacsi (VARCHAR 255), khoá chính idNhacsi.","a":"<div class='code'>CREATE TABLE nhacsi (\n  idNhacsi INT,\n  tenNhacsi VARCHAR(255),\n  PRIMARY KEY (idNhacsi)\n);<\/div>"},{"q":"<i>Thử thách:<\/i> Kể trình tự tạo đủ CSDL mymusic gồm 4 bảng. Vì sao phải tạo bảng nhacsi, casi <b>trước<\/b> bannhac, banthuam?","a":"Tạo CSDL → <b>nhacsi<\/b>, <b>casi<\/b> → <b>bannhac<\/b> → <b>banthuam<\/b>. Bảng có khoá ngoài phải <b>tham chiếu tới bảng đã có<\/b> khoá chính tương ứng."}],"mcq":[{"m":"NB","q":"Bộ mã kí tự nên chọn khi tạo CSDL mymusic để lưu tiếng Việt là","o":["utf8mb4","ascii","latin1","binary"],"g":"Bộ mã utf8mb4."},{"m":"TH","q":"Khi tạo CSDL bằng giao diện HeidiSQL, phần mềm tự sinh câu lệnh","o":["CREATE DATABASE","SELECT * FROM","DROP TABLE IF EXISTS","GRANT ALL ON"],"g":"HeidiSQL tự sinh CREATE DATABASE."},{"m":"TH","q":"Với trường idNhacsi là khoá chính tự tăng, ta cần","o":["bỏ chọn Allow NULL, chọn AUTO_INCREMENT","chọn kiểu VARCHAR(255) cho trường","để trống tên trường, chỉ chọn kiểu","chọn kiểu BOOLEAN và cho phép NULL"],"g":"idNhacsi: INT, bỏ Allow NULL, AUTO_INCREMENT."},{"m":"VD","q":"Để đặt idNhacsi làm khoá chính trong HeidiSQL, ta","o":["chuột phải trường → Create new index → PRIMARY","nháy đúp tên bảng → Đổi tên bảng","chọn thẻ Dữ liệu → nhấn nút Insert","nhấn phím F5 để làm tươi danh sách"],"g":"Chuột phải → Create new index → PRIMARY."},{"m":"NB","q":"Phím tắt thêm trường mới khi thiết kế bảng trong HeidiSQL là","o":["Ctrl + Insert","Ctrl + Delete","Ctrl + O","F9"],"g":"Ctrl+Insert thêm trường."},{"m":"TH","q":"Sau khi khai báo xong bảng, việc bắt buộc phải làm là","o":["nhấn Lưu","nhấn Xoá","đóng HeidiSQL","tắt MySQL"],"g":"Nhấn Lưu → bảng hiện dưới mymusic."}],"tf":[{"q":"Hà tạo bảng nhacsi(idNhacsi, tenNhacsi) trong CSDL mymusic.","y":["idNhacsi có kiểu INT và AUTO_INCREMENT.","tenNhacsi nên khai báo kiểu INT.","Chọn nhầm khoá chính có thể sửa lại ở ô PRIMARY KEY.","Không cần nhấn Lưu vì HeidiSQL tự lưu mọi ch nhạc sĩ có sẵn → dữ liệu nhất quán."},{"m":"TH","q":"Xoá một nhạc sĩ đã có bản nhạc trong bảng bannhac thì MySQL sẽ","o":["ngăn xoá và báo lỗi","xoá luôn mọi bản nhạc","xoá nhạc sĩ, giữ bản nhạc","tự đổi tên nhạc sĩ"],"g":"Bảo đảm toàn vẹn tham chiếu."},{"m":"TH","q":"Ràng buộc giúp MySQL ngăn xoá nhạc sĩ đang được tham chiếu gọi là","o":["toàn vẹn tham chiếu","độc lập dữ liệu","bảo mật dữ liệu","sao lưu dữ liệu"],"g":"Toàn vẹn tham chiếu."},{"m":"VD","q":"Nhập nhầm nhạc sĩ cho một bản nhạc (nhưng nhạc sĩ đó có trong bảng) thì","o":["máy không phát hiện được, người nhập phải cẩn thận","MySQL tự sửa lại đúng nhạc sĩ cho bản nhạc","MySQL báo lỗi khoá ngoài và không cho lưu","bản ghi bị nhập nhầm sẽ tự động bị xoá đi"],"g":"Máy chỉ chặn lỗi đã khai báo; sai lôgic thì cần con người cẩn thận."},{"m":"TH","q":"Ứng dụng Quản lí âm nhạc có giao diện thân thiện giúp người dùng","o":["không cần biết cấu trúc bảng","phải viết câu lệnh SQL","phải biết khoá ngoài là gì","phải dùng cửa sổ lệnh"],"g":"Người dùng không cần biết cấu trúc bảng."},{"m":"NB","q":"Để sửa nhạc sĩ của một bản nhạc trong bảng bannhac, ta","o":["nháy đúp ô cần sửa và chọn lại nhạc sĩ","xoá cả bảng nhacsi rồi tạo lại từ đầu","tạo một CSDL mới rồi nhập lại dữ liệu","đổi kiểu dữ liệu của trường idNhacsi"],"g":"Sửa: nháy đúp ô, chọn lại nhạc sĩ."}],"tf":[{"q":"Hùng xoá nhạc sĩ “Văn Cao” khỏi bảng nhacsi trong khi bảng bannhac còn bài “Tiến quân ca”.","y":["MySQL sẽ báo lỗi và không cho xoá.","Đây là nhờ khai báo khoá ngoài giữa hai bảng.","Nếu Hùng chọn nhầm nhạc sĩ khác cho một bài hát, MySQL luôn phát hiện được.","Muốn xoá nhạc sĩ đó, có thể xoá hoặc sửa các bản nhạc tham chiếu tới trước."],"d":[true,true,false,true],"g":["Toàn vẹn tham chiếu.","Khoá ngoài giữ toàn vẹn.","Lỗi lôgic máy không biết.","Hết tham chiếu mới xoá được."]}]},{"so":23,"cd":6,"ten":"Thực hành truy xuất dữ liệu qua liên kết các bảng","trang":"109–112","muctieu":["Hiểu được cách thức truy xuất dữ liệu qua liên kết các bảng."],"muc":[{"t":"Liên kết 2 bảng","icon":"🔗","b":["Ghép <b>bannhac<\/b> với <b>nhacsi<\/b> qua idNhacsi để có tên tác giả.","<code>SELECT … FROM A INNER JOIN B ON A.x = B.x;<\/code>","Đổi tên cột trùng bằng <b>as<\/b>; chạy bằng <b>F9<\/b> hoặc ▶."]},{"t":"Liên kết 3 bảng","icon":"🧬","b":["Bản thu âm đủ: idBanthuam, tenBannhac, tenCasi.","Lặp lại mệnh đề <code>INNER JOIN … ON …<\/code> cho bảng thứ ba.","HeidiSQL tô màu cú pháp, gợi ý tên trường khi gõ dấu chấm."]},{"t":"Ứng dụng Quản lí âm nhạc","icon":"🖥️","b":["Chọn bản nhạc, ca sĩ từ hộp danh sách.","Hiển thị đủ tên bản nhạc, nhạc sĩ, ca sĩ – hỗ trợ nhất quán dữ liệu."]}],"ghinho":"Dữ liệu tách ở nhiều bảng vẫn “gặp nhau” được nhờ JOIN theo khoá ngoài – khoá chính.","vandung":"Truy xuất bảng Quận/Huyện liên kết với bảng Tỉnh/Thành phố.","the":[{"q":"Mệnh đề nào dùng để <b>liên kết<\/b> hai bảng trong câu truy vấn SQL?","a":"<b>INNER JOIN … ON …<\/b>"},{"q":"Trong HeidiSQL, nhấn phím nào để <b>chạy<\/b> câu truy vấn?","a":"Phím <b>F9<\/b> (hoặc nháy biểu tượng ▶, hoặc nháy phải chuột → Chạy)."},{"q":"Mỗi khi gõ tên bảng và <b>dấu chấm<\/b> trong cửa sổ truy vấn, HeidiSQL hỗ trợ gì?","a":"Hiện ngay <b>danh sách tên trường<\/b> của bảng để chọn (ngoài ra còn tô <b>màu cú pháp<\/b>)."},{"q":"Vì sao bảng bannhac không có tenNhacsi mà vẫn lấy được danh sách bản nhạc kèm tên tác giả?","a":"Nhờ <b>khoá ngoài idNhacsi<\/b> tham chiếu bảng nhacsi → dùng <b>INNER JOIN<\/b> liên kết hai bảng để lấy tenNhacsi."},{"q":"Viết câu truy vấn lấy danh sách <b>tenBannhac<\/b> kèm <b>tenNhacsi<\/b>, liên kết bannhac và nhacsi.","a":"<div class='code'>SELECT bannhac.tenBannhac,\n  nhacsi.tenNhacsi\nFROM bannhac\n INNER JOIN nhacsi\n ON bannhac.idNhacsi\n  = nhacsi.idNhacsi;<\/div>"},{"q":"Liên kết nhiều hơn hai bảng bằng JOIN thế nào? Viết khung câu truy vấn liên kết 3 bảng a, b, c.","a":"Lặp lại mệnh đề INNER JOIN:<div class='code'>SELECT ...\nFROM a\n  INNER JOIN b ON a.x = b.x\n  INNER JOIN c ON b.y = c.y;<\/div>"},{"q":"<i>Thử thách:<\/i> Viết câu truy vấn lấy <b>idBanthuam, tenBannhac, tenCasi<\/b> từ 3 bảng banthuam, bannhac, casi.","a":"<div class='code'>SELECT banthuam.idBanthuam,\n bannhac.tenBannhac,\n casi.tenCasi\nFROM banthuam\nINNER JOIN bannhac ON\n banthuam.idBannhac\n  = bannhac.idBannhac\nINNER JOIN casi ON\n banthuam.idCasi\n  = casi.idCasi;<\/div>"}],"mcq":[{"m":"NB","q":"Mệnh đề SQL dùng để liên kết hai bảng là","o":["INNER JOIN … ON …","ORDER BY … DESC","GROUP … WITH …","WHERE … LIKE …"],"g":"SELECT … FROM A INNER JOIN B ON A.x = B.x;"},{"m":"TH","q":"Để có tên nhạc sĩ cho mỗi bản nhạc, ta liên kết bảng bannhac với nhacsi qua trường","o":["idNhacsi","idBannhac","tenBannhac","idCasi"],"g":"Ghép qua idNhacsi."},{"m":"TH","q":"Khi hai bảng có cột trùng tên, để đổi tên cột kết quả ta dùng","o":["as","is","to","by"],"g":"Đổi tên cột trùng bằng as."},{"m":"NB","q":"Phím tắt chạy truy vấn trong HeidiSQL là","o":["F9","F1","F12","Esc"],"g":"Chạy bằng F9 hoặc ▶."},{"m":"TH","q":"Để liên kết ba bảng, ta","o":["lặp lại mệnh đề INNER JOIN … ON … cho bảng thứ ba","viết ba câu SELECT riêng rồi so sánh kết quả","đổi tên CSDL rồi chạy lại câu truy vấn cũ","xoá bớt một bảng để chỉ còn hai bảng"],"g":"Lặp lại INNER JOIN cho bảng thứ ba."},{"m":"VD","q":"Câu lệnh lấy tên bản nhạc kèm tên nhạc sĩ đúng là","o":["SELECT tenBannhac, tenNhacsi FROM bannhac INNER JOIN nhacsi ON bannhac.idNhacsi = nhacsi.idNhacsi;","SELECT tenBannhac, tenNhacsi FROM bannhac ORDER BY bannhac.idNhacsi, nhacsi.idNhacsi;","SELECT tenBannhac, tenNhacsi FROM bannhac WHERE idNhacsi IN nhacsi ORDER BY tenNhacsi;","SELECT tenBannhac, tenNhacsi FROM bannhac, nhacsi WHERE tenBannhac LIKE \"%nhacsi%\";"],"g":"INNER JOIN … ON khoá ngoài = khoá chính."}],"tf":[{"q":"Mai muốn xem bản thu âm đầy đủ: tên bản nhạc, tên ca sĩ.","y":["Mai cần liên kết bảng banthuam với bannhac và casi.","Liên kết dựa trên cặp khoá ngoài – khoá chính.","Dữ liệu ở nhiều bảng thì không thể hiển thị chung trong một kết quả.","HeidiSQL gợi ý tên trường khi gõ dấu chấm sau tên bảng."],"d":[true,true,false,true],"g":["Liên kết 3 bảng.","Theo SGK.","JOIN giúp dữ liệu “gặp nhau”.","Theo SGK."]}]},{"so":24,"cd":6,"ten":"Thực hành sao lưu dữ liệu","trang":"113–115","muctieu":["Nắm được các thao tác sao lưu và phục hồi dữ liệu."],"muc":[{"t":"Sao lưu CSDL (backup)","icon":"💾","b":["<b>Các công cụ → Xuất cơ sở dữ liệu dưới dạng SQL<\/b>.","Đánh dấu CSDL, chọn <b>Drop<\/b>, <b>Create<\/b>; Data: <b>Delete + insert<\/b>.","Output: <b>Single .sql file<\/b>, đặt tên tệp → <b>Export<\/b>.","Có thể chỉ sao lưu một số bảng."]},{"t":"Phục hồi CSDL (restore)","icon":"♻️","b":["<b>Tập tin → Load SQL file…<\/b> (Ctrl+O) → chọn tệp sao lưu.","Nhấn ▶ chạy truy vấn, <b>F5<\/b> làm tươi danh sách.","CSDL được khởi tạo lại đủ các bảng, dữ liệu."]}],"ghinho":"Sao lưu định kì là “bảo hiểm” cho dữ liệu: có tệp .sql là có thể phục hồi, kể cả trên máy mới.","vandung":"Chuyển một CSDL từ máy tính này sang máy tính khác bằng sao lưu – phục hồi.","the":[{"q":"Tệp sao lưu CSDL mymusic có phần mở rộng là gì?","a":"<b>.sql<\/b> (VD _mymusic.sql)."},{"q":"Để sao lưu CSDL, chọn lệnh nào trong thẻ <b>Các công cụ<\/b>?","a":"<b>Xuất cơ sở dữ liệu dưới dạng SQL<\/b>."},{"q":"Muốn phục hồi CSDL từ tệp sao lưu, chọn lệnh nào? Phím tắt là gì?","a":"<b>Tập tin → Load SQL file<\/b>, phím tắt <b>Ctrl + O<\/b>."},{"q":"Khi sao lưu, đánh dấu <b>Drop<\/b> và <b>Create<\/b> có ý nghĩa gì?","a":"Khi phục hồi sẽ <b>xoá đối tượng cũ<\/b> (nếu có) trước khi <b>tạo mới<\/b> đối tượng."},{"q":"<i>Đúng hay Sai?<\/i><br>“Chỉ sao lưu được toàn bộ CSDL, không sao lưu riêng một vài bảng được.”","a":"<b>Sai.<\/b> Có thể sao lưu <b>một phần<\/b> CSDL bằng cách chỉ chọn những bảng muốn sao lưu."},{"q":"<i>Tình huống:<\/i> Em cần chuyển CSDL mymusic từ máy ở trường sang máy ở nhà. Làm thế nào?","a":"Máy trường: <b>Xuất CSDL dưới dạng SQL<\/b> ra tệp .sql → chép tệp sang máy nhà → <b>Load SQL file<\/b>, chạy ▶, nhấn <b>F5<\/b> làm tươi danh sách CSDL."}],"mcq":[{"m":"NB","q":"Trong HeidiSQL, chức năng sao lưu CSDL nằm ở","o":["Các công cụ → Xuất cơ sở dữ liệu dưới dạng SQL","Tập tin → In dữ liệu bảng đang mở","Truy vấn → Chạy câu lệnh đang chọn","Trợ giúp → Giới thiệu về HeidiSQL"],"g":"Các công cụ → Xuất cơ sở dữ liệu dưới dạng SQL."},{"m":"NB","q":"Tệp sao lưu CSDL tạo bởi HeidiSQL có phần mở rộng","o":["sql","xcf","vpj","gif"],"g":"Output: Single .sql file."},{"m":"TH","q":"Để phục hồi CSDL từ tệp sao lưu, ta dùng","o":["Tập tin → Load SQL file… rồi chạy truy vấn","Các công cụ → Xuất cơ sở dữ liệu dạng SQL","nháy đúp vào tên bảng cần phục hồi","chọn dòng dữ liệu rồi nhấn Ctrl + Delete"],"g":"Tập tin → Load SQL file… (Ctrl+O) → ▶ → F5."},{"m":"TH","q":"Có thể sao lưu chỉ một số bảng của CSDL không?","o":["Có, chọn các bảng cần sao lưu","Không, luôn phải sao lưu toàn bộ","Chỉ khi CSDL rỗng","Chỉ khi xoá bớt bảng"],"g":"Có thể chỉ sao lưu một số bảng."},{"m":"VD","q":"Máy tính phòng thực hành bị cài lại hệ điều hành. Để có lại CSDL mymusic trên máy mới, cần","o":["tệp sao lưu .sql đã xuất trước đó","ảnh chụp màn hình các bảng","tên của CSDL","mật khẩu Wi-Fi"],"g":"Có tệp .sql là có thể phục hồi, kể cả trên máy mới."},{"m":"NB","q":"Phím tắt mở tệp SQL để phục hồi trong HeidiSQL là","o":["Ctrl + O","Ctrl + S","Ctrl + P","Ctrl + Z"],"g":"Load SQL file… (Ctrl+O)."}],"tf":[{"q":"Cuối buổi thực hành, nhóm Hoa sao lưu CSDL mymusic.","y":["Sao lưu định kì giúp bảo vệ dữ liệu khi có sự cố.","Tệp sao lưu chỉ phục hồi được trên đúng máy đã tạo ra nó.","Sau khi chạy tệp sao lưu, nhấn F5 để làm tươi danh sách CSDL.","Khi xuất, chọn Output là Single .sql file."],"d":[true,false,true,true],"g":["Sao lưu là “bảo hiểm”.","Phục hồi được cả trên máy mới.","Theo SGK.","Theo SGK."]}]},{"so":25,"cd":7,"ten":"Phần mềm chỉnh sửa ảnh","trang":"116–121","muctieu":["Làm quen với phần mềm chỉnh sửa ảnh.","Thực hiện được một số thao tác cơ bản với ảnh: phóng to, thu nhỏ, xoay, cắt ảnh."],"muc":[{"t":"Ảnh số","icon":"🖼️","b":["Ảnh bitmap: tập hợp <b>điểm ảnh (pixel)<\/b>, mỗi điểm một function chuongs(g){
  const d=DATA[g]; const keys=Object.keys(d.chude).map(Number).sort((a,b)=>a-b);

}
function baiOf(g,so){return DATA[g].bai.find(b=>b.so===so)}

let U=null;           // người dùng hiện tại {code,g,lp:{},boss:{},de:{},mo:{},sai:[],xem}
function newUser(code,g){return {code,g,lp:{},boss:{},de:{},mo:{},sai:[],t0:Date.now()}}
function lp(so){return U.lp[so]||(U.lp[so]={})}
function starsOf(pct){return pct>=0.9?3:pct>=0.7?2:pct>=0.5?1:0}
function lessonPts(p,b){let s=0;if(p.doc)s+=10;if(p.sodo)s+=10;if(p.the)s+=10;s+=(p.best||0)*10;if((p.st||0)===3)s+=20;return s}
function totalPts(u){
  u=u||U;let s=0;const g=u.g;
  for(const so in u.lp){s+=lessonPts(u.lp[so])}
  for(const cd in u.boss){const b=u.boss[cd];s+=(b.best||0)*20+(b.pass?50:0)}
  for(const k in u.de){s+=Math.round((u.de[k]||0)*10)}
  return s;
}
const LEVELS=[[0,"🌱","Mầm non số"],[300,"🔍","Nhà khám phá"],[800,"🛡️","Hiệp sĩ số"],[1500,"💡","Chuyên gia nhí"],[2500,"🚀","Phi hành gia Tin học"],[4000,"👑","Bậc thầy Tin học"]];

function ym(t){const d=t?new Date(t):new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}

function n2Of(u){return Object.values(u.lp).filter(p=>(p.st||0)>=2).length}

// cộng phần điểm thưởng / số bài ★★ TĂNG THÊM vào tháng hiện tại
function trackMonth(){
  if(!U||U.xem)return;
  const tp=totalPts(),n2=n2Of(U),m=thangU();
  if(U.lastPts==null){if(ym(U.t0)===ym()){m.d=tp;m.b=n2}U.lastPts=tp;U.lastN2=n2;return}
  if(tp>U.lastPts)m.d+=tp-U.lastPts;
  if(n2>U.lastN2)m.b+=n2-U.lastN2;
  U.lastPts=tp;U.lastN2=n2;
}

function khoiPhuc(){
  if(!coSheet()||U.xem||totalPts()>0||navigator.onLine===false)return;
  const code=U.code;
  taiSo().then(d=>{
    if(!U||U.code!==code)return;

    if(!d.td||!d.td.u)return ve();
    let cu;try{cu=JSON.parse(d.td.u)}catch(e){return ve()}

  }).catch(()=>{});
}

function chuongOpen(g,idx){
  if(U.xem)return true;
  const cs=chuongs(g); const c=cs[idx];
  if(c.bai.every(b=>b.cho))return false;
  if(U.mo["all"]||U.mo["cd"+c.cd])return true;
  if(idx===0)return true;
  const prev=cs[idx-1];
  if(prev.bai.every(b=>b.cho))return true;
  return !!(U.boss[prev.cd]&&U.boss[prev.cd].pass);
}
function baiOpen(g,idx,j){
  const c=chuongs(g)[idx]; const b=c.bai[j];
  if(b.cho)return false;
  if(U.xem)return true;
  if(U.mo["b"+b.so])return true;
  if(!chuongOpen(g,idx))return false;
  if(U.mo["all"]||U.mo["cd"+c.cd]||j===0)return true;
  const pv=c.bai[j-1]; return ((U.lp[pv.so]||{}).st||0)>=2;
}
function bossOpen(g,idx){
  const c=chuongs(g)[idx];
  if(U.xem)return true;
  if(!chuongOpen(g,idx))return false;
  return c.bai.every(b=>((U.lp[b.so]||{}).st||0)>=2);
}
function openLessons(g){const out=[];chuongs(g).forEach((c,i)=>c.bai.forEach((b,j)=>{if(baiOpen(g,i,j))out.push(b)}));return out}

/* ══════════ CÂU HỎI ══════════ */
function mkMCQ(g,so,idx){const q=baiOf(g,so).mcq[idx];const ord=shuffle([0,1,2,3]);return {k:"m",id:`${g}-${so}-m${idx}`,so,q:q.q,o:ord.map(i=>q.o[i]),ans:ord.indexOf(0),g:q.g,muc:q.m}}
function mkTF(g,so,idx){const t=baiOf(g,so).tf[idx];return {k:"t",id:`${g}-${so}-t${idx}`,so,q:t.q,y:t.y,d:t.d,g:t.g}}
function poolOf(g,lessons){const m=[],t=[];lessons.forEach(b=>{b.mcq.forEach((_,i)=>m.push([b.so,i]));b.tf.forEach((_,i)=>t.push([b.so,i]))});return {m:shuffle(m),t:shuffle(t)}}
function startLesson(so){
  const g=U.g,b=baiOf(g,so);
  const qs=shuffle(b.mcq.map((_,i)=>i)).slice(0,10).map(i=>mkMCQ(g,so,i));
  if(b.tf.length)qs.push(mkTF(g,so,Math.floor(Math.random()*b.tf.length)));
  VIEW={t:"quiz",kind:"bai",so,qs,i:0,ans:[],mode:"hoc",title:`Luyện tập Bài ${so}`,from:{t:"bai",so,tab:"lt"}};render();
}
function startBoss(cd){
  const g=U.g,c=chuongs(g).find(x=>x.cd===cd);
  const P=poolOf(g,c.bai.filter(b=>!b.cho));
  const qs=P.m.slice(0,10).map(([so,i])=>mkMCQ(g,so,i)).concat(P.t.slice(0,2).map(([so,i])=>mkTF(g,so,i)));
  VIEW={t:"quiz",kind:"boss",cd,qs,i:0,ans:[],mode:"hoc",title:"⚔️ Thử thách chặng",from:null};render();
}
function startDe(kind){
  const g=U.g,ls=openLessons(g);const P=poolOf(g,ls);
  let qs,mins;
  if(kind==="nhanh"){qs=P.m.slice(0,10).map(([so,i])=>mkMCQ(g,so,i));mins=10}
  else if(kind==="chuan"){qs=P.m.slice(0,24).map(([so,i])=>mkMCQ(g,so,i)).concat(P.t.slice(0,4).map(([so,i])=>mkTF(g,so,i)));mins=45}
  else if(kind==="sai"){
    const ids=U.sai.slice(-20);qs=ids.map(id=>{const m=id.match(/^(\d+)-(\d+)-([mt])(\d+)$/);if(!m||m[1]!==g)return null;const b=baiOf(g,+m[2]);if(!b)return null;return m[3]==="m"?(b.mcq[+m[4]]?mkMCQ(g,+m[2],+m[4]):null):(b.tf[+m[4]]?mkTF(g,+m[2],+m[4]):null)}).filter(Boolean);
    if(!qs.length)return toast("Sổ câu sai đang trống. Tuyệt vời!");
    VIEW={t:"quiz",kind:"sai",qs:shuffle(qs),i:0,ans:[],mode:"hoc",title:"🩹 Ôn câu sai",from:null};return render();
  }
  if(!qs.length)return toast("Em cần mở ít nhất một bài để luyện đề.");
  VIEW={t:"quiz",kind:"de",de:kind,qs,i:0,ans:[],mode:"thi",title:kind==="nhanh"?"⚡ Đề nhanh":"📄 Đề như kiểm tra",from:null,end:Date.now()+mins*60000};render();
}

function viewQuiz(){

  const q=V.qs[V.i],a=V.ans[V.i];
  const right=V.mode==="thi"?`<span class="pts timer" id="tm">--:--</span>`:`<span class="pts">${V.i+1}/${V.qs.length}</span>`;
  let h=topbar(V.title,true,right)+`<div class="wrap"><div class="bar" style="margin-bottom:12px"><i style="width:${Math.round(V.i/V.qs.length*100)}%"></i></div>
  <div class="qhead"><span>Câu ${V.i+1}/${V.qs.length}${q.muc?` · ${q.muc==="NB"?"Nhận biết":q.muc==="TH"?"Thông hiểu":"Vận dụng"}`:""}</span><span>Bài ${q.so}</span></div>`;
  const shown=V.mode==="hoc"&&a&&a.chot;
  if(q.k==="m"){
    h+=`<div class="qtext">${esc(q.q)}</div>`;
    q.o.forEach((o,i)=>{let cl="";if(shown){if(i===q.ans)cl="right";else if(a.v===i)cl="wrong"}else if(a&&a.v===i)cl="sel";
      h+=`<button class="opt ${cl}" data-o="${i}" ${shown?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`});
  } else {
    h+=`<div class="qtext">${esc(q.q)}</div><div class="small muted">Chọn Đúng hoặc Sai cho từng ý:</div>`;
    q.y.forEach((y,i)=>{const v=a&&a.v?a.v[i]:null;let cl="";if(shown)cl=(v===q.d[i])?"right":"wrong";
      h+=`<div class="tfrow ${cl}"><div class="y"><b>${"abcd"[i]})</b> ${esc(y)}</div><div class="ch"><button data-tf="${i}" data-v="1" class="${v===true?"sel":""}" ${shown?"disabled":""}>Đúng</button><button data-tf="${i}" data-v="0" class="${v===false?"sel":""}" ${shown?"disabled":""}>Sai</button></div>
      ${shown?`<div class="small" style="margin-top:6px">${q.d[i]?"✔ Đúng":"✘ Sai"} — ${esc(q.g[i])}</div>`:""}</div>`});
  }
  if(shown&&q.k==="m")h+=`<div class="expl">${a.v===q.ans?"🎉 <b>Chính xác!</b>":"💡 <b>Đáp án đúng: "+"ABCD"[q.ans]+"</b>"} ${esc(q.g)}</div>`;
  if(V.mode==="hoc"){
    if(!shown)h+=`<button class="btn" id="chot" ${q.k==="t"?"":"disabled"}>Kiểm tra</button>`;
    else h+=`<button class="btn" id="next">${V.i<V.qs.length-1?"Câu tiếp →":"Xem kết quả 🏁"}</button>`;
  } else {
    h+=`<div class="row"><button class="btn ghost" id="prev" ${V.i===0?"disabled":""}>← Câu trước</button><button class="btn" id="next">${V.i<V.qs.length-1?"Câu sau →":"Nộp bài 🏁"}</button></div>
    <div class="small muted" style="margin-top:10px;text-align:center">Đã làm ${V.ans.filter(x=>x&&x.v!=null&&(!Array.isArray(x.v)||x.v.some(z=>z!=null))).length}/${V.qs.length} câu</div>`;
  }
  return h+`</div>`;
}
function bindQuiz(){

function reportCode(){
  const g=U.g;const s=DATA[g].bai.filter(b=>!b.cho).map(b=>(U.lp[b.so]||{}).st||0).join("");
  const bo=chuongs(g).filter(c=>!c.bai.every(b=>b.cho)).map(c=>(U.boss[c.cd]&&U.boss[c.cd].pass)?1:0).join("");
  const d=new Date();const day=`${d.getDate()}/${d.getMonth()+1}`;
  const body=[U.code,totalPts(),s,bo,Math.round((U.de.chuan||0)*10),Math.round((U.de.nhanh||0)*10),day].join("~");
  const ck=(h32(BIMAT+"|bc|"+body)%46656).toString(36).toUpperCase().padStart(3,"0");
  return "BC~"+body+"~"+ck;
}

    h+=`</table></div>`});
  return h+`<button class="btn ghost noprint" onclick="print()">🖨️ In bảng mã</button>`;

function readReports(txt){
  const rows=[];const seen={};
  (txt.match(/BC~[^\s]+/g)||[]).forEach(s=>{const p=s.split("~");if(p.length!==9)return;const body=p.slice(1,8).join("~");
    const ok=(h32(BIMAT+"|bc|"+body)%46656).toString(36).toUpperCase().padStart(3,"0")===p[8];
    const r={code:p[1],pts:+p[2],st:p[3],bo:p[4],chuan:(+p[5])/10,nhanh:(+p[6])/10,day:p[7],ok};seen[r.code]=r});
  for(const k in seen)rows.push(seen[k]);
  rows.sort((a,b)=>a.code.localeCompare(b.code,"vi",{numeric:true}));return rows;
}
function bcTable(rows){
  if(!rows.length)return `<div class="err">Không tìm thấy mã báo cáo nào.</div>`;
  let h=`<div class="card" style="overflow-x:auto"><table><tr><th>Mã HS</th><th>Điểm thưởng</th><th>Bài ★★+</th><th>Sao</th><th>Chặng vượt</th><th>Đề KT</th><th>Ngày</th></tr>`;
  rows.forEach(r=>{const st=r.st.split("").map(Number);h+=`<tr><td><b>${esc(r.code)}</b>${r.ok?"":" ⚠️"}</td><td>${r.pts}</td><td>${st.filter(x=>x>=2).length}/${st.length}</td><td>${st.reduce((a,b)=>a+b,0)}</td><td>${r.bo.split("").filter(x=>x==="1").length}/${r.bo.length}</td><td>${String(r.chuan).replace(".",",")}</td><td>${esc(r.day)}</td></tr>`});
  h+=`</table><div class="small muted" style="margin-top:8px">⚠️ = mã bị sửa tay, không khớp. Điểm thưởng là điểm ôn tập, không dùng thay điểm kiểm tra.</div><button class="btn ghost" id="csv">⬇️ Tải bảng (CSV mở bằng Excel)</button></div>`;
  return h;
}

/* ══════════ GIẤY CHỨNG NHẬN — bộ vẽ canvas (lấy từ app Cổng sẵn sàng) ══════════ */
// ───── GIẤY CHỨNG NHẬN A5 ngang (210 × 148 mm) — vẽ bằng canvas: cô in, học sinh lưu ảnh về điện thoại

    const f = typeof File === "function" ? new File([b], ten, { type: "image/png" }) : null;
    if (f && navigator.canShare && navigator.canShare({ files: [f] }) && /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)) navigator.share({ files: [f], title: "Giấy chứng nhận" }).catch(() => {});
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = ten; document.body.appendChild(a); a.click(); a.remove(); toast("Đã tải ảnh giấy chứng nhận về máy ✓"); }
  }, "image/png");
}
