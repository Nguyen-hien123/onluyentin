],"g":"Hình 2.4: bảng chọn có Move to… để di chuyển tệp; Rename đổi tên; Properties xem thuộc tính."},{"m":"VD","q":"Hình 2.7 mở theo tab Tools. Muốn dùng tiện ích dọn đĩa Disk Cleanup, em mở tab nào (Vận dụng 1)?","o":["General","Hardware","Sharing","Security"],"g":"Vận dụng 1: nếu mở cửa sổ Properties theo tab General sẽ thấy nút lệnh của tiện ích dọn đĩa (Disk Cleanup)."},{"m":"VD","q":"Tiện ích Disk Cleanup giúp ích gì cho người dùng?","o":["Giải phóng dung lượng bằng cách xoá tệp không cần","Sắp xếp lại các liên cung cho liền nhau","Đánh dấu và loại bỏ các cung bị hỏng","Chia ổ đĩa thành nhiều phân vùng mới"],"g":"Vận dụng 1: Disk Cleanup dọn đĩa — xoá các tệp tạm, tệp không cần thiết để giải phóng dung lượng (khác Optimize, Check)."},{"m":"VD","q":"Điện thoại của Bình đặt khoá bằng khẩu hình (vẽ nối các điểm). Điểm yếu dễ thấy của cách này là","o":["Người bên cạnh có thể nhìn trộm nét vẽ","Không mở được máy khi tay bị ướt","Không nhận ra khi đeo khẩu trang","Phải có kết nối mạng mới mở được"],"g":"Vận dụng 2: so sánh các cách đăng nhập. Khẩu hình nhanh nhưng dễ bị nhìn trộm hoặc để lại vết trên màn hình."},{"m":"VD","q":"Chi đăng nhập điện thoại bằng nhận dạng khuôn mặt. Tình huống nào có thể làm cách này không nhận được?","o":["Đeo khẩu trang che nửa khuôn mặt","Đang bật kết nối Wi-Fi tại nhà","Danh bạ đang có quá nhiều số","Đã đặt báo thức lúc 6 giờ sáng"],"g":"Vận dụng 2: nhận dạng khuôn mặt tiện nhưng có thể không nhận được khi khuôn mặt bị che, thiếu sáng."},{"m":"VD","q":"Thao tác “kéo thả chuột” trong File Explorer thường dùng để làm gì?","o":["Di chuyển tệp sang thư mục khác","Mở tệp bằng ứng dụng mặc định","Hiện bảng chọn lệnh của tệp","Xem thuộc tính dung lượng tệp"],"g":"Kéo thả biểu tượng tệp vào thư mục đích là cách di chuyển tệp; nháy đúp để mở; nháy phải hiện bảng chọn."},{"m":"VDC","q":"Một tệp có kích thước 10 000 byte được ghi trên đĩa có liên cung 8 cung, mỗi cung 512 byte. Tệp chiếm bao nhiêu liên cung?","o":["3 liên cung","2 liên cung","20 liên cung","10 liên cung"],"g":"Một liên cung = 8 × 512 = 4096 byte. 10 000 : 4096 ≈ 2,44 → cần 3 liên cung (đọc ghi theo đơn vị liên cung)."},{"m":"VDC","q":"Một tệp 6 000 byte được ghi theo đơn vị liên cung 8 cung (mỗi cung 512 byte). Tệp thực sự chiếm bao nhiêu byte trên đĩa?","o":["8192 byte","6000 byte","6144 byte","4096 byte"],"g":"Cần 2 liên cung (2 × 4096 = 8192 byte) vì ghi theo đơn vị liên cung; phần dư trong liên cung thứ hai bỏ trống."},{"m":"VDC","q":"Máy tính dùng ổ thể rắn SSD (không phải đĩa từ) bị chậm. Bạn Long định chạy hợp mảnh để tăng tốc. Nhận xét nào đúng theo SGK?","o":["Chưa hợp lí vì hợp mảnh chỉ có tác dụng với đĩa từ","Hợp lí vì hợp mảnh có tác dụng với mọi loại đĩa","Chưa hợp lí vì SSD không có tệp bị phân mảnh","Hợp lí vì hợp mảnh xong sẽ tăng dung lượng ổ"],"g":"SGK lưu ý: chức năng hợp mảnh chỉ có tác dụng đối với đĩa từ (có đầu từ dịch chuyển cơ học)."},{"m":"VDC","q":"Ổ cứng báo có tệp mở ra bị lẫn nội dung của tệp khác. Lỗi này nhiều khả năng thuộc loại nào và xử lí bằng gì?","o":["Chồng chéo liên cung, dùng Check","Phân mảnh tệp, dùng Optimize","Thiếu dung lượng, dùng Disk Cleanup","Sai tên tệp, dùng lệnh Rename"],"g":"Vài tệp liên kết đến cùng một liên cung (chồng chéo) làm nội dung lẫn nhau; tiện ích kiểm tra đĩa (Check) khử các lỗi này."},{"m":"VDC","q":"Với đĩa từ dung lượng lớn, khi nào nên chạy hợp mảnh cho phù hợp?","o":["Lúc không cần dùng máy vì có thể mất nhiều thời gian","Ngay trước giờ thi trực tuyến để máy chạy nhanh","Mỗi lần mở một tệp mới cần chạy hợp mảnh","Khi máy đang chép tệp lớn sang USB"],"g":"SGK lưu ý: việc hợp mảnh có thể mất nhiều thời gian nếu đĩa có dung lượng lớn, nên làm khi không cần dùng máy."},{"m":"VDC","q":"Để vừa nhanh vừa an toàn khi mở khoá điện thoại, cách kết hợp nào hợp lí nhất?","o":["Vân tay hằng ngày, kèm mật khẩu dự phòng mạnh","Chỉ dùng khẩu hình đơn giản để mở cho nhanh","Tắt khoá màn hình để không mất thời gian","Dùng mật khẩu 1234 cho dễ nhớ"],"g":"Vận dụng 2: vân tay nhanh, khó giả mạo; mật khẩu mạnh dùng khi sinh trắc học không nhận. Khẩu hình đơn giản, mật khẩu yếu dễ bị đoán."},{"m":"VDC","q":"Lớp trưởng cần nhắn tin nhanh cho “Ban cán sự” và “Tổ 1”, có bạn vừa ở Ban cán sự vừa ở Tổ 1. Cách tổ chức danh bạ hợp lí nhất là","o":["Tạo hai nhóm, bạn đó được gán vào cả hai","Tạo một nhóm chung cho toàn bộ lớp","Lưu bạn đó hai lần với hai tên khác nhau","Chỉ cho bạn đó vào nhóm Ban cán sự"],"g":"Một số điện thoại có thể thuộc nhiều nhóm, không cần lưu trùng liên hệ (Luyện tập 1)."},{"m":"VDC","q":"Vì sao SGK yêu cầu loại các cung hỏng khỏi danh sách sử dụng thay vì tiếp tục ghi vào?","o":["Ghi vào cung hỏng sẽ không đọc lại được dữ liệu","Cung hỏng làm đĩa quay nhanh hơn bình thường","Cung hỏng chiếm dụng bộ nhớ RAM của máy","Cung hỏng làm tên tệp bị đổi ngẫu nhiên"],"g":"Bad sector hỏng về vật lí, đọc ghi không được; tiếp tục ghi vào sẽ mất dữ liệu nên phải loại ra."},{"m":"VDC","q":"Với tệp bị phân mảnh trên đĩa từ, đại lượng nào tăng lên nhiều nhất?","o":["Thời gian đọc, ghi tệp","Kích thước của tệp","Số tệp trong thư mục","Số cung của một liên cung"],"g":"SGK: khi tệp bị phân mảnh, thời gian đọc ghi tăng lên nhiều lần vì đầu từ phải dịch chuyển giữa các đường ghi."},{"m":"VDC","q":"Nhóm việc nào chỉ dùng đúng các tiện ích có sẵn của hệ điều hành Windows (không cài thêm)?","o":["Kiểm tra lỗi đĩa và hợp mảnh ổ cứng","Gõ tiếng Việt bằng Unikey và nén zip","Gõ tiếng Việt bằng Unikey và hợp mảnh","Nén tệp zip rồi kiểm tra lỗi đĩa"],"g":"SGK: kiểm tra đĩa, hợp mảnh cài cùng hệ điều hành; nén zip, Unikey được cài đặt sau."},{"m":"VD","q":"Nam muốn chép tệp bài tập từ thư mục Downloads sang USB mà vẫn giữ bản gốc. Dùng bảng chọn chuột phải, Nam làm thế nào?","o":["Chọn Copy ở tệp, rồi Paste trong USB","Chọn Cut ở tệp, rồi Paste trong USB","Chọn Delete ở tệp, rồi mở USB","Chọn Rename ở tệp, rồi mở USB"],"g":"Copy giữ lại bản gốc và tạo bản sao ở nơi dán; Cut là di chuyển (bản gốc mất khỏi chỗ cũ)."}],"db":[24,25,29,30,31,34,35,36,37,46,47,39],"noi":{"noi":"Câu nói nguy hiểm nhất trong ngôn ngữ là: “Chúng ta vẫn luôn làm như thế”.","tg":"Grace Hopper — nhà khoa học máy tính","nguon":"Câu nói thường được gắn với bà trong các bài nói chuyện","y":"Dám thử tiện ích mới, cách làm mới trên máy tính và điện thoại — đó là tinh thần chủ động, sáng tạo."}},{"so":3,"cd":1,"ten":"Phần mềm nguồn mở và phần mềm chạy trên Internet","trang":"15–20","muctieu":["Trình bày được một số khái niệm và so sánh phần mềm nguồn mở với phần mềm thương mại.","Nêu được vai trò của phần mềm nguồn mở và thương mại với sự phát triển CNTT.","Làm quen với phần mềm chạy trên Internet."],"muc":[{"t":"Phần mềm nguồn mở","icon":"🔓","b":["<b>Thương mại<\/b>: phải mua quyền dùng, thường nguồn đóng (Word, Photoshop).","<b>Tự do<\/b>: miễn phí, dùng không cần xin phép (Acrobat Reader).","<b>Nguồn mở<\/b>: có mã nguồn để sửa, phân phối lại theo giấy phép (GIMP, Python).","Giấy phép <b>GNU GPL<\/b>: bản sửa đổi cũng phải công bố mã nguồn theo GPL."]},{"t":"Vai trò PM thương mại và nguồn mở","icon":"⚖️","b":["Thương mại: “đặt hàng” (may đo) và “đóng gói”, có bảo hành, hỗ trợ kĩ thuật.","Nguồn mở: chi phí thấp, minh bạch, ít phụ thuộc nhà cung cấp.","Cặp thay thế: Word ↔ Writer · Windows ↔ Linux · Photoshop ↔ GIMP."]},{"t":"Phần mềm chạy trên Internet","icon":"☁️","b":["Dùng qua Internet, <b>không cần cài đặt<\/b>; ở đâu, máy nào cũng dùng được.","Chi phí rẻ hoặc miễn phí; dữ liệu tự lưu trên đám mây.","Ví dụ: Google Docs, Sheets, Slides, thư điện tử, mạng xã hội."]}],"ghinho":"Mỗi loại phần mềm có chỗ đứng riêng; chọn đúng loại và luôn tôn trọng giấy phép sử dụng.","vandung":"Tìm và nêu tên một phần mềm đồ hoạ nguồn mở và một phần mềm đồ hoạ thương mại.","the":[{"q":"Phần mềm chuyển giao dưới dạng <b>mã máy<\/b> được gọi là gì?","a":"Phần mềm <b>nguồn đóng<\/b>."},{"q":"Kể tên phần mềm nguồn mở thay thế cho <b>Photoshop<\/b> và cho <b>Windows<\/b>.","a":"Photoshop ↔ <b>GIMP<\/b>. Windows ↔ <b>Linux<\/b> (Ubuntu, Red Hat…)."},{"q":"<b>Phần mềm tự do<\/b> khác <b>phần mềm nguồn mở<\/b> ở điểm nào?","a":"Phần mềm tự do: miễn phí, dùng tự do nhưng có thể chỉ ở <b>dạng mã máy<\/b> (VD Acrobat Reader). Nguồn mở: cung cấp cả <b>mã nguồn<\/b> để sửa đổi, phân phối lại."},{"q":"<i>Đúng hay Sai?<\/i><br>“Dùng Google Docs phải cài đặt phần mềm vào máy tính.”","a":"<b>Sai.<\/b> Google Docs là <b>phần mềm chạy trên Internet<\/b>: dùng qua trình duyệt, không cần cài; cần tài khoản Google."},{"q":"Giấy phép <b>GNU GPL<\/b> yêu cầu gì khi em sửa đổi một phần mềm nguồn mở rồi phân phối lại?","a":"Phải <b>công bố mã nguồn<\/b> phần sửa đổi, nêu rõ phần thay đổi, và bản mới cũng phải <b>mở theo GPL<\/b>."},{"q":"<i>Thử thách:<\/i> Trường em nên dùng phần mềm <b>nguồn mở<\/b> hay <b>thương mại<\/b> cho phòng máy? Nêu 2 ưu điểm và 1 hạn chế của lựa chọn đó.","a":"Gợi ý (nguồn mở): <b>chi phí thấp<\/b>, <b>minh bạch<\/b>, không phụ thuộc nhà cung cấp; hạn chế: thường <b>không được bảo hành<\/b>, không thay thế hết nhu cầu riêng. (Lập luận hợp lí cho lựa chọn khác vẫn đúng.)"}],"mcq":[{"m":"TH","q":"Lỗi nào sau đây được tiện ích Check (kiểm tra đĩa) khắc phục?","o":["Cung hỏng trên đĩa (bad sector)","Tệp bị ghi phân mảnh trên đĩa","Màn hình bị giật khi xem phim","Con trỏ chuột di chuyển chậm"],"g":"Check khắc phục lỗi trên đĩa: cung mất liên kết, chồng chéo, cung hỏng (bad sector). Phân mảnh do Optimize xử lí (SGK Bài 2, tr.10–14)."},{"m":"NB","q":"Trong File Explorer, muốn mở một tệp em","o":["nháy đúp chuột vào tệp","nháy nút phải chuột vào tệp","kéo tệp vào thùng rác","nhấn phím Delete"],"g":"Nháy đúp để mở; nháy nút phải chuột để hiện bảng chọn lệnh với đối tượng (SGK Bài 2, tr.10–14)."},{"m":"TH","q":"Tiện ích Optimize (hợp mảnh) có đặc điểm nào sau đây?","o":["Chỉ có tác dụng với đĩa từ","Có tác dụng với mọi loại đĩa","Luôn chạy xong trong vài giây","Giúp sửa các cung bị hỏng"],"g":"Optimize chỉ có tác dụng với đĩa từ, có thể mất nhiều thời gian nếu đĩa dung lượng lớn (SGK Bài 2, tr.10–14)."},{"m":"VD","q":"Minh muốn xoá một ứng dụng NB","q":"Giấy phép phần mềm nguồn mở được áp dụng rộng rãi nhất là","o":["GNU GPL","Acrobat DC","Microsoft Office","OpenOffice"],"g":"SGK: có nhiều loại giấy phép, trong đó giấy phép công cộng GNU GPL được áp dụng rộng rãi nhất."},{"m":"NB","q":"Giấy phép GNU GPL 3.0 được phát hành vào năm nào?","o":["2007","1991","1970","2018"],"g":"SGK: giấy phép GNU GPL 3.0 phát hành năm 2007."},{"m":"NB","q":"Phần mềm nguồn mở nào trong Bảng 3.1 có thể thay thế Photoshop?","o":["GIMP","MySQL","Calc","Impress"],"g":"Bảng 3.1: phần mềm xử lí ảnh — thương mại Photoshop, nguồn mở GIMP."},{"m":"NB","q":"Phần mềm nguồn mở nào có thể thay thế hệ quản trị cơ sở dữ liệu Oracle, SQL server?","o":["MySQL, PostgreSQL","Writer, Calc","GIMP, Inkscape","Ubuntu, Red Hat"],"g":"Bảng 3.1: hệ quản trị CSDL thương mại Oracle, SQL server; nguồn mở MySQL, PostgreSQL."},{"m":"NB","q":"Bộ phần mềm văn phòng nguồn mở có Writer, Calc, Impress là bộ nào?","o":["OpenOffice","Microsoft Office","Google Docs","Acrobat Pro DC"],"g":"Bảng 3.1: Writer, Calc và Impress trong bộ OpenOffice, cùng chức năng Word, Excel, PowerPoint."},{"m":"NB","q":"Phần mềm được thiết kế theo yêu cầu riêng của từng khách hàng gọi là phần mềm gì?","o":["Phần mềm “đặt hàng”","Phần mềm “đóng gói”","Phần mềm tự do","Phần mềm nguồn mở"],"g":"SGK: phần mềm “đặt hàng” (may đo) được thiết kế theo yêu cầu của từng khách hàng."},{"m":"NB","q":"Theo SGK, phần mềm chạy trên Internet là phần mềm","o":["dùng qua Internet, không cần cài vào máy","chỉ chạy được khi máy không có mạng","phải cài vào máy rồi mới kết nối mạng","chỉ dùng được trên điện thoại di động"],"g":"SGK: phần mềm chạy trên Internet là phần mềm cho phép sử dụng qua Internet mà không cần cài đặt vào máy."},{"m":"TH","q":"Vì sao dịch chương trình sang mã máy giúp bảo vệ phần mềm?","o":["Mã máy rất khó đọc hiểu nên khó sửa đổi","Mã máy luôn được mã hoá bằng mật khẩu","Mã máy chỉ chạy trên một máy duy nhất","Mã máy tự xoá nếu bị sao chép trái phép"],"g":"SGK: mã máy rất khó đọc hiểu nên việc dịch sang mã máy giúp chống đánh cắp ý tưởng hay sửa đổi phần mềm."},{"m":"TH","q":"Phần mềm tự do (free software) khác phần mềm chỉ miễn phí ở điểm nào?","o":["Được tự do dùng, không phải xin phép","Luôn được cung cấp kèm theo mã nguồn","Luôn được nhà sản xuất bảo hành","Chỉ chạy được trên hệ điều hành Linux"],"g":"SGK: phần mềm tự do không chỉ miễn phí mà còn được tự do sử dụng không phải xin phép; có thể ở dạng mã máy hoặc mã nguồn."},{"m":"TH","q":"Theo Hình 3.1, Acrobat Reader và Acrobat Pro DC khác nhau thế nào?","o":["Reader chỉ đọc, ghi chú, in; Pro DC thêm soạn sửa, quét","Reader có đủ tính năng; Pro DC chỉ đọc được tệp","Reader là nguồn mở; Pro DC là phần mềm tự do","Reader chạy trên mạng; Pro DC phải cài vào máy"],"g":"SGK: Acrobat Reader là phần mềm tự do ở dạng mã máy, chỉ đọc, ghi chú, in; muốn soạn thảo, quét, kí, chuyển định dạng phải mua Acrobat Pro DC."},{"m":"TH","q":"Phần mềm nguồn mở được cung cấp kèm mã nguồn nhằm mục đích gì?","o":["Để người dùng tự sửa, cải tiến, phân phối","Để người dùng không cần cài đặt vào máy","Để nhà sản xuất dễ thu phí bản quyền hơn","Để phần mềm chạy nhanh hơn bản mã máy"],"g":"SGK: phần mềm nguồn mở cung cấp cả mã nguồn để người dùng tự sửa đổi, cải tiến, phát triển, phân phối lại theo giấy phép."},{"m":"TH","q":"Vì sao cần có giấy phép cho phần mềm nguồn mở?","o":["Để trao các quyền vốn bị luật bản quyền cấm","Để buộc người dùng trả phí sử dụng hằng năm","Để cấm mọi người sửa đổi mã nguồn","Để phần mềm chỉ cài được trên một máy"],"g":"SGK: vì mâu thuẫn giữa quy định bản quyền và quyền sử dụng nguồn mở nên cần giấy phép; giấy phép cung cấp các quyền vốn bị cấm bởi quy định bản quyền."},{"m":"TH","q":"Theo GNU GPL, người sửa đổi và phân phối lại phần mềm phải làm gì?","o":["Công bố mã nguồn phần sửa, nêu rõ thay đổi","Giữ kín phần sửa đổi để bảo vệ ý tưởng","Xin phép từng tác giả trước khi sử dụng","Đổi tên phần mềm và xoá tên tác giả gốc"],"g":"GPL: được sửa đổi và phân phối bản sửa với điều kiện công bố mã nguồn phần sửa, nêu rõ đã thay đổi, chỉ rõ thành phần được thay đổi."},{"m":"TH","q":"Theo GNU GPL, việc phân phối lại phần mềm có được thu phí không?","o":["Được thu phí, phải báo rõ bản quyền gốc","Không bao giờ được thu bất kì khoản phí nào","Được thu phí và giữ kín mã nguồn đã sửa","Chỉ tác giả đầu tiên mới được thu phí"],"g":"GPL: được sao chép, phân phối, có quyền yêu cầu trả phí chuyển giao nhưng phải thông báo rõ bản quyền gốc và miễn trừ bảo hành."},{"m":"TH","q":"Đặc điểm của phần mềm “đóng gói” là gì?","o":["Hoàn chỉnh, theo nhu cầu chung, có bộ cài","Viết riêng cho một khách hàng theo hợp đồng","Luôn được cung cấp kèm theo mã nguồn","Chỉ chạy được khi có kết nối Internet"],"g":"SGK: phần mềm đóng gói dựa trên yêu cầu chung của nhiều người, viết hoàn chỉnh, kèm công cụ cài đặt tự động."},{"m":"TH","q":"Theo Bảng 3.2, về chi phí, phần mềm nguồn mở khác phần mềm thương mại thế nào?","o":["Chỉ mất phí chuyển giao nếu có","Mất phí mua và phí chuyển giao","Mất phí bảo hành theo hợp đồng","Mất phí theo số lần sử dụng"],"g":"Bảng 3.2: phần mềm thương mại mất chi phí mua và phí chuyển giao; nguồn mở chỉ mất phí chuyển giao nếu có."},{"m":"TH","q":"Theo Bảng 3.2, về tính minh bạch, phần mềm nguồn mở có ưu điểm gì?","o":["Có thể kiểm soát được mã nguồn","Có nhà cung cấp hỗ trợ kĩ thuật","Được cài sẵn trên mọi máy tính","Không cần giấy phép khi sử dụng"],"g":"Bảng 3.2: phần mềm nguồn đóng khó kiểm soát những gì cài cắm bên trong; nguồn mở có thể kiểm soát được mã nguồn."},{"m":"TH","q":"Vì sao người dùng phần mềm thương mại dễ bị phụ thuộc vào nhà cung cấp?","o":["Nhà cung cấp nắm giải pháp và hỗ trợ kĩ thuật","Phần mềm thương mại không thể gỡ khỏi máy","Phần mềm thương mại chỉ chạy được một năm","Người dùng phải tự viết lại mã nguồn"],"g":"SGK: phần mềm thương mại liên quan giải pháp riêng của người cung cấp nên người dùng dễ phụ thuộc cả về giải pháp và hỗ trợ kĩ thuật."},{"m":"TH","q":"Vì sao SGK kết luận phần mềm nguồn mở không thể thay thế hoàn toàn phần mềm thương mại?","o":["Nhu cầu riêng cần phần mềm đặt hàng","Phần mềm nguồn mở luôn kém chất lượng hơn","Phần mềm nguồn mở bị cấm dùng ở cơ quan","Phần mềm nguồn mở không có giấy phép"],"g":"SGK: nguồn mở đáp ứng nhu cầu chung; nhu cầu riêng phong phú hơn nhiều chỉ phần mềm đặt hàng đáp ứng; thương mại còn là nguồn tài chính duy trì tổ chức làm phần mềm."},{"m":"TH","q":"Lợi ích chính của phần mềm chạy trên Internet là gì?","o":["Dùng mọi lúc, mọi nơi có Internet","Chạy được ngay cả khi không có mạng","Luôn có đầy đủ mã nguồn kèm theo","Không bao giờ cần đến tài khoản đăng nhập"],"g":"SGK: lợi ích là có thể sử dụng ở bất cứ đâu, bất cứ lúc nào, bất cứ máy tính nào có kết nối Internet, chi phí rẻ hoặc không mất phí."},{"m":"TH","q":"Văn bản soạn trên Google Docs được lưu ở đâu?","o":["Tự động lưu trên đám mây của Google","Trên ổ đĩa C của máy đang dùng","Trong thẻ nhớ của điện thoại","Trên USB cắm vào máy tính"],"g":"SGK: văn bản được lưu tự động trên không gian lưu trữ của em trên đám mây của Google."},{"m":"TH","q":"Vì sao GPL buộc phần mềm sửa từ một phần mềm theo GPL cũng phải mở theo GPL?","o":["Giúp nguồn mở phát triển bền vững","Để tác giả gốc thu được nhiều tiền hơn","Để phần mềm sửa đổi không ai dùng được","Để chuyển phần mềm thành nguồn đóng"],"g":"SGK: GPL đảm bảo sự phát triển bền vững của nguồn mở bằng cách buộc phần phát triển dựa trên phần mềm GPL cũng phải mở theo GPL."},{"m":"VD","q":"Trường muốn dạy tin học văn phòng nhưng không đủ kinh phí mua Word, Excel, PowerPoint. Lựa chọn hợp lí theo Bảng 3.1 là","o":["Writer, Calc, Impress của OpenOffice","MySQL, PostgreSQL của cộng đồng","GIMP và Inkscape của cộng đồng","Oracle và SQL server bản dùng thử"],"g":"Bảng 3.1: Writer, Calc, Impress (OpenOffice) có cùng chức năng với Word, Excel, PowerPoint."},{"m":"VD","q":"Một hãng taxi thuê công ty viết riêng ứng dụng đặt xe theo yêu cầu, có bảo hành theo hợp đồng. Đây là loại phần mềm nào?","o":["Phần mềm thương mại “đặt hàng”","Phần mềm thương mại “đóng gói”","Phần mềm nguồn mở theo GPL","Phần mềm tự do dạng mã máy"],"g":"SGK: phần mềm đặt xe của các hãng taxi là ví dụ phần mềm đặt hàng — thiết kế theo yêu cầu, bảo hành theo hợp đồng."},{"m":"VD","q":"Lan cần chuyển một tệp PDF sang Word để sửa nội dung. Theo Hình 3.1, Lan cần dùng","o":["Acrobat Pro DC (bản thương mại)","Acrobat Reader (bản tự do)","Trình duyệt web bất kì","Tiện ích File Explorer"],"g":"Hình 3.1: chuyển định dạng PDF sang Word… chỉ có ở Acrobat Pro DC; Reader chỉ đọc, ghi chú, in."},{"m":"VD","q":"Nhóm bạn tải mã nguồn một phần mềm theo GPL, thêm tính năng mới rồi chia sẻ lại. Nhóm phải làm gì?","o":["Công bố mã nguồn phần sửa và vẫn dùng giấy phép GPL","Đổi sang bán dạng mã máy để bảo vệ ý tưởng","Xoá thông tin tác giả gốc khỏi phần mềm","Giữ kín phần thêm vì đó là công sức của nhóm"],"g":"GPL: phần mềm có nguồn gốc từ việc sửa đổi phần mềm GPL cũng phải là nguồn mở theo GPL, công bố mã nguồn phần sửa."},{"m":"VD","q":"Minh soạn bài thuyết trình trên Google Slides ở trường, về nhà mở tiếp trên máy khác. Điều này thể hiện ưu điểm nào?","o":["Dùng trên máy nào có Internet","Không cần tài khoản để đăng nhập","Có thể chạy khi máy mất mạng","Được cài sẵn trong mọi máy tính"],"g":"SGK: phần mềm trực tuyến dùng được ở bất cứ đâu, bất cứ máy nào có Internet; tệp lưu trên đám mây."},{"m":"VD","q":"Để dùng Google Sheets, điều kiện cần là gì?","o":["Có tài khoản Google, vào sheets.google.com","Mua bản quyền Microsoft Excel trước","Cài bộ OpenOffice vào máy tính","Tải mã nguồn của Google Sheets về"],"g":"SGK lưu ý: để dùng phần mềm trực tuyến của Google cần có tài khoản Google và truy cập docs/sheets/slides.google.com."},{"m":"VD","q":"Trên trang docs.google.com (Hình 3.2), muốn tạo văn bản mới, em làm gì?","o":["Nháy chọn biểu tượng dấu + (Blank)","Nháy chọn một văn bản cũ phía dưới","Nháy đúp vào ô tìm kiếm Search","Cài thêm Word vào máy rồi mở"],"g":"SGK: muốn sửa văn bản cũ thì chọn văn bản đó; muốn tạo mới thì chọn biểu tượng + như Hình 3.2."},{"m":"VD","q":"Phần mềm ở trạm ATM có phải phần mềm chạy trên Internet theo nghĩa của SGK không?","o":["Không, vì phần mềm được cài sẵn trên máy ATM","Có, vì máy ATM kết nối với ngân hàng","Có, vì ai cũng dùng được máy ATM","Không, vì máy ATM không có hệ điều hành"],"g":"Luyện tập 2: phần mềm chạy trên Internet là dùng qua Internet mà không cần cài vào máy; phần mềm ATM được cài trên máy ATM (dù có kết nối mạng ngân hàng)."},{"m":"VD","q":"Bạn Nam nói: “Nguồn mở càng phát triển thì thị trường phần mềm thương mại càng suy giảm”. Nhận xét nào phù hợp với SGK?","o":["Chưa đúng, nhu cầu riêng vẫn cần phần mềm thương mại","Đúng, nguồn mở sẽ thay thế hết phần mềm thương mại","Đúng, vì phần mềm thương mại đều kém chất lượng","Chưa đúng, vì nguồn mở đang dần biến mất"],"g":"Luyện tập 1: nguồn mở đáp ứng nhu cầu chung; nhu cầu riêng phong phú cần phần mềm đặt hàng; thương mại là nguồn tài chính duy trì các tổ chức làm phần mềm."},{"m":"VD","q":"Câu lạc bộ thiết kế của trường cần một phần mềm đồ hoạ vector miễn phí, được cộng đồng phát triển. Chọn phần mềm nào?","o":["Inkscape","Photoshop","Microsoft Word","Acrobat Pro DC"],"g":"Vận dụng 1: Inkscape (SGK nêu là nguồn mở) là phần mềm đồ hoạ; Photoshop là phần mềm thương mại."},{"m":"VD","q":"Một công ty dùng phần mềm thương mại đóng gói, cần thêm một tính năng riêng nhưng nhà bán không làm. Lí do theo SGK là","o":["Người bán không sửa theo từng người dùng","Phần mềm đóng gói không thể nâng cấp được","Phần mềm đóng gói luôn là nguồn mở","Công ty chưa trả phí bản quyền đúng hạn"],"g":"SGK: với phần mềm đóng gói, người bán không có trách nhiệm sửa chữa nâng cấp theo yêu cầu từng người, nhưng có thể nâng cấp định kì."},{"m":"VD","q":"Mua một giấy phép phần mềm thương mại, người dùng thường bị giới hạn điều gì?","o":["Chỉ được cài trên số máy nhất định","Chỉ được dùng phần mềm trong một ngày","Phải công bố mã nguồn khi sử dụng","Không được lưu tệp tạo ra bằng phần mềm"],"g":"SGK: khi trả tiền cho mỗi giấy phép, phần mềm thương mại chỉ được phép cài trên một số lượng máy tính nhất định."},{"m":"VD","q":"Thầy giáo muốn học sinh luyện lập trình mà không phải mua bản quyền. Môi trường nào trong SGK là nguồn mở?","o":["Môi trường lập trình Python","Bộ Microsoft Office","Phần mềm Photoshop","Hệ điều hành iOS"],"g":"SGK: một số phần mềm nguồn mở trong bộ sách là Inkscape, GIMP, môi trường lập trình cho ngôn ngữ Python."},{"m":"VD","q":"Ngân hàng chọn phần mềm thương mại có hợp đồng bảo hành thay cho phần mềm nguồn mở. Lí do hợp lí nhất là","o":["Cần hỗ trợ kĩ thuật, bảo hành","Phần mềm thương mại luôn minh bạch hơn","Phần mềm thương mại luôn rẻ hơn nguồn mở","Phần mềm nguồn mở không chạy được trên máy chủ"],"g":"Bảng 3.2: thương mại có hỗ trợ kĩ thuật; nguồn mở thông thường không được bảo hành, chỉ được hỗ trợ từ cộng đồng."},{"m":"VD","q":"Cơ quan muốn kiểm soát chắc chắn phần mềm không cài cắm mã lạ bên trong. Theo Bảng 3.2, nên ưu tiên loại nào?","o":["Phần mềm nguồn mở","Phần mềm nguồn đóng","Phần mềm tự do dạng mã máy","Phần mềm đóng gói"],"g":"Bảng 3.2: với nguồn đóng, khó kiểm soát những gì cài cắm bên trong; nguồn mở có thể kiểm soát được mã nguồn."},{"m":"VDC","q":"Sắp xếp ba cách chuyển giao phần mềm theo hướng “mở dần” lợi ích cho người dùng: (1) cho dùng miễn phí, không cung cấp mã nguồn; (2) bán dạng mã máy; (3) cho dùng tự do kèm mã nguồn.","o":["2 – 1 – 3","1 – 2 – 3","3 – 1 – 2","2 – 3 – 1"],"g":"Hoạt động 1: bán mã máy → cho dùng miễn phí không có mã nguồn → dùng tự do có mã nguồn để sửa, phát triển, phân phối lại."},{"m":"VDC","q":"Các chương trình Python thường ở dạng mã nguồn. Có thể coi mọi phần mềm viết bằng Python đều là phần mềm nguồn mở không?","o":["Không, nguồn mở còn phụ thuộc giấy phép tác giả cho phép","Có, vì ai cũng đọc được mã nguồn Python","Có, vì Python là môi trường lập trình nguồn mở","Không, vì Python luôn dịch ra mã máy"],"g":"Vận dụng 2: đọc được mã nguồn chưa đủ; phần mềm nguồn mở phải được cấp quyền sửa đổi, phân phối lại theo giấy phép. Tác giả vẫn giữ bản quyền nếu không cấp phép."},{"m":"VDC","q":"Công ty A lấy một phần mềm theo GPL, sửa đổi rồi bán dưới dạng mã máy, không công bố mã nguồn. Đánh giá nào đúng?","o":["Vi phạm GPL vì bản sửa phải mở theo GPL","Hợp lệ vì GPL cho phép thu phí chuyển giao","Hợp lệ vì công ty đã bỏ công sửa đổi","Vi phạm vì GPL cấm mọi hình thức thu phí"],"g":"GPL cho thu phí chuyển giao nhưng bản sửa đổi phải công bố mã nguồn và vẫn theo GPL."},{"m":"VDC","q":"Ý nghĩa của yêu cầu “người sửa đổi phải công bố rõ phần nào đã sửa, sửa thế nào so với bản gốc” là","o":["Ghi nhận đúng công sức tác giả, người sau dễ kế thừa","Để tác giả gốc chịu trách nhiệm phần bị sửa","Để phần mềm sửa đổi trở thành nguồn đóng","Để người dùng phải trả phí cho mỗi lần sửa"],"g":"SGK: GPL bảo đảm quyền đứng tên của các tác giả tham gia phát triển và sự phát triển bền vững nhờ công bố rõ các thay đổi của các phiên bản."},{"m":"VDC","q":"Một bạn cho rằng “Phần mềm tự do thì chắc chắn là phần mềm nguồn mở”. Nhận xét nào đúng?","o":["Chưa đúng, phần mềm tự do có thể chỉ ở dạng mã máy","Đúng, vì phần mềm tự do luôn có kèm mã nguồn","Đúng, vì hai khái niệm này hoàn toàn trùng nhau","Chưa đúng, vì phần mềm tự do luôn phải trả phí"],"g":"SGK: phần mềm tự do có thể ở dạng mã máy hoặc mã nguồn (VD Acrobat Reader là tự do dạng mã máy), nên chưa chắc là nguồn mở."},{"m":"VDC","q":"Trường cần phần mềm quản lí điểm đúng quy trình riêng của trường, có người bảo trì lâu dài. Phương án hợp lí nhất là","o":["Đặt hàng phần mềm có hợp đồng bảo hành","Dùng phần mềm đóng gói và tự sửa theo ý muốn","Dùng Google Docs để ghi điểm từng môn học","Tải phần mềm tự do dạng mã máy rồi chỉnh sửa"],"g":"Nhu cầu riêng → phần mềm đặt hàng, thiết kế chính xác theo yêu cầu và được bảo hành theo hợp đồng."},{"m":"VDC","q":"Vì sao SGK nói phần mềm thương mại vẫn có vai trò quan trọng dù nguồn mở phát triển mạnh?","o":["Là nguồn thu chính duy trì tổ chức làm phần mềm","Vì phần mềm thương mại luôn có mã nguồn mở","Vì luật bắt buộc mọi cơ quan dùng hàng thương mại","Vì phần mềm thương mại không cần cập nhật"],"g":"SGK: phần mềm thương mại là nguồn thu nhập chính của các tổ chức, cá nhân làm phần mềm chuyên nghiệp, tạo thị trường phong phú."},{"m":"VDC","q":"Nhóm sinh viên viết một phần mềm Python cho riêng mình, không công bố giấy phép, rồi đưa tệp mã nguồn cho bạn dùng. Người bạn có quyền gì?","o":["Chỉ dùng trong phạm vi nhóm cho phép, chưa được phát hành lại","Được tuỳ ý sửa và bán lại vì đã có mã nguồn","Được coi là tác giả vì đã có tệp mã nguồn","Bắt buộc phải công bố mã nguồn theo GPL"],"g":"Có mã nguồn chưa đồng nghĩa có quyền; khi không có giấy phép, bản quyền thuộc tác giả (quyền tạo bản sao, sửa đổi, chuyển giao)."},{"m":"VDC","q":"Trường chuyển cả phòng máy từ Windows sang Ubuntu để tiết kiệm. Khó khăn nào dễ gặp nhất theo Bảng 3.2?","o":["Thiếu hỗ trợ kĩ thuật trực tiếp","Phải trả phí bản quyền cao cho mỗi máy","Không kiểm soát được mã nguồn bên trong","Bị phụ thuộc hoàn toàn vào một hãng"],"g":"Bảng 3.2: nguồn mở không có hỗ trợ kĩ thuật từ nhà cung cấp (chỉ được hỗ trợ từ cộng đồng); chi phí thấp, minh bạch, không phụ thuộc."},{"m":"VDC","q":"Chọn ghép đúng phần mềm thương mại với phần mềm nguồn mở cùng chức năng (Bảng 3.1).","o":["Excel – Calc; iOS – Android; Photoshop – GIMP","Word – Calc; Windows – Android; Oracle – GIMP","PowerPoint – Writer; iOS – Linux; SQL server – Impress","Excel – Impress; Windows – MySQL; Photoshop – Writer"],"g":"Bảng 3.1: Word–Writer, Excel–Calc, PowerPoint–Impress; Windows–Linux; iOS–Android; Oracle/SQL server–MySQL/PostgreSQL; Photoshop–GIMP."}],"db":[21,25,30,31,32,36,37,41,44,46,47,49],"noi":{"noi":"Web là dành cho tất cả mọi người.","tg":"Tim Berners-Lee — người phát minh ra World Wide Web","nguon":"Dòng chữ ông gửi tại lễ khai mạc Thế vận hội London, 2012","y":"Phần mềm nguồn mở và phần mềm trực tuyến mở ra cơ hội học tập cho mọi người — hãy dùng đúng, dùng có trách nhiệm."}},{"so":4,"cd":1,"ten":"Bên trong máy tính","trang":"21–26","muctieu":["Nhận diện được một số thiết bị bên trong máy tính với chức năng và thông số đo hiệu năng.","Nhận biết được sơ đồ mạch lôgic AND, OR, NOT; giải thích vai trò của chúng trong tính toán nhị phân."],"muc":[{"t":"Các thiết bị bên trong máy tính","icon":"🧠","b":["Gắn trên <b>bảng mạch chính<\/b>: CPU, bộ nhớ trong, bộ nhớ ngoài, mạch mở rộng.","<b>CPU<\/b> = ALU + CU; tốc độ đo bằng <b>GHz<\/b>; có thanh ghi, cache, đa lõi.","<b>RAM<\/b>: lưu tạm, mất khi tắt máy · <b>ROM<\/b>: chỉ đọc, lưu chương trình khởi động.","Bộ nhớ ngoài: HDD, SSD (nhanh hơn HDD), đĩa quang – dung lượng GB, TB."]},{"t":"Mạch lôgic và vai trò","icon":"💡","b":["<b>AND<\/b> = 1 khi cả hai bằng 1 · <b>OR<\/b> = 1 khi ít nhất một bằng 1 · <b>NOT<\/b> đảo giá trị.","<b>XOR<\/b> = 1 khi hai giá trị khác nhau.","Rơ le nối tiếp → AND · song song → OR · thường đóng → NOT.","Cộng 2 bit: tổng <b>t = x ⊕ y<\/b>, số nhớ <b>z = x ∧ y<\/b> (VD 110 + 111 = 1101)."]}],"ghinho":"Mọi thiết bị số đều được chế tạo từ mạch lôgic; hiểu thông số CPU, RAM, ổ cứng giúp chọn máy đúng nhu cầu.","vandung":"Tìm hiểu đơn vị flops và vì sao dùng nó đo hiệu năng máy tính.","the":[{"q":"<b>CPU<\/b> gồm hai bộ phận chính nào?","a":"<b>Bộ số học và lôgic<\/b> (ALU) và <b>bộ điều khiển<\/b> (CU)."},{"q":"Tốc độ CPU đo bằng đơn vị gì? <b>1 GHz<\/b> là bao nhiêu xung một giây?","a":"Đo bằng <b>tần số xung nhịp<\/b>, thường là GHz. <b>1 GHz = 1 tỉ xung/giây<\/b>."},{"q":"<b>Bộ nhớ đệm<\/b> (cache) của CPU dùng để làm gì?","a":"Chứa dữ liệu được <b>nạp trước<\/b> để giảm thời gian CPU đọc dữ liệu."},{"q":"<b>RAM<\/b> và <b>ROM<\/b> khác nhau thế nào?","a":"<b>RAM<\/b>: ghi được, lưu <b>tạm thời<\/b>, tắt máy mất dữ liệu. <b>ROM<\/b>: <b>chỉ đọc<\/b>, không cần nguồn nuôi, lưu chương trình khởi động."},{"q":"Tính: <b>1 AND 0<\/b> ; <b>1 OR 0<\/b> ; <b>1 XOR 1<\/b> ; <b>NOT 0<\/b>.","a":"<b>0 ; 1 ; 0 ; 1<\/b>. (XOR = 1 khi hai giá trị khác nhau.)"},{"q":"Cộng hai số nhị phân: <b>110 + 111<\/b> = ? Kiểm tra lại bằng hệ thập phân.","a":"<b>1101<\/b>. Kiểm tra: 6 + 7 = 13 = 1101₂."},{"q":"Mạch rơ le mắc <b>nối tiếp<\/b> và mắc <b>song song<\/b> tương ứng với phép toán lôgic nào? Vì sao?","a":"<b>Nối tiếp → AND<\/b>: đèn sáng khi cả hai công tắc đóng. <b>Song song → OR<\/b>: chỉ cần một công tắc đóng là sáng."}],"mcq":[{"m":"NB","q":"Mã nguồn của phần mềm là","o":["chương trình viết bằng ngôn ngữ bậc cao","dãy lệnh máy tính chạy được trực tiếp","giấy phép quy định điều kiện sử dụng","tệp dùng để cài đặt phần mềm"],"g":"Mã nguồn: chương trình viết bằng ngôn ngữ lập trình bậc cao; mã máy: dãy lệnh máy tính chạy trực tiếp (SGK Bài 3, tr.15–20)."},{"m":"NB","q":"Phần mềm được chuyển giao cho người dùng ở dạng mã máy gọi là","o":["phần mềm nguồn đóng","phần mềm nguồn mở","phần mềm trực tuyến","phần mềm tiện ích"],"g":"Phần mềm chuyển giao dạng mã máy gọi là phần mềm nguồn đóng (SGK Bài 3, tr.15–20)."},{"m":"NB","q":"Phần mềm thương mại là phần mềm","o":["để bán, người dùng phải mua quyền","miễn phí, tự do sửa mã nguồn","chỉ chạy được trên Internet","không cần giấy phép sử dụng"],"g":"Phần mềm thương mại để bán, người dùng phải mua quyền sử dụng, hầu hết là nguồn đóng (Word, Photoshop) (SGK Bài 3, tr.15–20)."},{"m":"TH","q":"Acrobat Reader là ví dụ của loại phần mềm nào?","o":["Phần mềm tự do ở dạng mã máy","Phần mềm nguồn mở có mã nguồn","Phần mềm đặt hàng theo hợp đồng","Phần mềm chạy trên Internet"],"g":"Phần mềm tự do: miễn phí, tự do sử dụng không phải xin phép, có thể ở dạng mã máy (Acrobat Reader) (SGK Bài 3, tr.15–20)."},{"m":"NB","q":"Phần mềm nguồn mở dùng thay cho Microsoft Excel là","o":["Calc","Writer","Impress","GIMP"],"g":"Bảng 3.1: Word, Excel, PowerPoint ↔ Writer, Calc, Impress (OpenOffice) (SGK Bài 3, tr.15–20)."},{"m":"NB","q":"Hệ quản trị cơ sở dữ liệu nguồn mở dùng thay cho Oracle, SQL server là","o":["MySQL","Photoshop","Inkscape","Impress"],"g":"Bảng 3.1: Oracle, SQL server ↔ MySQL, PostgreSQL (SGK Bài 3, tr.15–20)."},{"m":"TH","q":"Phần mềm thương mại \"đóng gói\" là phần mềm","o":["làm theo nhu cầu chung, có công cụ cài đặt","viết riêng theo yêu cầu một khách hàng","luôn được cung cấp kèm cả mã nguồn","chỉ dùng được khi có kết nối Internet"],"g":"Phần mềm \"đóng gói\" theo nhu cầu chung, hoàn chỉnh, có công cụ cài đặt; phần mềm \"đặt hàng\" làm theo yêu cầu riêng (SGK Bài 3, tr.15–20)."},{"m":"VD","q":"Khi soạn bài trên Google Docs, Hà không cần nhấn nút Lưu vì","o":["văn bản tự lưu trên đám mây","văn bản tự in ra máy in","văn bản lưu sẵn trong ROM","Google Docs không cần tài khoản"],"g":"Google Docs, Sheets, Slides cần tài khoản Google; văn bản tự lưu trên đám mây (SGK Bài 3, tr.15–20)."}],"tf":[{"q":"Huy chọn mua máy tính để học đồ hoạ và lập trình.","y":["Tốc độ CPU được đo bằng GHz.","Dữ liệu trong RAM vẫn còn khi tắt máy.","Ổ SSD đọc ghi nhanh hơn ổ HDD.","CPU gồm bộ số học – lôgic (ALU) và bộ điều khiển (CU)."],"d":[true,false,true,true],"g":["Theo SGK.","RAM mất dữ liệu khi tắt máy.","SSD nhanh hơn HDD.","CPU = ALU + CU."]}],"td":[{"m":"NB","q":"Tất cả thiết bị bên trong thân máy được gắn trên bảng mạch nào?","o":["Bảng mạch chính (mainboard)","Bảng mạch mở rộng","Bộ nhớ đệm (cache)","Bộ số học và lôgic"],"g":"SGK: tất cả các thiết bị bên trong thân máy được gắn với bảng mạch chính (mainboard)."},{"m":"NB","q":"CPU được cấu tạo từ hai bộ phận chính nào?","o":["Bộ số học – lôgic và bộ điều khiển","Bộ nhớ trong và bộ nhớ ngoài","Thanh ghi và bộ nhớ ROM","Bảng mạch chính và cổng kết nối"],"g":"SGK: CPU gồm bộ số học và lôgic (ALU) và bộ điều khiển (Control Unit)."},{"m":"NB","q":"Tốc độ của CPU thường được đánh giá bằng đơn vị nào?","o":["GHz","GB","TB","MB"],"g":"SGK: dùng tần số đồng hồ xung, thường là GHz (1 tỉ xung một giây), để đánh giá tốc độ CPU."},{"m":"NB","q":"Bộ phận nào của CPU thực hiện tất cả các phép tính số học và lôgic?","o":["ALU","Bộ điều khiển","Bộ nhớ đệm","Bộ nhớ ROM"],"g":"SGK: bộ số học và lôgic (ALU) thực hiện tất cả các phép tính số học và lôgic."},{"m":"NB","q":"Bộ nhớ trong gồm hai loại nào?","o":["RAM và ROM","SSD và HDD","Cache và thanh ghi","Đĩa từ và đĩa quang"],"g":"SGK: tuỳ cách sử dụng, bộ nhớ trong chia thành RAM và ROM."},{"m":"NB","q":"Dữ liệu trong RAM sẽ thế nào khi tắt máy?","o":["Bị xoá","Được giữ lâu dài","Chuyển sang ROM","Tự lưu lên mạng"],"g":"SGK: RAM ghi dữ liệu tạm thời khi chạy chương trình nhưng không giữ lâu dài; tắt máy dữ liệu bị xoá."},{"m":"NB","q":"Phép toán lôgic nào chỉ cho giá trị 1 khi cả hai đại lượng đều bằng 1?","o":["AND (phép nhân)","OR (phép cộng)","XOR (hoặc loại trừ)","NOT (phủ định)"],"g":"SGK: phép nhân AND chỉ nhận giá trị 1 khi và chỉ khi cả x và y đều bằng 1."},{"m":"NB","q":"Phép XOR của hai đại lượng lôgic cho kết quả 1 khi nào?","o":["Hai đại lượng khác nhau","Hai đại lượng giống nhau","Hai đại lượng đều bằng 1","Hai đại lượng đều bằng 0"],"g":"SGK: XOR cho kết quả 1 khi và chỉ khi hai đại lượng có giá trị khác nhau."},{"m":"NB","q":"Mỗi đơn vị xử lí trong CPU nhiều lõi được gọi là gì?","o":["Lõi (core)","Thanh ghi","Xung nhịp","Liên cung"],"g":"SGK: mỗi đơn vị xử lí được gọi là một lõi hoặc một nhân (core)."},{"m":"NB","q":"Các mạch lôgic thực hiện phép toán cơ bản như AND, OR, NOT, XOR được gọi là gì?","o":["Cổng lôgic","Rơ le điện từ","Bảng mạch chính","Bộ nhớ đệm"],"g":"SGK: mạch lôgic thực hiện các phép toán lôgic cơ bản gọi là các cổng lôgic (logic gate)."},{"m":"TH","q":"Thanh ghi (register) trong CPU dùng để làm gì?","o":["Lưu tạm lệnh, dữ liệu đang xử lí","Lưu lâu dài các tệp của người dùng","Lưu chương trình khởi động máy","Kết nối CPU với thiết bị ngoài"],"g":"SGK: thanh ghi là vùng nhớ đặc biệt lưu tạm thời lệnh và dữ liệu đang được xử lí, CPU truy cập rất nhanh."},{"m":"TH","q":"Bộ nhớ đệm (cache) giúp ích gì cho CPU?","o":["Giảm thời gian đọc dữ liệu","Tăng dung lượng ổ cứng","Lưu dữ liệu khi tắt máy","Tạo xung nhịp đồng hồ"],"g":"SGK: cache chứa dữ liệu nạp trước từ bộ nhớ trong nhằm giảm thời gian đọc dữ liệu."},{"m":"TH","q":"Vì sao CPU đa lõi xử lí nhanh hơn CPU một lõi?","o":["Thực hiện song song nhiều việc","Có dung lượng RAM lớn hơn","Dùng điện áp cao hơn","Không cần đồng hồ xung"],"g":"SGK: CPU đa lõi cho phép thực hiện song song nhiều công việc nên xử lí nhanh hơn."},{"m":"TH","q":"ROM thường được dùng để lưu gì?","o":["Dữ liệu hệ thống, chương trình khởi động","Văn bản người dùng đang soạn dở","Ảnh và video tải từ Internet","Dữ liệu tạm khi chạy trò chơi"],"g":"SGK: ROM thường dùng để lưu dữ liệu hệ thống cố định và các chương trình kiểm tra hay khởi động máy."},{"m":"TH","q":"So với RAM, ROM thường có đặc điểm nào?","o":["Dung lượng nhỏ hơn, truy cập chậm hơn","Dung lượng lớn hơn, truy cập nhanh hơn","Mất dữ liệu khi tắt máy","Ghi và xoá được thường xuyên"],"g":"SGK: so với RAM, ROM thường có dung lượng nhỏ hơn và thời gian truy cập trung bình lớn hơn."},{"m":"TH","q":"Hai tham số đo hiệu năng quan trọng nhất của bộ nhớ là gì?","o":["Dung lượng và thời gian truy cập","Giá tiền và màu sắc vỏ","Hãng sản xuất và kích thước","Số cổng và số lõi"],"g":"SGK: các thông số quan trọng nhất của bộ nhớ là dung lượng nhớ và thời gian truy cập trung bình."},{"m":"TH","q":"Vì sao đĩa cứng truy cập chậm hơn nhiều so với SSD?","o":["Đĩa cứng là thiết bị điện cơ","Đĩa cứng có dung lượng nhỏ","Đĩa cứng nằm ngoài thân máy","Đĩa cứng không có cổng nối"],"g":"SGK: đĩa cứng là thiết bị điện cơ nên tốc độ truy cập chậm hơn nhiều so với SSD, nhưng nhanh hơn đĩa quang."},{"m":"TH","q":"Bộ điều khiển (Control Unit) của CPU có nhiệm vụ gì?","o":["Phối hợp đồng bộ các thiết bị theo chương trình","Thực hiện các phép cộng, trừ, nhân, chia","Lưu dữ liệu lâu dài khi tắt máy","Tạo kết nối mạng không dây"],"g":"SGK: bộ điều khiển phối hợp đồng bộ các thiết bị của máy tính, đảm bảo máy thực hiện đúng chương trình."},{"m":"TH","q":"Trong mạch Hình 4.4 (hai rơ le K1, K2 mắc nối tiếp), đèn sáng khi nào?","o":["Cả K1 và K2 đều có điện","Chỉ cần K1 có điện","Chỉ cần K2 có điện","Cả K1 và K2 đều mất điện"],"g":"Hình 4.4 mạch nối tiếp thực hiện phép nhân lôgic (AND): chỉ khi cả hai rơ le có điện đèn mới sáng."},{"m":"TH","q":"Trong mạch Hình 4.5 (hai rơ le mắc song song), mạch thực hiện phép toán nào?","o":["Phép cộng lôgic OR","Phép nhân lôgic AND","Phép phủ định NOT","Phép hoặc loại trừ XOR"],"g":"Hình 4.5: chỉ cần ít nhất một rơ le có điện là mạch đóng, đèn sáng → phép cộng lôgic OR."},{"m":"TH","q":"Mạch phủ định NOT ở Hình 4.6 dùng loại rơ le nào?","o":["Rơ le thường đóng","Rơ le thường mở","Hai rơ le nối tiếp","Hai rơ le song song"],"g":"SGK: dùng một rơ le thường đóng; cấp điện thì ngắt mạch (0), không cấp điện thì đèn sáng (1)."},{"m":"TH","q":"Theo SGK, mọi mạch lôgic đều có thể xây dựng từ các cổng nào?","o":["AND, OR, NOT","XOR, NOT, OR","AND, XOR","Chỉ cổng XOR"],"g":"SGK: bất cứ mạch lôgic nào cũng có thể xây dựng được từ các cổng AND, OR, NOT."},{"m":"TH","q":"Khi cộng hai bit, số nhớ z là kết quả của phép toán lôgic nào?","o":["z = x AND y","z = x OR y","z = x XOR y","z = NOT x"],"g":"Hoạt động 2: số nhớ z chỉ bằng 1 khi x và y đều bằng 1 → z = x ∧ y; chữ số kết quả t = x ⊕ y."},{"m":"TH","q":"Khi cộng hai bit x và y, chữ số kết quả t (không tính nhớ) là phép toán nào?","o":["t = x XOR y","t = x AND y","t = x OR y","t = NOT y"],"g":"Hình 4.10: t chính là x ⊕ y (bằng 1 khi x, y khác nhau)."},{"m":"TH","q":"Vì sao mạch lôgic rất quan trọng?","o":["Mọi thiết bị số đều được chế tạo từ mạch lôgic","Mạch lôgic giúp máy tính tiết kiệm điện năng","Mạch lôgic thay thế hoàn toàn phần mềm","Mạch lôgic chỉ dùng cho máy tính cũ"],"g":"SGK: tất cả các thiết bị số, gồm cả máy tính, đều được chế tạo từ các mạch lôgic."},{"m":"VD","q":"Tính giá trị của biểu thức NOT(x OR y) với (x, y) = (0, 1).","o":["0","1","10","2"],"g":"x OR y = 0 ∨ 1 = 1, phủ định thành 0."},{"m":"VD","q":"Tính giá trị của (NOT x) AND (NOT y) với (x, y) = (1, 0).","o":["0","1","10","2"],"g":"NOT 1 = 0, NOT 0 = 1; 0 AND 1 = 0."},{"m":"VD","q":"Thực hiện phép cộng nhị phân 1010 + 101. Kết quả là","o":["1111","1011","10101","1101"],"g":"Luyện tập 2a: 1010 (10) + 101 (5) = 1111 (15)."},{"m":"VD","q":"Thực hiện phép cộng nhị phân 1001 + 1011. Kết quả là","o":["10100","10010","11100","10110"],"g":"Luyện tập 2b: 1001 (9) + 1011 (11) = 10100 (20)."},{"m":"VD","q":"Số nhị phân 10011 bằng bao nhiêu trong hệ thập phân?","o":["19","11","35","13"],"g":"1×2⁴ + 0×2³ + 0×2² + 1×2¹ + 1×2⁰ = 16 + 2 + 1 = 19."},{"m":"VD","q":"Số nhị phân 1101 có giá trị thập phân là","o":["13","11","9","15"],"g":"8 + 4 + 0 + 1 = 13 (chính là kết quả 6 + 7 ở Hình 4.9)."},{"m":"VD","q":"Hai máy tính giống nhau, chỉ khác CPU: máy A 2,4 GHz, máy B 3,6 GHz (cùng số lõi). Nhận định nào hợp lí?","o":["Máy B có tần số xung cao hơn","Máy A có dung lượng nhớ lớn hơn","Máy B có ổ cứng lớn hơn","Hai máy xử lí nhanh như nhau"],"g":"Tốc độ CPU thường đánh giá bằng tần số đồng hồ xung (GHz); 3,6 GHz cao hơn 2,4 GHz."},{"m":"VD","q":"Lan đang soạn văn bản thì mất điện, máy tắt, chưa kịp lưu. Phần văn bản mới gõ bị mất vì","o":["chỉ đang nằm trong RAM","đã được ghi vào ROM","nằm trên đĩa cứng","đã lưu lên đám mây"],"g":"Dữ liệu đang chạy nằm trong RAM — không giữ được khi mất nguồn; muốn giữ phải lưu ra bộ nhớ ngoài."},{"m":"VD","q":"Minh cần lưu kho ảnh, video dung lượng vài TB, giá rẻ. Thiết bị phù hợp là","o":["Bộ nhớ ngoài như đĩa cứng","Thêm thanh RAM","Bộ nhớ ROM","Bộ nhớ đệm cache"],"g":"SGK: bộ nhớ ngoài lưu dữ liệu lâu dài, không cần nguồn nuôi, giá rẻ hơn RAM, dung lượng lớn (cỡ TB)."},{"m":"VD","q":"Máy tính mở phần mềm chậm vì ổ đĩa là đĩa cứng điện cơ. Nâng cấp nào giúp truy cập dữ liệu nhanh hơn?","o":["Thay bằng đĩa thể rắn SSD","Thay bằng đĩa quang DVD","Thêm bảng mạch cổng USB","Thay màn hình độ phân giải cao"],"g":"SGK: đĩa cứng là thiết bị điện cơ, truy cập chậm hơn nhiều so với SSD."},{"m":"VD","q":"Trong Hình 4.2, thiết bị a) có chữ “intel CORE i9” là","o":["bộ xử lí trung tâm CPU","thanh bộ nhớ RAM","đĩa cứng 1 TB","bảng mạch mở rộng"],"g":"Hình 4.2: a) CPU; b) đĩa cứng; c) thanh RAM; d) bảng mạch mở rộng (cổng USB)."},{"m":"VD","q":"Trong Hình 4.2, thanh dài, mỏng, có hàng chip nhỏ (hình c) là","o":["thanh RAM","bộ xử lí","đĩa cứng", q":"Mục đích chính của công việc quản lí là gì?","a":"<b>Xử lí thông tin<\/b> để <b>đưa ra quyết định<\/b>."},{"q":"Kể <b>2 ví dụ<\/b> thu thập dữ liệu <b>tự động<\/b>. Lợi ích là gì?","a":"Quét <b>mã vạch<\/b> ở quầy thu ngân; <b>công tơ điện tử<\/b> gửi chỉ số về điện lực. Lợi ích: <b>giảm công sức<\/b>, có khối dữ liệu lớn giúp ra quyết định."},{"q":"<i>Tình huống:<\/i> Phân loại các việc sau là <b>cập nhật<\/b> hay <b>khai thác<\/b>: (a) sửa tên ghi nhầm (b) thống kê tỉ lệ HS Giỏi (c) xoá điểm 0 của bạn nghỉ có lí do.","a":"(a) <b>cập nhật<\/b>; (b) <b>khai thác thông tin<\/b> (thống kê); (c) <b>cập nhật<\/b>."},{"q":"<i>Thử thách:<\/i> Thư viện trường quản lí sách bằng sổ ghi tay. Nêu <b>3 lợi ích<\/b> khi chuyển sang dùng CSDL.","a":"Gợi ý: tìm kiếm, <b>truy xuất nhanh<\/b>; <b>không dư thừa<\/b>, nhất quán (sửa một nơi); <b>thống kê<\/b> sách mượn nhiều; bảo mật, <b>sao lưu<\/b> được; thu thập tự động bằng mã vạch. (Hợp lí là đúng.)"}],"mcq":[{"m":"TH","q":"Cập nhật dữ liệu gồm các thao tác","o":["thêm, xoá, sửa dữ liệu","tìm kiếm, sắp xếp, lọc","thống kê, phân tích","in ấn, trình chiếu"],"g":"Cập nhật: thêm, xoá, sửa."},{"m":"TH","q":"Lọc danh sách học sinh có điểm từ 8 trở lên thuộc công việc","o":["truy xuất dữ liệu","cập nhật dữ liệu","thu thập dữ liệu","sao lưu dữ liệu"],"g":"Truy xuất: tìm kiếm, sắp xếp, lọc theo tiêu chí."},{"m":"VD","q":"Tính tỉ lệ học sinh Giỏi, Khá của lớp thuộc công việc","o":["khai thác thông tin","cập nhật dữ liệu","nhập dữ liệu","xoá dữ liệu"],"g":"Khai thác: thống kê, phân tích, tính toán."},{"m":"NB","q":"Ví dụ nào là thu thập dữ liệu tự động?","o":["Quét mã vạch ở siêu thị","Viết sổ điểm bằng tay","Gõ danh sách lớp từ giấy","Đọc tên điểm danh"],"g":"Mã vạch, công tơ điện tử, IoT… thu thập tự động."},{"m":"TH","q":"Công việc quan trọng hàng đầu trong bài toán quản lí là","o":["lưu trữ dữ liệu","in báo cáo màu","trang trí giao diện","chọn phông chữ"],"g":"Quản lí là xử lí thông tin để ra quyết định → lưu trữ dữ liệu là hàng đầu."},{"m":"VD","q":"Thư viện sửa lại tên một cuốn sách bị ghi nhầm trong hệ thống. Đây là thao tác","o":["cập nhật dữ liệu","truy xuất dữ liệu","khai thác thông tin","sao lưu dữ liệu"],"g":"Sửa dữ liệu là cập nhật."}],"tf":[{"q":"Cửa hàng văn phòng phẩm của trường quản lí hàng bằng máy tính.","y":["Nhập thêm mặt hàng mới là cập nhật dữ liệu.","Xem danh sách mặt hàng sắp hết là truy xuất dữ liệu.","Thống kê mặt hàng bán chạy nhất tháng là cập nhật dữ liệu.","Máy quét mã vạch giúp thu thập dữ liệu bán hàng tự động."],"d":[true,true,false,true],"g":["Thêm dữ liệu.","Lọc theo tiêu chí.","Là khai thác thông tin.","Thu thập tự động."]}],"td":[{"m":"NB","q":"Việc thêm, xoá, chỉnh sửa dữ liệu được gọi chung là gì?","o":["Cập nhật dữ liệu","Truy xuất dữ liệu","Khai thác dữ liệu","Thu thập tự động"],"g":"SGK: việc thêm, xoá và chỉnh sửa dữ liệu được gọi chung là cập nhật dữ liệu."},{"m":"NB","q":"Việc tìm kiếm, sắp xếp hay lọc dữ liệu theo tiêu chí nào đó được gọi là gì?","o":["Truy xuất dữ liệu","Cập nhật dữ liệu","Lưu trữ dữ liệu","Sao lưu dữ liệu"],"g":"SGK: việc tìm kiếm, sắp xếp hay lọc ra các dữ liệu theo tiêu chí thường được gọi là truy xuất dữ liệu."},{"m":"NB","q":"Việc phân tích, thống kê, tính toán từ dữ liệu đã có để được thông tin cần thiết gọi là gì?","o":["Khai thác thông tin","Cập nhật dữ liệu","Nhập dữ liệu","Xoá dữ liệu"],"g":"SGK: những công việc như lập bảng phân loại kết quả học tập… được gọi là khai thác thông tin từ dữ liệu đã có."},{"m":"NB","q":"Việc ghi điểm vào sổ điểm mỗi khi có đánh giá được gọi là gì?","o":["Lưu trữ dữ liệu điểm","Truy xuất dữ liệu điểm","Thống kê dữ liệu điểm","Phân loại dữ liệu điểm"],"g":"SGK: việc ghi chép này là gọi là lưu trữ dữ liệu điểm."},{"m":"NB","q":"Mục đích chính của quản lí là gì?","o":["Xử lí thông tin, ra quyết định","Lưu thật nhiều dữ liệu","Nhập dữ liệu thủ công","In báo cáo hằng ngày"],"g":"SGK: mục đích chính của quản lí là xử lí thông tin để đưa ra các quyết định."},{"m":"NB","q":"Lĩnh vực khoa học liên ngành áp, dòng điện","Họ tên, ngày sinh các thành viên","Số thiết bị điện trong nhà","Giờ đi ngủ của chủ nhà"],"g":"SGK: không chỉ lượng điện tiêu thụ mà còn giá trị tức thời của điện áp, dòng, tần số, độ lệch pha."},{"m":"TH","q":"Vì sao việc thu thập, lưu trữ dữ liệu có ý nghĩa hàng đầu với quản lí?","o":["Quyết định dựa trên thông tin","Vì dữ liệu càng nhiều càng đẹp","Vì luật bắt buộc lưu mọi thứ","Vì máy tính cần dữ liệu để chạy"],"g":"SGK: mục đích chính của quản lí là xử lí thông tin để ra quyết định; vì vậy thu thập, lưu trữ dữ liệu quan trọng hàng đầu."},{"m":"TH","q":"Ngoài giảm công sức, thu thập dữ liệu tự động còn mang lại lợi ích gì?","o":["Có nhiều dữ liệu để quyết định","Dữ liệu không bao giờ cần cập nhật","Không cần lưu dữ liệu vào máy","Không cần người quản lí nữa"],"g":"SGK: không chỉ giảm công sức mà còn cung cấp khối lượng dữ liệu lớn giúp nâng cao hiệu quả ra quyết định."},{"m":"TH","q":"Trung tâm dự báo thời tiết cần lưu trữ dữ liệu gì?","o":["Nhiệt độ, độ ẩm, gió","Khách hàng gửi tiền mỗi ngày","Hồ sơ bệnh án của bệnh nhân","Điểm đánh giá của học sinh"],"g":"SGK: ở trung tâm dự báo thời tiết là dữ liệu về nhiệt độ, độ ẩm, hướng và cường độ gió."},{"m":"TH","q":"Với nhân viên điện lực, công tơ điện tử giúp giảm bớt việc gì?","o":["Ghi số thủ công hằng tháng","Sửa chữa đường dây điện","Lắp đặt công tơ mới","Tư vấn khách hàng"],"g":"SGK: nhân viên không cần ghi số thủ công hằng tháng rồi nhập vào máy tính, giảm công sức làm hoá đơn."},{"m":"TH","q":"Câu nào đúng về bài toán quản lí?","o":["Phổ biến, cần lưu trữ dữ liệu","Chỉ có trong trường học","Không cần dùng dữ liệu","Chỉ làm được bằng tay"],"g":"SGK: bài toán quản lí phổ biến trong thực tế, cần tổ chức lưu trữ dữ liệu phục vụ yêu cầu quản lí đa dạng."},{"m":"VD","q":"Theo Bảng 10.2, có bao nhiêu học sinh có điểm cuối kì từ 7 trở lên?","o":["3","2","4","5"],"g":"Điểm cuối kì: Hoàng Anh 8, Việt Anh 5, Kì Duyên 9, Quý Dương 6, Hồng Dương 7 → 8, 9, 7: có 3 em."},{"m":"VD","q":"Theo Bảng 10.2, có bao nhiêu học sinh có điểm cuối kì từ 8 trở lên?","o":["2","3","1","4"],"g":"8 (Hoàng Anh) và 9 (Kì Duyên): 2 em."},{"m":"VD","q":"Sắp xếp Bảng 10.2 theo điểm cuối kì từ cao xuống thấp, ai đứng đầu?","o":["Nguyễn Kì Duyên","Dương Hoàng Anh","Đỗ Hồng Dương","Bùi Quý Dương"],"g":"Điểm cuối kì cao nhất là 9 của Nguyễn Kì Duyên."},{"m":"VD","q":"Theo Hình 10.1, điểm cuối kì môn Tin học của Lương Việt Anh là","o":["6","10","5","8"],"g":"Bảng ĐĐG các môn cuối học kì I: Lương Việt Anh — Toán 5, Tin học 6, Vật lí 6…"},{"m":"VD","q":"Bảng 10.3 có 8 học sinh Giỏi chiếm 20%. Lớp có bao nhiêu học sinh?","o":["40","28","32","48"],"g":"8 : 20% = 40 (kiểm tra: 16 Khá = 40%, 16 Trung bình = 40%)."},{"m":"VD","q":"Thư viện trường muốn quản lí việc mượn, trả sách. Dữ liệu cần thu thập là","o":["Sách, bạn đọc, ngày mượn – trả","Điểm các môn của bạn đọc","Màu bìa của từng cuốn sách","Nhiệt độ phòng đọc mỗi ngày"],"g":"Luyện tập 1: nhu cầu quản lí khác trong trường (thư viện) cần dữ liệu về sách, bạn đọc, mượn – trả."},{"m":"VD","q":"Phòng y tế trường muốn theo dõi sức khoẻ học sinh. Hoạt động này cần dữ liệu nào?","o":["Chiều cao, cân nặng, lần khám","Số sách đã mượn ở thư viện","Điểm thi đua của lớp","Lịch trực nhật của lớp"],"g":"Luyện tập 1: mỗi hoạt động quản lí cần dữ liệu riêng phù hợp mục đích."},{"m":"VD","q":"Hệ thống bán vé tàu xe cần quản lí những dữ liệu nào?","o":["Chuyến, chỗ ngồi, vé, khách","Điểm thi của hành khách","Màu sơn của toa tàu","Sở thích ăn uống của khách"],"g":"SGK: quản lí chỗ ngồi trên chuyến bay, tàu xe tại phòng bán vé là bài toán quản lí."},{"m":"VD","q":"Ở trạm xăng, dữ liệu lượng xăng bán và doanh thu được thu thập thế nào?","o":["Cột bơm tự ghi, gửi về máy tính","Nhân viên ước lượng bằng mắt","Khách tự ghi vào sổ giấy","Chỉ tính vào cuối năm"],"g":"Vận dụng 2: cột bơm xăng điện tử tự đo lượng xăng, số tiền và gửi về hệ thống — thu thập tự động."},{"m":"VD","q":"Cửa hàng tạp hoá muốn biết mặt hàng nào bán chạy nhất tháng. Cửa hàng cần","o":["Lưu dữ liệu bán  cập hay cập nhật dữ liệu."},{"m":"VD","q":"Có cần lưu cột điểm trung bình trong bảng điểm môn học trên máy tính không (Luyện tập 1)?","o":["Không, vì tính được từ điểm đã có","Có, vì máy tính không tính được trung bình","Có, để tăng dung lượng dữ liệu","Không, vì điểm trung bình luôn bằng 10"],"g":"Luyện tập 1: điểm trung bình suy ra được từ dữ liệu đã có; lưu thêm gây dư thừa, có thể không nhất quán."},{"m":"VD","q":"Phần mềm nhập điểm từ chối giá trị 11. Phần mềm đang đảm bảo tính gì?","o":["Tính toàn vẹn","Tính độc lập","Tính cấu trúc","Tính không dư thừa"],"g":"Ràng buộc điểm không âm, không lớn hơn 10 — tính toàn vẹn."},{"m":"VD","q":"Phần mềm không cho nhập điểm âm như −2. Đây là ràng buộc của tính nào?","o":["Tính toàn vẹn","Tính nhất quán","Tính bảo mật","Tính độc lập"],"g":"SGK: điểm phải là số không âm và nhỏ hơn hoặc bằng 10 — tính toàn vẹn."},{"m":"VD","q":"Học sinh không đăng nhập được vào trang sửa điểm của giáo viên. Hệ thống đang đảm bảo","o":["tính bảo mật","tính cấu trúc","tính độc lập","tính không dư thừa"],"g":"Không phải ai cũng có quyền cập nhật dữ liệu — tính bảo mật và an toàn."},{"m":"VD","q":"Thư viện cần quản lí dữ liệu nào (Vận dụng)?","o":["Sách, bạn đọc, phiếu mượn trả","Điểm thi tốt nghiệp của bạn đọc","Lịch dạy của giáo viên","Màu sơn tường phòng đọc"],"g":"Vận dụng: thư viện cần dữ liệu về sách (mã, tên, tác giả…), bạn đọc, việc mượn – trả."},{"m":"VD","q":"Nhà trường đổi phần mềm xem điểm từ máy tính sang ứng dụng điện thoại mà không phải sửa CSDL. Điều này thể hiện","o":["tính độc lập dữ liệu","tính toàn vẹn dữ liệu","tính không dư thừa","tính nhất quán"],"g":"Luyện tập 2: dữ liệu độc lập với phần mềm khai thác — nhiều ứng dụng dùng chung một CSDL."},{"m":"VD","q":"Lớp lưu số điện thoại phụ huynh ở 3 bảng khác nhau. Một phụ huynh đổi số, cô chỉ sửa 1 bảng. Hậu quả là","o":["Các bảng không còn khớp nhau","Số điện thoại được bảo mật hơn","Dữ liệu có cấu trúc tốt hơn","Bảng dữ liệu nhỏ gọn hơn"],"g":"Dư thừa dữ liệu dẫn tới không nhất quán khi cập nhật sót."},{"m":"VD","q":"Để tránh tình huống ở câu trước, cách tổ chức hợp lí là","o":["Lưu số điện thoại ở một nơi duy nhất","Lưu thêm bảng thứ tư cho chắc","In ra giấy để đối chiếu","Không lưu số điện thoại nữa"],"g":"Tính không dư thừa: hạn chế lưu trùng lặp, dữ liệu chỉ ở một nơi, nơi khác tham chiếu tới."},{"m":"VD","q":"Ngân hàng sao lưu dữ liệu hằng ngày ra máy chủ dự phòng. Việc này phục vụ tính gì?","o":["An toàn dữ liệu","Không dư thừa","Tính cấu trúc","Tính độc lập"],"g":"Dữ liệu phải được bảo vệ an toàn, có thể khôi phục dù xảy ra sự cố."},{"m":"VD","q":"Dòng “11A, 2, Lương Việt Anh, , 5, 6, 5, 5, 5” trong tệp bảng điểm môn học cho biết ĐĐG cuối kì của bạn này là","o":["5","6","2","11"],"g":"SGK: dòng gồm tên lớp, STT, họ tên, 4 ĐĐG thường xuyên, 1 ĐĐG giữa kì, 1 ĐĐG cuối kì; thành phần cuối là 5."},{"m":"VD","q":"Trong dòng “11A, 1, Dương Hồng Anh, 8, 7, , 7, 9, 8”, ĐĐG giữa kì là","o":["9","8","7","1"],"g":"Sau 4 ĐĐG thường xuyên (8, 7, trống, 7) là ĐĐG giữa kì 9, rồi cuối kì 8."},{"m":"VD","q":"Một CSDL quản lí học sinh lưu cả “ngày sinh” và “tuổi”. Nhận xét nào đúng?","o":["Cột tuổi dư thừa, suy ra được","Nên bỏ cột ngày sinh, giữ cột tuổi","Cả hai cột đều bắt buộc phải lưu","Cột tuổi giúp dữ liệu nhất quán hơn"],"g":"Tuổi tính được từ ngày sinh; lưu thêm gây dư thừa và mau sai theo thời gian."},{"m":"VD","q":"Bảng điểm có giá trị “tám” ở một ô, các ô khác là số. Đây là vấn đề gì?","o":["Ghi không thống nhất, khó tính","Dữ liệu được bảo mật tốt hơn","Dữ liệu trở nên độc lập hơn","Máy tính tự quy đổi chữ thành số"],"g":"SGK: điểm ghi bằng chữ hoặc kí hiệu riêng thay vì cột điểm bằng số gây không nhất quán, khó tính toán."},{"m":"VD","q":"Hai thu ngân cùng lúc bán chiếc điện thoại cuối cùng trong kho cho hai khách. CSDL cần cơ chế đảm bảo","o":["tính nhất quán","tính cấu trúc","tính độc lập","tính không dư thừa"],"g":"Tương tự ví dụ hai đại lí bán cùng một ghế máy bay — vi phạm tính nhất quán."},{"m":"VD","q":"Trong Hình 11.3, mô đun “ hai nơi"],"g":"CSDL độc lập, dùng chung cho nhiều ứng dụng: hạn chế dư thừa, dễ chia sẻ, dữ liệu nhất quán."},{"m":"VDC","q":"Khi đang chuyển tiền thì mất điện. Hệ thống tốt phải đảm bảo điều gì?","o":["Hoặc chuyển trọn vẹn, hoặc không trừ tiền","Trừ tiền trước, chuyển sau khi có điện","Chuyển tiền hai lần cho chắc chắn","Xoá giao dịch và xoá tài khoản"],"g":"SGK: dữ liệu phải đúng đắn sau cập nhật, kể cả khi xảy ra sự cố trong quá trình cập nhật (tính nhất quán)."},{"m":"VDC","q":"Vì sao CSDL được thiết kế để người dùng không cần biết chi tiết kĩ thuật lưu trữ?","o":["Phục vụ nhiều người, nhiều mục đích","Vì người dùng không được phép xem dữ liệu","Vì dữ liệu chỉ phục vụ một bài toán","Vì máy tính không lưu được chi tiết"],"g":"SGK: CSDL phục vụ nhiều người dùng với nhiều mục đích quản lí, không đòi hỏi họ biết chi tiết kĩ thuật."},{"m":"VDC","q":"Ví dụ nào minh hoạ đúng sự cần thiết lưu dữ liệu độc lập với phần mềm (Luyện tập 2)?","o":["Thêm cột, phần mềm cũ vẫn chạy","Sửa phần mềm mỗi khi thêm học sinh","Mỗi giáo viên giữ một tệp điểm riêng","Đổi dấu ngăn cách thì sửa mọi mô đun"],"g":"Khi dữ liệu độc lập, đổi cách lưu (thêm cột) không bắt các ứng dụng hiện có phải sửa."},{"m":"VDC","q":"Một thư viện lưu “tên tác giả” lặp lại ở mọi cuốn sách. Đổi cách viết tên tác giả sẽ gặp vấn đề gì và khắc phục ra sao?","o":["Sửa nhiều nơi; tách bảng tác giả","Không vấn đề; giữ nguyên cách lưu","Mất sách; in lại toàn bộ danh mục","Lộ dữ liệu; đặt mật khẩu cho bảng"],"g":"Dữ liệu lặp lại → dư thừa, dễ không nhất quán; tách tác giả ra lưu một nơi, sách tham chiếu tới."}],"db":[25,26,29,30,31,32,36,37,45,48,49,43],"noi":{"noi":"Đơn giản là điều kiện tiên quyết cho sự tin cậy.","tg":"Edsger W. Dijkstra — nhà khoa học máy tính","nguon":"Ghi chép EWD498, 1975","y":"Tổ chức dữ liệu gọn gàng, không dư thừa giúp mọi thứ chạy chính xác — học Tin cũng vậy."}},{"so":12,"cd":4,"ten":"Hệ quản trị cơ sở dữ liệu và hệ cơ sở dữ liệu","trang":"58–63","muctieu":["Hiểu được khái niệm hệ quản trị CSDL.","Hiểu được khái niệm hệ CSDL.","Phân biệt được CSDL tập trung và CSDL phân tán."],"muc":[{"t":"Hệ quản trị CSDL","icon":"⚙️","b":["Phần mềm giúp <b>lưu trữ, cập nhật, truy xuất<\/b> dữ liệu, bảo mật và an toàn CSDL.","4 nhóm chức năng: <b>định nghĩa dữ liệu · cập nhật và truy xuất · bảo mật, an toàn · giao diện lập trình ứng dụng<\/b>.","Ví dụ: MySQL, Oracle, SQL Server, PostgreSQL, SQLite."]},{"t":"Hệ cơ sở dữ liệu","icon":"🧱","b":["Gồm 3 thành phần: <b>CSDL + hệ QTCSDL + phần mềm ứng dụng CSDL<\/b>.","Mô hình “khách” (giao diện) – “chủ” (xử lí dữ liệu).","VD: tra cứu điểm thi, mua bán trực tuyến, đặt xe công nghệ."]},{"t":"CSDL tập trung và phân tán","icon":"🌐","b":["<b>Tập trung<\/b>: dữ liệu lưu trên một máy tính.","<b>Phân tán<\/b>: dữ liệu ở nhiều trạm trên mạng – dễ mở rộng, tin cậy cao.","Phân tán: thiết kế phức tạp, chi phí cao (Google, Facebook)."]}],"ghinho":"Hệ CSDL = CSDL + hệ QTCSDL + phần mềm ứng dụng; hệ QTCSDL là “bộ não” điều hành dữ liệu.","vandung":"Chỉ ra ba thành phần của hệ CSDL trong một ứng dụng em hay dùng.","the":[{"q":"Kể tên <b>3 hệ quản trị CSDL<\/b> phổ biến.","a":"Ví dụ: <b>Oracle<\/b>, <b>MySQL<\/b>, <b>SQL Server<\/b>, PostgreSQL, DB2, SQLite…"},{"q":"Một <b>hệ CSDL<\/b> gồm <b>3 thành phần<\/b> nào?","a":"<b>CSDL<\/b>, <b>hệ QTCSDL<\/b> và các <b>phần mềm ứng dụng CSDL<\/b>."},{"q":"Kể <b>3 nhóm chức năng<\/b> của hệ QTCSDL.","a":"<b>Định nghĩa<\/b> dữ liệu; <b>cập nhật và truy xuất<\/b> dữ liệu; <b>bảo mật, an toàn<\/b> CSDL; giao diện lập trình ứng dụng."},{"q":"Hệ CSDL <b>tập trung<\/b> khác hệ CSDL <b>phân tán<\/b> thế nào?","a":"Tập trung: CSDL lưu trên <b>một máy tính<\/b>. Phân tán: dữ liệu lưu ở <b>nhiều máy (trạm)<\/b> trên mạng."},{"q":"Nêu <b>2 ưu điểm<\/b> và <b>1 hạn chế<\/b> của hệ CSDL phân tán.","a":"Ưu: <b>dễ mở rộng<\/b>; <b>sẵn sàng, tin cậy<\/b> cao. Hạn chế: thiết kế phức tạp, khó đảm bảo nhất quán, bảo mật, <b>chi phí cao<\/b>."},{"q":"<i>Thử thách:<\/i> Ứng dụng <b>đặt xe công nghệ<\/b> trên điện thoại là thành phần nào của hệ CSDL? Mô tả nó làm việc với 2 thành phần còn lại thế nào.","a":"Là <b>phần mềm ứng dụng CSDL<\/b>: nhận yêu cầu của người dùng → gửi tới <b>hệ QTCSDL<\/b> → hệ QTCSDL lưu trữ, truy xuất <b>CSDL<\/b> (tài xế, chuyến đi…) → trả kết quả hiển thị cho người dùng."}],"mcq":[{"m":"NB","q":"Phần mềm nào sau đây là hệ quản trị CSDL?","o":["MySQL","Photoshop","Python IDLE","Inkscape"],"g":"VD: MySQL, Oracle, SQL Server, PostgreSQL, SQLite."},{"m":"NB","q":"Hệ CSDL gồm ba thành phần là","o":["CSDL, hệ QTCSDL, phần mềm ứng dụng CSDL","CSDL, máy in, mạng Internet","phần cứng, phần mềm, người dùng","bảng, trường, bản ghi"],"g":"Hệ CSDL = CSDL + hệ QTCSDL + phần mềm ứng dụng."},{"m":"TH","q":"Trong mô hình khách – chủ của hệ CSDL, phía “chủ” đảm nhiệm","o":["xử lí dữ liệu","hiển thị giao diện","nhận thao tác chuột","in kết quả ra giấy"],"g":"“Khách” là giao diện, “chủ” xử lí dữ liệu."},{"m":"TH","q":"Ưu điểm của CSDL phân tán so với CSDL tập trung là","o":["dễ mở rộng, độ tin cậy cao","thiết kế đơn giản, chi phí thấp","chỉ cần một máy tính","không cần mạng máy tính"],"g":"Phân tán: dễ mở rộng, tin cậy cao nhưng thiết kế phức tạp, chi phí cao."},{"m":"VD","q":"Ứng dụng đặt xe công nghệ trên điện thoại là ví dụ về","o":["phần mềm ứng dụng của một hệ CSDL","một hệ điều hành cho điện thoại","một phần mềm đồ hoạ chỉnh ảnh","một thiết bị lưu trữ dữ liệu ngoài"],"g":"VD hệ CSDL: tra cứu điểm thi, mua bán trực tuyến, đặt xe công nghệ."},{"m":"TH","q":"Nhóm chức năng nào KHÔNG thuộc hệ QTCSDL?","o":["Thiết kế ảnh quảng cáo","Định nghĩa dữ liệu","Cập nhật và truy xuất dữ liệu","Bảo mật, an toàn CSDL"],"g":"4 nhóm: định nghĩa · cập nhật và truy xuất · bảo mật, an toàn · giao diện lập trình."}],"tf":[{"q":"Em tra cứu điểm thi tốt nghiệp trên trang web của Sở GD&ĐT.","y":["Trang tra cứu là phần mềm ứng dụng của một hệ CSDL.","Hệ QTCSDL lo việc lưu trữ, truy xuất và bảo mật dữ liệu điểm.","Giao diện trang web là phía “chủ” trong mô hình khách – chủ.","CSDL phân tán luôn rẻ và dễ thiết kế hơn CSDL tập trung."],"d":[true,true,false,false],"g":["Theo SGK.","Chức năng hệ QTCSDL.","Giao diện là phía “khách”.","Phân tán thiết kế phức tạp, chi phí cao."]}],"td":[{"m":"NB","q":"Bộ phần mềm chuyên dụng hỗ trợ làm việc với CSDL được gọi là gì?","o":["Hệ quản trị CSDL","Hệ điều hành máy tính","Phần mềm soạn thảo văn bản","Trình duyệt web"],"g":"SGK: những bộ phần mềm chuyên dụng gọi là hệ quản trị cơ sở dữ liệu (hệ QTCSDL)."},{"m":"NB","q":"Khai báo CSDL, tạo lập, sửa đổi kiến trúc bên trong CSDL thuộc nhóm chức năng nào?","o":["Định nghĩa dữ liệu","Cập nhật dữ liệu","Truy xuất dữ liệu","Giao diện lập trình"],"g":"SGK: nhóm chức năng định nghĩa dữ liệu — khai báo CSDL, tạo lập, sửa đổi kiến trúc, cài đặt ràng buộc toàn vẹn."},{"m":"NB","q":"Thêm, xoá, sửa dữ liệu thuộc nhóm chức năng nào của hệ QTCSDL?","o":["Cập nhật và truy xuất","Định nghĩa dữ liệu","Bảo mật, an toàn","Giao diện lập trình"],"g":"SGK: nhóm chức năng cập nhật và truy xuất dữ liệu (thao tác dữ liệu)."},{"m":"NB","q":"Sao lưu dự phòng (backup) thuộc nhóm chức năng nào?","o":["Bảo mật, an toàn CSDL","Định nghĩa dữ liệu","Truy xuất dữ liệu","Giao diện lập trình"],"g":"SGK: hệ QTCSDL cung cấp phương tiện sao lưu dự phòng trong nhóm bảo mật, an toàn."},{"m":"NB","q":"Hệ QTCSDL nào sau đây được SGK nêu là phổ biến hiện nay?","o":["MySQL","Photoshop","Windows","Google Docs"],"g":"SGK: Oracle, MySQL, SQL Server, DB2, PostGreSQL, SQLite…"},{"m":"NB","q":"Một hệ CSDL gồm những thành phần nào?","o":["CSDL, hệ QTCSDL, phần mềm ứng dụng","CSDL, máy in, màn hình","Hệ điều hành, chuột, bàn phím","Trình duyệt, thư điện tử, mạng"],"g":"SGK: một hệ thống gồm ba thành phần CSDL, hệ QTCSDL và các phần mềm ứng dụng CSDL được gọi là một hệ CSDL."},{"m":"NB","q":"Trong mô hình hai thành phần, phần thực hiện tính toán, xử lí dữ liệu gọi là gì?","o":["Phần “chủ”","Phần “khách”","Phần giao diện","Phần ứng dụng"],"g":"SGK: thành phần có nhiệm vụ chính tính toán, xử lí dữ liệu được gọi là phần “chủ”."},{"m":"NB","q":"Hệ CSDL mà CSDL được lưu trữ trên một máy tính được gọi là gì?","o":["Hệ CSDL tập trung","Hệ CSDL phân tán","Hệ CSDL cục bộ","Hệ CSDL đám mây"],"g":"SGK: hệ CSDL mà CSDL được lưu trữ tập trung trên một máy tính được gọi là hệ CSDL tập trung."},{"m":"NB","q":"Ứng dụng chạy tại một trạm và chỉ dùng dữ liệu của trạm đó gọi là gì?","o":["Ứng dụng cục bộ","Ứng dụng toàn cục","Ứng dụng phân tán","Ứng dụng trực tuyến"],"g":"SGK: ứng dụng cục bộ chạy tại một trạm, chỉ sử dụng dữ liệu cục bộ của trạm đó."},{"m":"NB","q":"Ứng dụng chạy tại một trạm và dùng dữ liệu của ít nhất hai trạm gọi là gì?","o":["Ứng dụng toàn cục","Ứng dụng cục bộ","Ứng dụng đơn lẻ","Ứng dụng văn phòng"],"g":"SGK: ứng dụng toàn cục (ứng dụng phân tán) sử dụng dữ liệu của ít nhất hai trạm."},{"m":"TH","q":"Cài đặt ràng buộc toàn vẹn trong hệ QTCSDL nhằm mục đích gì?","o":["Kiểm soát dữ liệu đúng đắn","Làm dữ liệu hiển thị nhiều màu sắc hơn","Tăng dung lượng ổ cứng của máy chủ","Cho mọi người được xem dữ liệu"],"g":"SGK: nhiều hệ QTCSDL cho phép cài đặt các ràng buộc toàn vẹn để kiểm soát tính đúng đắn của dữ liệu."},{"m":"TH","q":"Vì sao dữ liệu trong CSDL cần được cập nhật theo thời gian?","o":["Thế giới thực biến động, có sai sót","Hệ QTCSDL tự xoá dữ liệu cũ","Để CSDL có thêm dung lượng","Để người dùng không truy xuất được"],"g":"SGK: do biến động của thế giới thực hoặc sai sót khi nhập, dữ liệu không còn đúng nữa."},{"m":"TH","q":"Khi nhiều người cùng truy cập, một người sửa còn người kia xoá bản ghi. Hệ QTCSDL cần chức năng gì?","o":["Kiểm soát giao dịch","Định nghĩa dữ liệu","Tạo lập CSDL mới","Sao chép giao diện"],"g":"SGK: hệ QTCSDL cần kiểm soát các giao dịch để đảm bảo tính nhất quán dữ liệu."},{"m":"TH","q":"Nhóm chức năng giao diện lập trình ứng dụng phục vụ chủ yếu cho ai?","o":["Nhà phát triển ứng dụng CSDL","Người chỉ đọc báo trên mạng","Người sửa chữa phần cứng","Người bán máy tính"],"g":"SGK: cung cấp cho nhà phát triển ứng dụng các phương thức, công cụ gửi truy vấn đến CSDL từ ứng dụng."},{"m":"TH","q":"Vì sao Microsoft Access ít được dùng cho ứng dụng phức tạp, trực tuyến?","o":["Có nhiều hạn chế về hiệu suất","Không lưu được dữ liệu dạng bảng","Không chạy được trên Windows","Chỉ dùng được trên điện thoại"],"g":"SGK: do nhiều hạn chế về hiệu suất, Access không được sử dụng cho các ứng dụng phức tạp, trực tuyến."},{"m":"TH","q":"Phần mềm “khách” trong mô hình hai thành phần làm nhiệm vụ gì?","o":["Giao tiếp người dùng, gửi yêu cầu","Lưu toàn bộ dữ liệu của CSDL trên máy chủ","Thực hiện mọi tính toán, xử lí dữ liệu","Sao lưu dữ liệu ra ổ cứng dự phòng"],"g":"SGK: phần mềm khách tổ chức giao diện với người dùng, kết nối, gửi yêu cầu đến phần chủ, nhận và hiển thị kết quả."},{"m":"TH","q":"Phần mềm ứng dụng CSDL là gì?","o":["Phần mềm khai thác dữ liệu qua hệ QTCSDL","Phần mềm thay thế hoàn toàn hệ QTCSDL","Phần mềm diệt virus cho máy chủ CSDL","Phần mềm soạn thảo văn bản thông thường"],"g":"SGK: phần mềm ứng dụng CSDL xây dựng tương tác với hệ QTCSDL nhằm hỗ trợ người dùng khai thác thông tin thuận tiện."},{"m":"TH","q":"Hệ QTCSDL và hệ CSDL khác nhau thế nào?","o":["Hệ QTCSDL là một thành phần của hệ CSDL","Hệ CSDL là một thành phần của hệ QTCSDL","Hai khái niệm này hoàn toàn trùng nhau","Hệ QTCSDL chính là phần mềm ứng dụng"],"g":"SGK: hệ CSDL gồm CSDL, hệ QTCSDL và các phần mềm ứng dụng CSDL."},{"m":"TH","q":"Một CSDL có thể có bao nhiêu phần mềm ứng dụng cùng khai thác?","o":["Nhiều phần mềm ứng dụng","Đúng một phần mềm ứng dụng","Không phần mềm ứng dụng nào","Tối đa hai phần mềm ứng dụng"],"g":"SGK: có thể có nhiều phần mềm ứng dụng CSDL với các mục tiêu khác nhau cùng truy xuất một CSDL (Hình 12.3)."},{"m":"TH","q":"Trong hệ CSDL tập trung một người dùng (như Access), người dùng đóng vai trò gì?","o":["Vừa thiết kế, vừa khai thác","Chỉ được xem, không được sửa dữ liệu","Chỉ quản trị máy chủ ở nước ngoài","Chỉ nhập liệu, không thiết kế"],"g":"SGK: người dùng vừa là người thiết kế, tạo lập, bảo trì CSDL, vừa viết phần mềm ứng dụng, vừa là người dùng đầu cuối."},{"m":"TH","q":"Hệ CSDL phân tán cho phép người dùng làm gì?","o":["Truy cập dữ liệu ở nhiều máy trên mạng","Chỉ dùng dữ liệu trên một máy duy nhất","Không cần mạng máy tính để kết nối","Không cần hệ QTCSDL tại các trạm"],"g":"SGK: hệ CSDL phân tán cho phép truy cập dữ liệu được lưu trữ ở nhiều máy tính khác nhau trên mạng máy tính."},{"m":"TH","q":"Nhược điểm của hệ CSDL phân tán so với tập trung là gì?","o":["Phức tạp, chi phí duy trì cao","Không mở rộng được khi thêm chi nhánh","Mất hết dữ liệu khi một trạm hỏng","Chỉ dùng được trong một phòng máy"],"g":"SGK: thiết kế, triển khai phức tạp, khó đảm bảo nhất quán và bảo mật, chi phí duy trì cao hơn."},{"m":"TH","q":"Ưu điểm của hệ CSDL phân tán là gì?","o":["Dễ mở rộng, tin cậy cao","Thiết kế đơn giản, chi phí rất thấp","Dễ đảm bảo nhất quán hơn tập trung","Không cần mạng máy tính"],"g":"SGK: dễ dàng mở rộng; tính sẵn sàng và độ tin cậy được nâng cao."},{"m":"TH","q":"Mô hình máy chủ tệp thuộc loại nào?","o":["CSDL tập trung, xử lí phân tán","CSDL phân tán, xử lí tập trung","CSDL phân tán, xử lí phân tán","Không phải mô hình CSDL"],"g":"SGK lưu ý: máy chủ tệp là ví dụ mô hình CSDL tập trung nhưng xử lí phân tán."},{"m":"TH","q":"Các chức năng của hệ QTCSDL được xây dựng theo hướng nào?","o":["Tổng quát, không phụ thuộc CSDL cụ thể","Riêng cho từng CSDL của một trường","Chỉ cho một ứng dụng duy nhất","Chỉ cho máy tính cá nhân"],"g":"SGK: các chức năng được xây dựng tổng quát, theo mô hình CSDL không phụ thuộc các CSDL và ứng dụng cụ thể."},{"m":"VD","q":"Em nhập số báo danh trên trang tra cứu điểm thi vào lớp 10 và nhận được điểm. Trang đó là","o":["phần mềm ứng dụng CSDL","hệ quản trị CSDL","chính CSDL điểm thi","hệ điều hành máy chủ"],"g":"SGK: khi tra cứu điểm thi, em tương tác với phần mềm ứng dụng CSDL; nó kết nối với hệ QTCSDL quản lí điểm thi."},{"m":"VD","q":"Ứng dụng đặt xe công nghệ trên điện thoại thuộc thành phần nào của hệ CSDL?","o":["Phần mềm ứng dụng CSDL","Hệ quản t ùng vừa thiết kế vừa khai thác → hệ CSDL tập trung."},{"m":"VD","q":"Công ty mở thêm chi nhánh Hải Phòng, chỉ cần thêm một trạm mà các trạm cũ vẫn chạy bình thường. Điều này thể hiện","o":["dễ mở rộng của CSDL phân tán","nhược điểm của CSDL phân tán","ưu điểm của CSDL tập trung","tính dư thừa dữ liệu"],"g":"SGK: CSDL phân tán dễ mở rộng, bổ sung trạm mà không ảnh hưởng các trạm đang hoạt động."},{"m":"VD","q":"Trạm Đà Nẵng gặp sự cố nhưng dữ liệu vẫn còn vì đã sao lưu ở trạm khác. Đây là ưu điểm nào?","o":["Tính sẵn sàng, độ tin cậy cao","Dễ thiết kế, chi phí thấp","Không cần mạng máy tính","Dữ liệu không cần bảo mật"],"g":"SGK: dữ liệu có thể được sao lưu nhiều bản đặt ở các trạm khác, hạn chế mất mát."},{"m":"VD","q":"Chọn hệ QTCSDL nguồn mở để lập trang web bán hàng của trường. Phương án phù hợp là","o":["MySQL","Microsoft Access","Photoshop","Windows"],"g":"MySQL là hệ QTCSDL phổ biến (Bài 3: nguồn mở) phù hợp ứng dụng trực tuyến; Access hạn chế hiệu suất."},{"m":"VD","q":"Hệ thống điểm danh bằng thẻ học sinh: thẻ quẹt ở cổng, dữ liệu lưu trên máy chủ trường, cô xem trên điện thoại. Phần mềm trên điện thoại của cô là","o":["phần mềm ứng dụng CSDL","hệ quản trị CSDL","cơ sở dữ liệu","thiết bị đọc thẻ"],"g":"Phần mềm cô dùng để khai thác thông tin từ CSDL là phần mềm ứng dụng CSDL."},{"m":"VD","q":"Mỗi đêm hệ thống ngân hàng tự sao chép dữ liệu sang máy chủ dự phòng. Đây là chức năng","o":["sao lưu dự phòng","định nghĩa dữ liệu","truy xuất dữ liệu","giao diện lập trình"],"g":"SGK: phương tiện sao lưu dự phòng (backup) để phòng sự cố mất dữ liệu và khôi phục khi cần."},{"m":"VD","q":"Lập trình viên viết ứng dụng tra cứu sách, gửi truy vấn đến CSDL thư viện. Họ dùng nhóm chức năng nào?","o":["Giao diện lập trình ứng dụng","Định nghĩa dữ liệu","Bảo mật, an toàn","Sao lưu dự phòng"],"g":"SGK: nhóm giao diện lập trình ứng dụng cung cấp phương thức, công cụ để gửi truy vấn từ ứng dụng."},{"m":"VDC","q":"Nếu không có hệ QTCSDL, khó khăn lớn nhất khi khai thác CSDL là gì? ược mô hình CSDL quan hệ.","Hiểu các thuật ngữ, khái niệm: bản ghi, trường (thuộc tính), khoá, khoá chính, khoá ngoài, liên kết dữ liệu."],"muc":[{"t":"Khái niệm CSDL quan hệ","icon":"📋","b":["Do <b>E. F. Codd<\/b> đề xuất từ những năm 1970.","Lưu dữ liệu dưới dạng <b>các bảng có quan hệ với nhau<\/b>."]},{"t":"Bản ghi, trường","icon":"🧾","b":["<b>Bản ghi<\/b> (record): mỗi hàng – thông tin một đối tượng.","<b>Trường<\/b> (field): mỗi cột – một thuộc tính.","Mỗi trường có <b>kiểu dữ liệu<\/b>: số, xâu, lôgic, ngày tháng…"]},{"t":"Khoá chính, khoá ngoài","icon":"🔑","b":["<b>Khoá<\/b>: xác định duy nhất một bản ghi.","<b>Khoá chính<\/b>: khoá được chọn, thường ít trường nhất.","<b>Khoá ngoài<\/b>: trường của bảng A là khoá chính của bảng B."]},{"t":"Liên kết dữ liệu","icon":"🔗","b":["Dùng khoá ngoài ghép nối 2 bảng (<b>join<\/b>).","Tách bảng → tránh lặp dữ liệu, sửa một lần, dữ liệu nhất quán."]}],"ghinho":"CSDL quan hệ = các bảng liên kết qua khoá: khoá chính để phân biệt, khoá ngoài để kết nối.","vandung":"Xác định khoá chính, khoá ngoài cho CSDL quản lí điểm thi tốt nghiệp.","the":[{"q":"Ai đề xuất mô hình <b>CSDL quan hệ<\/b>, vào khoảng thời gian nào?","a":"<b>Edgar Frank Codd<\/b>, những năm <b>1970<\/b>."},{"q":"Trong một bảng, mỗi <b>hàng<\/b> và mỗi <b>cột<\/b> gọi là gì?","a":"Hàng: <b>bản ghi<\/b> (record). Cột: <b>trường<\/b> (field)."},{"q":"<b>Khoá<\/b> của một bảng là gì?","a":"Trường (nhóm trường) có giá trị <b>không trùng nhau<\/b> ở các bản ghi — xác định <b>duy nhất<\/b> một bản ghi."},{"q":"<b>Khoá ngoài<\/b> là gì? Dùng để làm gì?","a":"Trường của bảng A là <b>khoá chính ở bảng B<\/b>. Dùng để <b>liên kết<\/b> (join) dữ liệu hai bảng."},{"q":"<i>Đúng hay Sai?<\/i><br>“Bảng Học sinh có thể chọn trường <b>Họ tên<\/b> làm khoá chính.”","a":"<b>Sai.<\/b> Họ tên có thể <b>trùng nhau<\/b>; nên chọn trường như <b>mã học sinh<\/b>."},{"q":"Vì sao khai báo <b>kiểu dữ liệu<\/b> cho từng trường?","a":"Để <b>hạn chế lãng phí<\/b> dung lượng và <b>kiểm soát t
