ào?","a":"<b>DDL<\/b> (định nghĩa dữ liệu), <b>DML<\/b> (thao tác dữ liệu), <b>DCL<\/b> (kiểm soát dữ liệu)."},{"q":"Câu truy vấn SQL kết thúc bằng dấu gì?","a":"Dấu chấm phẩy <b>;<\/b>"},{"q":"Hai câu truy vấn nào <b>cấp<\/b> và <b>thu hồi<\/b> quyền người dùng?","a":"<b>GRANT<\/b> (cấp quyền) và <b>REVOKE<\/b> (thu hồi quyền)."},{"q":"Kiểu <b>DATE<\/b> và <b>TIME<\/b> trong SQL viết theo dạng nào?","a":"DATE: <b>'YYYY-MM-DD'<\/b>. TIME: <b>'HH:MM:SS'<\/b>."},{"q":"<b>CHAR(n)<\/b> khác <b>VARCHAR(n)<\/b> thế nào?","a":"CHAR(n): xâu độ dài <b>cố định<\/b> n kí tự (thiếu thì thêm dấu cách). VARCHAR(n): độ dài <b>thay đổi<\/b>, không quá n kí tự."},{"q":"Câu truy vấn sau làm gì?<div class='code'>SELECT Mid, TenBN\n  FROM bannhac\n  WHERE Aid = 1\n  ORDER BY TenBN;<\/div>","a":"Lấy cột <b>Mid, TenBN<\/b> của các dòng có <b>Aid = 1<\/b> trong bảng bannhac, <b>sắp xếp<\/b> theo TenBN."},{"q":"Câu truy vấn sau làm gì?<div class='code'>DELETE FROM bannhac\n  WHERE Mid = '0005';<\/div>","a":"<b>Xoá<\/b> dòng có Mid = '0005' trong bảng <b>bannhac<\/b>."},{"q":"Câu truy vấn sau thuộc thành phần nào của SQL? Nó làm gì?<div class='code'>GRANT select\n  ON music.*\n  TO guest;<\/div>","a":"Thuộc <b>DCL<\/b>. Cấp quyền <b>SELECT<\/b> trên tất cả các bảng của CSDL music cho người dùng <b>guest<\/b>."},{"q":"Viết câu truy vấn đổi tên nhạc sĩ có <b>Aid = 6<\/b> trong bảng <b>nhacsi<\/b> thành <b>'Hoàng Hiệp'<\/b>.","a":"<div class='code'>UPDATE nhacsi\n  SET TenNS = 'Hoàng Hiệp'\n  WHERE Aid = 6;<\/div>"},{"q":"Viết câu truy vấn thêm 2 nhạc sĩ <b>(5, 'Phú Quang')<\/b> và <b>(6, 'Phan Huỳnh Điểu')<\/b> vào bảng <b>nhacsi<\/b>.","a":"<div class='code'>INSERT INTO nhacsi VALUES\n  (5, 'Phú Quang'),\n  (6, 'Phan Huỳnh Điểu');<\/div>"},{"q":"Bảng <b>diemtoan_11A<\/b> có cột <b>tb<\/b> (điểm trung bình Toán). Viết câu truy vấn tính <b>điểm trung bình cộng<\/b> của cả lớp.","a":"<div class='code'>SELECT AVG(tb)\n  FROM diemtoan_11A;<\/div>"},{"q":"<i>Thử thách:<\/i> Viết câu truy vấn lấy <b>tên bản nhạc<\/b> (bannhac.TenBN) kèm <b>tên nhạc sĩ<\/b> (nhacsi.TenNS), liên kết hai bảng theo <b>Aid<\/b>.","a":"<div class='code'>SELECT bannhac.TenBN,\n  nhacsi.TenNS\nFROM bannhac\n INNER JOIN nhacsi\n ON bannhac.Aid\n  = nhacsi.Aid;<\/div>"}],"mcq":[{"m":"NB","q":"Câu lệnh SQL dùng để tạo bảng là","o":["CREATE TABLE","SELECT","INSERT INTO","GRANT"],"g":"DDL: CREATE DATABASE, CREATE TABLE, ALTER TABLE."},{"m":"NB","q":"Câu lệnh SQL dùng để truy xuất dữ liệu là","o":["SELECT … FROM … WHERE","CREATE DATABASE … ;","ALTER TABLE … ADD …","REVOKE … ON … FROM"],"g":"DML: SELECT … FROM … WHERE … ORDER BY."},{"m":"TH","q":"Lệnh GRANT và REVOKE thuộc thành phần nào của SQL?","o":["DCL – kiểm soát quyền truy cập","DDL – định nghĩa dữ liệu","DML – thao tác dữ liệu","DQL – truy vấn dữ liệu"],"g":"DCL: GRANT cấp quyền, REVOKE thu hồi."},{"m":"VD","q":"Câu lệnh lấy họ tên học sinh có điểm Tin từ 8 trở lên là","o":["SELECT HoTen FROM HOCSINH WHERE DiemTin >= 8;","SELECT * HOCSINH WHERE DiemTin >= 8;","INSERT HoTen FROM HOCSINH WHERE DiemTin >= 8;","UPDATE HOCSINH SET HoTen WHERE DiemTin >= 8;"],"g":"Cú pháp SELECT … FROM … WHERE …;"},{"m":"TH","q":"Lợi ích chính của ngôn ngữ truy vấn so với lập trình theo thủ tục là","o":["chỉ cần viết muốn làm gì, hệ QTCSDL tự thực hiện","phải biết rõ cấu trúc tệp lưu dữ liệu","chỉ chạy được trên một máy tính","không cần hệ quản trị CSDL"],"g":"Truy vấn: chỉ viết muốn làm gì, hệ QTCSDL tự thực hiện."},{"m":"VD","q":"Muốn sửa điểm của học sinh mã HS05 thành 9, dùng lệnh","o":["UPDATE … SET … WHERE …","DELETE FROM … WHERE …","CREATE TABLE …","SELECT … ORDER BY …"],"g":"UPDATE … SET dùng để sửa dữ liệu."}],"tf":[{"q":"Cô giáo dùng SQL quản lí bảng DIEM(MaHS, Mon, Diem).","y":["Lệnh INSERT INTO dùng để thêm bản ghi mới.","Lệnh DELETE FROM DIEM WHERE MaHS = 'HS03'; xoá các bản ghi của HS03.","Mệnh đề ORDER BY dùng để lọc dữ liệu theo điều kiện.","Câu lệnh SQL kết thúc bằng dấu chấm phẩy “;”."],"d":[true,true,false,true],"g":["DML.","DELETE FROM … WHERE.","ORDER BY để sắp xếp; WHERE để lọc.","Theo SGK."]}],"td":[{"m":"NB","q":"SQL là viết tắt của cụm từ nào?","o":["Structured Query Language","Simple Question Language","System Quick Logic","Standard Queue List"],"g":"SGK: ngôn ngữ truy vấn định chuẩn cho CSDL quan hệ là SQL (Structured Query Language)."},{"m":"NB","q":"SQL được xây dựng từ những năm nào?","o":["1970","1990","2000","1950"],"g":"SGK: SQL được xây dựng từ những năm 1970."},{"m":"NB","q":"Thành phần DDL của SQL là ngôn ngữ gì?","o":["Định nghĩa dữ liệu","Thao tác dữ liệu","Kiểm soát dữ liệu","Trình bày dữ liệu"],"g":"SGK: DDL (Data Definition Language) – ngôn ngữ định nghĩa dữ liệu."},{"m":"NB","q":"Thành phần DML của SQL là ngôn ngữ gì?","o":["Thao tác dữ liệu","Định nghĩa dữ liệu","Kiểm soát dữ liệu","Đánh dấu dữ liệu"],"g":"SGK: DML (Data Manipulation Language) – ngôn ngữ thao tác dữ liệu."},{"m":"NB","q":"Câu truy vấn nào dùng để khởi tạo CSDL?","o":["CREATE DATABASE","CREATE TABLE","ALTER TABLE","INSERT INTO"],"g":"Bảng 14.1: CREATE DATABASE — khởi tạo CSDL."},{"m":"NB","q":"Câu truy vấn ALTER TABLE có ý nghĩa gì?","o":["Thay đổi định nghĩa bảng","Khởi tạo bảng mới","Xoá dữ liệu trong bảng","Thêm dữ liệu vào bảng"],"g":"Bảng 14.1: ALTER TABLE — thay đổi định nghĩa bảng."},{"m":"NB","q":"Kiểu dữ liệu nào là xâu kí tự có độ dài cố định n kí tự?","o":["CHAR(n)","VARCHAR(n)","INT","BOOLEAN"],"g":"Bảng 14.2: CHAR(n) — xâu có độ dài cố định n; thiếu thì thêm dấu cách bên phải."},{"m":"NB","q":"Kiểu DATE trong SQL có dạng nào?","o":["'YYYY-MM-DD'","'DD/MM/YYYY'","'HH:MM:SS'","'MM-DD-YY'"],"g":"Bảng 14.2: DATE — ngày tháng, dạng 'YYYY-MM-DD'."},{"m":"NB","q":"Câu truy vấn nào cấp quyền cho người dùng?","o":["GRANT","REVOKE","DELETE","UPDATE"],"g":"Bảng 14.5: GRANT — cấp quyền; REVOKE — thu hồi quyền."},{"m":"NB","q":"Dấu nào được dùng để kết thúc câu truy vấn SQL trong ví dụ của SGK?","o":["Dấu chấm phẩy ;","Dấu chấm .","Dấu phẩy ,","Dấu hai chấm :"],"g":"SGK: các dấu chấm phẩy “;” được dùng để kết thúc câu truy vấn."},{"m":"TH","q":"Khác biệt cơ bản khi dùng ngôn ngữ truy vấn so với lập trình trực tiếp là gì?","o":["Chỉ nêu muốn gì, hệ QTCSDL tự làm","Phải biết rõ cấu trúc tệp dữ liệu","Phải viết lại chương trình mỗi lần","Chỉ chạy được trên một hệ QTCSDL"],"g":"SGK: với truy vấn, người dùng chỉ viết yêu cầu muốn làm gì, mọi việc còn lại do hệ QTCSDL giải quyết."},{"m":"TH","q":"Vì sao lập trình “theo thủ tục” để truy xuất dữ liệu mất công sức?","o":["Phải biết cấu trúc tệp, dễ nhầm lẫn","Máy tính không đọc được tệp","Ngôn ngữ lập trình không có biến","Không lưu được kết quả ra màn hình"],"g":"SGK: người dùng phải biết rõ cấu trúc tệp, lập trình lấy từng đoạn dữ liệu, rất mất công sức, dễ nhầm lẫn."},{"m":"TH","q":"Vì sao có thể dùng SQL trên Oracle, SQL Server, MySQL, PostgreSQL?","o":["SQL là ngôn ngữ truy vấn tiêu chuẩn","Các hệ này do một hãng làm ra","SQL tự cài vào mọi máy tính","Các hệ này đều là nguồn mở"],"g":"SGK: SQL đã trở thành ngôn ngữ truy vấn tiêu chuẩn mà hầu hết các hệ QTCSDL đều sử dụng."},{"m":"TH","q":"Kiểu VARCHAR(n) khác CHAR(n) ở điểm nào?","o":["Độ dài thay đổi, không quá n","Độ dài luôn đúng bằng n","Chỉ chứa được chữ số","Chỉ có hai giá trị 0 và 1"],"g":"Bảng 14.2: VARCHAR(n) — xâu có độ dài thay đổi, không vượt quá n kí tự."},{"m":"TH","q":"Mệnh đề WHERE trong câu SELECT có tác dụng gì?","o":["Chỉ chọn các dòng thoả điều kiện","Sắp xếp các dòng kết quả","Liên kết các bảng với nhau","Chọn tên bảng cần lấy"],"g":"Bảng 14.3: WHERE — chỉ định chọn chỉ các dòng thoả mãn điều kiện xác định."},{"m":"TH","q":"Mệnh đề ORDER BY trong câu SELECT có tác dụng gì?","o":["Sắp xếp các dòng kết quả","Lọc các dòng theo điều kiện","Xoá các dòng trùng nhau","Đổi tên các cột kết quả"],"g":"Bảng 14.3: ORDER BY — sắp xếp các dòng kết quả theo thứ tự chỉ định."},{"m":"TH","q":"INNER JOIN trong câu SELECT dùng để làm gì?","o":["Liên kết các bảng theo điều kiện","Thêm dòng mới vào bảng","Cấp quyền cho người dùng","Tạo bảng mới trong CSDL"],"g":"Bảng 14.3: INNER JOIN — liên kết các bảng theo điều kiện."},{"m":"TH","q":"Câu INSERT INTO ... VALUES ... thuộc thành phần nào của SQL?","o":["DML","DDL","DCL","API"],"g":"SGK: thành phần DML cung cấp các câu truy vấn cập nhật và truy xuất dữ liệu."},{"m":"TH","q":"Câu CREATE TABLE thuộc thành phần nào của SQL?","o":["DDL","DML","DCL","CSS"],"g":"SGK: thành phần DDL cung cấp các câu truy vấn khởi tạo CSDL, khởi tạo bảng, thiết lập các khoá."},{"m":"TH","q":"Câu REVOKE thuộc thành phần nào của SQL?","o":["DCL","DDL","DML","XML"],"g":"SGK: thành phần DCL cung cấp các câu truy vấn kiểm soát quyền người dùng (GRANT, REVOKE)."},{"m":"TH","q":"Câu SELECT AVG(tb) FROM diemtoan_11A; trả về gì?","o":["Trung bình cộng cột tb","Tổng các giá trị cột tb","Giá trị lớn nhất cột tb","Số dòng của bảng"],"g":"SGK: câu truy vấn lấy ra điểm trung bình cộng môn Toán của tất cả học sinh lớp 11A."},{"m":"TH","q":"Khai báo khoá ngoài trong SQL dùng mẫu nào?","o":["FOREIGN KEY ... REFERENCES ...","PRIMARY KEY ...","ALTER TABLE ... ADD","GRANT ... ON ..."],"g":"Bảng 14.1: FOREIGN KEY… REFERENCES… — khai báo khoá ngoài."},{"m":"TH","q":"Kiểu BOOLEAN lưu loại giá trị nào?","o":["Đúng (1) hoặc Sai (0)","Số thực dấu phẩy động","Xâu tối đa 255 kí tự","Thời gian dạng giờ phút"],"g":"Bảng 14.2: BOOLEAN — kiểu lôgic có giá trị Đúng (1) hay Sai (0)."},{"m":"TH","q":"Câu UPDATE nhacsi SET TenNS = 'Hoàng Hiệp' WHERE Aid = 6; làm gì?","o":["Đổi TenNS ở dòng có Aid = 6","Thêm một nhạc sĩ có Aid = 6","Xoá nhạc sĩ có Aid = 6","Đổi Aid thành 6 ở mọi dòng"],"g":"SGK: thay đổi giá trị cột TenNS thành 'Hoàng Hiệp' ở dòng có cột Aid = 6 trong bảng nhacsi."},{"m":"TH","q":"Câu DELETE FROM bannhac WHERE Mid = '0005'; làm gì?","o":["Xoá dòng có Mid = '0005'","Xoá toàn bộ bảng bannhac","Xoá cột Mid khỏi bảng","Xoá bản nhạc đầu tiên"],"g":"SGK: xoá dòng có Mid = '0005' trong bảng bannhac."},{"m":"VD","q":"Câu truy vấn lấy tất cả các dòng của bảng nhacsi là","o":["SELECT * FROM nhacsi;","SELECT nhacsi FROM *;","GET ALL nhacsi;","SHOW TABLE nhacsi;"],"g":"Câu hỏi SGK: SELECT * FROM nhacsi; — dấu * chọn mọi cột."},{"m":"VD","q":"Câu nào thêm khoá chính Sid cho bảng casi?","o":["ALTER TABLE casi ADD PRIMARY KEY (Sid);","CREATE TABLE casi PRIMARY Sid;","INSERT INTO casi PRIMARY KEY Sid;","UPDATE casi SET PRIMARY KEY = Sid;"],"g":"Tương tự ví dụ ALTER TABLE bannhac ADD PRIMARY KEY (Mid);"},{"m":"VD","q":"Câu nào thêm dòng ('TK', 'Nguyễn Trung Kiên') vào bảng casi?","o":["INSERT INTO casi VALUES ('TK', 'Nguyễn Trung Kiên');","UPDATE casi VALUES ('TK', 'Nguyễn Trung Kiên');","ADD INTO casi ('TK', 'Nguyễn Trung Kiên');","SELECT casi VALUES ('TK', 'Nguyễn Trung Kiên');"],"g":"Bảng 14.4: INSERT INTO <tên bảng> VALUES <danh sách giá trị>."},{"m":"VD","q":"Câu nào cấp quyền UPDATE trên mọi bảng của CSDL music cho người dùng mod?","o":["GRANT update ON music.* TO mod;","REVOKE update ON music.* FROM mod;","GRANT update FROM music.* TO mod;","GIVE update ON music TO mod;"],"g":"Tương tự ví dụ GRANT select ON music.* TO guest;"},{"m":"VD","q":"Câu nào thu hồi quyền DELETE đối với bảng nhacsi trong CSDL music của người dùng mod?","o":["REVOKE delete ON music.nhacsi FROM mod;","GRANT delete ON music.nhacsi TO mod;","REVOKE delete FROM music.nhacsi ON mod;","DELETE REVOKE music.nhacsi mod;"],"g":"Tương tự ví dụ REVOKE create, alter ON music.bannhac FROM mod;"},{"m":"VD","q":"Kết quả của truy vấn SELECT TenBN FROM bannhac WHERE Aid = 2 ORDER BY TenBN; trên CSDL âm nhạc là","o":["Tiến về Hà Nội, Trường ca sông Lô","Trường ca sông Lô, Tiến về Hà Nội","Du kích sông Thao, Việt Nam quê hương tôi","Tình ca, Xa khơi"],"g":"Aid = 2 có hai bản nhạc; sắp xếp theo TenBN: “Tiến…” đứng trước “Trường…”."},{"m":"VD","q":"Truy vấn SELECT COUNT(*) FROM bannhac WHERE Aid = 1; cho kết quả là","o":["2","1","3","6"],"g":"Aid = 1 (Đỗ Nhuận) có 0001 Du kích sông Thao và 0005 Việt Nam quê hương tôi."},{"m":"VD","q":"Kết quả của SELECT TenNS FROM nhacsi WHERE Aid = 3; là","o":["Hoàng Việt","Văn Cao","Đỗ Nhuận","Nguyễn Tài Tuệ"],"g":"Bảng Nhạc sĩ: Aid 3 là Hoàng Việt."},{"m":"VD","q":"Câu nào lấy tên các bản nhạc cùng tên nhạc sĩ sáng tác?","o":["SELECT bannhac.TenBN, nhacsi.TenNS FROM bannhac INNER JOIN nhacsi ON bannhac.Aid = nhacsi.Aid;","SELECT bannhac.TenBN, nhacsi.TenNS FROM bannhac INNER JOIN nhacsi ON bannhac.Mid = nhacsi.Aid;","SELECT bannhac.TenBN, nhacsi.TenNS FROM bannhac, nhacsi ORDER BY nhacsi.TenNS;","SELECT bannhac.TenBN, nhacsi.TenNS FROM bannhac WHERE bannhac.Aid = nhacsi.TenNS;"],"g":"SGK: liên kết bannhac với nhacsi theo khoá Aid bằng INNER JOIN ... ON."},{"m":"VD","q":"Câu nào sắp xếp danh sách nhạc sĩ theo tên?","o":["SELECT * FROM nhacsi ORDER BY TenNS;","SELECT * FROM nhacsi WHERE TenNS;","SORT nhacsi BY TenNS;","UPDATE nhacsi ORDER BY TenNS;"],"g":"ORDER BY <tên trường> sắp xếp các dòng kết quả."},{"m":"VD","q":"Câu nào khởi tạo CSDL tên music?","o":["CREATE DATABASE music;","CREATE TABLE music;","NEW DATABASE music;","INSERT INTO music;"],"g":"SGK ví dụ: CREATE DATABASE music;"},{"m":"VD","q":"Khi khai báo bảng casi, trường TenCS tên ca sĩ dài không quá 64 kí tự nên dùng kiểu nào?","o":["VARCHAR(64)","CHAR(2)","INT","DATE"],"g":"Tên có độ dài thay đổi, tối đa 64 kí tự → VARCHAR(64) (như TenNS VARCHAR(64))."},{"m":"VD","q":"Trường Sid mã ca sĩ luôn đúng 2 kí tự như 'TK', 'LD' nên dùng kiểu nào?","o":["CHAR(2)","VARCHAR(128)","INT","BOOLEAN"],"g":"Xâu có độ dài cố định 2 kí tự → CHAR(2) (như Mid CHAR(4))."},{"m":"VD","q":"Câu nào xoá bản nhạc có tên 'Tình ca' khỏi bảng bannhac?","o":["DELETE FROM bannhac WHERE TenBN = 'Tình ca';","DELETE TenBN FROM bannhac = 'Tình ca';","REVOKE 'Tình ca' ON bannhac FROM TenBN;","UPDATE bannhac DELETE WHERE TenBN = 'Tình ca';"],"g":"Bảng 14.4: DELETE FROM <tên bảng> WHERE <điều kiện>."},{"m":"VD","q":"Sau khi chạy INSERT INTO nhacsi VALUES (5, 'Phú Quang'), (6, 'Phan Huỳnh Điểu'); bảng nhacsi có bao nhiêu dòng? Kết quả SELECT COUNT(*) là","o":["6","4","5","2"],"g":"Bảng có 4 nhạc sĩ, thêm 2 dòng → 6."},{"m":"VDC","q":"Câu nào tạo bảng banthuam gồm Mid CHAR(4), Sid CHAR(2) (Luyện tập 1)?","o":["CREATE TABLE banthuam (Mid CHAR(4), Sid CHAR(2));","CREATE DATABASE banthuam (Mid, Sid);","INSERT INTO banthuam (Mid CHAR(4), Sid CHAR(2));","ALTER TABLE banthuam Mid CHAR(4) Sid CHAR(2);"],"g":"CREATE TABLE <tên bảng> (<trường> <kiểu>, …);"},{"m":"VDC","q":"Câu nào khai báo Mid là khoá ngoài của bảng banthuam, tham chiếu bảng bannhac (Luyện tập 2)?","o":["ALTER TABLE banthuam ADD FOREIGN KEY (Mid) REFERENCES bannhac(Mid);","ALTER TABLE banthuam ADD PRIMARY KEY (Mid) REFERENCES bannhac;","CREATE FOREIGN KEY banthuam Mid TO bannhac;","GRANT FOREIGN KEY (Mid) ON bannhac TO banthuam;"],"g":"Bảng 14.1: FOREIGN KEY… REFERENCES… để khai báo khoá ngoài."},{"m":"VDC","q":"Truy vấn SELECT banthuam.Sid, bannhac.TenBN FROM banthuam INNER JOIN bannhac ON banthuam.Mid = bannhac.Mid WHERE banthuam.Mid = '0004'; cho kết quả là","o":["QH Xa khơi","TK Du kích sông Thao","TN Tình ca","LD Tiến về Hà Nội"],"g":"Bản thu âm 0004 do QH thể hiện; Mid 0004 là Xa khơi (theo Hình 13.1)."},{"m":"VDC","q":"Liên kết banthuam với casi theo Sid, kết quả SELECT COUNT(*) các bản thu âm của ca sĩ Trần Khánh là","o":["2","1","3","4"],"g":"Trần Khánh (TK) có bản thu 0001 và 0005."},{"m":"VDC","q":"Vận dụng: lấy Mid, Sid, TenBN, TenCS từ liên kết banthuam với bannhac và casi. Câu đúng là","o":["SELECT banthuam.Mid, banthuam.Sid, TenBN, TenCS FROM banthuam INNER JOIN bannhac ON banthuam.Mid = bannhac.Mid INNER JOIN casi ON banthuam.Sid = casi.Sid;","SELECT banthuam.Mid, banthuam.Sid, TenBN, TenCS FROM banthuam INNER JOIN bannhac ON banthuam.Sid = bannhac.Mid INNER JOIN casi ON banthuam.Mid = casi.Sid;","SELECT banthuam.Mid, banthuam.Sid, TenBN, TenCS FROM banthuam, bannhac, casi WHERE TenBN = TenCS AND banthuam.Mid = casi.Sid;","SELECT banthuam.Mid, banthuam.Sid, TenBN, TenCS FROM bannhac INNER JOIN casi ON bannhac.Aid = casi.Sid ORDER BY banthuam.Mid;"],"g":"Liên kết đúng khoá: banthuam.Mid = bannhac.Mid và banthuam.Sid = casi.Sid."},{"m":"VDC","q":"Sau khi chạy DELETE FROM bannhac WHERE Aid = 1; truy vấn SELECT COUNT(*) FROM bannhac; cho kết quả là","o":["4","5","6","2"],"g":"Aid = 1 có 2 bản nhạc bị xoá; còn 6 − 2 = 4."},{"m":"VDC","q":"Lập trình viên muốn lấy danh sách học sinh điểm Toán trên 8. Lợi thế khi dùng SQL so với tự lập trình là","o":["Chỉ đổi điều kiện truy vấn, không viết lại","Không cần dữ liệu điểm trong CSDL","Không cần biết bảng nào chứa điểm","SQL tự nhập điểm vào bảng"],"g":"SGK: với lập trình thủ tục, bài toán tương tự lại phải viết lại chương trình; với SQL chỉ cần viết yêu cầu mới."},{"m":"VDC","q":"Câu truy vấn nào lấy điểm cao nhất cột tb của bảng diemtoan_11A?","o":["SELECT MAX(tb) FROM diemtoan_11A;","SELECT AVG(tb) FROM diemtoan_11A;","SELECT tb FROM MAX(diemtoan_11A);","UPDATE diemtoan_11A SET MAX(tb);"],"g":"Tương tự hàm AVG trong SGK, MAX trả về giá trị lớn nhất của cột."},{"m":"VDC","q":"Ghép câu truy vấn với thành phần SQL: (1) GRANT; (2) ALTER TABLE; (3) UPDATE.","o":["1 – DCL; 2 – DDL; 3 – DML","1 – DDL; 2 – DML; 3 – DCL","1 – DML; 2 – DCL; 3 – DDL","1 – DCL; 2 – DML; 3 – DDL"],"g":"GRANT kiểm soát quyền (DCL); ALTER TABLE định nghĩa (DDL); UPDATE thao tác dữ liệu (DML)."},{"m":"VDC","q":"Câu nào cho người dùng guest chỉ được xem (SELECT) dữ liệu trong mọi bảng của CSDL music?","o":["GRANT select ON music.* TO guest;","GRANT all ON music.* TO guest;","REVOKE select ON music.* FROM guest;","GRANT update ON music.* TO guest;"],"g":"SGK ví dụ: cấp quyền dùng truy vấn SELECT đối với tất cả các bảng trong CSDL music cho người dùng guest."}],"db":[25,27,28,29,33,37,40,41,42,43,44,45],"noi":{"noi":"Cách tốt nhất để dự đoán tương lai là tạo ra nó.","tg":"Alan Kay — nhà khoa học máy tính","nguon":"Phát biểu tại cuộc họp ở Xerox PARC, 1971","y":"Viết được câu truy vấn đầu tiên là em đã bắt đầu tạo ra công cụ của riêng mình."}},{"so":15,"cd":4,"ten":"Bảo mật và an toàn hệ cơ sở dữ liệu","trang":"73–76","muctieu":["Hiểu được tầm quan trọng và một số biện pháp bảo vệ hệ CSDL."],"muc":[{"t":"Bảo mật hệ CSDL","icon":"🔒","b":["Xây dựng <b>chính sách bảo mật<\/b>: phân nhóm người dùng, mỗi nhóm một quyền.","VD web âm nhạc: guest (xem) · moderator (thêm) · master_mod (sửa, xoá) · admin.","Ý thức người dùng: giữ mật khẩu; theo dõi hệ thống, lưu <b>log file<\/b>; an ninh mạng."]},{"t":"Sự cố nguồn điện","icon":"⚡","b":["Không đủ công suất → xây dựng hệ thống điện đủ tải.","Quá tải → kiểm tra thường xuyên · mất điện đột ngột → <b>bộ lưu điện<\/b>."]},{"t":"Sự cố thiết bị lưu trữ","icon":"💽","b":["Hỏng do tuổi thọ → thay trước khi hết hạn dùng.","Hỏng bất ngờ → <b>sao lưu định kì<\/b>, lưu hai bản, kiểm tra chéo.","Hệ QTCSDL hỗ trợ sao lưu và phục hồi từ bản gần nhất."]}],"ghinho":"Bảo vệ CSDL cần cả công nghệ (phân quyền, sao lưu) lẫn con người (ý thức, trách nhiệm).","vandung":"Xây dựng mô hình phân nhóm quyền truy cập cho CSDL điểm của một trung tâm tiếng Anh.","the":[{"q":"Việc <b>đầu tiên<\/b> khi xây dựng chính sách bảo mật CSDL là gì?","a":"<b>Lập danh sách<\/b> và xác định <b>quyền hạn<\/b> của các nhóm người dùng."},{"q":"Biên bản lưu lại hoạt động của hệ thống thường được gọi là gì?","a":"<b>Log file<\/b>."},{"q":"Giải pháp chung để khôi phục dữ liệu khi thiết bị lưu trữ hỏng là gì?","a":"<b>Sao lưu dữ liệu định kì<\/b> ra thiết bị dự phòng; phục hồi từ bản sao lưu gần nhất."},{"q":"Nêu giải pháp cho sự cố <b>mất điện đột ngột<\/b> với máy tính quản trị CSDL.","a":"Dùng <b>bộ lưu điện<\/b> (UPS) cấp điện ngay khi mất điện đột ngột."},{"q":"Vì sao chính sách bảo mật phải có quy định về <b>ý thức, trách nhiệm<\/b> của người dùng với tài khoản?","a":"Nếu người dùng <b>để lộ tài khoản<\/b>, kẻ xấu chiếm được thì giải pháp phân quyền <b>mất tác dụng<\/b>."},{"q":"<i>Tình huống:<\/i> Website âm nhạc: khách chỉ được <b>xem<\/b>; cộng tác viên được <b>thêm<\/b> bản nhạc mới nhưng không xoá, sửa. Cấp quyền gì cho mỗi nhóm?","a":"Khách (guest): quyền <b>SELECT<\/b>. Cộng tác viên (moderator): quyền <b>SELECT, INSERT<\/b>."},{"q":"<i>Thử thách:<\/i> Trung tâm tiếng Anh có 4 giáo viên dạy 4 kĩ năng (bảng diemnghe, diemnoi, diemdoc, diemviet). Hãy <b>phân nhóm quyền<\/b> truy cập CSDL.","a":"<b>Học viên<\/b>: chỉ xem (SELECT). <b>Mỗi giáo viên<\/b>: thêm, cập nhật, xoá bản ghi trong <b>bảng điểm môn mình dạy<\/b>. <b>Một người quản trị<\/b>: toàn quyền với tất cả các bảng."}],"mcq":[{"m":"TH","q":"Để bảo mật hệ CSDL, chính sách thường dùng là","o":["phân nhóm người dùng, mỗi nhóm một quyền","cho mọi người dùng quyền quản trị","công khai mật khẩu quản trị","tắt hết nhật kí hệ thống"],"g":"Phân nhóm người dùng, mỗi nhóm một quyền."},{"m":"NB","q":"Thiết bị giúp hệ thống không mất dữ liệu khi mất điện đột ngột là","o":["bộ lưu điện (UPS)","máy in laser","bộ chia mạng","máy quét mã vạch"],"g":"Mất điện đột ngột → bộ lưu điện."},{"m":"TH","q":"Biện pháp phòng thiết bị lưu trữ hỏng bất ngờ là","o":["sao lưu định kì, lưu hai bản","dùng một ổ đĩa duy nhất","tắt máy liên tục","xoá bớt dữ liệu cũ"],"g":"Sao lưu định kì, lưu hai bản, kiểm tra chéo."},{"m":"TH","q":"Tệp nhật kí (log file) giúp người quản trị","o":["theo dõi các thao tác trên hệ thống","tăng dung lượng trống của ổ cứng","tăng tốc độ đường truyền mạng","thiết kế giao diện cho người dùng"],"g":"Theo dõi hệ thống, lưu log file."},{"m":"VD","q":"Trên web âm nhạc, người dùng chỉ được nghe và xem thông tin bài hát thuộc nhóm","o":["guest","admin","master_mod","moderator"],"g":"guest (xem) · moderator (thêm) · master_mod (sửa, xoá) · admin."},{"m":"VD","q":"Ổ cứng máy chủ đã gần hết tuổi thọ. Việc nên làm là","o":["thay ổ trước khi hết hạn dùng","đợi ổ hỏng rồi mới thay","giảm bớt số người dùng","tắt chức năng sao lưu"],"g":"Hỏng do tuổi thọ → thay trước khi hết hạn dùng."}],"tf":[{"q":"Trường quản lí CSDL điểm trên máy chủ trong phòng tin học.","y":["Nên sao lưu CSDL định kì, lưu ở hai nơi khác nhau.","Mọi giáo viên nên được quyền sửa điểm của tất cả các lớp.","Người dùng giữ kín mật khẩu là một phần của bảo mật.","Hệ QTCSDL không hỗ trợ phục hồi dữ liệu từ bản sao lưu."],"d":[true,false,true,false],"g":["Phòng hỏng thiết bị.","Phân quyền theo nhóm.","Ý thức người dùng.","Hệ QTCSDL hỗ trợ sao lưu và phục hồi."]}],"td":[{"m":"NB","q":"Công việc đầu tiên cần làm để xây dựng chính sách bảo mật CSDL là gì?","o":["Lập danh sách quyền các nhóm","Mua thêm ổ cứng dung lượng lớn","Cài phần mềm trò chơi cho máy chủ","Xoá bớt các bảng dữ liệu cũ"],"g":"SGK: lập danh sách và xác định quyền hạn các nhóm người dùng là công việc đầu tiên để xây dựng chính sách bảo mật CSDL."},{"m":"NB","q":"Trong website âm nhạc, nhóm 1 (không cần đăng nhập) có quyền gì?","o":["Chỉ tìm kiếm, xem","Thêm bản nhạc mới","Xoá, sửa dữ liệu","Toàn quyền với bảng"],"g":"SGK: nhóm 1 không cần khai báo, đăng nhập, được quyền chỉ tìm kiếm, xem, không có quyền cập nhật."},{"m":"NB","q":"Tài khoản truy xuất CSDL dành cho nhóm 4 (toàn quyền) trong ví dụ của SGK là","o":["admin","guest","moderator","master_mod"],"g":"SGK: tài khoản admin có toàn quyền đối với tất cả các bảng trong CSDL music cho nhóm 4."},{"m":"NB","q":"Tài khoản truy xuất CSDL dành cho nhóm 1 là","o":["guest","admin","moderator","master_mod"],"g":"SGK: tạo tài khoản khách (guest) và cấp quyền SELECT đối với tất cả các bảng."},{"m":"NB","q":"Biên bản lưu lại các truy xuất của người dùng thường được gọi là gì?","o":["Log file","Backup file","Text file","Data file"],"g":"SGK: những truy xuất của người dùng có thể được lưu lại dưới dạng biên bản (thường gọi là log file)."},{"m":"NB","q":"Khi mất điện đột ngột, giải pháp để cấp điện ngay cho hệ thống quản trị CSDL là","o":["Dùng bộ lưu điện","Dùng thêm máy in","Dùng thêm màn hình","Dùng ổ đĩa quang"],"g":"SGK: dùng bộ lưu điện để cấp điện ngay cho hệ thống khi mất điện đột ngột."},{"m":"NB","q":"Các hệ QTCSDL đều hỗ trợ chức năng nào để phòng mất dữ liệu?","o":["Sao lưu định kì, phục hồi","Tự động in toàn bộ dữ liệu","Tự động gửi dữ liệu qua thư","Tự động xoá dữ liệu cũ"],"g":"SGK: các hệ QTCSDL đều hỗ trợ chức năng sao lưu định kì và phục hồi dữ liệu từ bản sao lưu gần nhất."},{"m":"NB","q":"Giải pháp với thiết bị lưu trữ hư hỏng vì quá tuổi thọ là gì?","o":["Thay thiết bị trước khi hết tuổi thọ","Dùng đến khi hỏng hẳn mới thay","Tăng nhiệt độ phòng máy chủ","Chép dữ liệu ra giấy"],"g":"SGK: quản lí thời gian sử dụng của thiết bị lưu trữ, thay thế trước giai đoạn thường bị hư hỏng."},{"m":"NB","q":"Bảng user của website âm nhạc dùng để quản lí gì?","o":["Người có quyền đăng nhập website","Danh sách các bản nhạc mới","Danh sách ca sĩ và nhạc sĩ","Lịch phát nhạc mỗi ngày"],"g":"SGK: bảng user quản lí những người có quyền đăng nhập, gồm tên đăng nhập, mật khẩu và nhóm người dùng."},{"m":"NB","q":"Đảm bảo an toàn dữ liệu là đảm bảo điều gì?","o":["Dữ liệu không sai lạc, mất mát","Dữ liệu luôn công khai cho mọi người","Dữ liệu được nén nhỏ hơn","Dữ liệu tự động cập nhật"],"g":"SGK Hoạt động 2: đảm bảo dữ liệu không bị sai lạc, mất mát khi hệ thống phần cứng, phần mềm gặp sự cố."},{"m":"TH","q":"Tài khoản moderator được cấp quyền nào đối với các bảng?","o":["SELECT, INSERT","SELECT, DELETE","Chỉ SELECT","Toàn quyền"],"g":"SGK: tài khoản moderator được cấp quyền SELECT, INSERT đối với tất cả các bảng."},{"m":"TH","q":"Tài khoản master_mod có những quyền nào?","o":["SELECT, INSERT, UPDATE, DELETE","Chỉ SELECT, INSERT","Chỉ quyền tạo bảng mới","Không có quyền nào"],"g":"SGK: master_mod có tất cả quyền SELECT, INSERT, UPDATE, DELETE đối với các bảng."},{"m":"TH","q":"Nhóm 3 khác nhóm 4 ở điểm nào?","o":["Nhóm 3 không đổi cấu trúc bảng","Nhóm 3 không xem được dữ liệu","Nhóm 3 không thêm được dữ liệu","Nhóm 3 có toàn quyền tạo bảng"],"g":"SGK: nhóm 3 có quyền xoá, sửa dữ liệu nhưng không có quyền thay đổi cấu trúc bảng, không xoá bảng."},{"m":"TH","q":"Người dùng nhóm 4 có can thiệp được vào CSDL khác trong cùng hệ QTCSDL không?","o":["Không, chỉ toàn quyền trên CSDL music","Có, toàn quyền mọi CSDL","Có, nếu đăng nhập hai lần","Không, vì không có tài khoản"],"g":"SGK: ngay cả người dùng có quyền cao nhất ở nhóm 4 cũng không thể can thiệp vào các CSDL khác."},{"m":"TH","q":"Vì sao chính sách bảo mật cần quy định về ý thức người dùng?","o":["Lộ tài khoản, phân quyền vô dụng","Vì phân quyền luôn đủ an toàn","Vì người dùng không cần mật khẩu","Vì máy chủ tự bảo vệ mọi thứ"],"g":"SGK: nếu người dùng để lộ, để người khác chiếm tài khoản thì giải pháp phân quyền hạn chế tác dụng."},{"m":"TH","q":"Vì sao cần giám sát hoạt động của hệ thống CSDL?","o":["Hệ thống lớn khó biết điều bất ổn","Để tăng thêm số người truy cập","Để giảm dung lượng ổ cứng máy chủ","Để bỏ được việc phân quyền"],"g":"SGK: ứng dụng lớn với hàng triệu người truy cập như một hộp đen; cần giám sát số truy cập, tình trạng thiết bị…"},{"m":"TH","q":"Log file có tác dụng gì?","o":["Kiểm tra, phân tích khi cần","Tăng tốc độ truy vấn CSDL","Lưu mật khẩu người dùng","Thay cho bản sao lưu"],"g":"SGK: log file lưu lại truy xuất của người dùng để khi cần có thể kiểm tra, phân tích."},{"m":"TH","q":"Khi hệ thống chứa CSDL kết nối mạng, cần thêm kế hoạch gì?","o":["Có giải pháp an ninh mạng","Tắt hết mọi tài khoản","Ngừng sao lưu để tránh lộ","Chỉ cho máy chủ chạy ngoại tuyến"],"g":"SGK: cần kế hoạch cụ thể về giải pháp an ninh mạng (cả phần cứng và phần mềm) chống tấn công qua mạng."},{"m":"TH","q":"Vì sao cần sao lưu dữ liệu định kì?","o":["Phục hồi được khi có sự cố","Để CSDL chạy nhanh hơn trước","Để người dùng khỏi phải đăng nhập","Để xoá các dữ liệu bị trùng lặp"],"g":"SGK: thiết bị lưu trữ có thể hư hỏng; rất khó lấy lại dữ liệu nên cần sao lưu định kì để phục hồi."},{"m":"TH","q":"Giải pháp khi hệ thống cấp điện bị quá tải do nhu cầu tăng đột biến là","o":["Kiểm tra cấp điện thường xuyên","Tắt bớt máy chủ CSDL","Giảm số người dùng hằng ngày","Đổi mật khẩu quản trị"],"g":"SGK: thường xuyên kiểm tra hệ thống cấp điện, đặc biệt khi nhu cầu sử dụng điện tăng vọt."},{"m":"TH","q":"Giải pháp lưu trữ “hai phiên bản dữ liệu, kiểm tra chéo” của các hãng nhằm mục đích gì?","o":["Đảm bảo dữ liệu chính xác","Tăng tốc độ in dữ liệu","Giảm giá thiết bị lưu trữ","Cho người lạ xem dữ liệu"],"g":"SGK: các hãng có giải pháp lưu trữ hai phiên bản dữ liệu, kiểm tra chéo để đảm bảo tính chính xác của dữ liệu."},{"m":"TH","q":"Vì sao cần quy định về ý thức, trách nhiệm của người vận hành hệ thống?","o":["Sơ suất vận hành gây mất dữ liệu","Vì người vận hành không cần đăng nhập","Vì người vận hành có toàn quyền","Vì hệ thống tự vận hành"],"g":"Luyện tập 2; SGK: chính sách an toàn phải bao gồm quy định về ý thức, trách nhiệm của người vận hành hệ thống."},{"m":"TH","q":"Chính sách bảo mật CSDL toàn diện KHÔNG cần nội dung nào?","o":["Quy định màu giao diện của website","Ý thức, trách nhiệm người dùng","Danh sách nhóm và quyền hạn","Giám sát hoạt động, biên bản"],"g":"SGK: gồm quy định ý thức trách nhiệm; an ninh mạng; nhóm người dùng và quyền; giám sát, biên bản, kế hoạch xử lí."},{"m":"TH","q":"Khi thiết bị lưu trữ hỏng, nói chung việc lấy lại dữ liệu thế nào?","o":["Rất khó lấy lại đầy đủ","Luôn lấy lại đủ trong vài phút","Hệ QTCSDL tự sửa thiết bị","Không ảnh hưởng tới dữ liệu"],"g":"SGK: nói chung rất khó lấy lại được toàn bộ và chính xác dữ liệu trong thiết bị lưu trữ bị hỏng."},{"m":"TH","q":"Website âm nhạc dùng tài khoản guest để làm gì?","o":["Ai cũng xem được, không đăng nhập","Quản trị viên tạo bảng mới","Biên tập viên nhập bài hát mới","Xoá các ca sĩ không còn hoạt động"],"g":"SGK: tất cả người dùng khi vào website mặc nhiên được xem như truy xuất CSDL music với tài khoản guest."},{"m":"VD","q":"Một biên tập viên cần thêm bài hát mới nhưng không được sửa, xoá. Tài khoản phù hợp là","o":["moderator","guest","master_mod","admin"],"g":"Nhóm 2 — moderator: quyền SELECT, INSERT."},{"m":"VD","q":"Người cần sửa lỗi chính tả tên bản nhạc, xoá bản ghi sai nhưng không được xoá bảng. Tài khoản phù hợp là","o":["master_mod","guest","moderator","admin"],"g":"Nhóm 3 — master_mod: SELECT, INSERT, UPDATE, DELETE; không đổi cấu trúc, không xoá bảng."},{"m":"VD","q":"Câu lệnh cấp quyền phù hợp cho tài khoản moderator trên mọi bảng của CSDL music là","o":["GRANT select, insert ON music.* TO moderator;","GRANT delete ON music.* TO moderator;","REVOKE select ON music.* FROM moderator;","GRANT all ON music.* TO moderator;"],"g":"Moderator được cấp quyền SELECT, INSERT (cú pháp GRANT ở Bài 14)."},{"m":"VD","q":"Lan cho bạn mượn tài khoản moderator để giúp nhập bài hát. Nguy cơ là gì?","o":["Người khác dùng quyền, lộ tài khoản","Website chạy nhanh hơn trước","Tài khoản tự có thêm quyền mới","Lan được cấp quyền admin"],"g":"SGK: để lộ, để người khác chiếm được tài khoản thì giải pháp bảo mật theo phân quyền bị hạn chế tác dụng."},{"m":"VD","q":"Trung tâm dữ liệu nằm ở khu vực hay mất điện. Thiết bị nên trang bị cho máy chủ là","o":["Bộ lưu điện (UPS)","Máy in laser","Loa ngoài","Máy chiếu"],"g":"SGK: dùng bộ lưu điện để cấp điện ngay khi mất điện đột ngột."},{"m":"VD","q":"Ổ cứng máy chủ đã dùng gần hết tuổi thọ của nhà sản xuất. Việc nên làm là","o":["Thay ổ cứng mới trước khi hỏng","Chờ ổ hỏng rồi mới thay","Tắt chức năng sao lưu","Xoá bớt dữ liệu để đỡ hỏng"],"g":"SGK: quản lí thời gian sử dụng, thay thế trước khi thiết bị đến giai đoạn thường hư hỏng."},{"m":"VD","q":"Trường lưu điểm học sinh trên máy chủ. Lịch sao lưu hợp lí nhất là","o":["Sao lưu định kì ra thiết bị khác","Chỉ sao lưu khi máy chủ hỏng","Sao lưu một lần khi lắp máy","In bảng điểm ra giấy mỗi năm"],"g":"SGK: sao lưu dữ liệu định kì ra thiết bị dự phòng; phục hồi từ bản sao lưu gần nhất."},{"m":"VD","q":"Quản trị viên phát hiện có người đăng nhập lạ lúc nửa đêm. Nguồn thông tin giúp kiểm tra là","o":["Log file của hệ thống","Bảng bannhac","Bảng casi","Màn hình máy chủ"],"g":"SGK: truy xuất của người dùng được lưu trong log file để khi cần kiểm tra, phân tích."},{"m":"VD","q":"Trung tâm tiếng Anh (Vận dụng): học viên được quyền gì với các bảng điểm?","o":["Chỉ xem","Thêm, sửa, xoá","Toàn quyền","Tạo bảng mới"],"g":"Vận dụng: các học viên được quyền chỉ xem các bảng điểm."},{"m":"VD","q":"Giáo viên dạy luyện nói ở trung tâm (Vận dụng) được thêm, sửa, xoá bản ghi ở bảng nào?","o":["Chỉ bảng diemnoi","Mọi bảng điểm","Chỉ bảng diemnghe","Không bảng nào"],"g":"Vận dụng: giáo viên được thêm mới, cập nhật, xoá bản ghi trong bảng điểm môn học mình dạy."},{"m":"VD","q":"Mô hình phân nhóm người dùng ở trung tâm tiếng Anh (Vận dụng) gồm mấy nhóm có quyền khác nhau?","o":["3 nhóm: học viên, giáo viên, quản trị","1 nhóm dùng chung một tài khoản","2 nhóm: học viên và quản trị","4 nhóm đều có toàn quyền"],"g":"Học viên chỉ xem; giáo viên thêm, sửa, xoá bảng điểm môn mình (mỗi giáo viên một tài khoản); một người toàn quyền."},{"m":"VD","q":"Câu lệnh phù hợp cấp quyền cho giáo viên luyện viết gvviet trên bảng diemviet của CSDL trungtam là","o":["GRANT select, insert, update, delete ON trungtam.diemviet TO gvviet;","GRANT select ON trungtam.* TO gvviet ;","GRANT all ON trungtam.* TO gvviet WITH GRANT OPTION;","REVOKE insert, update ON trungtam.diemviet FROM gvviet;"],"g":"Giáo viên chỉ thao tác dữ liệu ở bảng môn mình dạy."},{"m":"VD","q":"Máy chủ CSDL kết nối Internet bị dò mật khẩu liên tục. Biện pháp phù hợp là","o":["Tăng cường an ninh mạng","Tắt chức năng sao lưu","Công khai mật khẩu admin","Xoá log file của hệ thống"],"g":"SGK: cần giải pháp an ninh mạng (phần cứng và phần mềm) để chống tấn công qua mạng."},{"m":"VD","q":"Một nhân viên vận hành vô tình xoá nhầm bảng dữ liệu. Có thể khôi phục nhờ","o":["Bản sao lưu gần nhất","Bảng user","Tài khoản guest","Bộ lưu điện"],"g":"SGK: các hệ QTCSDL hỗ trợ phục hồi dữ liệu từ bản sao lưu gần nhất."},{"m":"VD","q":"Ngân hàng nhắc khách “Không cung cấp mật khẩu cho bất kì ai”. Điều này thuộc nội dung nào của chính sách bảo mật?","o":["Ý thức, trách nhiệm người dùng","Sao lưu dữ liệu định kì","Hệ thống cấp điện đủ công suất","Thay thế thiết bị lưu trữ"],"g":"SGK: CSDL ngân hàng, chứng khoán… nếu người dùng tiết lộ thông tin truy cập thì dữ liệu không còn được bảo mật."},{"m":"VDC","q":"Sắp xếp các tài khoản website âm nhạc theo quyền hạn tăng dần.","o":["guest – moderator – master_mod – admin","admin – master_mod – moderator – guest","moderator – guest – admin – master_mod","guest – master_mod – moderator – admin"],"g":"Chỉ xem → thêm → thêm, sửa, xoá → toàn quyền."},{"m":"VDC","q":"Một bạn cho rằng chỉ cần phân quyền thật chặt là CSDL an toàn. Nhận xét nào đúng?","o":["Chưa đủ, cần thêm ý thức, giám sát","Đúng, phân quyền là đủ cho mọi tình huống","Đúng, vì tin tặc không vượt qua được phân quyền","Chưa đủ, chỉ cần thêm bộ lưu điện"],"g":"SGK: chính sách bảo mật toàn diện gồm ý thức người dùng, an ninh mạng, phân quyền, giám sát và kế hoạch xử lí."},{"m":"VDC","q":"Vì sao tài khoản guest chỉ được cấp quyền SELECT mà không được INSERT?","o":["Ai cũng dùng guest, ghi bừa rất nguy hiểm","Vì guest không được xem dữ liệu nào","Vì INSERT làm CSDL chạy rất chậm","Vì guest là tài khoản quản trị cao nhất"],"g":"Mọi người dùng Internet đều dùng guest; nếu được thêm dữ liệu, ai cũng có thể ghi bừa vào CSDL."},{"m":"VDC","q":"Sao lưu dữ liệu lên chính ổ cứng đang chứa CSDL có an toàn không?","o":["Không, ổ hỏng mất cả bản sao","Có, vì sao lưu luôn an toàn","Có, vì nhanh hơn sao lưu ra ngoài","Không, vì hệ QTCSDL cấm sao lưu"],"g":"SGK: sao lưu toàn bộ dữ liệu ra thiết bị dự phòng; bản sao trên cùng ổ sẽ mất theo khi ổ hỏng."},{"m":"VDC","q":"Hệ thống có hàng triệu người dùng đồng thời. Biện pháp giúp phát hiện sớm sự bất thường là","o":["Giám sát truy cập, thiết bị, lưu log","Giảm bớt số bảng trong CSDL","Cho mọi người dùng chung tài khoản","Tắt máy chủ vào ban đêm"],"g":"SGK: tổ chức giám sát hoạt động (số người truy cập, tình trạng thiết bị…), lưu log để kiểm tra, phân tích."},{"m":"VDC","q":"Một trường muốn phụ huynh xem điểm con mình mà không xem được điểm học sinh khác. Yêu cầu này đòi hỏi","o":["Phân quyền chi tiết đến từng học sinh","Cho phụ huynh dùng tài khoản admin","Công khai toàn bộ bảng điểm","Không cần phân quyền gì"],"g":"Bảo mật theo nhóm người dùng và quyền hạn tương ứng, có thể chi tiết đến từng bản ghi."},{"m":"VDC" iết kế đồ hoạ","Kĩ sư phần cứng","Nhân viên bán hàng"],"g":"SGK: người thực thi hoạt động quản trị CSDL gọi là nhà quản trị CSDL (người quản trị CSDL)."},{"m":"NB","q":"Mục đích của quản trị CSDL là gì?","o":["CSDL hoạt động thông suốt, an toàn","Thiết kế giao diện website đẹp mắt","Bán phần mềm quản lí cho khách","Sửa chữa máy in của cơ quan"],"g":"SGK: quản trị CSDL có mục đích đảm bảo cho các hoạt động liên quan đến CSDL thông suốt, an toàn và có hiệu quả cao."},{"m":"NB","q":"Vai trò quan trọng nhất của quản trị CSDL là gì?","o":["Giữ CSDL luôn sẵn sàng khi cần","Nhập toàn bộ dữ liệu bằng tay","Viết phần mềm trò chơi","Bán thiết bị lưu trữ"],"g":"SGK: vai trò quan trọng nhất là đảm bảo các CSDL trong tổ chức luôn ở trạng thái sẵn sàng khi cần."},{"m":"NB","q":"Nhiệm vụ nào thuộc công việc của nhà quản trị CSDL?","o":["Cài đặt, nâng cấp hệ QTCSDL","Thiết kế logo cho công ty","Bán hàng trực tuyến","Lắp ráp máy tính"],"g":"SGK: cài đặt và nâng cấp hệ QTCSDL; tạo lập, điều chỉnh CSDL; đảm bảo tài nguyên; đảm bảo an toàn, bảo mật."},{"m":"NB","q":"Ngôn ngữ truy vấn mà nhà quản trị CSDL cần thành thạo, làm việc được với mọi hệ QTCSDL hiện đại là","o":["SQL","HTML","CSS","Scratch"],"g":"SGK: thành thạo ngôn ngữ quản trị, trong đó có ngôn ngữ truy vấn SQL."},{"m":"NB","q":"Ở bậc đại học, chuyên ngành nào liên quan nhiều đến nghề quản trị CSDL?","o":["Các hệ thống thông tin","Thiết kế thời trang","Quản trị khách sạn","Kiến trúc cảnh quan"],"g":"SGK: các chuyên ngành có liên quan nhiều là Các hệ thống thông tin và Công nghệ phần mềm."},{"m":"NB","q":"Phẩm chất nào cần thiết cho nhà quản trị CSDL theo SGK?","o":["Cẩn thận, tỉ mỉ, kiên trì","Nóng vội, thích mạo hiểm","Thích làm một mình, ngại học","Chỉ cần nói giỏi"],"g":"SGK: tính cẩn thận, tỉ mỉ, kiên trì; tinh thần ham học."},{"m":"NB","q":"Các hãng nổi tiếng cấp chứng chỉ quản trị CSDL được SGK nêu là","o":["IBM, Microsoft, Oracle","Nike, Adidas, Puma","Toyota, Honda, Ford","Pepsi, Coca, Lavie"],"g":"SGK: lấy chứng chỉ quản trị CSDL của các hãng nổi tiếng như IBM, Microsoft, Oracle."},{"m":"NB","q":"Một nội dung quan trọng của Cách mạng công nghiệp 4.0 làm tăng nhu cầu nhà quản trị CSDL là","o":["Chuyển đổi số","Cơ khí hoá","Điện khí hoá","Thủ công hoá"],"g":"SGK: nội dung quan trọng là chuyển đổi số; nhu cầu tuyển dụng nhà quản trị CSDL tăng nhanh cùng quá trình này."},{"m":"NB","q":"Cụm từ khoá SGK gợi ý để tìm thông tin tuyển dụng liên quan là","o":["tuyển dụng quản trị cơ sở dữ liệu","học bổng du học miễn phí","việc làm thêm cho học sinh","thiết kế trang web đẹp"],"g":"SGK Hoạt động 3: sử dụng cụm từ khoá “tuyển dụng quản trị cơ sở dữ liệu”."},{"m":"TH","q":"Vì sao cần nâng cấp hệ QTCSDL theo thời gian?","o":["Công nghệ lạc hậu, cần vá lỗi","Để CSDL có ít dữ liệu hơn","Để người dùng không truy cập được","Để đổi màu giao diện cho đẹp"],"g":"SGK: các hệ QTCSDL được cập nhật để bổ sung tính năng và vá lỗi; công nghệ CSDL có thể lạc hậu, cần nâng cấp."},{"m":"TH","q":"Nâng cấp hệ QTCSDL mới còn đòi hỏi việc gì ngoài cài phần mềm?","o":["Chuyển đổi CSDL, cả chuyển đổi dữ liệu","Mua máy tính mới cho mọi nhân viên","Xoá toàn bộ dữ liệu cũ","Đổi tên tổ chức"],"g":"SGK: nâng cấp không chỉ là cài đặt phần mềm mới mà còn phải chuyển đổi CSDL, bao gồm cả chuyển đổi dữ liệu."},{"m":"TH","q":"Lập hồ sơ về CSDL phục vụ việc gì?","o":["Duy trì, nâng cấp hệ thống","Quảng cáo phần mềm cho khách","Tính lương cho nhân viên","Thay thế việc sao lưu"],"g":"SGK: lập hồ sơ về CSDL để phục vụ cho hoạt động duy trì và nâng cấp hệ thống sau này."},{"m":"TH","q":"Đảm bảo tài nguyên cho CSDL cần được thực hiện khi nào?","o":["Thường xuyên, theo mức tăng trưởng","Chỉ khi khởi tạo CSDL","Chỉ khi máy chủ hỏng","Mỗi năm một lần cố định"],"g":"SGK: không chỉ khi khởi tạo mà cần thực hiện thường xuyên theo mức tăng trưởng, mức độ khai thác dữ liệu."},{"m":"TH","q":"Vì sao mất dữ liệu có thể làm sụp đổ cả tổ chức?","o":["Dữ liệu có tầm quan trọng đặc biệt","Vì thiết bị mua lại rất đắt","Vì phần mềm không thể cài lại","Vì dữ liệu chiếm nhiều chỗ"],"g":"SGK: hỏng thiết bị có thể sửa, mua mới; nhưng mất dữ liệu, bị đánh cắp, bị sửa có thể làm tê liệt, sụp đổ tổ chức."},{"m":"TH","q":"Nhà quản trị CSDL phối hợp với ai để phân quyền sử dụng dữ liệu?","o":["Người thiết kế, bộ phận nghiệp vụ","Khách hàng vãng lai của tổ chức","Nhà cung cấp điện của khu vực","Học sinh thực tập ngắn hạn"],"g":"SGK: phối hợp với người thiết kế hệ thống và các bộ phận nghiệp vụ để phân quyền đến từng nhóm người dùng."},{"m":"TH","q":"Khi nào nhà quản trị cần điều chỉnh quyền truy cập dữ liệu?","o":["Khi nhân sự hay nghiệp vụ biến động","Mỗi lần có người xem dữ liệu","Khi máy tính khởi động lại","Khi đổi hình nền máy chủ"],"g":"SGK: điều chỉnh quyền truy cập dữ liệu khi có biến động về nhân sự hay nghiệp vụ."},{"m":"TH","q":"Vì sao hiểu biết về hệ điều hành, mạng là điểm cộng cho nhà quản trị CSDL?","o":["Hệ QTCSDL chạy trên hệ điều hành","Vì nhà quản trị phải sửa máy in","Vì CSDL không cần hệ điều hành","Vì mạng thay thế được CSDL"],"g":"SGK: việc cài đặt hệ QTCSDL thực hiện trên một hệ điều hành cụ thể, có liên quan đến mạng máy tính."},{"m":"TH","q":"Tinh thần ham học cùng ngoại ngữ giúp nhà quản trị CSDL điều gì?","o":["Tự học để nắm công nghệ mới","Không cần đọc tài liệu kĩ thuật","Làm việc ít giờ hơn","Không cần sao lưu dữ liệu"],"g":"SGK: giúp nhà quản trị CSDL có khả năng tự học để nắm bắt được những công nghệ mới."},{"m":"TH","q":"Vì sao nhà quản trị không nhất thiết thiết kế CSDL nhưng vẫn cần biết thiết kế?","o":["Có thể phải sửa cấu trúc khi nâng cấp","Vì thiết kế CSDL là việc của khách hàng","Vì thiết kế không liên quan quản trị","Vì CSDL không có cấu trúc"],"g":"SGK: nhà quản trị có thể phải tham gia thiết kế hoặc điều chỉnh cấu trúc CSDL khi nâng cấp phần mềm."},{"m":"TH","q":"Vì sao nhu cầu nhân lực quản trị CSDL ngày một tăng?","o":["Ứng dụng dùng CSDL phát triển mạnh","Vì CSDL ngày càng ít dữ liệu","Vì máy tính không cần bảo trì","Vì ai cũng tự quản trị được"],"g":"SGK: nhu cầu nhân lực quản trị CSDL tăng theo nhu cầu phát triển các ứng dụng tin học sử dụng CSDL."},{"m":"TH","q":"Tổ chức nào từ lâu đã cần nhà quản trị CSDL vì mức độ tin học hoá cao?","o":["Ngân hàng, bảo hiểm, dịch vụ công","Các cửa hàng tạp hoá nhỏ lẻ","Các quán nước ven đường","Các hộ gia đình làm nông"],"g":"SGK: tổ chức tài chính, ngân hàng, bảo hiểm, cơ quan nhà nước cung cấp dịch vụ công, công ti tin học lớn."},{"m":"TH","q":"Giám sát thường xuyên của nhà quản trị nhằm mục đích gì?","o":["Phát hiện sớm sự cố để khắc phục","Kiểm tra giờ làm của nhân viên","Đếm số lượt thích trên mạng","Xoá dữ liệu cũ hằng ngày"],"g":"SGK: thường xuyên giám sát phát hiện sớm các sự cố dữ liệu để khắc phục kịp thời."},{"m":"TH","q":"Ngoài các công việc chính, nhà quản trị CSDL còn có thể làm gì?","o":["Nghiên cứu, xây dựng quy trình, tư vấn","Thiết kế quần áo cho nhân viên","Lái xe đưa đón khách hàng","Nấu ăn cho căng tin"],"g":"SGK: có thể tham gia các hoạt động nghiên cứu, xây dựng các quy trình và tư vấn về các vấn đề liên quan đến CSDL."},{"m":"TH","q":"Nhà quản trị CSDL thường xuyên tạo bản sao lưu nhằm","o":["Khôi phục dữ liệu khi có sự cố","Tăng số người truy cập mỗi ngày","Thay thế cho việc phân quyền","Làm dữ liệu chạy chậm hơn"],"g":"SGK: tạo các bản sao lưu dữ liệu dự phòng để khi gặp sự cố có thể khôi phục, nhất là sự cố phần cứng."},{"m":"VD","q":"Nhân viên kế toán thường xuyên nhập hoá đơn mới vào CSDL. Ai chịu trách nhiệm chính việc cập nhật dữ liệu này?","o":["Người dùng phần mềm quản lí","Người làm ra phần mềm","Nhà quản trị CSDL","Nhà cung cấp điện năng"],"g":"Câu hỏi SGK: cập nhật dữ liệu là việc của người sử dụng phần mềm quản lí."},{"m":"VD","q":"Ai chịu trách nhiệm chính việc thiết kế dữ liệu cho một phần mềm quản lí mới?","o":["Người làm phần mềm","Người sử dụng phần mềm","Khách hàng mua hàng","Nhân viên bảo vệ"],"g":"Câu hỏi SGK: thiết kế dữ liệu là việc chính của người làm phần mềm (có thể có nhà quản trị tham gia)."},{"m":"VD","q":"Ai chịu trách nhiệm chính việc sao lưu dữ liệu định kì của tổ chức?","o":["Nhà quản trị CSDL","Người sử dụng phần mềm","Người làm phần mềm","Khách hàng của tổ chức"],"g":"Câu hỏi SGK: sao lưu dữ liệu là nhiệm vụ của nhà quản trị CSDL."},{"m":"VD","q":"Lượng khách hàng của ngân hàng tăng gấp đôi, máy chủ CSDL quá tải. Nhà quản trị cần làm gì?","o":["Bổ sung tài nguyên máy chủ, lưu trữ","Xoá bớt một nửa khách hàng","Tắt máy chủ vào giờ cao điểm","Đổi mật khẩu cho khách hàng"],"g":"SGK: đảm bảo tài nguyên theo mức tăng trưởng, mức độ khai thác dữ liệu."},{"m":"VD","q":"Nhân viên A chuyển từ phòng Kế toán sang phòng Kinh doanh. Nhà quản trị CSDL nên","o":["Điều chỉnh quyền truy cập của A","Giữ nguyên mọi quyền cũ của A","Xoá toàn bộ dữ liệu phòng Kế toán","Cấp cho A toàn quyền"],"g":"SGK: điều chỉnh quyền truy cập khi có biến động về nhân sự hay nghiệp vụ."},{"m":"VD","q":"Hệ QTCSDL công ty đang dùng đã ngừng được hãng hỗ trợ, có nhiều lỗi bảo mật. Hướng xử lí hợp lí là","o":["Đổi hệ QTCSDL mới, chuyển dữ liệu","Tiếp tục dùng, không cần làm gì","Xoá toàn bộ CSDL rồi nhập tay","Ngừng sử dụng máy tính"],"g":"SGK: nhiều tổ chức buộc phải loại bỏ hệ QTCSDL không còn thích hợp, thay bằng hệ tốt hơn, chuyển đổi dữ liệu."},{"m":"VD","q":"Bạn Minh muốn trở thành nhà quản trị CSDL. Hướng chuẩn bị phù hợp là","o":["Học Hệ thống thông tin, lấy chứng chỉ","Chỉ cần chơi trò chơi thật giỏi","Học ngành thiết kế thời trang","Chỉ học thuộc lòng sách giáo khoa"],"g":"SGK: học bài bản ở đại học chuyên ngành, khoá học nghề, chứng chỉ, rèn luyện trong công việc thực tế."},{"m":"VD","q":"Để tìm việc làm quản trị CSDL ở ngân hàng (Vận dụng 1), từ khoá phù hợp là","o":["tuyển dụng quản trị CSDL ngân hàng","khuyến mãi mở thẻ ngân hàng mới","lãi suất tiết kiệm mới nhất năm nay","cách rút tiền ở cây ATM gần nhà"],"g":"Vận dụng 1: tìm ba địa chỉ tuyển dụng nhà quản trị CSDL trong ngành ngân hàng."},{"m":"VD","q":"Để tìm nơi đào tạo cấp chứng chỉ CSDL của Oracle (Luyện tập 2), từ khoá phù hợp là","o":["chứng chỉ Oracle Database đào tạo","Oracle giá cổ phiếu hôm nay","Oracle trò chơi miễn phí","hình nền Oracle đẹp"],"g":"Luyện tập 2: tìm địa chỉ cung cấp dịch vụ đào tạo cấp chứng chỉ CSDL của IBM, Oracle, Microsoft."},{"m":"VD","q":"Sàn thương mại điện tử cần ai để CSDL đơn hàng luôn hoạt động tin cậy?","o":["Nhà quản trị CSDL","Nhân viên giao hàng","Người mẫu quảng cáo","Nhân viên lễ tân"],"g":"SGK: đảm bảo CSDL của các ứng dụng trực tuyến luôn hoạt động tốt là yêu cầu cốt lõi; nhà quản trị CSDL rất được trọng dụng."},{"m":"VD","q":"Hệ thống báo dung lượng ổ lưu trữ CSDL đã dùng 95%. Nhà quản trị nên","o":["Lên kế hoạch mở rộng lưu trữ","Chờ ổ đầy hẳn rồi mới xử lí","Xoá ngẫu nhiên một số bảng","Tắt chức năng ghi log"],"g":"Đảm bảo tài nguyên là một phần của hoạt động lập kế hoạch phát triển CSDL."},{"m":"VD","q":"Phát hiện có người lạ truy cập trái phép CSDL. Đây là phần việc thuộc nhiệm vụ nào của nhà quản trị?","o":["Đảm bảo an toàn, bảo mật","Cài đặt hệ QTCSDL","Đảm bảo tài nguyên","Tạo lập CSDL mới"],"g":"SGK: đảm bảo an toàn, bảo mật cho dữ liệu là hoạt động quan trọng hàng đầu."},{"m":"VD","q":"Nhà quản trị lập hồ sơ mô tả các bảng, khoá, quan hệ của CSDL. Mục đích là","o":["Phục vụ duy trì, nâng cấp sau này","Gửi cho khách hàng làm quà","Thay thế cho bản sao lưu","Để in trang trí văn phòng"],"g":"SGK: lập hồ sơ về CSDL để phục vụ cho hoạt động duy trì và nâng cấp hệ thống sau này."},{"m":"VD","q":"Một bạn thích phân tích, cẩn thận nhưng ngại học điều mới. Lời khuyên phù hợp nếu muốn làm quản trị CSDL là","o":["Rèn tinh thần ham học, tự học","Không cần học thêm vì đã cẩn thận","Bỏ qua mảng CSDL, chỉ học mạng","Chỉ cần thuộc lòng câu lệnh"],"g":"SGK: khả năng học tập suốt đời giúp nhà quản trị CSDL nâng cao bản lĩnh nghề nghiệp."},{"m":"VD","q":"Ngành nào sau đây có thể giúp em làm quản trị CSDL sau này?","o":["Tin học quản lí","Văn học","Âm nhạc","Thể dục thể thao"],"g":"SGK: một vài trường đại học mở cả chuyên ngành tin học quản lí."},{"m":"VDC","q":"Ghép công việc với người chịu trách nhiệm chính: (a) cập nhật dữ liệu; (b) thiết kế dữ liệu; (c) sao lưu dữ liệu.","o":["a – người dùng; b – người làm phần mềm; c – nhà quản trị","a – nhà quản trị; b – người dùng; c – người làm phần mềm","a – người làm phần mềm; b – nhà quản trị; c – người dùng","a – người dùng; b – nhà quản trị; c – người làm phần mềm"],"g":"Câu hỏi SGK: phân biệt vai trò ba nhóm người."},{"m":"VDC","q":"Vì sao hỏng thiết bị ít nghiêm trọng hơn mất dữ liệu?","o":["Thiết bị mua được, dữ liệu khó tái tạo","Thiết bị luôn rẻ hơn phần mềm quản lí","Dữ liệu ít quan trọng hơn thiết bị","Mất dữ liệu chỉ ảnh hưởng một người"],"g":"SGK: khi hỏng thiết bị có thể sửa, mua mới; nhưng mất dữ liệu có thể làm tê liệt hoạt động, sụp đổ tổ chức."},{"m":"VDC","q":"Một tổ chức chuyển đổi số toàn bộ quy trình nghiệp vụ. Yêu cầu nào với CSDL là cốt lõi?","o":["Tích hợp, nhất quán, chia sẻ được","Mỗi phòng một CSDL riêng rẽ","Lưu dữ liệu trên giấy song song","Hạn chế người dùng truy cập"],"g":"SGK: chuyển đổi số tin học hoá quy trình trên nền tảng những CSDL tích hợp, nhất quán và chia sẻ được."},{"m":"VDC","q":"Sắp xếp quá trình trở thành nhà quản trị CSDL tốt theo SGK.","o":["Đại học chuyên ngành → khoá học, chứng chỉ → thực tế","Làm việc thực tế → học đại học → không cần chứng chỉ","Lấy chứng chỉ → thôi học đại học → tự làm ngay","Học thuộc SQL → bỏ thực hành → làm quản trị"],"g":"SGK: học bài bản ở đại học chuyên ngành, rèn luyện qua khoá học nghề nghiệp, các hệ QTCSDL cụ thể và công việc thực tế."},{"m":"VDC","q":"Kĩ năng quản trị CSDL hữu ích cho người học lên cao ở lĩnh vực nào theo SGK?","o":["Khoa học máy tính, Khoa học dữ liệu","Thanh nhạc, Hội hoạ, Điêu khắc","Ngữ văn, Lịch sử, Địa lí","Giáo dục thể chất, Thể thao"],"g":"SGK: hữu ích cho những ai phát triển năng lực ở bậc cao hơn như Khoa học máy tính, Hệ thống thông tin, Khoa học dữ liệu."},{"m":"VDC","q":"Vì sao phẩm chất cẩn thận, tỉ mỉ đặc biệt quan trọng với nhà quản trị CSDL?","o":["Sai sót nhỏ có thể làm hỏng dữ liệu","Vì công việc này r ,28,29,31,32,33,34,36,40,44,49],"noi":{"noi":"Hãy cứ khát khao, hãy cứ dại khờ.","tg":"Steve Jobs — nhà sáng lập Apple","nguon":"Diễn văn tại lễ tốt nghiệp Đại học Stanford, 2005","y":"Cài phần mềm mới, làm quen giao diện lạ — giữ sự tò mò là em học được mọi công cụ."}},{"so":18,"cd":6,"ten":"Thực hành xác định cấu trúc bảng và các trường khoá","trang":"86–90","muctieu":["Có hình dung về công việc xác định các bảng dữ liệu, cấu trúc của chúng và các trường khoá trước khi tạo lập CSDL."],"muc":[{"t":"Xem xét bài toán","icon":"🎵","b":["Quản lí bản thu âm: tên bản nhạc, nhạc sĩ, ca sĩ.","Một bản nhạc có nhiều ca sĩ thể hiện."]},{"t":"Tạo lập bảng","icon":"📐","b":["<code>banthuam(idBanthuam, tenBannhac, tenNhacsi, tenCasi)<\/code>.","<b>idBanthuam<\/b> làm khoá chính – ngắn gọn, thuận tiện."]},{"t":"Tổ chức lại bảng","icon":"✂️","b":["Tên lặp lại → tách bảng <b>casi<\/b>, <b>bannhac<\/b>, <b>nhacsi<\/b>.","Thay tên bằng mã: idCasi, idBannhac, idNhacsi."]},{"t":"Các loại khoá","icon":"🔑","b":["Mỗi bảng một <b>khoá chính<\/b>.","<b>Khoá ngoài<\/b> tham chiếu khoá chính bảng khác.","<b>Unique<\/b>: cặp không được trùng."]},{"t":"Kiểu dữ liệu","icon":"🔢","b":["Khoá chính: <b>INT<\/b>, <b>AUTO_INCREMENT<\/b>.","Tên: <b>VARCHAR(255)<\/b>."]}],"ghinho":"Thiết kế trước, tạo bảng sau: tách bảng để không lặp dữ liệu, dùng khoá để liên kết.","vandung":"Phân tích, thiết lập mô hình dữ liệu cho bài toán quản lí tên quận/huyện, tỉnh/thành phố.","the":[{"q":"Bảng <b>banthuam(idBanthuam, tenBannhac, tenNhacsi, tenCasi)<\/b>: vì sao chọn <b>idBanthuam<\/b> làm khoá chính?","a":"idBanthuam xác định <b>duy nhất<\/b> một bản thu âm, lại <b>ngắn gọn<\/b> hơn khoá gồm 3 trường tenBannhac, tenNhacsi, tenCasi."},{"q":"Trong bảng banthuam, tên ca sĩ Trần Khánh xuất hiện ở nhiều dòng. Điều đó gây bất lợi gì?","a":"<b>Lặp lại<\/b> dữ liệu → tốn dung lượng; khi sửa tên ca sĩ phải <b>sửa ở tất cả<\/b> các dòng, dễ sai, không nhất quán."},{"q":"<i>Đúng hay Sai?<\/i><br>“Để quản lí bản thu âm, tốt nhất gộp hết vào <b>một bảng<\/b> chứa đủ tên bản nhạc, nhạc sĩ, ca sĩ.”","a":"<b>Sai.<\/b> Nên tách thành nhiều bảng (casi, nhacsi, bannhac, banthuam) liên kết qua khoá để <b>tránh lặp<\/b>, dễ sửa."},{"q":"Để khắc phục tên ca sĩ bị lặp, SGK tạo thêm bảng nào và thay trường nào trong bảng banthuam?","a":"Tạo bảng <b>casi(idCasi, tenCasi)<\/b>; thay trường <b>tenCasi<\/b> trong banthuam bằng <b>idCasi<\/b> (khoá ngoài)."},{"q":"Sau khi tổ chức lại, CSDL mymusic gồm những bảng nào?","a":"<b>casi<\/b>(idCasi, tenCasi) · <b>nhacsi<\/b>(idNhacsi, tenNhacsi) · <b>bannhac<\/b>(idBannhac, tenBannhac, idNhacsi) · <b>banthuam<\/b>(idBanthuam, idBannhac, idCasi)."},{"q":"Trong bảng <b>banthuam(idBanthuam, idBannhac, idCasi)<\/b>, trường nào là khoá chính, trường nào là khoá ngoài? Tham chiếu tới đâu?","a":"Khoá chính: <b>idBanthuam<\/b>. Khoá ngoài: <b>idBannhac<\/b> → bảng bannhac; <b>idCasi<\/b> → bảng casi."}],"mcq":[{"m":"TH","q":"Trong bảng banthuam(idBanthuam, tenBannhac, tenNhacsi, tenCasi), trường làm khoá chính là","o":["idBanthuam","tenBannhac","tenNhacsi","tenCasi"],"g":"idBanthuam ngắn gọn, duy nhất, thuận tiện làm khoá chính."},{"m":"TH","q":"Vì sao nên tách bảng banthuam thành các bảng casi, bannhac, nhacsi?","o":["Để tránh lặp lại tên nhiều lần","Để tăng thêm số cột của bảng","Để các bảng không cần khoá chính","Để dữ liệu khó bị người khác tìm"],"g":"Tên lặp lại → tách bảng, thay tên bằng mã."},{"m":"NB","q":"Kiểu dữ liệu thường chọn cho trường khoá chính dạng mã số tự tăng là","o":["INT, AUTO_INCREMENT","VARCHAR(255), cho phép rỗng","DATE, ngày tạo bản ghi","BOOLEAN, chỉ đúng hoặc sai"],"g":"Khoá chính: INT, AUTO_INCREMENT."},{"m":"NB","q":"Kiểu dữ liệu phù hợp cho trường tên bản nhạc là","o":["VARCHAR(255)","INT AUTO_INCREMENT","BOOLEAN","DATE"],"g":"Tên: VARCHAR(255)."},{"m":"TH","q":"Khoá UNIQUE trên cặp trường (tenBannhac, idNhacsi) đảm bảo","o":["cặp giá trị đó không bị trùng","hai trường luôn rỗng","hai trường tự tăng","bảng không có khoá chính"],"g":"Unique: cặp không được trùng."},{"m":"TH","q":"Mỗi bảng trong CSDL quan hệ có","o":["một khoá chính","nhiều khoá chính","không có khoá nào","đúng hai khoá ngoài"],"g":"Mỗi bảng một khoá chính."}],"tf":[{"q":"Nhóm Linh thiết kế CSDL quản lí bản thu âm: một bản nhạc có nhiều ca sĩ thể hiện.","y":["Nếu lưu tên ca sĩ trực tiếp trong bảng banthuam thì tên sẽ lặp lại nhiều lần.","Bảng casi nên có khoá chính idCasi.","idCasi trong bảng banthuam là khoá ngoài tham chiếu bảng casi.","Nên tạo bảng trước rồi mới thiết kế cấu trúc."],"d":[true,true,true,false],"g":["Dẫn tới dư thừa.","Thay tên bằng mã.","Khoá ngoài.","Thiết kế trước, tạo bảng sau."]}],"td":[{"m":"NB","q":"Trong bảng banthuam(idBanthuam, tenBannhac, tenNhacsi, tenCasi), trường nào được chọn làm khoá chính?","o":["idBanthuam","tenBannhac","tenNhacsi","tenCasi"],"g":"SGK: trường idBanthuam xác định duy nhất một bản thu âm nên được lấy làm khoá chính."},{"m":"NB","q":"Khi viết mô tả bảng, tên trường khoá chính được thể hiện thế nào?","o":["Gạch chân","In nghiêng","Tô màu đỏ","Viết hoa toàn bộ"],"g":"SGK: viết lại mô tả bảng với tên trường khoá chính có gạch chân."},{"m":"NB","q":"Bảng casi sau khi tổ chức lại gồm các trường nào?","o":["idCasi, tenCasi","idCasi, tenBannhac","idBannhac, idCasi","idNhacsi, tenNhacsi"],"g":"SGK: lập bảng casi(idCasi, tenCasi) với trường khoá là idCasi."},{"m":"NB","q":"Bảng bannhac cuối cùng (Hình 18.1) gồm các trường nào?","o":["idBannhac, tenBannhac, idNhacsi","idBannhac, tenBannhac, tenNhacsi","idBanthuam, idBannhac, idCasi","idCasi, tenCasi, idNhacsi"],"g":"SGK: bannhac(idBannhac, tenBannhac, idNhacsi)."},{"m":"NB","q":"Bảng banthuam cuối cùng (Hình 18.1) gồm các trường nào?","o":["idBanthuam, idBannhac, idCasi","idBanthuam, tenBannhac, tenCasi","idBannhac, tenBannhac, idNhacsi","idCasi, tenCasi"],"g":"SGK: banthuam(idBanthuam, idBannhac, idCasi)."},{"m":"NB","q":"Khoá chính thường có kiểu nào để đơn giản?","o":["INT tự động tăng","VARCHAR(255) cố định","BOOLEAN hai giá trị","DATE ngày tháng"],"g":"SGK: các trường khoá chính thường có kiểu INT và tự động tăng giá trị (AUTO_INCREMENT)."},{"m":"NB","q":"Các trường tenNhacsi, tenCasi, tenBannhac có thể chọn kiểu nào?","o":["VARCHAR(255)","INT","BOOLEAN","TIME"],"g":"SGK: có thể chọn là xâu kí tự có độ dài tối đa 255 kí tự (VARCHAR(255))."},{"m":"NB","q":"Khoá không cho phép các giá trị bị lặp lại, ngoài khoá chính, được gọi là gì?","o":["Khoá cấm trùng lặp (Unique)","Khoá ngoài","Khoá tạm thời","Khoá mật khẩu"],"g":"SGK: khoá cấm trùng lặp giá trị (Unique)."},{"m":"NB","q":"Trong bảng bannhac, trường idNhacsi là khoá ngoài tham chiếu đến bảng nào?","o":["nhacsi","casi","banthuam","bannhac"],"g":"SGK: bannhac: idNhacsi tham chiếu đến idNhacsi trong bảng nhacsi."},{"m":"NB","q":"Bảng 18.1 ghi chép thông tin bản thu âm gồm những cột nào?","o":["STT, bản nhạc, nhạc sĩ, ca sĩ","STT, tên ca sĩ, ngày sinh, nơi sinh","STT, điểm, môn học, lớp","STT, tên sách, tác giả, năm"],"g":"Bảng 18.1: STT, Tên bản nhạc, Tên nhạc sĩ, Tên ca sĩ."},{"m":"TH","q":"Vì sao chọn idBanthuam làm khoá chính thay cho nhóm (tenBannhac, tenNhacsi, tenCasi)?","o":["Ngắn gọn và thuận lợi hơn","Nhóm ba trường bị trùng giá trị","idBanthuam là tên bài hát","Nhóm ba trường không phải khoá"],"g":"SGK: nhóm ba trường cũng có thể làm khoá chính nhưng dùng idBanthuam ngắn gọn và thuận lợi hơn."},{"m":"TH","q":"Vì sao tách tên ca sĩ ra bảng casi?","o":["Tên ca sĩ lặp lại, dài, khó sửa","Ca sĩ không liên quan bản thu","Để bảng banthuam có thêm cột","Vì tên ca sĩ là số nguyên"],"g":"SGK: tenCasi có giá trị lặp lại, dài, làm lớn dung lượng, khó sửa chữa (sửa ở mọi dòng có ca sĩ đó)."},{"m":"TH","q":"Sau khi tách bảng casi, trường idCasi trong banthuam là gì?","o":["Khoá ngoài tham chiếu casi","Khoá chính của banthuam","Trường tên ca sĩ","Trường lưu ngày thu âm"],"g":"SGK: idCasi trong bảng banthuam là khoá ngoài tham chiếu đến khoá chính idCasi trong bảng casi."},{"m":"TH","q":"Vì sao tạo bảng bannhac riêng?","o":["Một bản nhạc có nhiều bản thu âm","Mỗi bản nhạc chỉ có một ca sĩ","Bản nhạc không có tên","Để xoá bớt bản thu âm"],"g":"SGK: một bản nhạc có thể có nhiều bản thu âm (Trường ca sông Lô ở dòng 2 và 9)."},{"m":"TH","q":"Vì sao lập bảng nhacsi(idNhacsi, tenNhacsi)?","o":["Tên nhạc sĩ bị lặp lại trong bannhac","Nhạc sĩ không sáng tác bản nhạc","Để thêm tên ca sĩ","Vì nhạc sĩ là khoá chính"],"g":"SGK: tên nhạc sĩ trong bảng bannhac bị lặp lại do một nhạc sĩ có thể sáng tác nhiều bản nhạc."},{"m":"TH","q":"Cặp (tenBannhac, idNhacsi) trong bảng bannhac đặt khoá cấm trùng lặp nhằm","o":["Không lưu trùng bài của một nhạc sĩ","Cho phép nhập trùng bài hát","Xoá các bản nhạc cùng tên","Đổi tên nhạc sĩ tự động"],"g":"SGK: cặp (tenBannhac, idNhacsi) không được trùng lặp giá trị."},{"m":"TH","q":"Cặp (idBannhac, idCasi) trong banthuam không được trùng lặp có nghĩa là","o":["Ca sĩ không thu một bài hai lần","Một bài chỉ có đúng một ca sĩ","Một ca sĩ chỉ hát một bài","Mỗi ca sĩ có hai mã"],"g":"SGK: cặp (idBannhac, idCasi) cũng không được trùng lặp giá trị."},{"m":"TH","q":"Tổ chức lại CSDL thành nhiều bảng giúp đạt thuộc tính nào?","o":["Hạn chế dư thừa, dễ nhất quán","Tăng dung lượng lưu trữ dữ liệu","Bỏ được khoá chính của bảng","Không cần dùng hệ QTCSDL"],"g":"Mục đích tổ chức lại: phân tích, sắp xếp để hạn chế lượng dữ liệu lặp lại."},{"m":"TH","q":"Trong Hình 18.2, mũi tên nối idCasi của banthuam tới idCasi của casi thể hiện","o":["Tham chiếu từ khoá ngoài đến khoá chính","Sao chép dữ liệu giữa hai bảng","Xoá dữ liệu ở bảng casi","Hai bảng có cùng số dòng"],"g":"Hình 18.2: quan hệ tham chiếu khoá ngoài → khoá chính."},{"m":"TH","q":"Bảng banthuam có mấy khoá ngoài?","o":["2","1","3","0"],"g":"SGK: banthuam có idBannhac tham chiếu bannhac và idCasi tham chiếu casi."},{"m":"TH","q":"Bảng nào trong Hình 18.1 không có khoá ngoài?","o":["casi và nhacsi","bannhac và banthuam","chỉ banthuam","chỉ bannhac"],"g":"casi và nhacsi chỉ có khoá chính và tên; bannhac có idNhacsi; banthuam có idBannhac, idCasi."},{"m":"TH","q":"Tự động tăng giá trị (AUTO_INCREMENT) cho khoá chính có lợi gì?","o":["Mỗi dòng mới tự có mã không trùng","Khoá chính được nhập bằng chữ","Cho phép khoá chính trùng nhau","Xoá dữ liệu cũ tự động"],"g":"Kiểu INT tự động tăng giúp đơn giản: hệ QTCSDL tự cấp mã mới không trùng."},{"m":"TH","q":"Sau khi tổ chức lại, muốn sửa tên ca sĩ Trần Khánh, ta sửa ở đâu?","o":["Một dòng trong bảng casi","Mọi dòng có Trần Khánh ở banthuam","Bảng nhacsi và bảng bannhac","Không thể sửa được"],"g":"Tên ca sĩ chỉ lưu một lần trong bảng casi."},{"m":"TH","q":"Quy ước “tên ca sĩ” có thể là tên một nhóm ca sĩ có ý nghĩa gì?","o":["Nhóm coi như một ca sĩ","Mỗi thành viên phải có bảng riêng","Không lưu được nhóm ca sĩ","Phải xoá nhóm khỏi CSDL"],"g":"SGK: quy ước nói đến tên ca sĩ là nói đến tên một ca sĩ hay một nhóm ca sĩ biểu diễn tác phẩm."},{"m":"TH","q":"Vì sao cần xác định cấu trúc bảng và khoá trước khi tạo lập CSDL?","o":["CSDL hợp lí, ít dư thừa","Để khỏi phải nhập dữ liệu vào bảng","Để không cần dùng câu lệnh SQL","Để máy tính tự đặt tên các bảng"],"g":"Mục tiêu bài: hình dung việc xác định các bảng, cấu trúc và trường khoá trước khi bước vào tạo lập CSDL."},{"m":"VD","q":"Trong Bảng 18.1, ca sĩ Trần Khánh thể hiện mấy bản nhạc?","o":["2","1","3","4"],"g":"Dòng 3 (Tình ca) và dòng 9 (Trường ca Sông Lô)."},{"m":"VD","q":"Theo Bảng 18.2, idCasi của Doãn Tần là","o":["5","1","3","4"],"g":"Bảng 18.2: 5 – Doãn Tần."},{"m":"VD","q":"Theo Bảng 18.5, bản thu âm có idBanthuam = 9 là bản nhạc nào do ai thể hiện?","o":["Trường ca Sông Lô – Trần Khánh","Tiến về Hà Nội – Quốc Hương","Tình ca – Trần Khánh","Xa khơi – Tân Nhân"],"g":"idBannhac 2 = Trường ca Sông Lô; idCasi 1 = Trần Khánh."},{"m":"VD","q":"Kết quả truy vấn SELECT COUNT(*) FROM banthuam WHERE idCasi = 4; là","o":["3","2","4","1"],"g":"idCasi 4 (Quốc Hương) xuất hiện ở bản thu 5, 7, 10."},{"m":"VD","q":"Kết quả truy vấn SELECT tenBannhac FROM bannhac WHERE idNhacsi = 3 ORDER BY tenBannhac; là","o":["Nhạc rừng, Tình ca","Tình ca, Nhạc rừng","Xa khơi, Tình ca","Du kích sông Thao, Tình ca"],"g":"idNhacsi 3 (Hoàng Việt): Tình ca, Nhạc rừng; sắp xếp theo tên: Nhạc rừng trước."},{"m":"VD","q":"Bản nhạc “Tiến về Hà Nội” (idBannhac = 6) có bao nhiêu bản thu âm? Kết quả SELECT COUNT(*) FROM banthuam WHERE idBannhac = 6; là","o":["2","1","3","0"],"g":"Bản thu 6 (Doãn Tần) và 10 (Quốc Hương)."},{"m":"VD","q":"Muốn quản lí thêm ngày sinh của nhạc sĩ (Luyện tập 1), cách thay đổi hợp lí là","o":["Thêm trường ngaySinh vào bảng nhacsi","Thêm trường ngaySinh vào bảng banthuam","Tạo cột ngày sinh ở bảng bannhac","Đổi tên bảng nhacsi"],"g":"Ngày sinh là thuộc tính của nhạc sĩ nên thêm vào bảng nhacsi (tương tự với bảng casi)."},{"m":"VD","q":"Trường ngày sinh thêm vào bảng casi nên chọn kiểu dữ liệu nào?","o":["DATE","INT","BOOLEAN","VARCHAR(2)"],"g":"Ngày sinh là ngày tháng → kiểu DATE ('YYYY-MM-DD')."},{"m":"VD","q":"Muốn quản lí nơi sinh (tỉnh/thành phố) của nhạc sĩ, ca sĩ mà tránh lặp tên tỉnh (Luyện tập 2), nên","o":["Tạo bảng tinh(idTinh, tenTinh), thêm idTinh","Ghi tên tỉnh vào mọi bảng","Thêm cột tên tỉnh ở banthuam","Không lưu nơi sinh nữa"],"g":"Tên tỉnh lặp lại → tách bảng tinh; bảng nhacsi, casi dùng idTinh làm khoá ngoài."},{"m":"VD","q":"Sau khi thêm bảng tinh(idTinh, tenTinh), trường idTinh trong bảng casi là","o":["Khoá ngoài tham chiếu bảng tinh","Khoá chính của bảng casi","Trường cấm trùng lặp","Trường không có kiểu"],"g":"idTinh là khoá chính của tinh nên là khoá ngoài trong casi."},{"m":"VD","q":"Quản lí danh sách tên quận/huyện của các tỉnh thành (Vận dụng). Cấu trúc hợp lí là","o":["tinh(idTinh, tenTinh); huyen(idHuyen, tenHuyen, idTinh)","huyen(tenHuyen, tenTinh) duy nhất một bảng","tinh(idTinh, tenHuyen, tenTinh)","huyen(idTinh, idHuyen) không có tên"],"g":"Tên tỉnh lặp lại cho mỗi huyện → tách bảng tinh; huyen có khoá ngoài idTinh."},{"m":"VD","q":"Trong bảng huyen(idHuyen, tenHuyen, idTinh), cặp nào nên đặt khoá cấm trùng lặp?","o":["(tenHuyen, idTinh)","(idHuyen, tenHuyen)","(idTinh)","(tenHuyen)"],"g":"Hai tỉnh có thể có huyện trùng tên; trong một tỉnh không có hai huyện trùng tên."},{"m":"VD","q":"Nhập thêm dòng (11, 9, 2) vào banthuam trong khi bannhac không có idBannhac = 9. Ràng buộc nào bị vi phạm?","o":["Khoá ngoài idBannhac","Khoá chính idCasi","Kiểu dữ liệu VARCHAR","Khoá cấm trùng tenCasi"],"g":"idBannhac là khoá ngoài, giá trị phải tồn tại ở khoá chính của bảng bannhac."},{"m":"VD","q":"Nhập thêm bản thu âm (11, 2, 2) vào banthuam. Ràng buộc nào bị vi phạm?","o":["Cặp (idBannhac, idCasi) trùng","Khoá ngoài idBannhac","Khoá chính idBanthuam","Không vi phạm gì"],"g":"Đã có bản thu 2 với (2, 2): Lê Dung hát Trường ca Sông Lô — cặp cấm trùng lặp."},{"m":"VD","q":"Kết quả SELECT COUNT(*) FROM nhacsi; trên CSDL sau tổ chức lại là","o":["4","5","8","10"],"g":"Bảng nhacsi có 4 nhạc sĩ."},{"m":"VDC","q":"Kết quả truy vấn sau là gì?\nSELECT tenCasi FROM banthuam INNER JOIN casi ON banthuam.idCasi = casi.idCasi WHERE idBanthuam = 4;","o":["Tân Nhân","Trần Khánh","Lê Dung","Quốc Hương"],"g":"Bản thu 4 có idCasi = 3 → Tân Nhân."},{"m":"VDC","q":"Kết quả truy vấn sau là gì?\nSELECT tenNhacsi FROM bannhac INNER JOIN nhacsi ON bannhac.idNhacsi = nhacsi.idNhacsi WHERE tenBannhac = 'Nhạc rừng';","o":["Hoàng Việt","Văn Cao","Đỗ Nhuận","Nguyễn Tài Tuệ"],"g":"Nhạc rừng có idNhacsi = 3 → Hoàng Việt."},{"m":"VDC","q":"Liên kết ba bảng banthuam, bannhac, casi: có bao nhiêu bản thu âm nhạc của Văn Cao (idNhacsi = 2)? Kết quả COUNT là","o":["4","2","3","5"],"g":"Bài của Văn Cao: idBannhac 2, 6; các bản thu: 2, 9 (bài 2) và 6, 10 (bài 6) → 4."},{"m":"VDC","q":"Kết quả truy vấn đếm số ca sĩ khác nhau đã thu âm bài của nhạc sĩ Nguyễn Tài Tuệ (idNhacsi = 4) là","o":["2","1","3","4"],"g":"Bài 4 (Tân Nhân), bài 8 (Lê Dung) → 2 ca sĩ."},{"m":"VDC","q":"Lợi ích khi tổ chức CSDL âm nhạc thành bốn bảng như Hình 18.1 là","o":["Ít lặp lại, sửa một nơi","Truy vấn không cần liên kết bảng","Không cần khoá chính, khoá ngoài","Dung lượng tăng lên nhiều lần"],"g":"Câu hỏi SGK: hạn chế dữ liệu lặp, sửa tên chỉ một nơi, đảm bảo nhất quán, tiết kiệm lưu trữ."},{"m":"VDC","q":"Vì sao Bảng 18.3 (đã thay tenCasi bằng idCasi) vẫn chưa tối ưu?","o":["Tên bài, tên nhạc sĩ vẫn còn lặp","Không còn ca sĩ nào trong bảng","idCasi bị trùng ở mọi dòng","Bảng không còn khoá chính"],"g":"Bảng 18.3 vẫn lặp “Trường ca Sông Lô – Văn Cao”, “Tiến về Hà Nội – Văn Cao”… nên tiếp tục tách bảng bannhac."},{"m":"VDC","q":"Sắp xếp các bước phân tích để thiết lập mô hình dữ liệu (Vận dụng): (1) tổ chức lại bảng hạn chế lặp; (2) xem xét bài toán; (3) xác định khoá chính, khoá ngoài; (4) tạo bảng chung đủ thông tin.","o":["2 – 4 – 1 – 3","4 – 2 – 1 – 3","2 – 1 – 4 – 3","2 – 4 – 3 – 1"],"g":"SGK: xem xét bài toán → tạo lập bảng → tổ chức lại bảng dữ liệu → các loại khoá."},{"m":"VDC","q":"Một nhạc sĩ trùng tên với nhạc sĩ khác. Cách CSDL phân biệt hai người là","o":["Dùng idNhacsi khác nhau, thêm ngày sinh","Bắt đổi tên một người","Gộp chung thành một nhạc sĩ","Xoá một người khỏi CSDL"],"g":"Luyện tập 1: khoá chính idNhacsi phân biệt; thêm ngày sinh để người dùng nhận biết."},{"m":"VDC","q":"Bỏ khoá cấm trùng (idBannhac, idCasi) thì rủi ro gì có thể xảy ra?","o":["Một bản thu được nhập hai lần","Không nhập được bản thu mới","Mất toàn bộ bảng casi","Khoá chính idBanthuam bị xoá"],"g":"Không có ràng buộc, cùng một ca sĩ – bài hát có thể bị lưu nhiều lần (dư thừa, sai thống kê)."},{"m":"VDC","q":"Trong bảng huyen(idHuyen, tenHuyen, idTinh), nếu xoá một tỉnh trong bảng tinh mà vẫn còn huyện tham chiếu thì","o":["Vi phạm ràng buộc khoá ngoài","Các huyện tự chuyển sang tỉnh khác","Bảng huyen tự thêm tỉnh mới","Bảng huyen tự xoá các huyện còn lại"],"g":"Huyện tham chiếu idTinh không còn tồn tại → vi phạm tham chiếu khoá ngoài."}],"db":[31,32,33,34,35,36,37,38,39,46,47,49],"noi":{"noi":"Thiên tài là một phần trăm cảm hứng và chín mươi chín phần trăm mồ hôi.","tg":"Thomas Edison — nhà phát minh","nguon":"Câu nói được báo chí ghi lại khoảng năm 1903","y":"Phân tích bảng, tìm khoá cần kiên trì từng bước — mồ hôi hôm nay là thành quả ngày mai."}},{"so":19,"cd":6,"ten":"Thực hành tạo lập cơ sở dữ liệu và các bảng","trang":"91–94","muctieu":["Biết tạo mới một CSDL qua giao diện của phần mềm khách quản trị CSDL HeidiSQL.","Tạo được bảng không có khoá ngoài, chỉ định khoá chính, khoá cấm trùng lặp cho trường không được trùng giá trị."],"muc":[{"t":"Tạo lập CSDL mymusic","icon":"🆕","b":["Chuột phải vùng danh sách CSDL → <b>Tạo mới → Cơ sở dữ liệu<\/b>.","Nhập tên <b>mymusic<\/b>; bộ mã utf8mb4.","HeidiSQL tự sinh câu <code>CREATE DATABASE<\/code>."]},{"t":"Khai báo bảng, trường, kiểu","icon":"🧮","b":["<b>Tạo mới → Bảng<\/b>, tên <b>nhacsi<\/b> → Thêm mới trường.","<b>idNhacsi<\/b>: INT, bỏ Allow NULL, AUTO_INCREMENT.","<b>tenNhacsi<\/b>: VARCHAR(255) (Ctrl+Insert thêm trường)."]},{"t":"Khoá chính và lưu kết quả","icon":"🔑","b":["Chuột phải idNhacsi → <b>Create new index → PRIMARY<\/b>.","Chọn nhầm khoá → sửa lại ở ô PRIMARY KEY.","Nhấn <b>Lưu<\/b> → bảng hiện dưới mymusic."]}],"ghinho":"Mỗi bảng cần: tên, các trường, kiểu dữ liệu và một khoá chính – nhớ Lưu trước khi rời đi.","vandung":"Lập CSDL quản lí tên Quận/Huyện, Tỉnh/Thành phố; tạo bảng Tỉnh/Thành phố.","the":[{"q":"Muốn tạo CSDL mới trong HeidiSQL, nháy phải chuột vào vùng danh sách CSDL, chọn gì?","a":"<b>Tạo mới → Cơ sở dữ liệu<\/b>, nhập tên (VD mymusic), chọn OK."},{"q":"Khi tạo CSDL mymusic, bộ mã kí tự mặc định là gì?","a":"<b>Unicode 4 byte: utf8mb4<\/b> (đối chiếu so sánh xâu theo utf8mb4_general_ci)."},{"q":"Trường <b>idNhacsi<\/b> được khai báo kiểu dữ liệu gì? Trường <b>tenNhacsi<\/b> kiểu gì?","a":"idNhacsi: <b>INT<\/b>. tenNhacsi: <b>VARCHAR(255)<\/b>."},{"q":"Phím tắt nào dùng để <b>thêm trường<\/b> (cột) khi khai báo bảng?","a":"<b>Ctrl + Insert<\/b> (hoặc nháy phải chuột → Add column)."},{"q":"Khai báo khoá chính trong HeidiSQL thế nào?","a":"Nháy phải chuột vào dòng khai báo trường → <b>Create new index → PRIMARY<\/b>."},{"q":"Thuộc tính <b>AUTO_INCREMENT<\/b> của trư :"TH","q":"Khi chọn bộ lọc LIKE \"%...\" và nhập P, HeidiSQL sinh câu truy vấn nào ở vùng mã lệnh?","o":["SELECT * FROM mymusic.nhacsi WHERE tenNhacsi LIKE '%P%'","DELETE FROM nhacsi WHERE tenNhacsi = 'P'","UPDATE nhacsi SET tenNhacsi = 'P'","INSERT INTO nhacsi VALUES ('P')"],"g":"Hình 21.12: vùng mã lệnh hiện câu SELECT … WHERE tenNhacsi LIKE '%P%'."},{"m":"TH","q":"Một câu truy vấn có ORDER BY tenNhacsi DESC, idNhacsi ASC sắp xếp thế nào?","o":["Tên giảm dần, trùng tên thì mã tăng","Mã giảm dần, trùng mã thì tên tăng","Chỉ sắp xếp theo tên tăng dần","Chỉ sắp xếp theo mã giảm dần"],"g":"SGK: sắp xếp theo tên trường thứ nhất, nếu bằng nhau thì theo tên trường thứ hai."},{"m":"TH","q":"Chọn bảng nhacsi và thẻ Dữ liệu, HeidiSQL ngầm chạy câu nào (Hình 21.8)?","o":["SELECT * FROM mymusic.nhacsi LIMIT 1000;","DELETE FROM mymusic.nhacsi WHERE idNhacsi > 0;","CREATE TABLE mymusic.nhacsi (idNhacsi INT);","DROP TABLE mymusic.nhacsi CASCADE;"],"g":"Hình 21.8: vùng mã lệnh hiện SELECT * FROM `mymusic`.`nhacsi` LIMIT 1000;"},{"m":"VD","q":"Kết quả của SELECT idNhacsi, tenNhacsi FROM nhacsi WHERE tenNhacsi LIKE 'P%' ORDER BY tenNhacsi; là","o":["7 Phan Huỳnh Điểu, 6 Phan Nhân","6 Phan Nhân, 7 Phan Huỳnh Điểu","5 Nguyễn Văn Tý, 6 Phan Nhân","3 Hoàng Việt, 7 Phan Huỳnh Điểu"],"g":"Hình 21.14: hai nhạc sĩ bắt đầu bằng P, sắp theo tên: “Phan Huỳnh Điểu” trước “Phan Nhân”."},{"m":"VD","q":"Kết quả của SELECT COUNT(*) FROM nhacsi WHERE tenNhacsi LIKE 'Nguyễn%'; là","o":["2","1","3","0"],"g":"Nguyễn Tài Tuệ và Nguyễn Văn Tý."},{"m":"VD","q":"Kết quả của SELECT tenNhacsi FROM nhacsi ORDER BY idNhacsi DESC LIMIT 1; là","o":["Phan Huỳnh Điểu","Đỗ Nhuận","Phan Nhân","Văn Cao"],"g":"idNhacsi lớn nhất là 7 — Phan Huỳnh Điểu."},{"m":"VD","q":"Kết quả của SELECT tenNhacsi FROM nhacsi WHERE idNhacsi = 2 OR idNhacsi = 6 ORDER BY idNhacsi; là","o":["Văn Cao, Phan Nhân","Phan Nhân, Văn Cao","Văn Cao, Phan Huỳnh Điểu","Đỗ Nhuận, Phan Nhân"],"g":"idNhacsi 2 = Văn Cao, 6 = Phan Nhân."},{"m":"VD","q":"Kết quả của SELECT tenNhacsi FROM nhacsi WHERE tenNhacsi LIKE 'P%' AND (idNhacsi = 2 OR idNhacsi = 6); là","o":["Phan Nhân","Văn Cao","Phan Huỳnh Điểu","Không có dòng nào"],"g":"Ví dụ SGK: chỉ Phan Nhân (id 6) vừa bắt đầu bằng P vừa có id 2 hoặc 6."},{"m":"VD","q":"Sau khi thêm hàng tenNhacsi = 'Trịnh Công Sơn' vào bảng nhacsi đang có idNhacsi 1–7, kết quả SELECT MAX(idNhacsi) FROM nhacsi; là","o":["8","7","1","0"],"g":"AUTO_INCREMENT tự cấp giá trị tiếp theo là 8."},{"m":"VD","q":"Câu nào sắp xếp danh sách nhạc sĩ theo idNhacsi giảm dần?","o":["SELECT * FROM nhacsi ORDER BY idNhacsi DESC;","SELECT * FROM nhacsi ORDER BY idNhacsi ASC;","SELECT * FROM nhacsi WHERE idNhacsi DESC;","SELECT DESC * FROM nhacsi;"],"g":"ORDER BY <tên trường> DESC sắp xếp giảm dần."},{"m":"VD","q":"Câu nào lấy các ca sĩ có tên kết thúc bằng “Dung” trong bảng casi?","o":["SELECT * FROM casi WHERE tenCasi LIKE '%Dung';","SELECT * FROM casi WHERE tenCasi LIKE 'Dung%';","SELECT * FROM casi WHERE tenCasi = '%Dung%';","SELECT * FROM casi ORDER BY 'Dung';"],"g":"'%Dung': dãy kí tự bất kì rồi kết thúc bằng Dung."},{"m":"VD","q":"Luyện tập 2: lấy tất cả ca sĩ, sắp xếp theo tên tăng dần. Câu đúng là","o":["SELECT * FROM casi ORDER BY tenCasi ASC;","SELECT * FROM casi ORDER BY tenCasi DESC;","SELECT tenCasi ASC FROM casi;","SELECT * FROM casi WHERE ASC;"],"g":"Truy xuất bảng casi theo các tiêu chí khác nhau."},{"m":"VD","q":"Vận dụng: lấy các tỉnh có tên bắt đầu bằng “Hà” trong bảng tinh. Câu đúng là","o":["SELECT * FROM tinh WHERE tenTinh LIKE 'Hà%';","SELECT * FROM tinh WHERE tenTinh LIKE '%Hà';","SELECT * FROM tinh WHERE tenTinh = 'Hà';","SELECT Hà FROM tinh;"],"g":"'Hà%' — bắt đầu bằng Hà: Hà Nội, Hà Giang, Hà Nam, Hà Tĩnh…"},{"m":"VD","q":"Lan nhập nhầm 4 dòng liền nhau trong bảng casi. Cách xoá nhanh là","o":["Giữ Shift chọn 4 dòng, nhấn Ctrl+Delete","Giữ Alt chọn từng dòng, nhấn Insert","Nháy đúp từng ô rồi xoá chữ","Xoá cả bảng casi rồi tạo lại"],"g":"Shift chọn dòng liền nhau, Ctrl+Delete xoá, chọn OK để xác nhận."},{"m":"VD","q":"Mai cần xoá dòng 2 và dòng 5 (không liền nhau) trong bảng tinh. Mai làm thế nào?","o":["Giữ Ctrl nháy chọn hai dòng, Ctrl+Delete","Giữ Shift nháy dòng 2 và dòng 5","Nhấn Insert hai lần","Chọn Quick Filter rồi Lưu"],"g":"Ctrl để chọn những dòng tách rời nhau."},{"m":"VD","q":"Sau khi lọc tenNhacsi LIKE '%P%', muốn xem lại toàn bộ dữ liệu, em","o":["Chọn Dọn dẹp và Lọc","Đóng HeidiSQL rồi mở lại","Xoá các dòng không có P","Thêm hàng mới chữ P"],"g":"SGK Hình 21.13: xoá bộ lọc đã thiết lập."},{"m":"VD","q":"Câu nào thêm tỉnh “Lào Cai” vào bảng tinh(idTinh AUTO_INCREMENT, tenTinh)?","o":["INSERT INTO tinh (tenTinh) VALUES ('Lào Cai');","UPDATE tinh SET tenTinh = 'Lào Cai';","SELECT 'Lào Cai' FROM tinh;","DELETE FROM tinh WHERE tenTinh = 'Lào Cai';"],"g":"Chỉ cần nhập tenTinh; idTinh tự tăng."},{"m":"VD","q":"Câu nào sửa tên tỉnh có idTinh = 5 thành “Hà Giang”?","o":["UPDATE tinh SET tenTinh = 'Hà Giang' WHERE idTinh = 5;","UPDATE tinh SET tenTinh = 'Hà Giang';","INSERT INTO tinh VALUES (5, 'Hà Giang');","SELECT 'Hà Giang' FROM tinh WHERE idTinh = 5;"],"g":"UPDATE … SET … WHERE … chỉ sửa đúng dòng thoả điều kiện."},{"m":"VDC","q":"Kết quả của SELECT COUNT(*) FROM nhacsi WHERE tenNhacsi LIKE '%n%'; (không phân biệt hoa thường với chữ cái Latin) là","o":["7","5","6","4"],"g":"LIKE không phân biệt hoa thường với chữ Latin: cả 7 tên đều có chữ n hoặc N (Nhuận, Văn, Hoàng, Nguyễn, Phan…)."},{"m":"VDC","q":"Sau khi chạy DELETE FROM nhacsi WHERE tenNhacsi LIKE 'Nguyễn%'; kết quả SELECT COUNT(*) FROM nhacsi; là","o":["5","7","6","2"],"g":"Xoá 2 nhạc sĩ họ Nguyễn: 7 − 2 = 5."},{"m":"VDC","q":"Lỗi nguy hiểm khi viết UPDATE nhacsi SET tenNhacsi = 'Hoàng Việt'; (quên WHERE) là","o":["Mọi dòng đều bị đổi tên","Chỉ dòng đầu bị đổi tên","Không dòng nào bị đổi","Bảng nhacsi bị xoá"],"g":"Thiếu WHERE, lệnh áp dụng cho mọi dòng của bảng."},{"m":"VDC","q":"Sau khi chạy UPDATE nhacsi SET tenNhacsi = 'Hoàng Hiệp' WHERE idNhacsi = 3; kết quả SELECT tenNhacsi FROM nhacsi WHERE idNhacsi = 3; là","o":["Hoàng Hiệp","Hoàng Việt","Văn Cao","Không có dòng nào"],"g":"Dòng có idNhacsi = 3 được đổi tên."},{"m":"VDC","q":"Câu lấy các nhạc sĩ có id từ 3 đến 6 và sắp xếp theo tên giảm dần là","o":["SELECT * FROM nhacsi WHERE idNhacsi >= 3 AND idNhacsi <= 6 ORDER BY tenNhacsi DESC;","SELECT * FROM nhacsi WHERE idNhacsi >= 3 OR idNhacsi <= 6 ORDER BY tenNhacsi DESC;","SELECT * FROM nhacsi WHERE idNhacsi = 3 AND idNhacsi = 6 ORDER BY tenNhacsi;","SELECT * FROM nhacsi ORDER BY tenNhacsi DESC WHERE idNhacsi >= 3;"],"g":"Khoảng giá trị dùng AND; ORDER BY đặt sau WHERE."},{"m":"VDC","q":"Kết quả của SELECT tenNhacsi FROM nhacsi WHERE idNhacsi > 3 AND idNhacsi < 6 ORDER BY idNhacsi DESC; là","o":["Nguyễn Văn Tý, Nguyễn Tài Tuệ","Nguyễn Tài Tuệ, Nguyễn Văn Tý","Phan Nhân, Nguyễn Văn Tý","Hoàng Việt, Nguyễn Tài Tuệ"],"g":"id 4, 5 sắp giảm dần: 5 Nguyễn Văn Tý, 4 Nguyễn Tài Tuệ."},{"m":"VDC","q":"Vì sao trong câu truy vấn, ORDER BY phải đặt sau WHERE?","o":["Lọc xong mới sắp xếp kết quả","Vì ORDER BY không được dùng","Vì WHERE không bắt buộc","Vì SQL đọc từ phải qua trái"],"g":"Cấu trúc SELECT … FROM … [WHERE …] [ORDER BY …]: lọc các dòng thoả điều kiện rồi sắp xếp kết quả."},{"m":"VDC","q":"Muốn biết có bao nhiêu tỉnh trong bảng tinh có chữ “Hà” trong tên, câu đúng là","o":["SELECT COUNT(*) FROM tinh WHERE tenTinh LIKE '%Hà%';","SELECT COUNT(tenTinh = 'Hà') FROM tinh;","SELECT * FROM tinh COUNT '%Hà%';","COUNT tinh WHERE tenTinh LIKE 'Hà';"],"g":"COUNT(*) kết hợp điều kiện LIKE '%Hà%'."},{"m":"VDC","q":"So sánh lọc bằng Quick Filter và viết câu SQL, nhận định nào đúng?","o":["Cùng sinh câu SELECT; SQL linh hoạt hơn","Quick Filter xoá dữ liệu, SQL thì không","Chỉ Quick Filter mới lọc được tên","SQL không lọc được theo chữ cái"],"g":"HeidiSQL hiện câu SELECT tương ứng khi lọc; tự viết SQL kết hợp được nhiều điều kiện, sắp xếp."},{"m":"VDC","q":"Sau khi xoá dòng idNhacsi = 7 rồi thêm nhạc sĩ mới, idNhacsi của dòng mới (AUTO_INCREMENT) th
