nh INSERT INTO banthuam (idBannhac, idCasi) VALUES (3, 9); cho kết quả nào?","o":["Bị từ chối","Thành công","Thêm ca sĩ 9","Đổi ca sĩ thành 1"],"g":"idCasi = 9 không có trong bảng casi."},{"m":"VD","q":"Kết quả SELECT tenBannhac FROM bannhac WHERE idNhacsi = 2 ORDER BY idBannhac; là","o":["Trường ca Sông Lô, Tiến về Hà Nội","Tiến về Hà Nội, Trường ca Sông Lô","Tình ca, Nhạc rừng","Xa khơi, Tình ca"],"g":"Danh sách bản nhạc của nhạc sĩ Văn Cao (yêu cầu thực hành của SGK)."},{"m":"VD","q":"Kết quả SELECT idBannhac FROM bannhac ORDER BY idBannhac DESC LIMIT 1; là","o":["8","1","7","10"],"g":"Truy xuất theo thứ tự giảm dần của idBannhac: lớn nhất là 8."},{"m":"VD","q":"Kết quả SELECT tenBannhac FROM bannhac ORDER BY tenBannhac LIMIT 1; là","o":["Du kích sông Thao","Nhạc rừng","Xa khơi","Tình ca"],"g":"Sắp theo tên tăng dần, “Du kích…” đứng đầu."},{"m":"VD","q":"Câu nào lấy danh sách tên bản nhạc của nhạc sĩ Văn Cao bằng cách liên kết hai bảng?","o":["SELECT tenBannhac FROM bannhac INNER JOIN nhacsi ON bannhac.idNhacsi = nhacsi.idNhacsi WHERE tenNhacsi = 'Văn Cao';","SELECT tenBannhac FROM bannhac INNER JOIN casi ON bannhac.idNhacsi = casi.idCasi WHERE tenCasi = 'Văn Cao';","SELECT tenNhacsi FROM nhacsi INNER JOIN bannhac ON bannhac.idNhacsi = nhacsi.idNhacsi WHERE tenBannhac = 'Văn Cao';","SELECT tenBannhac FROM bannhac INNER JOIN nhacsi ON bannhac.idBannhac = nhacsi.idNhacsi WHERE tenNhacsi = 'Văn Cao';"],"g":"Bảng bannhac không có tenNhacsi nên phải liên kết với nhacsi qua idNhacsi."},{"m":"VD","q":"Muốn xoá được nhạc sĩ Văn Cao khỏi bảng nhacsi, trước hết cần","o":["Xoá hoặc đổi bài tham chiếu","Đổi tên Văn Cao thành tên khác","Thêm một nhạc sĩ mới vào bảng","Tắt máy chủ MySQL đang chạy"],"g":"Chỉ khi không còn dòng bannhac nào tham chiếu idNhacsi = 2 mới xoá được."},{"m":"VD","q":"Luyện tập 1: thêm bản thu âm “Xa khơi” do Doãn Tần thể hiện vào banthuam. Giá trị (idBannhac, idCasi) đúng là","o":["(4, 5)","(5, 4)","(4, 3)","(3, 5)"],"g":"Xa khơi có idBannhac = 4; Doãn Tần có idCasi = 5."},{"m":"VD","q":"Kết quả SELECT COUNT(*) FROM banthuam WHERE idBannhac = 2; là","o":["2","1","3","4"],"g":"Luyện tập 2: bài Trường ca Sông Lô có 2 bản thu âm (2 và 9)."},{"m":"VD","q":"Vận dụng: thêm “Quận Hoàn Kiếm” thuộc Hà Nội (idTinh = 1) vào bảng huyen. Câu đúng là","o":["INSERT INTO huyen (tenHuyen, idTinh) VALUES ('Hoàn Kiếm', 1);","INSERT INTO tinh (tenTinh) VALUES ('Hoàn Kiếm');","UPDATE huyen SET idTinh = 'Hoàn Kiếm';","INSERT INTO huyen VALUES ('Hà Nội', 'Hoàn Kiếm');"],"g":"idHuyen tự tăng; idTinh là khoá ngoài phải có trong bảng tinh."},{"m":"VD","q":"Vận dụng: lấy các quận/huyện của tỉnh có idTinh = 1, sắp theo tên. Câu đúng là","o":["SELECT tenHuyen FROM huyen WHERE idTinh = 1 ORDER BY tenHuyen;","SELECT tenTinh FROM huyen WHERE idTinh = 1 ORDER BY tenHuyen;","SELECT * FROM tinh WHERE idHuyen = 1 ORDER BY tenTinh;","SELECT tenHuyen FROM tinh WHERE idTinh = 1 ORDER BY idTinh;"],"g":"Lọc theo khoá ngoài idTinh và sắp xếp theo tên huyện."},{"m":"VD","q":"Bình nhập bài “Tình ca” nhưng chọn nhầm nhạc sĩ Văn Cao thay vì Hoàng Việt. Cách sửa là","o":["Chọn lại Hoàng Việt ở ô idNhacsi","Xoá nhạc sĩ Văn Cao khỏi CSDL","Đổi tên Văn Cao thành Hoàng Việt","Xoá bảng bannhac và tạo lại"],"g":"Sửa dữ liệu khoá ngoài bằng cách chọn lại trong hộp danh sách (Hình 22.4)."},{"m":"VD","q":"Kết quả liên kết: tên ca sĩ của bản thu âm số 9 là","o":["Trần Khánh","Lê Dung","Quốc Hương","Doãn Tần"],"g":"Bản thu 9 có idCasi = 1 → Trần Khánh."},{"m":"VDC","q":"Liên kết banthuam, bannhac, casi: kết quả đếm số bản thu âm do Quốc Hương thể hiện là","o":["3","2","4","1"],"g":"Quốc Hương (4): bản thu 5, 7, 10."},{"m":"VDC","q":"Kết quả: tên ca sĩ đã thu âm bài “Tiến về Hà Nội”, sắp theo tên là","o":["Doãn Tần, Quốc Hương","Quốc Hương, Doãn Tần","Trần Khánh, Lê Dung","Lê Dung, Tân Nhân"],"g":"Bài 6: bản thu 6 (Doãn Tần), 10 (Quốc Hương)."},{"m":"VDC","q":"Lệnh UPDATE nhacsi SET idNhacsi = 20 WHERE idNhacsi = 1; (Đỗ Nhuận đang có bài) cho kết quả nào?","o":["Bị từ chối","Thành công","Tự đổi theo ở bannhac","Xoá các bài của Đỗ Nhuận"],"g":"Đổi khoá chính đang được tham chiếu làm các bài hát mất tham chiếu — bị từ chối."},{"m":"VDC","q":"Sắp xếp thứ tự xoá an toàn để loại bỏ hoàn toàn bài “Xa khơi” khỏi CSDL: (1) xoá dòng ở bannhac; (2) xoá các bản thu âm của bài ở banthuam.","o":["2 rồi 1","1 rồi 2","Chỉ cần 1","Chỉ cần 2"],"g":"banthuam tham chiếu bannhac: phải xoá dòng con trước, dòng cha sau."},{"m":"VDC","q":"Sau khi xoá bản thu 4 rồi xoá bài “Xa khơi” (idBannhac 4), lệnh xoá bài có thành công không?","o":["Thành công","Bị từ chối","Lỗi cú pháp","Xoá cả nhạc sĩ"],"g":"Không còn bản thu nào tham chiếu bài 4."},{"m":"VDC","q":"So sánh nhập liệu qua HeidiSQL với ứng dụng Hình 22.7, nhận định nào đúng?","o":["Ứng dụng hướng nghiệp vụ, dễ dùng hơn","HeidiSQL dễ dùng hơn với người quản lí","Ứng dụng phải nhớ cấu trúc bảng","Hai cách giống hệt nhau"],"g":"Nhiệm vụ 2: ứng dụng chuyên biệt tích hợp chức năng theo nghiệp vụ, người dùng không cần biết cấu trúc bảng."},{"m":"VDC","q":"Ví dụ nào là lỗi mà hệ QTCSDL KHÔNG tự phát hiện được?","o":["Gõ sai chính tả tên bản nhạc","Nhập idNhacsi không tồn tại","Xoá nhạc sĩ đang có bài","Trùng khoá chính idBannhac"],"g":"SGK lưu ý: lỗi không liên quan đến lôgic đã khai báo (sai tên) không bị ngăn chặn."},{"m":"VDC","q":"Vận dụng: xoá một tỉnh trong bảng tinh khi còn quận/huyện tham chiếu. Kết quả và cách xử lí đúng là","o":["Bị từ chối; chuyển hoặc xoá huyện trước","Thành công; huyện tự xoá theo","Thành công; huyện mất tỉnh","Bị từ chối; phải xoá cả CSDL"],"g":"Ràng buộc khoá ngoài huyen.idTinh → tinh.idTinh ngăn xoá dòng cha đang được tham chiếu."},{"m":"VDC","q":"Kết quả: số nhạc sĩ chưa có bản nhạc nào trong bảng bannhac là","o":["3","2","4","0"],"g":"Nhạc sĩ 5, 6, 7 chưa có bài."},{"m":"VDC","q":"Vì sao nói khoá ngoài giúp CSDL “toàn vẹn” nhưng không thay được sự cẩn thận của người nhập liệu?","o":["Chỉ kiểm tra tham chiếu","Vì khoá ngoài tự sửa mọi lỗi","Vì khoá ngoài chỉ dùng cho tên","Vì khoá ngoài làm dữ liệu chậm"],"g":"SGK: hệ QTCSDL chỉ ngăn lỗi theo lôgic đã khai báo; chọn nhầm nhạc sĩ hợp lệ về lôgic vẫn là sai."}],"db":[25,28,29,32,33,34,35,36,37,40,41,47],"noi":{"noi":"Tôi không thất bại. Tôi chỉ vừa tìm ra 10.000 cách không hiệu quả.","tg":"Thomas Edison — nhà phát minh","nguon":"Câu nói thường được gắn với ông","y":"Bị hệ QTCSDL báo lỗi khoá ngoài? Đó là bài học — đọc lỗi, sửa lại, em sẽ giỏi hơn."}},{"so":23,"cd":6,"ten":"Thực hành truy xuất dữ liệu qua liên kết các bảng","trang":"109–112","muctieu":["Hiểu được cách thức truy xuất dữ liệu qua liên kết các bảng."],"muc":[{"t":"Liên kết 2 bảng","icon":"🔗","b":["Ghép <b>bannhac<\/b> với <b>nhacsi<\/b> qua idNhacsi để có tên tác giả.","<code>SELECT … FROM A INNER JOIN B ON A.x = B.x;<\/code>","Đổi tên cột trùng bằng <b>as<\/b>; chạy bằng <b>F9<\/b> hoặc ▶."]},{"t":"Liên kết 3 bảng","icon":"🧬","b":["Bản thu âm đủ: idBanthuam, tenBannhac, tenCasi.","Lặp lại mệnh đề <code>INNER JOIN … ON …<\/code> cho bảng thứ ba.","HeidiSQL tô màu cú pháp, gợi ý tên trường khi gõ dấu chấm."]},{"t":"Ứng dụng Quản lí âm nhạc","icon":"🖥️","b":["Chọn bản nhạc, ca sĩ từ hộp danh sách.","Hiển thị đủ tên bản nhạc, nhạc sĩ, ca sĩ – hỗ trợ nhất quán dữ liệu."]}],"ghinho":"Dữ liệu tách ở nhiều bảng vẫn “gặp nhau” được nhờ JOIN theo khoá ngoài – khoá chính.","vandung":"Truy xuất bảng Quận/Huyện liên kết với bảng Tỉnh/Thành phố.","the":[{"q":"Mệnh đề nào dùng để <b>liên kết<\/b> hai bảng trong câu truy vấn SQL?","a":"<b>INNER JOIN … ON …<\/b>"},{"q":"Trong HeidiSQL, nhấn phím nào để <b>chạy<\/b> câu truy vấn?","a":"Phím <b>F9<\/b> (hoặc nháy biểu tượng ▶, hoặc nháy phải chuột → Chạy)."},{"q":"Mỗi khi gõ tên bảng và <b>dấu chấm<\/b> trong cửa sổ truy vấn, HeidiSQL hỗ trợ gì?","a":"Hiện ngay <b>danh sách tên trường<\/b> của bảng để chọn (ngoài ra còn tô <b>màu cú pháp<\/b>)."},{"q":"Vì sao bảng bannhac không có tenNhacsi mà vẫn lấy được danh sách bản nhạc kèm tên tác giả?","a":"Nhờ <b>khoá ngoài idNhacsi<\/b> tham chiếu bảng nhacsi → dùng <b>INNER JOIN<\/b> liên kết hai bảng để lấy tenNhacsi."},{"q":"Viết câu truy vấn lấy danh sách <b>tenBannhac<\/b> kèm <b>tenNhacsi<\/b>, liên kết bannhac và nhacsi.","a":"<div class='code'>SELECT bannhac.tenBannhac,\n  nhacsi.tenNhacsi\nFROM bannhac\n INNER JOIN nhacsi\n ON bannhac.idNhacsi\n  = nhacsi.idNhacsi;<\/div>"},{"q":"Liên kết nhiều hơn hai bảng bằng JOIN thế nào? Viết khung câu truy vấn liên kết 3 bảng a, b, c.","a":"Lặp lại mệnh đề INNER JOIN:<div class='code'>SELECT ...\nFROM a\n  INNER JOIN b ON a.x = b.x\n  INNER JOIN c ON b.y = c.y;<\/div>"},{"q":"<i>Thử thách:<\/i> Viết câu truy vấn lấy <b>idBanthuam, tenBannhac, tenCasi<\/b> từ 3 bảng banthuam, bannhac, casi.","a":"<div class='code'>SELECT banthuam.idBanthuam,\n bannhac.tenBannhac,\n casi.tenCasi\nFROM banthuam\nINNER JOIN bannhac ON\n banthuam.idBannhac\n  = bannhac.idBannhac\nINNER JOIN casi ON\n banthuam.idCasi\n  = casi.idCasi;<\/div>"}],"mcq":[{"m":"NB","q":"Mệnh đề SQL dùng để liên kết hai bảng là","o":["INNER JOIN … ON …","ORDER BY … DESC","GROUP … WITH …","WHERE … LIKE …"],"g":"SELECT … FROM A INNER JOIN B ON A.x = B.x;"},{"m":"TH","q":"Để có tên nhạc sĩ cho mỗi bản nhạc, ta liên kết bảng bannhac với nhacsi qua trường","o":["idNhacsi","idBannhac","tenBannhac","idCasi"],"g":"Ghép qua idNhacsi."},{"m":"TH","q":"Khi hai bảng có cột trùng tên, để đổi tên cột kết quả ta dùng","o":["as","is","to","by"],"g":"Đổi tên cột trùng bằng as."},{"m":"NB","q":"Phím tắt chạy truy vấn trong HeidiSQL là","o":["F9","F1","F12","Esc"],"g":"Chạy bằng F9 hoặc ▶."},{"m":"TH","q":"Để liên kết ba bảng, ta","o":["lặp lại mệnh đề INNER JOIN … ON … cho bảng thứ ba","viết ba câu SELECT riêng rồi so sánh kết quả","đổi tên CSDL rồi chạy lại câu truy vấn cũ","xoá bớt một bảng để chỉ còn hai bảng"],"g":"Lặp lại INNER JOIN cho bảng thứ ba."},{"m":"VD","q":"Câu lệnh lấy tên bản nhạc kèm tên nhạc sĩ đúng là","o":["SELECT tenBannhac, tenNhacsi FROM bannhac INNER JOIN nhacsi ON bannhac.idNhacsi = nhacsi.idNhacsi;","SELECT tenBannhac, tenNhacsi FROM bannhac ORDER BY bannhac.idNhacsi, nhacsi.idNhacsi;","SELECT tenBannhac, tenNhacsi FROM bannhac WHERE idNhacsi IN nhacsi ORDER BY tenNhacsi;","SELECT tenBannhac, tenNhacsi FROM bannhac, nhacsi WHERE tenBannhac LIKE \"%nhacsi%\";"],"g":"INNER JOIN … ON khoá ngoài = khoá chính."}],"tf":[{"q":"Mai muốn xem bản thu âm đầy đủ: tên bản nhạc, tên ca sĩ.","y":["Mai cần liên kết bảng banthuam với bannhac và casi.","Liên kết dựa trên cặp khoá ngoài – khoá chính.","Dữ liệu ở nhiều bảng thì không thể hiển thị chung trong một kết quả.","HeidiSQL gợi ý tên trường khi gõ dấu chấm sau tên bảng."],"d":[true,true,false,true],"g":["Liên kết 3 bảng.","Theo SGK.","JOIN giúp dữ liệu “gặp nhau”.","Theo SGK."]}],"td":[{"m":"NB","q":"Trong Bài 23, bảng bannhac có thêm trường nào so với Bài 22?","o":["idTheloai","idCasi","tenNhacsi","tenCasi"],"g":"SGK: bannhac(idBannhac, tenBannhac, idNhacsi, idTheloai)."},{"m":"NB","q":"Mệnh đề nào trong câu truy vấn SQL dùng để liên kết hai bảng theo khoá?","o":["INNER JOIN … ON …","ORDER BY … DESC","WHERE … LIKE …","GROUP BY …"],"g":"SGK: để truy vấn hai bảng qua liên kết khoá dùng câu truy vấn SQL với mệnh đề JOIN."},{"m":"NB","q":"Phím tắt chạy câu truy vấn trong thẻ Truy vấn của HeidiSQL là","o":["F9","F5","F1","F12"],"g":"SGK: nhấn F9 trên bàn phím hoặc nháy chuột vào biểu tượng chạy, hoặc nháy phải chuột chọn Chạy."},{"m":"NB","q":"Từ khoá dùng để đặt tên khác cho một trường trong kết quả truy vấn là","o":["as","on","by","in"],"g":"SGK: bannhac.idNhacsi as idNS_BN — đổi tên hai trường cùng tên để phân biệt."},{"m":"NB","q":"Việc HeidiSQL tô màu các thành phần câu truy vấn để dễ quan sát cú pháp gọi là gì?","o":["Syntax coloring","Auto backup","Quick filter","Foreign key"],"g":"SGK: dùng màu sắc để trợ giúp quan sát cú pháp của câu truy vấn (syntax coloring)."},{"m":"NB","q":"Khi gõ tên bảng và dấu chấm (.) trong thẻ Truy vấn, HeidiSQL làm gì?","o":["Hiện danh sách tên trường của bảng","Tự chạy câu truy vấn ngay"," ["Tính nhất quán dữ liệu","Tăng số bảng CSDL","Đổi khoá chính tự động","Bỏ qua khoá ngoài"],"g":"Chỉ chọn tên đã có trong CSDL nên giá trị khoá ngoài luôn hợp lệ, dữ liệu nhất quán."},{"m":"TH","q":"Danh sách bản thu âm ở Hình 23.4 hiển thị tường minh những thông tin nào?","o":["Tên bản nhạc, nhạc sĩ, ca sĩ","Chỉ các mã số idBannhac","Chỉ tên ca sĩ","Mật khẩu người dùng"],"g":"SGK: danh sách bản thu âm có đầy đủ thông tin tường minh tên bản nhạc, tên nhạc sĩ và tên ca sĩ."},{"m":"TH","q":"Đặt WHERE trong câu truy vấn có JOIN để làm gì?","o":["Lọc dòng sau khi liên kết","Chọn bảng cần liên kết","Đặt tên mới cho cột","Tạo khoá ngoài mới"],"g":"Cấu trúc: SELECT … FROM a INNER JOIN b ON … [WHERE …] [ORDER BY …]."},{"m":"TH","q":"Giao diện hỗ trợ của HeidiSQL (Hình 23.3) giúp người dùng tránh lỗi gì?","o":["Gõ sai tên trường","Mất điện máy chủ","Quên mật khẩu root","Xoá nhầm CSDL"],"g":"Danh sách tên trường hiện ra để chọn, hạn chế gõ sai tên trường."},{"m":"TH","q":"INNER JOIN chỉ giữ lại những dòng nào?","o":["Dòng khớp khoá ở hai bảng","Mọi dòng của bảng thứ nhất","Mọi dòng của bảng thứ hai","Dòng có khoá không khớp"],"g":"INNER JOIN ghép các cặp dòng thoả điều kiện ON ở cả hai bảng."},{"m":"VD","q":"Kết quả liên kết bannhac với nhacsi: bản nhạc “Nhạc rừng” có tên nhạc sĩ là","o":["Hoàng Việt","Văn Cao","Đỗ Nhuận","Nguyễn Tài Tuệ"],"g":"Hình 23.1: Nhạc rừng — idNhacsi 3 — Hoàng Việt."},{"m":"VD","q":"Kết quả SELECT COUNT(*) FROM bannhac INNER JOIN nhacsi ON bannhac.idNhacsi = nhacsi.idNhacsi; là","o":["8","4","12","32"],"g":"Hình 23.1: mỗi bản nhạc ghép với đúng một nhạc sĩ — 8 dòng."},{"m":"VD","q":"Kết quả: danh sách idBannhac, tenBannhac các bài của nhạc sĩ Đỗ Nhuận là","o":["1 Du kích sông Thao, 5 Việt Nam quê hương tôi","2 Trường ca Sông Lô, 6 Tiến về Hà Nội","3 Tình ca, 7 Nhạc rừng","4 Xa khơi, 8 Tiếng hát giữa rừng Pắc Bó"],"g":"Hãy thực hành (SGK): bài của Đỗ Nhuận."},{"m":"VD","q":"Câu nào lấy idBannhac, tenBannhac, tenNhacsi của tất cả bản nhạc?","o":["SELECT bannhac.idBannhac, bannhac.tenBannhac, nhacsi.tenNhacsi FROM bannhac INNER JOIN nhacsi ON bannhac.idNhacsi = nhacsi.idNhacsi;","SELECT bannhac.idBannhac, bannhac.tenBannhac, nhacsi.tenNhacsi FROM bannhac INNER JOIN nhacsi ON bannhac.idBannhac = nhacsi.idNhacsi;","SELECT bannhac.idBannhac, bannhac.tenBannhac, bannhac.tenNhacsi FROM bannhac WHERE bannhac.idNhacsi = nhacsi.idNhacsi;","SELECT bannhac.idBannhac, bannhac.tenBannhac, nhacsi.tenNhacsi FROM nhacsi INNER JOIN bannhac ON nhacsi.tenNhacsi = bannhac.tenBannhac;"],"g":"Điều kiện liên kết đúng là khoá ngoài bannhac.idNhacsi = khoá chính nhacsi.idNhacsi."},{"m":"VD","q":"Kết quả: tên bản nhạc và tên ca sĩ của bản thu âm số 8 là","o":["Tiếng hát giữa rừng Pắc Bó – Lê Dung","Việt Nam quê hương tôi – Quốc Hương","Trường ca Sông Lô – Trần Khánh","Du kích sông Thao – Doãn Tần"],"g":"Bản thu 8: idBannhac 8, idCasi 2."},{"m":"VD","q":"Kết quả: số bản thu âm có ca sĩ Lê Dung thể hiện là","o":["2","1","3","4"],"g":"Lê Dung (2): bản thu 2 và 8."},{"m":"VD","q":"Kết quả: tên các bản nhạc do Lê Dung thể hiện, sắp theo idBanthuam là","o":["Trường ca Sông Lô, Tiếng hát giữa rừng Pắc Bó","Tiếng hát giữa rừng Pắc Bó, Trường ca Sông Lô","Tình ca, Nhạc rừng của Hoàng Việt","Xa khơi, Du kích sông Thao"],"g":"Luyện tập 3 (bỏ thể loại): bản thu 2 và 8."},{"m":"VD","q":"Kết quả: số bản thu âm các bài của nhạc sĩ Văn Cao là","o":["4","2","3","5"],"g":"Luyện tập 2 (bỏ thể loại): bài 2 có bản thu 2, 9; bài 6 có bản thu 6, 10."},{"m":"VD","q":"Kết quả: tên nhạc sĩ của bài do Tân Nhân thể hiện là","o":["Nguyễn Tài Tuệ","Văn Cao","Hoàng Việt","Đỗ Nhuận"],"g":"Tân Nhân (3) thu bài 4 Xa khơi của Nguyễn Tài Tuệ."},{"m":"VD","q":"Câu nào lấy idBanthuam, tenBannhac, tenCasi (Nhiệm vụ 2)?","o":["SELECT idBanthuam, tenBannhac, tenCasi FROM banthuam INNER JOIN bannhac ON banthuam.idBannhac = bannhac.idBannhac INNER JOIN casi ON banthuam.idCasi = casi.idCasi;","SELECT idBanthuam, tenBannhac, tenCasi FROM banthuam INNER JOIN bannhac ON banthuam.idCasi = bannhac.idBannhac INNER JOIN casi ON banthuam.idBannhac = casi.idCasi;","SELECT idBanthuam, tenBannhac, tenCasi FROM banthuam, bannhac, casi WHERE banthuam.idBanthuam = casi.idCasi AND bannhac.idBannhac = 1;","SELECT idBanthuam, tenBannhac, tenCasi FROM banthuam INNER JOIN casi ON banthuam.idBanthuam = casi.idCasi ORDER BY tenBannhac;"],"g":"Liên kết đúng: banthuam.idBannhac = bannhac.idBannhac và banthuam.idCasi = casi.idCasi."},{"m":"VD","q":"Vận dụng: lấy tên quận/huyện kèm tên tỉnh. Câu đúng là","o":["SELECT tenHuyen, tenTinh FROM huyen INNER JOIN tinh ON huyen.idTinh = tinh.idTinh;","SELECT tenHuyen, tenTinh FROM huyen INNER JOIN tinh ON huyen.idHuyen = tinh.idTinh;","SELECT tenHuyen, tenTinh FROM huyen WHERE tenTinh = tenHuyen;","SELECT tenHuyen, tenTinh FROM tinh ORDER BY idHuyen;"],"g":"Liên kết huyen với tinh theo khoá ngoài idTinh."},{"m":"VD","q":"Vận dụng: lấy các huyện của tỉnh “Lào Cai” qua liên kết. Câu đúng là","o":["SELECT tenHuyen FROM huyen INNER JOIN tinh ON huyen.idTinh = tinh.idTinh WHERE tenTinh = 'Lào Cai';","SELECT tenHuyen FROM huyen INNER JOIN tinh ON huyen.idHuyen = tinh.idTinh WHERE tenTinh = 'Lào Cai';","SELECT tenTinh FROM tinh INNER JOIN huyen WHERE tenHuyen = 'Lào Cai';","SELECT * FROM huyen INNER JOIN tinh ON huyen.idHuyen = 'Lào Cai';"],"g":"Bảng huyen không có tenTinh nên phải liên kết với tinh."},{"m":"VD","q":"Kết quả: số nhạc sĩ khác nhau có bài được Quốc Hương thể hiện là","o":["3","1","2","4"],"g":"Quốc Hương thu bài 5 (Đỗ Nhuận), 7 (Hoàng Việt), 6 (Văn Cao) — 3 nhạc sĩ."},{"m":"VD","q":"Trong Luyện tập 1, để lấy thêm tenTheloai cần liên kết thêm bảng nào với bannhac?","o":["theloai qua idTheloai","casi qua idTheloai","nhacsi qua idTheloai","banthuam qua idTheloai"],"g":"bannhac có khoá ngoài idTheloai tham chiếu bảng theloai."},{"m":"VD","q":"Lấy idBanthuam, tenBannhac, tenTheloai, tenNhacsi, tenCasi (Luyện tập 1) cần liên kết bao nhiêu bảng?","o":["5","3","4","2"],"g":"banthuam, bannhac, theloai, nhacsi, casi."},{"m":"VDC","q":"Kết quả: tên các ca sĩ đã thể hiện bài “Trường ca Sông Lô”, sắp theo tên là","o":["Lê Dung, Trần Khánh","Trần Khánh, Lê Dung","Doãn Tần, Quốc Hương","Tân Nhân, Lê Dung"],"g":"Bài 2: bản thu 2 (Lê Dung), 9 (Trần Khánh)."},{"m":"VDC","q":"Kết quả: số bản thu âm các bài của Nguyễn Tài Tuệ do Lê Dung thể hiện là","o":["1","2","0","3"],"g":"Bài 8 (Nguyễn Tài Tuệ) do Lê Dung thu — 1 bản."},{"m":"VDC","q":"Kết quả: ca sĩ có nhiều bản thu âm nhất là","o":["Quốc Hương","Trần Khánh","Lê Dung","Doãn Tần"],"g":"Quốc Hương 3 bản; Trần Khánh, Lê Dung, Doãn Tần 2 bản; Tân Nhân 1 bản."},{"m":"VDC","q":"Kết quả: số bản nhạc chưa có bản thu âm nào là","o":["0","1","2","3"],"g":"8 bài đều xuất hiện trong banthuam."},{"m":"VDC","q":"Vì sao lưu CSDL thành nhiều bảng vẫn lấy được danh sách đầy đủ như Bảng 18.1?","o":["Liên kết bảng qua khoá","Lưu thêm một bảng đầy đủ dự phòng","Gõ lại dữ liệu mỗi lần cần","Sao chép dữ liệu sang Excel"],"g":"JOIN ghép các bảng theo khoá ngoài – khoá chính để tái tạo thông tin đầy đủ."},{"m":"VDC","q":"Câu truy vấn bị thiếu ON như SELECT * FROM bannhac INNER JOIN nhacsi; (trong nhiều hệ QTCSDL) dễ cho kết quả sai vì","o":["Mỗi bài ghép với mọi nhạc sĩ","Chỉ lấy được dòng đầu tiên","Không lấy được dòng nào","Tự động ghép đúng khoá"],"g":"Thiếu điều kiện liên kết, mọi dòng bảng này ghép với mọi dòng bảng kia (8 × 4 = 32 dòng)."},{"m":"VDC","q":"Kết quả: số dòng khi ghép bannhac với nhacsi KHÔNG có điều kiện liên kết là","o":["32","8","4","12"],"g":"8 bản nhạc × 4 nhạc sĩ = 32 dòng (tích Đề-các)."},{"m":"VDC","q":"Lấy idBanthuam, tenBannhac, tenTacgia, tenCasi các bài do Lê Dung thể hiện thuộc thể loại “Nhạc trữ tình” (Luyện tập 4). Điều kiện WHERE đúng là","o":["tenCasi = 'Lê Dung' AND tenTheloai = 'Nhạc trữ tình'","tenCasi = 'Lê Dung' OR tenTheloai = 'Nhạc trữ tình'","tenCasi LIKE 'Lê Dung' AND idTheloai = 'trữ tình'","tenTheloai = 'Lê Dung' AND tenCasi = 'Nhạc'"],"g":"Hai điều kiện đồng thời: dùng AND."},{"m":"VDC","q":"So sánh tự viết câu JOIN với dùng ứng dụng Hình 23.4, nhận định đúng là","o":["Ứng dụng giấu câu JOIN phía sau","Ứng dụng không cần CSDL bên dưới","Tự viết JOIN luôn dễ hơn với mọi người","Ứng dụng không lấy được tên ca sĩ"],"g":"Nhiệm vụ 3: ứng dụng chuyên biệt hiển thị danh sách đầy đủ nhờ truy vấn liên kết phía sau."},{"m":"VDC","q":"Kết quả: các bài có từ hai bản thu âm trở lên, sắp theo idBannhac là","o":["Trường ca Sông Lô, Tiến về Hà Nội","Du kích sông Thao, Tình ca","Xa khơi, Nhạc rừng","Tình ca, Tiến về Hà Nội"],"g":"Bài 2 và bài 6 mỗi bài có 2 bản thu."}],"db":[30,31,32,33,34,35,36,37,38,43,45,47],"noi":{"noi":"Một mình chúng ta làm được rất ít; cùng nhau chúng ta làm được rất nhiều.","tg":"Helen Keller — nhà văn, nhà hoạt động xã hội","nguon":"Câu nói thường được gắn với bà","y":"Các bảng liên kết với nhau mới cho thông tin đầy đủ — như bạn bè cùng học sẽ đi xa hơn."}},{"so":24,"cd":6,"ten":"Thực hành sao lưu dữ liệu","trang":"113–115","muctieu":["Nắm được các thao tác sao lưu và phục hồi dữ liệu."],"muc":[{"t":"Sao lưu CSDL (backup)","icon":"💾","b":["<b>Các công cụ → Xuất cơ sở dữ liệu dưới dạng SQL<\/b>.","Đánh dấu CSDL, chọn <b>Drop<\/b>, <b>Create<\/b>; Data: <b>Delete + insert<\/b>.","Output: <b>Single .sql file<\/b>, đặt tên tệp → <b>Export<\/b>.","Có thể chỉ sao lưu một số bảng."]},{"t":"Phục hồi CSDL (restore)","icon":"♻️","b":["<b>Tập tin → Load SQL file…<\/b> (Ctrl+O) → chọn tệp sao lưu.","Nhấn ▶ chạy truy vấn, <b>F5<\/b> làm tươi danh sách.","CSDL được khởi tạo lại đủ các bảng, dữ liệu."]}],"ghinho":"Sao lưu định kì là “bảo hiểm” cho dữ liệu: có tệp .sql là có thể phục hồi, kể cả trên máy mới.","vandung":"Chuyển một CSDL từ máy tính này sang máy tính khác bằng sao lưu – phục hồi.","the":[{"q":"Tệp sao lưu CSDL mymusic có phần mở rộng là gì?","a":"<b>.sql<\/b> (VD _mymusic.sql)."},{"q":"Để sao lưu CSDL, chọn lệnh nào trong thẻ <b>Các công cụ<\/b>?","a":"<b>Xuất cơ sở dữ liệu dưới dạng SQL<\/b>."},{"q":"Muốn phục hồi CSDL từ tệp sao lưu, chọn lệnh nào? Phím tắt là gì?","a" let U=null;           // người dùng hiện tại {code,g,lp:{},boss:{},de:{},mo:{},sai:[],xem}

function lp(so){return U.lp[so]||(U.lp[so]={})}
function starsOf(pct){return pct>=0.9?3:pct>=0.7?2:pct>=0.5?1:0}
function lessonPts(p,b){let s=0;if(p.doc)s+=10;if(p.sodo)s+=10;if(p.the)s+=10;s+=(p.best||0)*10;if((p.st||0)===3)s+=20;return s}
function totalPts(u){
  u=u||U;let s=0;const g=u.g;
  for(const so in u.lp){s+=lessonPts(u.lp[so])}
  for(const cd in u.boss){const b=u.boss[cd];s+=(b.best||0)*20+(b.pass?50:0)}
  for(const k in u.de){s+=Math.round((u.de[k]||0)*10)}
  if(u.xp)s+=(u.xp.td||0)+(u.xp.db||0);
  return s;
}
const LEVELS=[[0,"🌱","Mầm non số"],[300,"🔍","Nhà khám phá"],[800,"🛡️","Hiệp sĩ số"],[1500,"💡","Chuyên gia nhí"],[2500,"🚀","Phi hành gia Tin học"],[4000,"👑","Bậc thầy Tin học"]];

function ym(t){const d=t?new Date(t):new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}

// cộng phần điểm thưởng / số bài ★★ TĂNG THÊM vào tháng hiện tại
function trackMonth(){
  if(!U||U.xem)return;
  const tp=totalPts(),n2=n2Of(U),m=thangU();
  if(U.lastPts==null){if(ym(U.t0)===ym()){m.d=tp;m.b=n2}U.lastPts=tp;U.lastN2=n2;return}
  if(tp>U.lastPts)m.d+=tp-U.lastPts;
  if(n2>U.lastN2)m.b+=n2-U.lastN2;
  U.lastPts=tp;U.lastN2=n2;
}

function khoiPhuc(){

  const code=U.code;
  taiSo().then(d=>{

  const cs=chuongs(g); const c=cs[idx];
  if(c.bai.every(b=>b.cho))return false;
  if(U.mo["all"]||U.mo["cd"+c.cd])return true;
  if(idx===0)return true;
  const prev=cs[idx-1];
  if(prev.bai.every(b=>b.cho))return true;
  return !!(U.boss[prev.cd]&&U.boss[prev.cd].pass);
}
function baiOpen(g,idx,j){
  const c=chuongs(g)[idx]; const b=c.bai[j];
  if(b.cho)return false;
  if(U.xem)return true;
  if(U.mo["b"+b.so])return true;
  if(!chuongOpen(g,idx))return false;
  if(U.mo["all"]||U.mo["cd"+c.cd]||j===0)return true;
  const pv=c.bai[j-1]; return ((U.lp[pv.so]||{}).st||0)>=2;
}
function bossOpen(g,idx){
  const c=chuongs(g)[idx];
  if(U.xem)return true;
  if(!chuongOpen(g,idx))return false;
  return c.bai.every(b=>((U.lp[b.so]||{}).st||0)>=2);
}
function openLessons(g){const out=[];chuongs(g).forEach((c,i)=>c.bai.forEach((b,j)=>{if(baiOpen(g,i,j))out.push(b)}));return out}

/* ══════════ CÂU HỎI ══════════ */
function mkMCQ(g,so,idx){const q=baiOf(g,so).mcq[idx];const ord=shuffle([0,1,2,3]);return {k:"m",id:`${g}-${so}-m${idx}`,so,q:q.q,o:ord.map(i=>q.o[i]),ans:ord.indexOf(0),g:q.g,muc:q.m}}
function mkTDQ(g,so,idx){const c=baiOf(g,so).td[idx];const ord=shuffle([0,1,2,3]);return {k:"m",id:`${g}-${so}-d${idx}`,so,q:c.q,o:ord.map(i=>c.o[i]),ans:ord.indexOf(0),g:c.g,muc:c.m==="NB"||c.m==="TH"?c.m:"VD"}}
function mkTF(g,so,idx){const t=baiOf(g,so).tf[idx];return {k:"t",id:`${g}-${so}-t${idx}`,so,q:t.q,y:t.y,d:t.d,g:t.g}}
function poolOf(g,lessons){const m=[],t=[];lessons.forEach(b=>{b.mcq.forEach((_,i)=>m.push([b.so,i]));b.tf.forEach((_,i)=>t.push([b.so,i]))});return {m:shuffle(m),t:shuffle(t)}}
function startLesson(so){
  const g=U.g,b=baiOf(g,so);
  const qs=shuffle(b.mcq.map((_,i)=>i)).slice(0,10).map(i=>mkMCQ(g,so,i));
  if(b.tf.length)qs.push(mkTF(g,so,Math.floor(Math.random()*b.tf.length)));
  VIEW={t:"quiz",kind:"bai",so,qs,i:0,ans:[],mode:"hoc",title:`Luyện tập Bài ${so}`,from:{t:"bai",so,tab:"lt"}};render();
}
function startBoss(cd){
  const g=U.g,c=chuongs(g).find(x=>x.cd===cd);
  const P=poolOf(g,c.bai.filter(b=>!b.cho));
  const qs=P.m.slice(0,10).map(([so,i])=>mkMCQ(g,so,i)).concat(P.t.slice(0,2).map(([so,i])=>mkTF(g,so,i)));
  VIEW={t:"quiz",kind:"boss",cd,qs,i:0,ans:[],mode:"hoc",title:"⚔️ Thử thách chặng",from:null};render();
}
function startDe(kind){
  const g=U.g,ls=openLessons(g);const P=poolOf(g,ls);
  let qs,mins;
  if(kind==="nhanh"){qs=P.m.slice(0,10).map(([so,i])=>mkMCQ(g,so,i));mins=10}
  else if(kind==="chuan"){qs=P.m.slice(0,24).map(([so,i])=>mkMCQ(g,so,i)).concat(P.t.slice(0,4).map(([so,i])=>mkTF(g,so,i)));mins=45}
  else if(kind==="sai"){
    const ids=U.sai.slice(-20);qs=ids.map(id=>{const m=id.match(/^(\d+)-(\d+)-([mtd])(\d+)$/);if(!m||m[1]!==g)return null;const b=baiOf(g,+m[2]);if(!b)return null;if(m[3]==="d")return b.td&&b.td[+m[4]]?mkTDQ(g,+m[2],+m[4]):null;return m[3]==="m"?(b.mcq[+m[4]]?mkMCQ(g,+m[2],+m[4]):null):(b.tf[+m[4]]?mkTF(g,+m[2],+m[4]):null)}).filter(Boolean);
    if(!qs.length)return toast("Sổ câu sai đang trống. Tuyệt vời!");

function readReports(txt){
  const rows=[];const seen={};
  (txt.match(/BC~[^\s]+/g)||[]).forEach(s=>{const p=s.split("~");if(p.length!==9)return;const body=p.slice(1,8).join("~");
    const ok=(h32(BIMAT+"|bc|"+body)%46656).toString(36).toUpperCase().padStart(3,"0")===p[8];
    const r={code:p[1],pts:+p[2],st:p[3],bo:p[4],chuan:(+p[5])/10,nhanh:(+p[6])/10,day:p[7],ok};seen[r.code]=r});
  for(const k in seen)rows.push(seen[k]);
  rows.sort((a,b)=>a.code.localeCompare(b.code,"vi",{numeric:true}));return rows;
}
function bcTable(rows){

function cnBo(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function cnHinh(c, ten, x, y, s, mau, net){ c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = c.fillStyle = mau; c.lineWidth = net / s; c.lineCap = c.lineJoin = "round"; (HV[ten] || HV.sao)(c); c.restore(); }

function cnChu(c, s, x, y, co, kieu, mau, rong, canh){ c.font = kieu.replace("#", co); while (co > 12 && rong && c.measureText(s).width > rong) { co -= 2; c.font = kieu.replace("#", co); } c.fillStyle = mau; c.textAlign = canh || "center"; c.fillText(s, x, y); return co; }
function cnDong(c, s, x, y, rong, cao){ const tu = s.split(" "); let d = "", n = 0; tu.forEach(t => { const thu = d ? d + " " + t : t; if (c.measureText(thu).width > rong && d) { c.fillText(d, x, y + n++ * cao); d = t; } else d = thu; }); if (d) c.fillText(d, x, y + n++ * cao); return n; }

  const g = c.createRadialGradient(x - 40, y - 40, 10, x, y, 150); g.addColorStop(0, MAU_HC[0]); g.addColorStop(.55, MAU_HC[1]); g.addColorStop(1, MAU_HC[2]);

  c.restore();
}

function maGiayCN(o){ return (h32(BIMAT + "|cn|" + o.th + "|" + o.ma + "|" + o.danh + "|" + o.hang) % 1679616).toString(36).toUpperCase().padStart(4, "0"); }
// o: { th "2026-10", lop, ma, danh, hang, gt } · ten: họ tên em tự gõ (chỉ vẽ trên máy, không gửi đi)

  n = c.createRadialGradient(CN_W / 2, 560, 100, CN_W / 2, 560, 1100); n.addColorStop(0, "rgba(255,255,255,.9)"); n.addColorStop(1, g.nhat); c.fillStyle = n; c.fillRect(0, 0, CN_W, CN_H);

  c.strokeStyle = "#fff"; c.lineWidth = 6; c.beginPath(); c.arc(1740, 500, 120, 0, 7); c.stroke();

  // phẩm chất

  let x = CN_W / 2 - tong / 2; cnChu(c, "Phẩm chất:", x, 964, 34, `italic bold #px ${CN_SERIF}`, "#334155", 0, "left"); x += 230;
  g.pc.forEach((p, i) => { c.fillStyle = g.nhat; cnBo(c, x, 918, w[i], 64, 32); c.fill(); c.strokeStyle = m; c.lineWidth = 3; c.stroke(); cnHinh(c, "sao", x + 36, 950, .36, m, 3); c.fillStyle = m; c.textAlign = "left"; c.fillText(p, x + 66, 963); x += w[i] + 30; });

// lưu ảnh: điện thoại mở bảng chia sẻ (Lưu hình ảnh / Zalo…); máy tính tải tệp PNG
function luuAnhCN(cv, ten){
